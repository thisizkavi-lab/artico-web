<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: schedule
  CONTEXTUAL_DEFINITION: A timetable showing when public transportation services depart and arrive.
  PEDAGOGICAL_ART_DIRECTOR: Show a station departure board with orderly route rows and a nearby analog clock with no numerals.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero information object with context
  SYNONYM_GUARD: Use repeated service rows and a transit clock; avoid a personal calendar or appointment diary.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Board x=47..244, y=46..127 with five horizontal rows of route dots, color bars, and blank time marks; clock centered at (260,55), radius 22, with hands and no numbers.
-->
