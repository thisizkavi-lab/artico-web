<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: straight
  CONTEXTUAL_DEFINITION: Extending in one unbending line without a curve.
  PEDAGOGICAL_ART_DIRECTOR: Contrast one ruler-straight blue route with a muted winding alternative on the same map to make the geometric property obvious.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrast / reference pair
  SYNONYM_GUARD: Teach the shape property of a path, not the instruction to continue ahead.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Straight route spans (26,116) to (277,116) as a crisp level line; a smaller muted road above bends twice; blue route stays uncurved throughout.
-->
