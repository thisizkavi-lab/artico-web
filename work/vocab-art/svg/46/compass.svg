<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: compass
  CONTEXTUAL_DEFINITION: A handheld magnetic instrument used to find direction while traveling.
  PEDAGOGICAL_ART_DIRECTOR: Show a substantial pocket compass on a folded topographic map; its free blue needle points north while a gold tail indicates the opposite end.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / direction diagram
  SYNONYM_GUARD: Make this a physical magnetic navigation instrument, not a compass rose used only as a direction icon; omit letters and numbers.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A brass-rimmed circular compass centered at (153,92), radius 62, rests over a pale folded map with unlabeled route lines; a two-color needle points vertically.
-->
