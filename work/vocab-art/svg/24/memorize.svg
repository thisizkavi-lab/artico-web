  CHAPTER: 24 — Studying
  WORD: memorize (Verb)
  CONTEXTUAL_DEFINITION: Learn information so it can be recalled from memory.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action
  SYNONYM_GUARD: Show active recall: a learner studies a cue card, then confidently answers from memory; distinguish this from simply rereading notes.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Quiet study desk and calm school wall.
    - Context_Layer: Several unlettered flash cards and a small pile of books.
    - Focal_Layer: Student turns a cue card, then recalls its pictured fact with a confident expression.
    - Details_Layer: A head-side recall bubble contains only the matching simple shape cue.
    - Lighting_Layer: Focused glow around learner and cue cards.
-->
