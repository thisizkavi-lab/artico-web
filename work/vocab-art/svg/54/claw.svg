<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:claw(s)" data-archetype="part-of-whole">
  <defs>
    <!-- Animal Claws: close-up macro view of sharp curved retractile claws extending from furry paw into wood -->
    <clipPath id="claw-focus-clip">
      <circle cx="152" cy="100" r="68" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="166" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Focus Halo Ring Callout -->
  <circle cx="152" cy="100" r="76" fill="#FEF3C7" opacity="0.5" />
  <circle cx="152" cy="100" r="76" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6 4" />

  <!-- Wooden Surface Being Scratched -->
  <polygon points="40,146 264,146 250,172 54,172" fill="#B45309" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <line x1="44" y1="152" x2="260" y2="152" stroke="#D97706" stroke-width="2" />
  <!-- Sharp Scratch Marks Dug into Wood -->
  <path d="M 124 150 L 120 166 M 142 148 L 138 166 M 162 148 L 160 166 M 180 150 L 180 166" stroke="#451A03" stroke-width="2.6" stroke-linecap="round" />

  <!-- Hero Macro Paw & Sharp Curved Claws -->
  <!-- Furry Paw Foreleg Coming Down from Top -->
  <path d="M 118 42 L 126 116 C 126 128 178 128 178 116 L 186 42 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Fluffy fur tufts on paw -->
  <path d="M 124 96 Q 116 104 126 110 M 180 96 Q 188 104 178 110" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Paw Toe Knuckles (Four distinct digits) -->
  <ellipse cx="118" cy="124" rx="10" ry="14" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="138" cy="126" rx="11" ry="15" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="164" cy="126" rx="11" ry="15" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="184" cy="124" rx="10" ry="14" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2.2" />

  <!-- Four Sharp, Curved, Translucent Claws Extending from Sheaths -->
  <!-- Claw 1 -->
  <path d="M 116 130 C 114 142 118 152 122 154 C 120 148 124 136 122 130 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 118 134 Q 116 146 122 154" stroke="#FDE68A" stroke-width="1.6" fill="none" />

  <!-- Claw 2 (Center left) -->
  <path d="M 136 132 C 132 144 136 156 140 158 C 138 150 144 138 142 132 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M 138 136 Q 134 148 140 158" stroke="#FDE68A" stroke-width="2" fill="none" />

  <!-- Claw 3 (Center right) -->
  <path d="M 162 132 C 160 144 162 156 164 158 C 164 150 168 138 168 132 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M 164 136 Q 162 148 164 158" stroke="#FDE68A" stroke-width="2" fill="none" />

  <!-- Claw 4 -->
  <path d="M 184 130 C 184 142 180 152 178 154 C 180 148 188 136 188 130 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 184 134 Q 182 146 178 154" stroke="#FDE68A" stroke-width="1.6" fill="none" />

  <!-- Sharp Claw Glint / Sparkle -->
  <path d="M 140 156 L 142 150 L 144 156 L 150 158 L 144 160 L 142 166 L 140 160 L 134 158 Z" fill="#FACC15" />
</svg>