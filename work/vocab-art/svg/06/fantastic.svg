  CHAPTER: 06 - Describing things: opinions
  WORD: fantastic (Adjective)
  CONTEXTUAL_DEFINITION: Exceptionally enjoyable and impressive, shown by a live performance that leaves an audience cheering.
  PEDAGOGICAL_ARCHETYPE: 3 (Strong positive reaction to a specific experience)
  SYNONYM_GUARD: A joyful theater audience separates this from breathtaking scenery and from the literal 'strange' sense of fantastic.
