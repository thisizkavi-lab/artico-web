  CHAPTER: 46 - Maps and directions
  WORD: roadmap
  CONTEXTUAL_DEFINITION: A map designed to show roads and routes for traveling between places.
  PEDAGOGICAL_ART_DIRECTOR: Show a folded regional road map with one prominent continuous route connecting several towns and a small vehicle.
