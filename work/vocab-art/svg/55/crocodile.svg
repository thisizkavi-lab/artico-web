  CHAPTER: 55 - Wild animals
  WORD: crocodile (noun)
  CONTEXTUAL_DEFINITION: A long low water-dwelling reptile with armored back scales, eyes above the water, and a tapered tooth-lined snout.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero animal with defining armored back and jaws
  SYNONYM_GUARD: Place the eyes and back above a waterline while the long toothed snout points out; this distinguishes crocodile from a land lizard.
