<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: travel insurance
  CONTEXTUAL_DEFINITION: Protection that helps cover problems or losses during a trip.
  PEDAGOGICAL_ART_DIRECTOR: Place an oversized protective shield around a traveler and their luggage while travel hazards stay outside.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / travel diagram
  SYNONYM_GUARD: Connect the protective cover to a journey and its traveler; do not show ordinary health insurance alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A traveler with a suitcase stands protected inside a broad shield bearing an airplane pictogram while rain and a damaged-bag hazard remain outside.
-->
