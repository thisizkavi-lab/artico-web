<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: determined
  CONTEXTUAL_DEFINITION: Firmly decided to achieve something and unwilling to give up when it is difficult.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker persisting through one obstacle to finish an important task.
  PEDAGOGICAL_ARCHETYPE: 10 - Persistence through a setback
  SYNONYM_GUARD: Show commitment continuing after a setback, rather than a distant ambitious goal or general hard work.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put one worker at x=91..145 bracing against a tipped stack of project folders at x=160..194, then reaching toward a finished task board at x=215..258. Add a clear forward path around the obstacle and a steady posture.
-->
