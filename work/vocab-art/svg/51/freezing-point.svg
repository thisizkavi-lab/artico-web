<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: freezing point (Noun)
  CONTEXTUAL_DEFINITION: The temperature where liquid water changes state and becomes solid ice.
  PEDAGOGICAL_ART_DIRECTOR: Show a single water droplet divided between liquid and crystalline ice, aligned with a thermometer's reference threshold.
  PEDAGOGICAL_ARCHETYPE: 1 - Phase-change threshold
  SYNONYM_GUARD: This is the exact transition temperature, not simply freezing weather or an ice cube.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Large half-liquid, half-ice droplet above a small thermometer with the red column at a marked lower threshold.
-->
