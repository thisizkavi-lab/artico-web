<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:crow (cockerel)" data-archetype="dynamic-action">
  <defs>
    <!-- Rooster Crowing: cockerel on fence post at dawn with head thrown back, open beak crowing at rising morning sun -->
    <clipPath id="crow-body-clip">
      <path d="M 104 88 C 104 68 126 56 156 64 C 188 74 204 98 198 136 C 194 154 164 156 132 152 C 108 148 102 122 104 88 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />

  <!-- Rising Dawn Morning Sun on Right Horizon -->
  <circle cx="240" cy="80" r="32" fill="#FDE047" opacity="0.6" />
  <circle cx="240" cy="80" r="22" fill="#FACC15" />
  <!-- Radiant Dawn Sunbeams -->
  <line x1="240" y1="36" x2="240" y2="24" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="272" y1="48" x2="282" y2="40" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="284" y1="80" x2="296" y2="80" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="208" y1="48" x2="198" y2="40" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />

  <!-- Wooden Farm Fence Post on which Rooster is Perched -->
  <rect x="122" y="140" width="30" height="46" rx="3" fill="#B45309" stroke="#1E2A3B" stroke-width="2.4" />
  <line x1="128" y1="146" x2="128" y2="182" stroke="#78350F" stroke-width="2" />
  <line x1="144" y1="146" x2="144" y2="182" stroke="#78350F" stroke-width="2" />
  <!-- Horizontal fence rail -->
  <rect x="40" y="156" width="224" height="12" rx="3" fill="#D97706" stroke="#1E2A3B" stroke-width="2.2" />

  <!-- Magnificent Long Arching Sickle Tail Feathers (Behind rooster) -->
  <path d="M 120 114 C 92 84 64 68 44 80 C 40 92 68 116 112 134 Z" fill="#065F46" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M 116 122 C 86 96 60 88 42 102 C 42 114 72 130 110 140 Z" fill="#1E3A8A" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 112 132 C 88 114 70 114 54 126 C 56 136 80 144 108 144 Z" fill="#78350F" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Powerful Yellow Clawed Legs Gripping Fence Post -->
  <path d="M 132 138 L 132 144 L 126 146 M 132 144 L 132 148 M 132 144 L 138 146" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <path d="M 144 138 L 144 144 L 138 146 M 144 144 L 144 148 M 144 144 L 150 146" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Puffed Out Rooster Body -->
  <g clip-path="url(#crow-body-clip)">
    <!-- Base golden orange -->
    <rect x="95" y="55" width="115" height="105" fill="#EA580C" />
    <!-- Radiant gold puffed breast -->
    <ellipse cx="164" cy="98" rx="28" ry="34" fill="#F59E0B" />
    <path d="M 110 100 Q 150 114 190 94 L 194 155 L 105 155 Z" fill="#78350F" />
  </g>
  <!-- Body Contour -->
  <path d="M 104 88 C 104 68 126 56 156 64 C 188 74 204 98 198 136 C 194 154 164 156 132 152 C 108 148 102 122 104 88 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Layered Red & Copper Wing -->
  <path d="M 124 94 C 144 86 172 90 178 114 C 180 132 156 142 136 138 C 124 130 120 108 124 94 Z" fill="#DC2626" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 132 106 Q 154 110 164 122 M 128 118 Q 150 122 158 132" stroke="#991B1B" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Neck Thrown Back in Triumphant Crowing Posture -->
  <path d="M 152 74 C 158 56 166 40 180 34 C 190 32 198 42 192 64 C 188 76 182 86 176 92" fill="#FBBF24" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Golden hackle feather points on neck -->
  <polygon points="166,66 160,74 170,72" fill="#F59E0B" />
  <polygon points="174,68 168,78 178,76" fill="#F59E0B" />
  <polygon points="182,72 176,82 186,80" fill="#F59E0B" />

  <!-- Large Fleshy Red Wattles Under Throat -->
  <path d="M 186 52 C 182 66 190 74 196 66 Z" fill="#DC2626" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Rooster Head (Tilted Upwards Towards Sunrise) -->
  <ellipse cx="186" cy="38" rx="14" ry="12" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.2" />

  <!-- Giant Tall Serrated Red Comb on Head -->
  <path d="M 174 36 C 172 20 180 20 182 26 C 184 14 194 14 196 22 C 198 14 206 16 206 26 C 206 32 196 40 188 42 Z" fill="#DC2626" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Fierce Alert Orange Eye -->
  <circle cx="186" cy="36" r="3.5" fill="#F97316" stroke="#1E2A3B" stroke-width="1.4" />
  <circle cx="186" cy="36" r="1.8" fill="#1E2A3B" />
  <circle cx="185.2" cy="35.2" r="0.7" fill="#FFFFFF" />

  <!-- Beak Wide Open Calling Out! -->
  <!-- Upper beak pointing skyward -->
  <polygon points="196,34 216,28 200,40" fill="#FACC15" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <!-- Red mouth interior & sharp tongue -->
  <polygon points="198,39 208,41 198,44" fill="#DC2626" />
  <!-- Lower beak dropped open -->
  <polygon points="196,44 214,46 194,49" fill="#FACC15" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Crow Sound Waves Blasting into Morning Sky -->
  <path d="M 218 24 Q 228 32 226 44" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <path d="M 228 16 Q 242 28 240 48" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 238 8 Q 256 24 252 52" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round" />
</svg>