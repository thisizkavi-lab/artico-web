<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: conference call
  CONTEXTUAL_DEFINITION: A meeting by phone or online that connects several people in different places.
  PEDAGOGICAL_ART_DIRECTOR: Show one local participant connected to several remote colleagues on a laptop and a shared speakerphone.
  PEDAGOGICAL_ARCHETYPE: 4 - Remote group meeting
  SYNONYM_GUARD: Make the multi-person remote connection unmistakable; avoid a one-to-one private phone conversation or an all-in-person boardroom.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place an open laptop at x=100..224, y=46..116 with three small remote face tiles on screen. A local speaker sits at x=53..108, facing it across a table at y=132; put a compact round speakerphone at x=151..179, y=120. Use two small signal arcs above the laptop and no interface text.
-->
