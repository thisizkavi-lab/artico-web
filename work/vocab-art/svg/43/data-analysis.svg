<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: data analysis
  CONTEXTUAL_DEFINITION: Examining collected data to identify patterns or useful findings.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker comparing a field of data points and isolating a meaningful trend.
  PEDAGOGICAL_ARCHETYPE: 40 - Pattern finding in data
  SYNONYM_GUARD: Show interpretation of already collected information, not source gathering, general arithmetic, or a simple upward chart alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a worker at x=90 studying a large blank grid panel at x=142..260; scatter groups of points inside, add a highlighted rising cluster and a curved trend line, with a magnifying lens over the significant region.
-->
