<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: clinch the deal (idiom)
  CONTEXTUAL_DEFINITION: Secure a business agreement, especially by completing the final negotiation.
  PEDAGOGICAL_ARCHETYPE: 4 - Decisive agreement action
  SYNONYM_GUARD: The decisive handshake over a closed blank contract and a finished handshake-shaped clasp signal a completed agreement rather than a greeting or preliminary check-in.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Two partners meet across a desk centered at y=124. Their clasped hands sit prominently at x=151,y=91 over a closed blue contract folder. Add a small gold seal disk beside the folder to indicate completion without writing.
-->
