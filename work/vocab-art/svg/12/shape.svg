  CHAPTER: 12 — Tools and gardening
  WORD: shape (Noun/Verb; physical form)
  CONTEXTUAL_DEFINITION: The form or outline of an object, and the act of giving material that form.
  PEDAGOGICAL_ARCHETYPE: 3 — Concrete before-and-after contrast
  SYNONYM_GUARD: Show a square molding blank being worked into a curved arch profile; the focus is the changed outline, not a particular tool.
