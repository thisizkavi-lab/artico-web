<!-- SELF_PROMPT:
  CHAPTER: 45 - Driving a car
  WORD: signal
  CONTEXTUAL_DEFINITION: A visible cue from a driver that communicates a planned turn to nearby road users.
  PEDAGOGICAL_ART_DIRECTOR: Show a car's amber indicator sending a clear curved cue toward another waiting driver at an intersection; the signal's communication is the focus.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / directional communication
  SYNONYM_GUARD: Show the information being communicated on the road, distinct from the turn-signal lamp part and from the driver's act of pressing its stalk.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Blue car approaching a junction from x=39..194 y=90..145; amber front indicator at x=185..195. A dotted gold arc travels from the lamp toward a second muted car waiting on the side street at x=214..273 y=43..93; driver in second car faces and responds to the cue.
-->
