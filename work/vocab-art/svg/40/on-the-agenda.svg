<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: on the agenda
  CONTEXTUAL_DEFINITION: Included as a topic planned for discussion at the meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show one agenda topic currently being discussed, visibly highlighted within the planned list.
  PEDAGOGICAL_ARCHETYPE: 5 - Scheduled topic in focus
  SYNONYM_GUARD: The topic is already listed and selected for discussion; it is not a later action item or an unplanned AOB topic.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a wall agenda board at x=73..221, y=34..121 with four rows; highlight the second row with a gold band and one simple topic icon. Put a standing presenter at x=38..77 pointing toward that row and two seated listeners, the right one inset near x=240..282, behind a table at y=132.
-->
