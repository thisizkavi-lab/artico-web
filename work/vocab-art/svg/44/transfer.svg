<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: transfer
  CONTEXTUAL_DEFINITION: To change from one vehicle or route to another during a continuing journey.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler changing from a bus to a train at an interchange, following a connected route onward.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial route diagram with transition
  SYNONYM_GUARD: Emphasize changing modes mid-journey; this is not moving house, changing money, or simply exiting a vehicle.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Bus on left x=25..112 y=79..133; train on right x=191..280 y=77..133; traveler and small bag at central connecting platform x=129..174; route arrows lead from bus through traveler to train.
-->
