<!-- SELF_PROMPT:
  CHAPTER: 13 — Moving and renting
  WORD: property (Noun)
  CONTEXTUAL_DEFINITION: A house and the land around it, treated as a place to rent or own.
  PEDAGOGICAL_ARCHETYPE: 1 — Hero home and bounded plot
  SYNONYM_GUARD: The complete dwelling and its outlined lot are the focus, unlike parking space which isolates one car bay.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Residential street and a clear plot boundary.
    - Context_Layer: Neighboring homes are muted beyond the boundary.
    - Focal_Layer: One warm-colored house inside a parcel of land with garden and path.
    - Details_Layer: Fence corners and a front gate indicate the extent of the property.
    - Lighting_Layer: Blue contour traces the whole lot, not a tiny object.
-->
