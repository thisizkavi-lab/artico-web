<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:pleased" data-archetype="expressive-bust">
  <defs>
    <path id="pleased-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="pleased-head-clip">
      <use href="#pleased-head"/>
    </clipPath>
    <clipPath id="pleased-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Warm Tea Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEF3C7"/>

  <!-- Hands Holding Warm Teacup in Foreground (Content, Pleased) -->
  <g transform="translate(152, 146)">
    <!-- Teacup Silhouette & Saucer -->
    <ellipse cx="0" cy="14" rx="20" ry="5" fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2"/>
    <path d="M -14 0 L 14 0 C 14 12, -14 12, -14 0 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2"/>
    <path d="M 14 2 C 18 2, 18 8, 14 8" fill="none" stroke="#1E2A3B" stroke-width="1.8"/>
    <!-- Rising Steam of Contentment -->
    <path d="M -4 -4 Q -2 -10 -5 -16" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 4 -4 Q 6 -10 3 -16" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Gentle Hands Cupping Cup -->
    <ellipse cx="-16" cy="4" rx="7" ry="9" transform="rotate(-15 -16 4)" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2"/>
    <ellipse cx="16" cy="4" rx="7" ry="9" transform="rotate(15 16 4)" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2"/>
  </g>

  <!-- Torso (Mia: Cream Cardigan) -->
  <g clip-path="url(#pleased-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#F3ECE1"/>
    <path d="M 140 126 L 152 142 L 164 126 Z" fill="#CE3D4E"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#E2DACD"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Pleased Smile -->
  <g clip-path="url(#pleased-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <ellipse cx="176" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#pleased-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Mia) -->
  <path d="M 104 64 C 100 34, 122 18, 152 18 C 182 18, 204 34, 200 64 C 206 90, 206 126, 194 142 C 188 132, 186 96, 184 72 C 176 44, 128 44, 120 72 C 118 96, 116 132, 110 142 C 98 126, 98 90, 104 64 Z"
        fill="#6E473B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Gentle Pleased Eyebrows -->
  <path d="M 124 68 Q 134 62 144 68" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 160 68 Q 170 62 180 68" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Soft Pleased Smiling Eyes -->
  <path d="M 126 78 Q 134 72 142 78" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 162 78 Q 170 72 178 78" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Sweet Satisfied Closed Smile -->
  <path d="M 136 96 Q 152 106 168 96" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 134 94 Q 136 97 134 100" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 170 94 Q 168 97 170 100" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round"/>
</svg>
