<!-- SELF_PROMPT:
  CHAPTER: 59 - Abilities and actions
  WORD: fall (action)
  CONTEXTUAL_DEFINITION: Move downward suddenly after losing balance.
  PEDAGOGICAL_ART_DIRECTOR: Make the person visibly airborne and tipped toward the ground, with legs kicked up behind and arms reaching out.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: The diagonal airborne body, kicked-up legs, and descending motion arc show a fall, not a run or lying down.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A child trips on a small root in a park. In a safe, comic instant, their head and outstretched hands tip down and right while their bent legs kick up behind; curved motion marks trace the descent over soft grass.
-->
