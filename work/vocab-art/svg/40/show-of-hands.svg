<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: show of hands
  CONTEXTUAL_DEFINITION: A quick way to gauge opinions by asking people to raise their hands.
  PEDAGOGICAL_ART_DIRECTOR: Show several participants making a visible vote, with two hands raised and others kept down to make the countable group response clear.
  PEDAGOGICAL_ARCHETYPE: 6 - Visible group vote
  SYNONYM_GUARD: This is a group indicating votes, not one person raising a question or every person giving unanimous assent.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Arrange five meeting participants across a low boardroom table. Two raise one hand, three keep hands down; make all five heads and each raised hand clearly separate silhouettes. Place a small unmarked ballot bowl at the table center, with no written choices.
-->
