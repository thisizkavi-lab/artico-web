  <circle cx="72" cy="166" r="13" fill="#7FB07A" stroke="#1E2A3B" stroke-width="2.2"/>
  <rect x="242" y="14" width="44" height="28" rx="4" fill="#E6C9A8" stroke="#1E2A3B" stroke-width="2.2"/>
  <rect x="242" y="152" width="44" height="28" rx="4" fill="#D8E2EE" stroke="#1E2A3B" stroke-width="2.2"/>

