<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:interested" data-archetype="expressive-bust">
  <defs>
    <path id="interested-head" d="M 104 56 C 104 32, 184 32, 184 56 L 182 92 C 182 118, 162 132, 144 132 C 126 132, 106 118, 106 92 Z"/>
    <clipPath id="interested-head-clip">
      <use href="#interested-head"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas & Table Surface -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <rect x="0" y="152" width="304" height="40" fill="#EAE2D3"/>
  <line x1="0" y1="152" x2="304" y2="152" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Torso Leaning Eagerly Forward over Table (Ren) -->
  <path d="M 80 178 C 86 136, 110 122, 148 122 C 188 122, 216 136, 224 178 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="136" y="112" width="22" height="18" rx="5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Forward Tilt -->
  <g clip-path="url(#interested-head-clip)">
    <rect x="98" y="30" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="120" cy="92" rx="9" ry="5" fill="#F58D82" opacity="0.5"/>
    <ellipse cx="168" cy="92" rx="9" ry="5" fill="#F58D82" opacity="0.5"/>
  </g>
  <use href="#interested-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Chin Resting on Clenched Hand in Deep Interest -->
  <ellipse cx="144" cy="132" rx="10" ry="8" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <path d="M 144 140 L 140 168" stroke="#1E2A3B" stroke-width="12" stroke-linecap="round"/>
  <path d="M 144 140 L 140 168" stroke="#5479AC" stroke-width="8" stroke-linecap="round"/>

  <!-- Open Illustrated Book on Table (Subject of Interest) -->
  <g transform="translate(176, 140)">
    <path d="M 12 18 C 28 14, 46 14, 60 17 L 60 36 C 46 33, 28 33, 12 37 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2"/>
    <path d="M -36 17 C -22 14, -4 14, 12 18 L 12 37 C -4 33, -22 33, -36 36 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2"/>
    <!-- Page illustrations/lines -->
    <rect x="-28" y="20" width="16" height="10" rx="1.5" fill="#5479AC"/>
    <line x1="22" y1="22" x2="50" y2="22" stroke="#94A3B8" stroke-width="1.8"/>
    <line x1="22" y1="27" x2="44" y2="27" stroke="#94A3B8" stroke-width="1.8"/>
  </g>

  <!-- Hair (Ren) -->
  <path d="M 98 62 C 94 34, 116 18, 144 18 C 172 18, 194 34, 190 62 C 184 46, 170 36, 144 36 C 118 36, 106 46, 98 62 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Attentive Eyebrows -->
  <path d="M 118 64 L 138 66" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 154 66 L 174 64" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Wide Curious Eyes Looking Down-Right at the Book -->
  <circle cx="128" cy="74" r="8" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="131" cy="76" r="4.2" fill="#1E2A3B"/>
  <circle cx="132" cy="74.5" r="1.3" fill="#FFFFFF"/>

  <circle cx="164" cy="74" r="8" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="167" cy="76" r="4.2" fill="#1E2A3B"/>
  <circle cx="168" cy="74.5" r="1.3" fill="#FFFFFF"/>

  <!-- Pleasant Intrigued Smile -->
  <path d="M 132 98 Q 144 104 156 98" fill="none" stroke="#1E2A3B" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Lightbulb / Spark Idea of Interest in Upper Corner -->
  <path d="M 68 46 Q 72 46 72 40 Q 72 46 76 46 Q 72 46 72 52 Q 72 46 68 46 Z" fill="#F59E0B"/>
</svg>
