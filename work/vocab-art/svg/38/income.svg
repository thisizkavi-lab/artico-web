  <g id="layer-details"><rect x="187" y="77" width="61" height="34" rx="3" fill="url(#income-envelope)" stroke="#1E2A3B" stroke-width="1.8"/><path d="M190 81 L218 100 L245 81" fill="none" stroke="#568552" stroke-width="1.5"/><path d="M198 88 H235 M198 94 H228" stroke="#94A3B8" stroke-width="1.3"/><ellipse cx="224" cy="134" rx="11" ry="5.5" fill="url(#income-coin)" stroke="#1E2A3B" stroke-width="1.4"/><ellipse cx="244" cy="138" rx="9" ry="4.7" fill="#D97A43" stroke="#1E2A3B" stroke-width="1.3"/><path d="M198 108 V118 M193 113 H203" stroke="#7FB07A" stroke-width="2"/><path d="M182 72 Q194 62 207 67" fill="none" stroke="#7FB07A" stroke-width="1.8" stroke-dasharray="3 3"/></g>
