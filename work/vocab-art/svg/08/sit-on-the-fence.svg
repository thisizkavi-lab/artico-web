  CHAPTER: 08 - Common English idioms
  WORD: sit on the fence (Phrase)
  CONTEXTUAL_DEFINITION: To deliberately avoid choosing a side in a disagreement.
  PEDAGOGICAL_ARCHETYPE: 3 (Human reaction within a visible dilemma)
  SYNONYM_GUARD: Two opposing friends appeal to a central sitter, who folds their arms and refuses to join either group.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Yard with a fence and two diverging paths.
    - Context_Layer: Opposing friends stand on either side and gesture toward the sitter.
    - Focal_Layer: Person sits on the fence with legs crossed and arms tucked in.
    - Details_Layer: Two contrasting group colors and a neutral expression.
    - Lighting_Layer: No side receives stronger light.
-->
