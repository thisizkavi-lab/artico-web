<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: key card
  CONTEXTUAL_DEFINITION: A flat electronic card used to unlock a hotel room door.
  PEDAGOGICAL_ART_DIRECTOR: Show a blue hotel access card being presented to a small electronic reader beside a guest-room door.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: Make the access item a flat card and pair it with a hotel door reader, not a metal key or payment card.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A large blank blue card aligns with a wall-mounted key reader beside a hotel room door; three arcs connect card to reader.
-->
