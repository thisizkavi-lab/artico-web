<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: overdraft (noun)
  CONTEXTUAL_DEFINITION: A bank account deficit created when spending exceeds the available balance.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrastive financial state
  SYNONYM_GUARD: Show the account dipping below its available-funds line with a shortfall that must be covered; no numerals, minus signs, or written labels.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Bank account panel with pale funds line near mid-height; small balance coins above, a large red withdrawal arrow drops below the line into a red shortfall pocket.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:overdraft" data-archetype="contrast-state">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="overdraft-panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F8FBFE"/><stop offset="1" stop-color="#DCECFB"/></linearGradient>
    <radialGradient id="overdraft-coin"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></radialGradient>
    <path id="overdraft-account" d="M58 48 Q58 40 67 40 H238 Q247 40 247 49 V145 H58 Z"/>
    <clipPath id="overdraft-clip"><use href="#overdraft-account"/></clipPath>
    <filter id="overdraft-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".17"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="153" width="304" height="39" fill="#EEE7DA"/><path d="M0 153 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="152" cy="163" rx="94" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Financial account state context -->
  <g id="layer-context"><path d="M37 147 H267" stroke="#C88446" stroke-width="2.2"/><path d="M43 151 H261" stroke="#E3AC77" stroke-width="1.5"/><path d="M73 65 H232" stroke="#A8D4A2" stroke-width="2.4" stroke-dasharray="5 4"/><circle cx="73" cy="65" r="4" fill="#7FB07A" stroke="#1E2A3B" stroke-width="1.1"/><circle cx="232" cy="65" r="4" fill="#7FB07A" stroke="#1E2A3B" stroke-width="1.1"/></g>
  <!-- 3. Account falls into a red shortfall region below available funds -->
  <g id="layer-focal" filter="url(#overdraft-shadow)"><use href="#overdraft-account" fill="url(#overdraft-panel)" stroke="#1E2A3B" stroke-width="2.6"/><g clip-path="url(#overdraft-clip)"><path d="M59 66 H247 V145 H59Z" fill="#F4F6FA"/><path d="M59 112 Q104 105 151 114 T247 110 V146 H59Z" fill="#F7DDE0"/><path d="M60 66 H246" stroke="#7FB07A" stroke-width="2.5"/><ellipse cx="96" cy="82" rx="15" ry="7" fill="#D49B2A" stroke="#1E2A3B" stroke-width="1.6"/><path d="M81 77 V82 C81 92 111 92 111 82 V77" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.6"/><ellipse cx="96" cy="77" rx="15" ry="7" fill="url(#overdraft-coin)" stroke="#1E2A3B" stroke-width="1.6"/><path d="M185 74 V117" stroke="#CE3D4E" stroke-width="7" stroke-linecap="round"/><path d="M172 105 L185 124 L198 105 Z" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round"/><path d="M204 78 H229" stroke="#D97A43" stroke-width="2.2" stroke-linecap="round"/></g></g>
  <!-- 4. Shortfall pocket and outgoing payment cue -->
  <g id="layer-details"><path d="M131 124 Q151 135 173 124" fill="none" stroke="#CE3D4E" stroke-width="2" stroke-linecap="round"/><path d="M120 130 Q151 144 184 130" fill="none" stroke="#CE3D4E" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="218" cy="125" r="7" fill="#F2A472" stroke="#1E2A3B" stroke-width="1.3"/><path d="M214 125 H222" stroke="#9E2636" stroke-width="1.8"/><path d="M70 58 H108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M67 102 H91" stroke="#CE3D4E" stroke-width="2.2" stroke-dasharray="3 3"/></g>
  <!-- 5. Alert highlight on the below-balance region -->
  <g id="layer-lighting"><ellipse cx="185" cy="122" rx="28" ry="23" fill="#F7DDE0" opacity=".45"/><ellipse cx="185" cy="122" rx="28" ry="23" fill="none" stroke="#CE3D4E" stroke-width="1.8" stroke-dasharray="4 4"/><path d="M258 47 L258 56 M254 51 H262" stroke="#CE3D4E" stroke-width="2.4" stroke-linecap="round"/></g>
</svg>
