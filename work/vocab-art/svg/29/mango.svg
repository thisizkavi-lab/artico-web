<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:mango" data-archetype="hero-object">
  <defs>
    <!-- Mango: kidney/oval tropical sunset gradient fruit, plus hedgehog-cut mango half with cubed blocks fanning outward -->
    <clipPath id="mango-body-clip">
      <path d="M 112 60 C 138 60 158 78 156 106 C 154 136 128 164 102 164 C 82 164 68 150 68 132 C 68 108 86 60 112 60 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="112" cy="162" rx="46" ry="9" fill="#DDD4C3" />
  <ellipse cx="212" cy="164" rx="44" ry="8" fill="#DDD4C3" />

  <!-- Slender Stem & Lanceolate Tropical Mango Leaf -->
  <g transform="translate(112, 60)">
    <line x1="0" y1="0" x2="-4" y2="-16" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-4" y2="-16" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
    <!-- Leaf -->
    <path d="M -4 -8 C -22 -18 -38 -12 -46 2 C -32 6 -16 2 -4 -8 Z" fill="#15803D" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M -4 -8 Q -24 -6 -44 2" stroke="#14532D" stroke-width="1.6" fill="none" />
  </g>

  <!-- Whole Tropical Sunset Gradient Mango on Left -->
  <g clip-path="url(#mango-body-clip)">
    <!-- Base golden yellow -->
    <rect x="60" y="55" width="105" height="115" fill="#FACC15" />
    <!-- Flaming crimson-rose blush over top shoulder -->
    <ellipse cx="124" cy="80" rx="36" ry="32" fill="#EF4444" />
    <ellipse cx="118" cy="86" rx="28" ry="24" fill="#F97316" opacity="0.8" />
    <!-- Fresh lime green gradient at the lower curved beak tip -->
    <path d="M 68 130 C 72 164 116 166 116 166 L 68 166 Z" fill="#84CC16" />
    <!-- Underside shadow -->
    <path d="M 70 144 C 84 164 128 166 148 144 L 148 168 L 70 168 Z" fill="#CA8A04" opacity="0.6" />
    <!-- Specular glow -->
    <ellipse cx="106" cy="88" rx="12" ry="16" transform="rotate(-20 106 88)" fill="#FEF08A" opacity="0.8" />
    <ellipse cx="102" cy="82" rx="4" ry="8" transform="rotate(-20 102 82)" fill="#FFFFFF" opacity="0.85" />
  </g>
  <!-- Mango Contour -->
  <path d="M 112 60 C 138 60 158 78 156 106 C 154 136 128 164 102 164 C 82 164 68 150 68 132 C 68 108 86 60 112 60 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Hedgehog-Cut Mango Half in Foreground Right (Cubed Blocks Fanned Outward!) -->
  <g transform="translate(212, 118)">
    <!-- Inverted skin peel base underneath (green/orange rind) -->
    <path d="M -38 18 C -36 34 36 34 38 18 C 30 22 -30 22 -38 18 Z" fill="#84CC16" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

    <!-- 3x3 Fanned Cubed Mango Fruit Blocks -->
    <!-- Top Row of Cubes -->
    <polygon points="-24,-24 -6,-28 -4,-12 -22,-8" fill="#FACC15" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="-4,-28 14,-28 16,-12 -2,-12" fill="#FDE047" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="16,-28 32,-22 30,-6 18,-12" fill="#FACC15" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

    <!-- Middle Row of Cubes (bulging outward toward viewer) -->
    <polygon points="-32,-6 -12,-8 -10,8 -28,10" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="-8,-8 10,-8 12,10 -6,10" fill="#FACC15" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="12,-8 34,-6 30,10 14,10" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Bottom Row of Cubes -->
    <polygon points="-26,12 -8,12 -12,24 -28,20" fill="#D97706" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="-6,12 8,12 6,26 -10,26" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="10,12 28,12 24,20 8,24" fill="#D97706" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

    <!-- Juicy glistening specular glints on cubes -->
    <circle cx="5" cy="0" r="1.5" fill="#FFFFFF" />
    <circle cx="-16" cy="-18" r="1.2" fill="#FFFFFF" />
    <circle cx="5" cy="-20" r="1.2" fill="#FFFFFF" />
    <circle cx="-18" cy="0" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
