<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: reach a consensus
  CONTEXTUAL_DEFINITION: Arrive at a decision that the participants can all support after discussion.
  PEDAGOGICAL_ART_DIRECTOR: Show different viewpoints gradually converging into one shared proposal among a small meeting group.
  PEDAGOGICAL_ARCHETYPE: 6 - Convergence / shared resolution
  SYNONYM_GUARD: Depict a process of coming together around one option, distinct from a simple pairwise agreement or a unanimous show of hands.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Seat three colleagues around a table at x=64..112, x=128..176, and x=192..240. Above them, start three differently colored small idea tiles apart at x=71, 151, and 231 and use curved paths that converge on one shared green card at x=134..170, y=58..95. Their open hands move toward that card.
-->
