<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: have your hands full (work idiom)
  CONTEXTUAL_DEFINITION: Be very busy because you have many responsibilities or tasks.
  PEDAGOGICAL_ART_DIRECTOR: Show a busy employee literally unable to take another work item because both arms already support an unstable stack.
  PEDAGOGICAL_ARCHETYPE: 4 - Work action with overloaded arms
  SYNONYM_GUARD: The pictured overload is figurative workload made visible, not a person carrying groceries or babies.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center an office worker at x=124..180,y=71..150. One arm braces a tall stack of three folders at x=74..130; the other holds a laptop and phone at x=170..220. A coworker's incoming folder waits just beyond reach at x=224.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:have your hands full" data-archetype="workload-action">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="hands-folder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EB0DE"/><stop offset="1" stop-color="#3D5F91"/></linearGradient>
    <linearGradient id="hands-laptop" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DCECFB"/><stop offset="1" stop-color="#8EB0DE"/></linearGradient>
    <radialGradient id="hands-focus"><stop stop-color="#FFF1B9" stop-opacity=".69"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <filter id="hands-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".17"/></filter>
    <path id="hands-worker" d="M126 127 Q127 105 141 100 L143 90 Q138 84 141 75 Q147 66 157 69 Q167 72 164 83 L161 92 Q175 98 177 121 L172 137 H131 Z"/>
    <clipPath id="hands-worker-clip"><use href="#hands-worker"/></clipPath>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="154" width="304" height="38" fill="#EEE7DA"/><path d="M0 154 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="151" cy="165" rx="111" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Active office and one more task waiting nearby -->
  <g id="layer-context"><path d="M34 149 H273" stroke="#C88446" stroke-width="2"/><rect x="35" y="111" width="66" height="33" rx="3" fill="#EEF4FA" stroke="#64748B" stroke-width="1.4"/><path d="M41 119 H95 M41 126 H87" stroke="#CBD5E1" stroke-width="1.1"/><path d="M44 144 V154 M91 144 V154" stroke="#64748B" stroke-width="1.6"/><rect x="222" y="88" width="44" height="30" rx="3" fill="#E5F0E1" stroke="#7FB07A" stroke-width="1.4"/><path d="M228 95 H260 M228 102 H255" stroke="#A8D4A2" stroke-width="1.1"/><path d="M214 103 H223" stroke="#7FB07A" stroke-width="1.8" stroke-dasharray="3 3"/><path d="M217 99 L224 103 L217 107 Z" fill="#7FB07A"/><circle cx="252" cy="53" r="11" fill="#F5BFA3" stroke="#64748B" stroke-width="1.4"/><path d="M241 53 Q242 41 253 42 Q263 43 264 52 Q257 47 250 49 Z" fill="#7B8A9E" stroke="#64748B" stroke-width="1.1"/><path d="M237 81 Q238 62 252 62 Q267 63 268 82 L263 90 H242 Z" fill="#E5E9F0" stroke="#64748B" stroke-width="1.6"/></g>
  <!-- 3. Worker already carries several work responsibilities -->
