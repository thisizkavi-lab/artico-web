<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:lucky" data-archetype="expressive-bust">
  <defs>
    <path id="lucky-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="lucky-head-clip">
      <use href="#lucky-head"/>
    </clipPath>
    <clipPath id="lucky-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Green Clover Lucky Backdrop -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#DCFCE7"/>

  <!-- Hand Holding Four-Leaf Clover in Foreground -->
  <path d="M 194 140 L 224 116 L 234 126 L 206 156 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Clenched Hand Holding Stem -->
  <circle cx="228" cy="116" r="10" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <!-- Four-Leaf Clover Stem & 4 Heart Leaves -->
  <path d="M 226 122 Q 224 100 232 86" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(232, 78)" fill="#22C55E" stroke="#1E2A3B" stroke-width="1.8">
    <!-- Top Leaf -->
    <path d="M 0 0 C -6 -10, 6 -10, 0 0 Z"/>
    <!-- Bottom Leaf -->
    <path d="M 0 0 C -6 10, 6 10, 0 0 Z"/>
    <!-- Left Leaf -->
    <path d="M 0 0 C -10 -6, -10 6, 0 0 Z"/>
    <!-- Right Leaf -->
    <path d="M 0 0 C 10 -6, 10 6, 0 0 Z"/>
  </g>
  <circle cx="232" cy="78" r="2.5" fill="#15803D"/>
  <!-- Lucky Sparkle beside Clover -->
  <path d="M 252 68 Q 256 68 256 62 Q 256 68 260 68 Q 256 68 256 74 Q 256 68 252 68 Z" fill="#F59E0B"/>

  <!-- Torso (Ren) -->
  <g clip-path="url(#lucky-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#5479AC"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Warm Smile -->
  <g clip-path="url(#lucky-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <ellipse cx="176" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#lucky-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Ren) -->
  <path d="M 106 66 C 102 36, 124 20, 152 20 C 180 20, 202 36, 198 66 C 192 48, 176 38, 152 38 C 128 38, 114 48, 106 66 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Happy Winking Eyes (Luck Wink!) -->
  <path d="M 124 70 Q 134 64 144 70" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 160 70 Q 170 64 180 70" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Left Open Eye with Star Sparkle -->
  <circle cx="134" cy="80" r="7.5" fill="#1E2A3B"/>
  <circle cx="132" cy="78" r="2.2" fill="#FFFFFF"/>
  <!-- Right Winking Eye -->
  <path d="M 162 80 Q 170 74 178 80" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Broad Lucky Grin -->
  <path d="M 134 94 C 134 116, 170 116, 170 94 Z" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 142 112 C 146 106, 158 106, 162 112 Z" fill="#F58D82"/>
  <path d="M 136 95 Q 152 99 168 95" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
</svg>
