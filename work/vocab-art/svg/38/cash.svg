<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: cash (noun)
  CONTEXTUAL_DEFINITION: Physical money ready for immediate payment, as opposed to an account balance or card.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with payment context
  SYNONYM_GUARD: Show tangible notes and coins being offered at a checkout; do not depict only a generic abstract money pile.
  MODE: STATIC peak payment moment
  COORDINATE_BLUEPRINT: Warm counter stage; foreground open palm and fanned blank notes at x75..222; three distinct coins at x185..241; muted checkout edge behind; soft shadow below.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:cash" data-archetype="hero-object">
  <defs>
