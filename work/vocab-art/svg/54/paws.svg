<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:paws" data-archetype="part-of-whole">
  <defs>
    <!-- Animal Paws: close-up view of furry paw displaying pink toe beans (digital & metacarpal pads), paw prints on floor -->
    <clipPath id="paw-main-clip">
      <path d="M 112 50 L 114 126 C 114 158 190 158 190 126 L 192 50 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="166" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Focus Halo Ring -->
  <circle cx="152" cy="112" r="66" fill="#FEF3C7" opacity="0.6" />
  <circle cx="152" cy="112" r="66" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6 4" />

  <!-- Cute Paw Prints Walking Across the Floor -->
  <!-- Left Paw Print -->
  <g transform="translate(48, 138) scale(0.65)" opacity="0.8">
    <ellipse cx="20" cy="24" rx="14" ry="11" fill="#78350F" />
    <circle cx="6" cy="10" r="4.5" fill="#78350F" />
    <circle cx="16" cy="6" r="4.8" fill="#78350F" />
    <circle cx="26" cy="6" r="4.8" fill="#78350F" />
    <circle cx="36" cy="10" r="4.5" fill="#78350F" />
  </g>
  <!-- Right Paw Print -->
  <g transform="translate(230, 134) scale(0.7)" opacity="0.8">
    <ellipse cx="20" cy="24" rx="14" ry="11" fill="#78350F" />
    <circle cx="6" cy="10" r="4.5" fill="#78350F" />
    <circle cx="16" cy="6" r="4.8" fill="#78350F" />
    <circle cx="26" cy="6" r="4.8" fill="#78350F" />
    <circle cx="36" cy="10" r="4.5" fill="#78350F" />
  </g>

  <!-- Hero Uplifted Furry Paw (Turned Towards Viewer) -->
  <!-- Foreleg coming down from top -->
  <path d="M 122 36 L 124 104 C 114 110 110 126 114 138 C 122 162 182 162 190 138 C 194 126 190 110 180 104 L 182 36 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- White Fur Highlights & Edge Tufts -->
  <path d="M 116 112 Q 108 120 114 126 M 188 112 Q 196 120 190 126" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Four Puffy Furry Digits / Toes -->
  <ellipse cx="120" cy="98" rx="11" ry="14" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="140" cy="88" rx="12" ry="15" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="164" cy="88" rx="12" ry="15" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="184" cy="98" rx="11" ry="14" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" />

  <!-- Soft Pink "Toe Beans" (Digital Pads) -->
  <ellipse cx="120" cy="100" rx="7" ry="9" fill="#F472B6" stroke="#1E2A3B" stroke-width="1.8" />
  <circle cx="118" cy="97" r="2" fill="#FDF2F8" />

  <ellipse cx="140" cy="90" rx="8" ry="10" fill="#F472B6" stroke="#1E2A3B" stroke-width="1.8" />
  <circle cx="138" cy="87" r="2.2" fill="#FDF2F8" />

  <ellipse cx="164" cy="90" rx="8" ry="10" fill="#F472B6" stroke="#1E2A3B" stroke-width="1.8" />
  <circle cx="162" cy="87" r="2.2" fill="#FDF2F8" />

  <ellipse cx="184" cy="100" rx="7" ry="9" fill="#F472B6" stroke="#1E2A3B" stroke-width="1.8" />
  <circle cx="182" cy="97" r="2" fill="#FDF2F8" />

  <!-- Main Central Metacarpal Palm Pad (Soft Heart / Clover Shape) -->
  <path d="M 152 118 C 138 118 126 126 128 138 C 130 148 144 154 152 150 C 160 154 174 148 176 138 C 178 126 166 118 152 118 Z" fill="#F472B6" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Main pad 3-lobed highlights -->
  <ellipse cx="142" cy="132" rx="4" ry="5" fill="#FB7185" />
  <ellipse cx="152" cy="126" rx="4.5" ry="5" fill="#FB7185" />
  <ellipse cx="162" cy="132" rx="4" ry="5" fill="#FB7185" />
  <circle cx="148" cy="136" r="2" fill="#FDF2F8" />

  <!-- Little Soft Claw Tips Peeking Out -->
  <path d="M 120 84 Q 120 78 122 76" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <path d="M 140 73 Q 140 68 142 66" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <path d="M 164 73 Q 164 68 162 66" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <path d="M 184 84 Q 184 78 182 76" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
</svg>