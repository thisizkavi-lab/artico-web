<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: meeting minutes
  CONTEXTUAL_DEFINITION: The written record of what was discussed and decided at a meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show an organized record page with topic marks, decision symbols, and a date cue, resting on an office table after discussion.
  PEDAGOGICAL_ARCHETYPE: 5 - Written record
  SYNONYM_GUARD: Minutes are notes from a meeting, not sixty-second units, an agenda prepared beforehand, or the act of writing notes.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a clipped record page at x=104..200, y=39..127. Use five note rows with tiny icon marks and varied line lengths but no words; add a small calendar symbol at the top and a checked decision box at the bottom. Place a capped pen alongside and keep meeting participants softly in the background.
-->
