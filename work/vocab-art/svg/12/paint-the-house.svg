  CHAPTER: 12 — Tools and gardening
  WORD: paint the house (Verb phrase)
  CONTEXTUAL_DEFINITION: Apply fresh exterior paint to the outside walls of a house.
  PEDAGOGICAL_ARCHETYPE: 4 — Person, tool, and before/after surface
