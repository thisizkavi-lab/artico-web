<!-- SELF_PROMPT:
  CHAPTER: 14 — The body
  WORD: cheek (Noun)
  CONTEXTUAL_DEFINITION: The soft area of the face below the eye and beside the nose.
  PEDAGOGICAL_ARCHETYPE: 2 — Part-of-whole face callout
  SYNONYM_GUARD: Highlight one cheek region without redness; blush is a change in cheek color caused by embarrassment.
