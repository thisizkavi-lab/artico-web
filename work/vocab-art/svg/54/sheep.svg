           A 14 14 0 0 1 144 68 
           A 16 16 0 0 1 176 66 
           A 15 15 0 0 1 206 70 
           A 14 14 0 0 1 230 84 
           A 14 14 0 0 1 242 108 
           A 14 14 0 0 1 238 132 
           A 14 14 0 0 1 220 148 
           A 14 14 0 0 1 192 154 
           A 14 14 0 0 1 164 154 
           A 14 14 0 0 1 138 150 
           A 14 14 0 0 1 118 136 
           A 14 14 0 0 1 112 116 Z" 
        fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

