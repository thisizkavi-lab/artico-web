  <rect x="181" y="154" width="16" height="9" rx="2.5" fill="#DCECFB" stroke="#1E2A3B" stroke-width="1.5"/>
  <rect x="182" y="168" width="14" height="6" rx="2" fill="#DCECFB" stroke="#1E2A3B" stroke-width="1.4"/>

