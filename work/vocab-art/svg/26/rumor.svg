<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: rumor (Noun)
  CONTEXTUAL_DEFINITION: An unverified story that is repeated among people as though it might be true.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept as circulating message
  SYNONYM_GUARD: Show one indistinct story moving between several speakers without verification, distinct from private gossip about a known person's affairs.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Neighborhood discussion room with a shared table.
    - Context_Layer: Three people sit at separate points across the room.
    - Focal_Layer: A hazy story bubble passes from the first person toward the last, changing slightly as it travels.
    - Details_Layer: Broken dotted trails and uncertain imagery signal that no one has confirmed it.
    - Lighting_Layer: Keep the floating message pale and unresolved.
-->
