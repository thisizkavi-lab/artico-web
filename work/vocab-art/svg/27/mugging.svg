<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: mugging (Noun)
  CONTEXTUAL_DEFINITION: Robbery of a person in a public place by threat or intimidation.
  PEDAGOGICAL_ARCHETYPE: 4 — Peak-moment action with a public victim and stolen bag
  SYNONYM_GUARD: Show a street-side person being intimidated and losing a bag, without weapon or injury; distinguish it from quiet pickpocketing and a shop robbery.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A dim neighborhood sidewalk beneath a streetlamp.
    - Context_Layer: A bench and public pavement establish an open street location.
    - Focal_Layer: One person pulls a shoulder bag away as its owner recoils; a distant officer approaches.
    - Details_Layer: The strap stretches between them and the owner's startled gesture conveys intimidation without physical harm.
    - Lighting_Layer: Cool night blue with a warm lamp pool keeps the figures visible and non-graphic.
-->
