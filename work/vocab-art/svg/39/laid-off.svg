    <path id="laid-person" d="M137 123 Q138 104 151 98 L153 89 Q148 83 151 75 Q157 66 167 69 Q176 73 173 83 L170 92 Q183 98 184 120 L179 133 H141 Z"/>
    <clipPath id="laid-person-clip"><use href="#laid-person"/></clipPath>
