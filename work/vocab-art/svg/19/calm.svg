<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" width="100%" height="100%" data-vocab-key="19:calm">
  <defs>
    <!-- Calm: serene closed eyes, gentle smile, peaceful meditation posture, gentle water ripples / lotus -->
  </defs>

  <!-- Serene misty mint/aqua wash background -->
  <rect width="304" height="192" fill="#F0FDFA" rx="16" />

  <!-- Gentle water ripples in lower background -->
  <ellipse cx="152" cy="162" rx="110" ry="16" fill="none" stroke="#99F6E4" stroke-width="2" opacity="0.6" />
  <ellipse cx="152" cy="164" rx="80" ry="11" fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.7" />
  <ellipse cx="152" cy="166" rx="50" ry="7" fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.8" />

  <!-- Soft floating lotus flower petals beside character -->
  <g transform="translate(68, 142)">
    <path d="M 0 10 C 6 2 14 2 20 10 C 14 18 6 18 0 10 Z" fill="#F472B6" stroke="#1E2A3B" stroke-width="1.8" />
    <path d="M 10 12 C 10 0 18 0 24 8 C 20 14 14 16 10 12 Z" fill="#FBCFE8" stroke="#1E2A3B" stroke-width="1.6" />
    <circle cx="10" cy="11" r="3" fill="#FDE047" />
  </g>

  <!-- Torso (centered, relaxed, seated cross-legged) -->
  <path d="M 102 136 C 102 118 122 112 152 112 C 182 112 202 118 202 136 L 214 172 C 214 180 198 184 152 184 C 106 184 90 180 90 172 Z" fill="#14B8A6" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Meditative folded arms & hands resting gently on lap -->
  <path d="M 104 138 C 96 156 122 174 152 174 C 182 174 208 156 200 138" stroke="#0D9488" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 104 138 C 96 156 122 174 152 174 C 182 174 208 156 200 138" stroke="#1E2A3B" stroke-width="2.6" fill="none" />
  <!-- Resting hands in lap -->
  <ellipse cx="152" cy="172" rx="14" ry="7" fill="#FCE7D6" stroke="#1E2A3B" stroke-width="2" />

  <!-- Neck -->
  <rect x="144" y="100" width="16" height="18" fill="#FCE7D6" stroke="#1E2A3B" stroke-width="2" />

  <!-- Head Base -->
  <circle cx="152" cy="76" r="34" fill="#FCE7D6" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Calm neat topknot / bun hairstyle -->
  <circle cx="152" cy="34" r="13" fill="#334155" stroke="#1E2A3B" stroke-width="2.4" />
  <path d="M 120 72 C 114 52 124 38 152 38 C 180 38 190 52 184 72 C 184 56 172 44 152 44 C 132 44 120 56 120 72 Z" fill="#334155" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Serene gentle eyebrows: soft natural relaxed arches -->
  <path d="M 132 64 Q 138 60 144 63" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 172 64 Q 166 60 160 63" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Eyes: serenely closed in upward peaceful curves `⌒ ⌒` -->
  <path d="M 130 74 Q 138 80 146 74" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <path d="M 158 74 Q 166 80 174 74" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Nose: soft small point -->
  <path d="M 150 78 Q 152 84 154 84" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Gentle peaceful smile of inner tranquility -->
  <path d="M 142 94 Q 152 102 162 94" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Soft healthy cheek blush -->
  <ellipse cx="128" cy="84" rx="6" ry="3.5" fill="#FDA4AF" opacity="0.6" />
  <ellipse cx="176" cy="84" rx="6" ry="3.5" fill="#FDA4AF" opacity="0.6" />

  <!-- Gentle breath swirl / serene aroma in air -->
  <path d="M 174 96 Q 186 92 192 98 Q 198 104 204 100" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
