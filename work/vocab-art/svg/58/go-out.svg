  CHAPTER: 58 - Free time activities
  WORD: go out
  CONTEXTUAL_DEFINITION: Leave home to spend leisure time somewhere with other people.
  PEDAGOGICAL_ART_DIRECTOR: Show someone crossing the open front door toward friends waiting outdoors at night.
