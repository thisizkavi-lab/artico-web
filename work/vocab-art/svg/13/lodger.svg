  CHAPTER: 13 — Moving and renting
  WORD: lodger (Noun)
  CONTEXTUAL_DEFINITION: A person who pays to stay in a room inside someone else's home.
  PEDAGOGICAL_ARCHETYPE: 3 — Host welcoming a paying guest
  SYNONYM_GUARD: The resident host opens a bedroom and offers the visitor a key; a roommate shares the same bedroom and a housemate shares common rooms.
