<!-- SELF_PROMPT:
  CHAPTER: 21 — Family and relationships
  WORD: put your foot down (Idiom)
  CONTEXTUAL_DEFINITION: To state a firm limit or decision and refuse to change it.
  PEDAGOGICAL_ARCHETYPE: 4 — Conceptual metaphor
  SYNONYM_GUARD: One person plants both feet firmly and raises a calm stop-palm while another tries to persuade them, showing a firm boundary rather than literally standing on an object.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Simple home entryway with a clear floor.
    - Context_Layer: A pair of moving boxes sits beside the other person's request.
    - Focal_Layer: Central adult stands wide and grounded, one palm held up decisively.
    - Details_Layer: Small impact marks beneath the planted shoe and a steady face.
    - Lighting_Layer: Focused gold ring around the firm stance.
-->
