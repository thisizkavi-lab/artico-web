  CHAPTER: 21 — Family and relationships
  WORD: break up (Phrasal Verb)
  CONTEXTUAL_DEFINITION: For a romantic couple to end their relationship.
  PEDAGOGICAL_ARCHETYPE: 4 — Conceptual metaphor
  SYNONYM_GUARD: Both partners walk away in different directions with a widening space between them, showing the couple's shared separation rather than one specific person delivering the news.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Quiet path diverging into two directions.
    - Context_Layer: A small shared keepsake rests on the path.
    - Focal_Layer: Two former partners walk apart, backs turned.
    - Details_Layer: A broken gold line between their separate paths.
    - Lighting_Layer: Cooler open space separates the figures.
-->
