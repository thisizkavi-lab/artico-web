<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: rideshare
  CONTEXTUAL_DEFINITION: A car trip arranged so a driver and passenger share one ride.
  PEDAGOGICAL_ART_DIRECTOR: Show one driver already in the car, a second traveler boarding, and a simple shared-route cue on a phone.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action + travel tool
  SYNONYM_GUARD: Use an ordinary unmarked car; no taxi dome, checker stripe, uniform, or lettering. Emphasize the shared pickup.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a compact hatchback from x=48..244 with wheels at (86,143) and (207,143); driver and rear passenger visible through windows; traveler at x=244..272 reaching the open rear door; small route-map phone at x=38..68 y=83..126.
-->
