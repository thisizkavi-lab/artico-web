<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: telephone manner
  CONTEXTUAL_DEFINITION: A polite, clear and helpful way of speaking on the phone.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker listening attentively during a phone call and responding in a calm, professional manner.
  PEDAGOGICAL_ARCHETYPE: 35 - Polite phone conduct
  SYNONYM_GUARD: Emphasize courteous tone, attentive listening, and prepared note-taking, not the phone device or generic conversation alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Seat one upright worker centered at x=150 with a phone held to the ear, relaxed smile and attentive posture; add two gentle speech-wave arcs, a small blank note card with a check, and a tidy desk.
-->
