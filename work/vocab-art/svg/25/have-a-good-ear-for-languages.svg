  CHAPTER: 25 — Speaking a foreign language
  WORD: have a good ear for languages (Verb phrase)
  CONTEXTUAL_DEFINITION: Be especially able to hear and reproduce sounds in unfamiliar languages.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action
  SYNONYM_GUARD: Show a learner hearing a model phrase and accurately echoing its changing sound contour, distinct from the ability noun phrase card.
