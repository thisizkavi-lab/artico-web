<!-- SELF_PROMPT:
  CHAPTER: 25 — Speaking a foreign language
  WORD: translate (Verb)
  CONTEXTUAL_DEFINITION: Change words or speech from one language into another while keeping the meaning.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action
  SYNONYM_GUARD: Show a person actively listening to one speaker and relaying the same picture meaning in another speech pattern; distinguish from translation as a completed written result.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: International conversation table.
    - Context_Layer: Two people speak different abstract sound patterns.
    - Focal_Layer: Translator listens and turns to relay the meaning to the other person.
    - Details_Layer: The same central picture cue passes through the translator.
    - Lighting_Layer: Warm light links the two sides through the translator.
-->
