    <linearGradient id="lay-box" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E8B765"/><stop offset="1" stop-color="#B6784B"/></linearGradient>
    <radialGradient id="lay-focus"><stop stop-color="#F9D6C8" stop-opacity=".64"/><stop offset="1" stop-color="#CE3D4E" stop-opacity="0"/></radialGradient>
