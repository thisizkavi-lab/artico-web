<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: vandalism (Noun)
  CONTEXTUAL_DEFINITION: Deliberate damage to public or private property.
  PEDAGOGICAL_ARCHETYPE: 4 — Peak-moment action with damaged property
  SYNONYM_GUARD: Show one person deliberately damaging a public planter, distinct from graffiti's unauthorized markings and hooliganism's group disorder.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A quiet public garden path with an intact low planter nearby.
    - Context_Layer: A second planter is tipped and cracked, with soil and leaves spilled out.
    - Focal_Layer: One person deliberately kicks the planter while a witness signals for help.
    - Details_Layer: A broken rim and displaced soil show damage without injury or dangerous tools.
    - Lighting_Layer: Calm daylight emphasizes the public object and intentional act.
-->
