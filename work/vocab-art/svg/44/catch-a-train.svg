  CHAPTER: 44 - Transportation and travel
  WORD: catch a train
  CONTEXTUAL_DEFINITION: To reach a train in time and board it before it departs.
  PEDAGOGICAL_ART_DIRECTOR: Capture the traveler stepping through an open train doorway as the train waits at the platform.
