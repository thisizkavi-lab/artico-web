<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: fix a puncture (Verb Phrase)
  CONTEXTUAL_DEFINITION: Patch a hole in a bicycle inner tube and repair the tire so it can hold air again.
  PEDAGOGICAL_ART_DIRECTOR: Show hands pressing a small patch onto the exposed inner tube beside a removed wheel.
  PEDAGOGICAL_ARCHETYPE: 4 - Agent-to-object action
  SYNONYM_GUARD: The action repairs a bicycle tire puncture; it is not simply pumping air or replacing a whole wheel.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Inner tube lifted from a tire; two hands press a bright patch over a marked pinhole; patch kit open nearby.
-->
