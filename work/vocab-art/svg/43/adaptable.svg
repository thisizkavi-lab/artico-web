  CHAPTER: 43 - Workplace skills and abilities
  WORD: adaptable
  CONTEXTUAL_DEFINITION: Able to adjust easily to new tasks or changing situations.
  PEDAGOGICAL_ART_DIRECTOR: Show one worker calmly switching from a first task to a newly needed task.
  PEDAGOGICAL_ARCHETYPE: 3 - Person adjusts to change
  SYNONYM_GUARD: Apply the quality to a person who changes tasks smoothly; do not use a bendable object to match the alternate Japanese gloss.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put one worker in the center x=118..174, y=68..137, turning from an earlier tool at x=78..113 toward a new task station at x=185..237. Use one curved transition arrow over the shoulders and calm posture.
-->
