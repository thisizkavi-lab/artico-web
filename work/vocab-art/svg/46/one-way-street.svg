  CHAPTER: 46 - Maps and directions
  WORD: one-way street
  CONTEXTUAL_DEFINITION: An urban street where traffic is permitted to travel in only one direction.
  PEDAGOGICAL_ART_DIRECTOR: Use a top-down city street with several vehicles and repeated aligned arrows all pointing the same way; no opposing traffic lane or counter-arrow.
