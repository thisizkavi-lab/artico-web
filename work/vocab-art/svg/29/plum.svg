<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:plum" data-archetype="hero-object">
  <defs>
    <!-- Plum: deep violet-purple skin with powdery frosted bloom, longitudinal suture cleft, cut half with glowing amber-gold flesh and flat stone pit -->
    <clipPath id="plum-body-clip">
      <ellipse cx="112" cy="114" rx="44" ry="46" />
    </clipPath>
    <clipPath id="plum-half-clip">
      <ellipse cx="204" cy="118" rx="38" ry="38" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="112" cy="162" rx="48" ry="9" fill="#DDD4C3" />
  <ellipse cx="204" cy="164" rx="42" ry="8" fill="#DDD4C3" />

  <!-- Slender Brown Stem & Green Leaf on Whole Plum -->
  <g transform="translate(112, 68)">
    <line x1="0" y1="0" x2="-2" y2="-16" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-2" y2="-16" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
    <!-- Leaf -->
    <path d="M -2 -10 C -16 -18 -24 -12 -26 0 C -16 2 -8 -2 -2 -10 Z" fill="#65A30D" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />
  </g>

  <!-- Whole Violet-Purple Plum on Left -->
  <g clip-path="url(#plum-body-clip)">
    <!-- Base rich royal purple -->
    <rect x="60" y="60" width="105" height="110" fill="#6B21A8" />
    <!-- Deep midnight purple underside shade -->
    <path d="M 68 132 C 82 158 136 158 156 132 L 156 165 L 68 165 Z" fill="#3B0764" />
    <!-- Powdery silver-lavender frosted bloom (waxy bloom characteristic of plums) -->
    <ellipse cx="98" cy="98" rx="32" ry="34" fill="#A855F7" opacity="0.75" />
    <ellipse cx="90" cy="90" rx="16" ry="20" transform="rotate(-20 90 90)" fill="#E9D5FF" opacity="0.85" />
    <ellipse cx="86" cy="84" rx="5" ry="8" transform="rotate(-20 86 84)" fill="#FFFFFF" opacity="0.9" />
  </g>
  <!-- Plum Contour -->
  <ellipse cx="112" cy="114" rx="44" ry="46" fill="none" stroke="#1E2A3B" stroke-width="2.6" />
  <!-- Characteristic Longitudinal Plum Suture Groove -->
  <path d="M 112 68 C 106 92 106 138 112 160" stroke="#3B0764" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <ellipse cx="112" cy="69" rx="5" ry="2" fill="#2E1065" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Cut Plum Half in Foreground Right (Showing Glowing Amber Flesh & Flat Pit) -->
  <ellipse cx="204" cy="118" rx="38" ry="38" fill="#581C87" stroke="#1E2A3B" stroke-width="2.6" />
  <g clip-path="url(#plum-half-clip)">
    <!-- Thin dark violet skin rim -->
    <ellipse cx="204" cy="118" rx="35" ry="35" fill="#F59E0B" />
    <!-- Translucent sweet amber-gold interior flesh -->
    <ellipse cx="204" cy="118" rx="28" ry="28" fill="#FBBF24" />
    <!-- Reddish bleed ring at pit cavity -->
    <ellipse cx="204" cy="118" rx="18" ry="22" fill="#EF4444" opacity="0.6" />

    <!-- Flat Oval Brown Stone Pit in Center -->
    <ellipse cx="204" cy="118" rx="10" ry="16" fill="#78350F" stroke="#1E2A3B" stroke-width="2" />
    <!-- Ridge on stone pit -->
    <path d="M 204 104 C 206 114 206 124 204 132" stroke="#451A03" stroke-width="1.6" stroke-linecap="round" fill="none" />
  </g>
</svg>
