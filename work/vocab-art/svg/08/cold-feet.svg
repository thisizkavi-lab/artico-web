<!-- SELF_PROMPT:
  CHAPTER: 08 - Common English idioms
  WORD: cold feet (Phrase)
  CONTEXTUAL_DEFINITION: Nervousness that stops someone from going through with a challenging plan.
  PEDAGOGICAL_ARCHETYPE: 3 (Human reaction at a moment of hesitation)
  SYNONYM_GUARD: A performer freezes before stepping onstage; icy shoes stand for fear, not literal cold weather.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Theater wings and a bright stage beyond.
    - Context_Layer: Audience waits in silhouette.
    - Focal_Layer: Nervous performer stops at the stage threshold with frosty shoes.
    - Details_Layer: Trembling knees, hesitant hand, warm stage lights.
    - Lighting_Layer: Warm stage light meets a cool shadow at the threshold.
-->
