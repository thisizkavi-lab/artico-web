<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: smuggling (Noun)
  CONTEXTUAL_DEFINITION: Illegally transporting goods across a border while hiding them from inspection.
  PEDAGOGICAL_ARCHETYPE: 6 — Crime shown through concealed goods discovered at customs
  SYNONYM_GUARD: Show hidden contents revealed by a lawful border inspection, distinct from ordinary freight transport or drug dealing.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A neutral customs inspection bay with a conveyor and scanning arch.
    - Context_Layer: A sealed crate passes through a simple x-ray panel.
    - Focal_Layer: A customs officer opens the crate and discovers hidden objects inside a false-looking inner layer.
    - Details_Layer: The scanner shows faint concealed shapes; no concealment method or route is described.
    - Lighting_Layer: Cool institutional light and a restrained amber alert highlight the discovery.
-->
