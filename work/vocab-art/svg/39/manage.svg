<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: manage (verb; coordinate a workplace)
  CONTEXTUAL_DEFINITION: Organize and control the work, people, or resources of a team or organization.
  PEDAGOGICAL_ART_DIRECTOR: Show a manager coordinating several work streams from a shared planning surface rather than leading one group toward a destination.
  PEDAGOGICAL_ARCHETYPE: 3 - Workplace coordination / role
  SYNONYM_GUARD: Depict organizing tasks and resources, not simply encouraging a group or physically handling an object.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a manager at x=148,y=93 behind a planning desk. Arrange three distinct work modules around them—paperwork, a team, and equipment—and connect each to a single organized dashboard with clean blue arrows.
-->
