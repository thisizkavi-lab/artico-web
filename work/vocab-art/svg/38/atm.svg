<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: ATM / cash machine (noun)
  CONTEXTUAL_DEFINITION: A bank machine that lets a customer withdraw cash using a bank card.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action plus tool
  SYNONYM_GUARD: Make the freestanding bank cash machine recognizable through screen, card slot, keypad and cash dispenser; show bills being retrieved, not a generic vending machine.
  MODE: STATIC peak cash withdrawal
  COORDINATE_BLUEPRINT: Tall blue-grey ATM body x86..219; display high, blank key grid and slot mid-body, cash tray low with two notes; customer's thick forearm reaches for notes from right.
-->
