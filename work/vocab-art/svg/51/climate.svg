  SYNONYM_GUARD: This is a repeating long-term seasonal pattern, not today's forecast.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Four equal landscape slices of one valley, from spring flowers through summer foliage and autumn color to winter snow.
-->
