<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:blackberries" data-archetype="hero-object">
  <defs>
    <!-- Blackberries: aggregate drupelet clusters, deep dark purple/black beads with white glints, serrated bramble leaves -->
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="120" cy="162" rx="46" ry="8" fill="#DDD4C3" />
  <ellipse cx="202" cy="164" rx="38" ry="7" fill="#DDD4C3" />

  <!-- Bramble Stem & Serrated Blackberry Leaves in Background -->
  <g transform="translate(100, 48)">
    <!-- Main stem -->
    <path d="M 12 18 C 16 -6 38 -18 56 -10" stroke="#4D7C0F" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 12 18 C 16 -6 38 -18 56 -10" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Leaf 1 (Left) -->
    <path d="M 22 2 C 0 -12 -4 -28 14 -36 C 26 -28 26 -14 22 2 Z" fill="#65A30D" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 22 2 Q 16 -18 14 -34" stroke="#365314" stroke-width="1.6" fill="none" />
    <!-- Leaf 2 (Right) -->
    <path d="M 38 -6 C 54 -20 72 -20 80 -4 C 68 8 52 4 38 -6 Z" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  </g>

  <!-- Calyx Star on Top of Berry 1 -->
  <g transform="translate(118, 76)">
    <polygon points="0,0 -8,-10 0,-6 8,-10" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="1.8" />
    <polygon points="0,0 -12,2 -8,-4" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="1.8" />
    <polygon points="0,0 12,2 8,-4" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="1.8" />
  </g>

  <!-- Primary Blackberry on Left (Compound Drupelets) -->
  <g transform="translate(118, 114)">
    <!-- Back row drupelets -->
    <circle cx="-18" cy="-24" r="10" fill="#312E81" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="0" cy="-28" r="10.5" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="18" cy="-24" r="10" fill="#312E81" stroke="#1E2A3B" stroke-width="2" />

    <!-- Second row drupelets -->
    <circle cx="-26" cy="-10" r="11" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="-10" cy="-12" r="12" fill="#312E81" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="10" cy="-12" r="12" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="26" cy="-10" r="11" fill="#0F172A" stroke="#1E2A3B" stroke-width="2" />

    <!-- Third row drupelets (center) -->
    <circle cx="-22" cy="8" r="11" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="-6" cy="6" r="12.5" fill="#312E81" stroke="#1E2A3B" stroke-width="2.4" />
    <circle cx="12" cy="6" r="12" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2.4" />
    <circle cx="24" cy="8" r="10.5" fill="#0F172A" stroke="#1E2A3B" stroke-width="2.2" />

    <!-- Fourth row drupelets (lower) -->
    <circle cx="-14" cy="24" r="10" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="0" cy="24" r="11" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="14" cy="24" r="9.5" fill="#0F172A" stroke="#1E2A3B" stroke-width="2" />

    <!-- Bottom tip drupelet -->
    <circle cx="0" cy="36" r="8.5" fill="#0F172A" stroke="#1E2A3B" stroke-width="2" />

    <!-- Specular highlight glints on glossy spherical beads -->
    <circle cx="-12" cy="-15" r="2.5" fill="#818CF8" />
    <circle cx="-13" cy="-16" r="1" fill="#FFFFFF" />
    <circle cx="8" cy="-15" r="2.5" fill="#818CF8" />
    <circle cx="7" cy="-16" r="1" fill="#FFFFFF" />
    <circle cx="-8" cy="3" r="3" fill="#818CF8" />
    <circle cx="-9" cy="2" r="1.2" fill="#FFFFFF" />
    <circle cx="10" cy="3" r="2.5" fill="#818CF8" />
    <circle cx="9" cy="2" r="1" fill="#FFFFFF" />
    <circle cx="-2" cy="21" r="2" fill="#818CF8" />
    <circle cx="-24" cy="6" r="2" fill="#818CF8" />
  </g>

  <!-- Second Slightly Smaller Blackberry Tilted in Foreground Right -->
  <g transform="translate(202, 126) rotate(18) scale(0.85)">
    <!-- Drupelets -->
    <circle cx="-16" cy="-18" r="9" fill="#312E81" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="0" cy="-20" r="9.5" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="16" cy="-18" r="9" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2" />

    <circle cx="-20" cy="-4" r="10" fill="#312E81" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="-4" cy="-4" r="11" fill="#4338CA" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="14" cy="-4" r="10.5" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2.2" />

    <circle cx="-12" cy="12" r="9.5" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="4" cy="12" r="10" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="-2" cy="24" r="7.5" fill="#0F172A" stroke="#1E2A3B" stroke-width="2" />

    <!-- Glints -->
    <circle cx="-5" cy="-6" r="2.2" fill="#A5B4FC" />
    <circle cx="-6" cy="-7" r="1" fill="#FFFFFF" />
    <circle cx="12" cy="-6" r="2" fill="#818CF8" />
  </g>
</svg>
