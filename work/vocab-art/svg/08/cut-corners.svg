<!-- SELF_PROMPT:
  CHAPTER: 08 - Common English idioms
  WORD: cut corners (Phrase)
  CONTEXTUAL_DEFINITION: To do something cheaply or carelessly by skipping important steps.
  PEDAGOGICAL_ARCHETYPE: 2 (A rushed shortcut causes a visibly weak result)
  SYNONYM_GUARD: A builder trims away supports and corners to save effort; the finished wobbly stool shows the cost of the shortcut.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Workshop floor and a tool bench.
    - Context_Layer: Builder holds a saw beside a rough board.
    - Focal_Layer: Unfinished stool with clipped seat corners and missing braces.
    - Details_Layer: Offcuts and loose joint.
    - Lighting_Layer: Uneven light signals an incomplete job.
-->
