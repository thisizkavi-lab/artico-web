  CHAPTER: 41 - Work and business idioms
  WORD: change of pace (idiom)
  CONTEXTUAL_DEFINITION: A welcome shift from the usual fast or repetitive work rhythm to a different, calmer activity.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrast between work rhythms
  SYNONYM_GUARD: Repeated paper sorting on one side contrasts with a short purposeful walk and stretch; the person remains in a workday setting.
