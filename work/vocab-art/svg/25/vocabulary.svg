  CHAPTER: 25 — Speaking a foreign language
  WORD: vocabulary (Noun)
  CONTEXTUAL_DEFINITION: The words known or used by a person, group, or subject area.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Show a learner's collection of learned word cards using picture symbols only; do not use a book of grammar rules or visible written vocabulary.
