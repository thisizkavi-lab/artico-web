<!-- SELF_PROMPT:
  CHAPTER: 50 - Beach
  WORD: bodyboarding (Noun)
  CONTEXTUAL_DEFINITION: Riding a small wave while lying prone on a short bodyboard.
  PEDAGOGICAL_ART_DIRECTOR: Make the rider horizontal and close to the water on a short board, clearly different from standing surfing.
