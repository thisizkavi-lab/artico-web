<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:mouse (animal)" data-archetype="hero-object">
  <defs>
    <!-- Little house mouse: giant round ears, long curling hairless tail, pointed snout, cheese wedge -->
    <clipPath id="mouse-body-clip">
      <path d="M 120 134 C 114 104 140 88 174 88 C 208 88 226 112 222 144 C 216 156 190 160 160 160 C 130 160 122 146 120 134 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="166" rx="108" ry="12" fill="#EAE3D5" />
  <ellipse cx="154" cy="164" rx="58" ry="7" fill="#DDD4C3" />

  <!-- Long Slender Curling Pink Tail -->
  <path d="M 218 144 C 240 144 258 132 254 112 C 250 96 232 94 234 104 C 236 114 246 118 244 126 C 242 134 230 140 216 140" fill="none" stroke="#FDA4AF" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 218 144 C 240 144 258 132 254 112 C 250 96 232 94 234 104 C 236 114 246 118 244 126 C 242 134 230 140 216 140" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Mouse Body (Heather Gray) -->
  <g clip-path="url(#mouse-body-clip)">
    <!-- Base Gray -->
    <rect x="110" y="80" width="120" height="85" fill="#94A3B8" />
    <!-- Light gray / white chest and belly -->
    <ellipse cx="152" cy="136" rx="28" ry="18" fill="#F1F5F9" />
    <!-- Lower shadow -->
    <rect x="110" y="152" width="120" height="15" fill="#64748B" />
  </g>
  <!-- Body Contour -->
  <path d="M 120 134 C 114 104 140 88 174 88 C 208 88 226 112 222 144 C 216 156 190 160 160 160 C 130 160 122 146 120 134 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Tiny Pink Paws -->
  <ellipse cx="140" cy="160" rx="6" ry="4" fill="#FDA4AF" stroke="#1E2A3B" stroke-width="1.8" />
  <ellipse cx="184" cy="160" rx="8" ry="4.5" fill="#FDA4AF" stroke="#1E2A3B" stroke-width="1.8" />

  <!-- Giant Round Ears (Classic Mouse Characteristic) -->
  <!-- Left Ear (Far) -->
  <circle cx="128" cy="72" r="18" fill="#94A3B8" stroke="#1E2A3B" stroke-width="2.2" />
  <circle cx="128" cy="72" r="12" fill="#FDA4AF" />
  <!-- Right Ear (Near) -->
  <circle cx="148" cy="78" r="19" fill="#94A3B8" stroke="#1E2A3B" stroke-width="2.4" />
  <circle cx="148" cy="78" r="13" fill="#FDA4AF" />

  <!-- Pointed Snout Head -->
  <path d="M 148 94 L 102 126 C 96 130 102 138 108 140 L 144 134 Z" fill="#94A3B8" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M 106 126 Q 120 134 138 132" stroke="#F1F5F9" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Tiny Pink Nose -->
  <circle cx="98" cy="128" r="3" fill="#F43F5E" stroke="#1E2A3B" stroke-width="1.4" />

  <!-- Dark Shiny Mouse Bead Eye -->
  <circle cx="124" cy="112" r="4" fill="#1E2A3B" />
  <circle cx="123" cy="110.5" r="1.4" fill="#FFFFFF" />

  <!-- Long Thin Whiskers -->
  <line x1="100" y1="126" x2="74" y2="114" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />
  <line x1="100" y1="128" x2="70" y2="128" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />
  <line x1="100" y1="130" x2="76" y2="140" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Swiss Cheese Wedge Beside Mouse -->
  <polygon points="62,156 86,134 94,158" fill="#FBBF24" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <polygon points="86,134 110,140 94,158" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Cheese Holes -->
  <ellipse cx="78" cy="148" rx="3.5" ry="2.5" fill="#D97706" />
  <circle cx="86" cy="142" r="2" fill="#D97706" />
  <ellipse cx="100" cy="148" rx="2.5" ry="3.5" fill="#B45309" />
</svg>