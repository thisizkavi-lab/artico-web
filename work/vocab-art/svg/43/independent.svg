<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: independent
  CONTEXTUAL_DEFINITION: Able to work alone and make progress without constant help.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker planning and completing a task on their own using available resources.
  PEDAGOGICAL_ARCHETYPE: 17 - Self-directed work
  SYNONYM_GUARD: Depict capable autonomy, not social isolation or refusal to be a team player.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center one worker at a desk independently consulting a blank reference page and completing a clear task. Leave the space beside them open; show a small finished check on their own board.
-->
