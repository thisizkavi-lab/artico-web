  CHAPTER: 51 - Weather and climate
  WORD: tornado (Noun)
  CONTEXTUAL_DEFINITION: A narrow rotating funnel cloud reaching from a storm cloud toward the ground.
  PEDAGOGICAL_ART_DIRECTOR: Make a tapered rotating funnel unmistakable as it touches down on an open plain beneath a dark parent cloud.
  PEDAGOGICAL_ARCHETYPE: 3 - Rotating funnel hazard
  SYNONYM_GUARD: A tornado is a vertical funnel viewed from the side, unlike a hurricane's broad overhead spiral.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A slim twisting cloud funnel narrows from a wide storm base to the ground, with wind rings circling the lower tip.
-->
