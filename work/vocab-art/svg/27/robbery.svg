  CHAPTER: 27 — Crime and the law
  WORD: robbery (Noun)
  CONTEXTUAL_DEFINITION: Taking property from a person or place by force or threat.
  PEDAGOGICAL_ARCHETYPE: 4 — Peak-moment action with threatened property transfer
  SYNONYM_GUARD: Show a shop counter, open cash drawer, and intimidated clerk, distinct from quiet shoplifting or a street mugging.
