<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: withdrawal (noun; taking cash out of an account)
  CONTEXTUAL_DEFINITION: Money removed from a bank account, commonly as cash from an ATM.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action plus tool
  SYNONYM_GUARD: Show funds leaving the account and cash being taken from a machine; contrast with deposit, where money enters.
  MODE: STATIC peak cash withdrawal
  COORDINATE_BLUEPRINT: Compact ATM dispenser at left, personal account screen behind; two blank notes exit slot toward a reaching hand at right, with blue outward arrow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:withdrawal" data-archetype="action-tool">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
