<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: finance (noun; management of money)
  CONTEXTUAL_DEFINITION: The management, investment, and flow of money for people or organizations.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with flow system
  SYNONYM_GUARD: Use a broad money-management scene with assets, incoming and outgoing flows, and a ledger; not one cash object, bill, or bank transaction.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Central open finance ledger and reserve chest; blue incoming arrow, copper outflow arrow, and green investment path connect coins, bankbook and enterprise building.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:finance" data-archetype="financial-system">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="finance-ledger" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCECFB"/></linearGradient>
    <radialGradient id="finance-coin"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></radialGradient>
    <path id="finance-book" d="M91 50 Q91 43 99 43 H208 Q216 43 216 51 V137 Q216 144 208 144 H99 Q91 144 91 137 Z"/>
    <clipPath id="finance-clip"><use href="#finance-book"/></clipPath>
    <filter id="finance-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".17"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
