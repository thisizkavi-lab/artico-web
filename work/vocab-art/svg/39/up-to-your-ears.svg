<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: up to your ears (work idiom)
  CONTEXTUAL_DEFINITION: Extremely busy or involved with work.
  PEDAGOGICAL_ART_DIRECTOR: Show work folders rising to the employee's ear level; keep the whole face and both ears just visible above the work.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrast / workload level
  SYNONYM_GUARD: Use a static ear-height paper line, distinct from the falling paper avalanche in snowed under and the more extreme eyeball-height pile.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A worker sits centered at x=125..178, head from y=54..91. A broad foreground wall of folders rises to y=88, reaching both ears but leaving eyes, nose, and mouth unobstructed; add one hand shuffling a final page.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:up to your ears" data-archetype="workload-level">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="ears-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DCECFB"/><stop offset="1" stop-color="#8EB0DE"/></linearGradient>
    <linearGradient id="ears-folder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EB0DE"/><stop offset="1" stop-color="#3D5F91"/></linearGradient>
    <radialGradient id="ears-focus"><stop stop-color="#FFF1B9" stop-opacity=".65"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <filter id="ears-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="154" width="304" height="38" fill="#EEE7DA"/><path d="M0 154 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="152" cy="165" rx="110" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Office wall and crowded work surface -->
