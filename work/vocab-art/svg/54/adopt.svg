    <rect x="110" y="65" width="85" height="85" fill="#FBBF24" />
    <!-- White Chest Bib -->
    <ellipse cx="152" cy="116" rx="18" ry="24" fill="#FFFBEB" />
    <ellipse cx="152" cy="80" rx="30" ry="24" fill="#F59E0B" />
    <!-- White muzzle -->
    <ellipse cx="152" cy="92" rx="14" ry="10" fill="#FFFBEB" />
  </g>
  <ellipse cx="152" cy="106" rx="34" ry="38" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Floppy Ears Hanging Down -->
  <path d="M 124 74 C 108 76 100 94 104 112 C 108 120 120 120 122 110 L 126 84 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 180 74 C 196 76 204 94 200 112 C 196 120 184 120 182 110 L 178 84 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Puppy Sparkling Relieved Eyes (Tears of joy) -->
  <ellipse cx="138" cy="78" rx="5" ry="6" fill="#1E2A3B" />
  <circle cx="136" cy="76" r="2.2" fill="#FFFFFF" />
  <circle cx="139" cy="81" r="1.1" fill="#FFFFFF" />

  <ellipse cx="166" cy="78" rx="5" ry="6" fill="#1E2A3B" />
  <circle cx="164" cy="76" r="2.2" fill="#FFFFFF" />
  <circle cx="167" cy="81" r="1.1" fill="#FFFFFF" />

  <!-- Button Nose & Smiling Mouth -->
