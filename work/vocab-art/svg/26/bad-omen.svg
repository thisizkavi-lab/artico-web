<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: bad omen (Noun phrase)
  CONTEXTUAL_DEFINITION: A sign that someone interprets as warning of future trouble.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept through symbolic scene
  SYNONYM_GUARD: Depict a culturally familiar foreboding sign and a wary observer; it is a superstition, not evidence or a certain prediction.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Garden just before a storm, with a pale sky darkening at one edge.
    - Context_Layer: A small path and bent branch establish an everyday setting.
    - Focal_Layer: A dark bird settles on the broken branch as a person notices it with concern.
    - Details_Layer: Approaching cloud and uneasy glance suggest a warning sign, without showing harm.
    - Lighting_Layer: Muted plum shadow contrasts with a narrow warm patch of light.
-->
