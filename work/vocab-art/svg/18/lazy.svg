  CHAPTER: 18 — Personality traits
  WORD: lazy (Adjective)
  CONTEXTUAL_DEFINITION: Avoiding effort or work that needs to be done.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: The person lounges while an unvacuumed rug, laundry basket, and untouched broom show chores being neglected; unlike laid-back, there is work waiting.
