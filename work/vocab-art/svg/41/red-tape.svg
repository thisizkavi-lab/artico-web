<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: red tape (idiom)
  CONTEXTUAL_DEFINITION: Excessive official paperwork and procedure that delays ordinary work.
  PEDAGOGICAL_ARCHETYPE: 6 - Bureaucratic obstruction
  SYNONYM_GUARD: A thick crimson ribbon literally binds a tall stack of blank forms while a waiting worker cannot proceed; the ribbon represents administrative obstacles, not gift wrapping.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Stack blank files and paper at x=99..220, y=50..146. Wrap a broad red ribbon vertically and horizontally around the stack with a large knot at center. Add a waiting clerk holding an unfinished folder at left and a small queue rail in the background.
-->
