<!-- SELF_PROMPT:
  CHAPTER: 24 — Studying
  WORD: polar opposites (Noun phrase)
  CONTEXTUAL_DEFINITION: Two things at the extreme opposite ends of a scale or spectrum.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Place day and night at the far ends of one continuous balance beam to express extremes, rather than just two noticeably different items.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Open sky transitioning from day to night.
    - Context_Layer: Sun on one side, moon and stars on the other.
    - Focal_Layer: A long balanced beam spans the opposing ends.
    - Details_Layer: Two small markers sit at the far endpoints.
    - Lighting_Layer: Warm and cool halves meet at a clear center.
-->
