<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: economic downturn (noun)
  CONTEXTUAL_DEFINITION: A period when overall business activity and prosperity decline.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrastive economy-wide scene
  SYNONYM_GUARD: Depict a broad slowdown across several businesses, not one company's loss or a single person's debt.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Several muted storefronts and a factory across a town strip; shrinking customer crowd, low production conveyor and descending blue market curve with arrows; no signs or text.
-->
