<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:collar (shirt)" data-archetype="part-focus">
  <defs>
    <clipPath id="collar-left-clip">
      <path d="M 122 36 L 152 62 L 128 84 L 106 58 Z"/>
    </clipPath>
    <clipPath id="collar-right-clip">
      <path d="M 182 36 L 152 62 L 176 84 L 198 58 Z"/>
    </clipPath>
  </defs>

  <!-- Warm Paper Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Soft Focus Halo Behind Collar Zone -->
  <ellipse cx="152" cy="58" rx="64" ry="38" fill="#FEF3C7"/>
  <ellipse cx="152" cy="58" rx="54" ry="30" fill="#FDE68A" opacity="0.6"/>

  <!-- MUTED CONTEXT: Dress Shirt Torso & Shoulders (ghosted so it NEVER reads as 'shirt') -->
  <path d="M 118 44
           L 76 60
           L 60 118
           L 86 126
           L 96 92
           L 96 170
           L 208 170
           L 208 92
           L 218 126
           L 244 118
           L 228 60
           L 186 44 Z"
        fill="#E6ECF2" stroke="#7B8A9E" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- Muted Center Button Placket, Pocket & Buttons -->
  <rect x="145" y="64" width="14" height="106" fill="#DCE3EC" stroke="#7B8A9E" stroke-width="1.6"/>
  <circle cx="152" cy="92" r="2.6" fill="#94A3B8"/>
  <circle cx="152" cy="118" r="2.6" fill="#94A3B8"/>
  <circle cx="152" cy="144" r="2.6" fill="#94A3B8"/>
  <path d="M 170 98 L 194 98 L 194 122 L 182 128 L 170 122 Z"
        fill="#DCE3EC" stroke="#7B8A9E" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Cast Shadow of Collar onto Shirt Chest -->
  <path d="M 110 64 L 128 90 L 152 70 L 176 90 L 194 64 Z" fill="#CBD5E1"/>

  <!-- FULL-COLOR TARGET PART: Structured Shirt Collar -->
  <!-- Back Inside Neckband -->
  <path d="M 122 36 C 134 26, 170 26, 182 36 L 176 58 L 152 64 L 128 58 Z"
        fill="#35558A" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Woven Neck Label Detail (non-text stitching bar) -->
  <rect x="143" y="38" width="18" height="7" rx="1.5" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1.3"/>

  <!-- Left Pointed Collar Wing -->
  <g clip-path="url(#collar-left-clip)">
    <rect x="102" y="32" width="54" height="56" fill="#5479AC"/>
    <path d="M 106 58 L 128 84 L 136 74 L 114 48 Z" fill="#3D5F91"/>
    <path d="M 122 36 L 150 60" stroke="#8EB0DE" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M 122 36 L 152 62 L 128 84 L 106 58 Z"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Fine Tailor Topstitching Inside Left Collar -->
  <path d="M 112 58 L 128 77 L 146 61" fill="none" stroke="#DCE8F8" stroke-width="1.2" stroke-dasharray="2.5 2"/>

  <!-- Right Pointed Collar Wing -->
  <g clip-path="url(#collar-right-clip)">
    <rect x="148" y="32" width="54" height="56" fill="#5479AC"/>
    <path d="M 198 58 L 176 84 L 168 74 L 190 48 Z" fill="#3D5F91"/>
    <path d="M 182 36 L 154 60" stroke="#8EB0DE" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M 182 36 L 152 62 L 176 84 L 198 58 Z"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M 192 58 L 176 77 L 158 61" fill="none" stroke="#DCE8F8" stroke-width="1.2" stroke-dasharray="2.5 2"/>

  <!-- Top Collar Stand Button -->
  <circle cx="152" cy="66" r="3.8" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Focus Callout Ring + Artico Blue Pointer Arrow -->
  <ellipse cx="152" cy="58" rx="56" ry="32" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4"/>
  <g>
    <path d="M 48 54 L 82 56" fill="none" stroke="#1E2A3B" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 48 54 L 82 56" fill="none" stroke="#4A72B2" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M 79 48 L 92 57 L 78 64 Z" fill="#4A72B2" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
