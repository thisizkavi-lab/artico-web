<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: motel
  CONTEXTUAL_DEFINITION: A roadside lodging where travelers can park directly beside their guest-room doors.
  PEDAGOGICAL_ART_DIRECTOR: Show a long single-story row of rooms with a car parked directly outside one entrance.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / travel diagram
  SYNONYM_GUARD: Make the direct room-to-parking relationship unmistakable and keep the building low, unlike a multi-story city hotel.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A one-story roadside room row runs across the scene; three individual doors face an adjacent parking lane with a car immediately outside the center room.
-->
