<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: dead-end job (noun phrase)
  CONTEXTUAL_DEFINITION: A job offering little or no chance of future advancement.
  PEDAGOGICAL_ART_DIRECTOR: Use an employee working at an ordinary desk while the visible promotion route literally stops at a wall, not a road or death image.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / career diagram
  SYNONYM_GUARD: Focus on the lack of advancement, not unemployment, a dangerous job, or a physical alley.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put an employee and repetitive desk in the foreground, x=102..215 and y=76..151. Behind them build a blue ascending career stair at x=43..115 that ends flush against a tall brick partition at x=119, with an empty blocked arrow tip; mute any route beyond it.
-->
