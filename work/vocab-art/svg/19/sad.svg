<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:sad" data-archetype="expressive-bust">
  <defs>
    <path id="sad-head" d="M 112 62 C 112 38, 192 38, 192 62 L 190 96 C 190 122, 170 136, 152 136 C 134 136, 114 122, 114 96 Z"/>
    <clipPath id="sad-head-clip">
      <use href="#sad-head"/>
    </clipPath>
    <clipPath id="sad-torso-clip">
      <path d="M 72 178 C 80 144, 108 132, 152 132 C 196 132, 224 144, 232 178 Z"/>
    </clipPath>
  </defs>

  <!-- Cool Tinted Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#EEF4FA"/>

  <!-- Slumped Torso (Mia: Cream Cardigan over Coral Top) -->
  <g clip-path="url(#sad-torso-clip)">
    <rect x="68" y="128" width="168" height="56" fill="#F3ECE1"/>
    <!-- Center top -->
    <path d="M 140 134 L 152 152 L 164 134 Z" fill="#CE3D4E"/>
    <path d="M 68 178 C 76 150, 96 136, 116 132 L 116 178 Z" fill="#E2DACD"/>
  </g>
  <path d="M 72 178 C 80 144, 108 132, 152 132 C 196 132, 224 144, 232 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="114" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="90" r="8.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="90" r="8.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head with Shading -->
  <g clip-path="url(#sad-head-clip)">
    <rect x="105" y="34" width="94" height="106" fill="#F5BFA3"/>
    <path d="M 112 120 C 132 136, 172 136, 192 120 L 192 140 L 112 140 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#sad-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Shoulder-Length Hair (Mia) -->
  <path d="M 104 68 C 100 36, 122 20, 152 20 C 182 20, 204 36, 200 68 C 206 94, 206 130, 194 146 C 188 136, 186 100, 184 76 C 176 46, 128 46, 120 76 C 118 100, 116 136, 110 146 C 98 130, 98 94, 104 68 Z"
        fill="#6E473B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Sad Drooping Eyebrows & Downcast Eyes -->
  <path d="M 126 74 Q 136 78 144 73" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 178 74 Q 168 78 160 73" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Downcast Eyes -->
  <path d="M 128 84 Q 136 90 144 84" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 160 84 Q 168 90 176 84" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Glistening Teardrop Rolling Down Cheek -->
  <path d="M 134 94 C 134 94, 131 99, 131 102 C 131 104.5, 132.8 106, 135 106 C 137.2 106, 139 104.5, 139 102 C 139 99, 134 94, 134 94 Z"
        fill="#7CC4FA" stroke="#1E2A3B" stroke-width="1.6"/>
  <circle cx="134" cy="101" r="1.2" fill="#FFFFFF"/>

  <!-- Downturned Sad Quivering Mouth -->
  <path d="M 140 110 Q 152 103 164 110" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 147 114 Q 152 112 157 114" fill="none" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Subtle Raincloud Motif in Corner -->
  <path d="M 76 54 C 74 48, 80 44, 85 45 C 88 40, 96 40, 100 44 C 104 42, 110 46, 108 51 C 112 53, 111 60, 106 60 L 78 60 C 74 60, 72 56, 76 54 Z"
        fill="#CBD5E1" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="84" y1="66" x2="82" y2="72" stroke="#7CC4FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="66" x2="92" y2="74" stroke="#7CC4FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="66" x2="102" y2="72" stroke="#7CC4FA" stroke-width="2" stroke-linecap="round"/>
</svg>
