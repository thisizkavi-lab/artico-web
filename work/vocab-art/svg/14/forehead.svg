<!-- SELF_PROMPT:
  CHAPTER: 14 — The body
  WORD: forehead (Noun)
  CONTEXTUAL_DEFINITION: The broad area of the face above the eyebrows and below the hairline.
  PEDAGOGICAL_ARCHETYPE: 2 — Part-of-whole face callout
  SYNONYM_GUARD: Highlight only the forehead above the eyebrows; eyebrow, eyes, and cheek have separate cards.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Close face crop on warm paper.
    - Context_Layer: Hair, eyes, nose, and chin remain muted.
    - Focal_Layer: Forehead region is warm color inside a golden focus halo.
    - Details_Layer: Hairline and eyebrow boundary clearly delimit the target.
    - Lighting_Layer: Blue pointer aims to the center of forehead.
-->
