  <path d="M 204 38 Q 200 30 206 24 Q 212 18 206 12" fill="none" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" />

  <!-- Big Circular Heart & Paw Emblem on Gable (Shelter Insignia) -->
  <circle cx="152" cy="62" r="18" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.2" />
  <path d="M 152 56 C 148 50 142 50 142 54 C 142 60 152 66 152 66 C 152 66 162 60 162 54 C 162 50 156 50 152 56 Z" fill="#EF4444" />
  <!-- Paw print inside heart -->
  <ellipse cx="152" cy="68" rx="4" ry="3" fill="#DC2626" />
  <circle cx="148" cy="63" r="1.3" fill="#DC2626" />
  <circle cx="151" cy="62" r="1.3" fill="#DC2626" />
  <circle cx="153" cy="62" r="1.3" fill="#DC2626" />
  <circle cx="156" cy="63" r="1.3" fill="#DC2626" />

