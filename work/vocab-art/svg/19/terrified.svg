<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" width="100%" height="100%" data-vocab-key="19:terrified">
  <defs>
    <!-- Terrified: pale ghostly face, wide open screaming mouth, shaking hands, hair standing straight up -->
    <clipPath id="mouth-cavity-clip">
      <path d="M 142 98 C 138 98 136 116 142 124 C 148 128 156 128 162 124 C 168 116 166 98 162 98 Z" />
    </clipPath>
  </defs>

  <!-- Dark spooky atmosphere background -->
  <rect width="304" height="192" fill="#F1F5F9" rx="16" />

  <!-- Shivering motion lines around head and shoulders -->
  <path d="M 92 68 L 86 64 M 90 84 L 84 82 M 88 102 L 82 104 M 212 68 L 218 64 M 214 84 L 220 82 M 216 102 L 222 104" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- Ghostly drop shadow on floor -->
  <ellipse cx="152" cy="174" rx="58" ry="10" fill="#CBD5E1" opacity="0.6" />

  <!-- Torso (trembling, leaning back in terror) -->
  <path d="M 112 142 C 112 130 126 122 152 122 C 178 122 192 130 192 142 L 200 184 L 104 184 Z" fill="#64748B" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Neck (stiff, pale) -->
  <rect x="144" y="112" width="16" height="18" fill="#F1F5F9" stroke="#1E2A3B" stroke-width="2" />

  <!-- Spiky hair standing straight up in sheer terror -->
  <path d="M 124 64 L 116 28 L 128 38 L 134 20 L 144 34 L 152 16 L 160 34 L 170 20 L 176 38 L 188 28 L 180 64 Z" fill="#1E293B" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Head Base (very pale face) -->
  <ellipse cx="152" cy="88" rx="34" ry="38" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Pale blue terror shadow / chill across top of forehead -->
  <path d="M 124 62 C 132 54 172 54 180 62 L 180 72 L 124 72 Z" fill="#93C5FD" opacity="0.5" />
  <!-- Vertical terror shade hatch lines on forehead -->
  <line x1="138" y1="56" x2="138" y2="70" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" />
  <line x1="144" y1="54" x2="144" y2="72" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" />
  <line x1="152" y1="53" x2="152" y2="73" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" />
  <line x1="160" y1="54" x2="160" y2="72" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" />
  <line x1="166" y1="56" x2="166" y2="70" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" />

  <!-- Terrified high-angled eyebrows -->
  <path d="M 132 72 Q 140 66 146 74" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <path d="M 172 72 Q 164 66 158 74" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Eyes: wide circular white sclera with tiny dot pupils -->
  <circle cx="138" cy="84" r="9" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" />
  <circle cx="138" cy="84" r="2.2" fill="#1E2A3B" />
  <circle cx="166" cy="84" r="9" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" />
  <circle cx="166" cy="84" r="2.2" fill="#1E2A3B" />

  <!-- Screaming wide open mouth -->
  <path d="M 142 98 C 136 98 134 116 142 126 C 148 130 156 130 162 126 C 170 116 168 98 162 98 Z" fill="#1E293B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Tongue inside -->
  <g clip-path="url(#mouth-cavity-clip)">
    <circle cx="152" cy="126" r="8" fill="#F43F5E" />
  </g>

  <!-- Shaking trembling hands raised in defensive horror -->
  <!-- Left hand -->
  <g transform="translate(104, 116) rotate(-15)">
    <path d="M 12 18 C 12 10 2 12 0 6 C -2 1 4 -2 8 2 L 14 -4 C 18 -6 20 0 18 4 L 22 2 C 26 2 26 8 22 10 L 18 20 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <!-- tremor vibrations -->
    <path d="M -6 6 L -10 4 M -4 14 L -8 14" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Right hand -->
  <g transform="translate(182, 116) rotate(15)">
    <path d="M 4 18 C 4 10 14 12 16 6 C 18 1 12 -2 8 2 L 2 -4 C -2 -6 -4 0 -2 4 L -6 2 C -10 2 -10 8 -6 10 L -2 20 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <!-- tremor vibrations -->
    <path d="M 22 6 L 26 4 M 20 14 L 24 14" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Cold sweat drops popping off head -->
  <path d="M 112 76 C 108 72 114 66 116 66 C 118 66 120 72 116 76 Z" fill="#67E8F9" stroke="#1E2A3B" stroke-width="1.6" />
  <path d="M 194 76 C 198 72 192 66 190 66 C 188 66 186 72 190 76 Z" fill="#67E8F9" stroke="#1E2A3B" stroke-width="1.6" />
</svg>
