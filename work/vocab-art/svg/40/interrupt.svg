<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: interrupt
  CONTEXTUAL_DEFINITION: Begin speaking or act before another person has finished, cutting into their turn.
  PEDAGOGICAL_ART_DIRECTOR: Show one colleague speaking and another politely signaling to interject, with the first person's speaking cue visibly cut short.
  PEDAGOGICAL_ARCHETYPE: 4 - Turn-taking interruption
  SYNONYM_GUARD: Make the timing overlap clear; this is not general disagreement, a raised hand in a vote, or a technical interruption.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a speaker on the left at x=54..116 with two small sound arcs coming from their mouth. Place a second colleague at x=186..247 raising one open hand between them; the arcs stop at the raised palm, and a small gold speaking cue begins on the right. Add a narrow table at y=132.
-->
