<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:fish tank" data-archetype="hero-object">
  <defs>
    <!-- Home Fish Tank: rectangular glass aquarium on wooden table, overhead hood light, filter bubbler, neon tetras -->
    <clipPath id="fishtank-water-clip">
      <rect x="52" y="58" width="200" height="92" rx="4" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="172" rx="118" ry="12" fill="#EAE3D5" />
  <ellipse cx="152" cy="170" rx="60" ry="7" fill="#DDD4C3" />

  <!-- Domestic Wooden Table / Credenza Stand -->
  <polygon points="34,158 270,158 262,174 42,174" fill="#78350F" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="36" y="152" width="232" height="6" fill="#92400E" stroke="#1E2A3B" stroke-width="2" />

  <!-- Tank Water Interior -->
  <g clip-path="url(#fishtank-water-clip)">
    <!-- Crisp clear aquatic blue water -->
    <rect x="48" y="54" width="208" height="100" fill="#BAE6FD" />
    <rect x="48" y="104" width="208" height="50" fill="#7DD3FC" />

    <!-- Multi-colored Aquatic Gravel Bed -->
    <rect x="48" y="138" width="208" height="16" fill="#0D9488" />
    <!-- Gravel pebble dots -->
    <circle cx="64" cy="144" r="3" fill="#14B8A6" />
    <circle cx="78" cy="146" r="3.5" fill="#2DD4BF" />
    <circle cx="94" cy="143" r="3" fill="#FACC15" />
    <circle cx="112" cy="145" r="3.5" fill="#F472B6" />
    <circle cx="130" cy="144" r="3" fill="#38BDF8" />
    <circle cx="148" cy="146" r="3.5" fill="#14B8A6" />
    <circle cx="166" cy="143" r="3" fill="#FACC15" />
    <circle cx="184" cy="145" r="3.5" fill="#F472B6" />
    <circle cx="202" cy="144" r="3" fill="#2DD4BF" />
    <circle cx="220" cy="146" r="3.5" fill="#38BDF8" />
    <circle cx="238" cy="143" r="3" fill="#14B8A6" />

    <!-- Lush Green Aquarium Plants (Left & Right) -->
    <path d="M 68 140 Q 62 108 72 88 Q 80 114 74 140 Z" fill="#16A34A" stroke="#15803D" stroke-width="1.2" />
    <path d="M 80 140 Q 88 112 82 94 Q 74 116 80 140 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.2" />
    <path d="M 226 140 Q 234 104 224 86 Q 218 110 226 140 Z" fill="#16A34A" stroke="#15803D" stroke-width="1.2" />
    <path d="M 238 140 Q 244 116 238 100 Q 232 118 238 140 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.2" />

    <!-- Submerged Corner Filter Unit with Bubbler -->
    <rect x="218" y="58" width="16" height="52" fill="#334155" stroke="#1E2A3B" stroke-width="1.6" rx="2" />
    <line x1="222" y1="70" x2="230" y2="70" stroke="#64748B" stroke-width="1.4" />
    <line x1="222" y1="80" x2="230" y2="80" stroke="#64748B" stroke-width="1.4" />
    <line x1="222" y1="90" x2="230" y2="90" stroke="#64748B" stroke-width="1.4" />

    <!-- Stream of Rising Air Bubbles from Filter -->
    <circle cx="214" cy="120" r="2.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
    <circle cx="212" cy="106" r="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
    <circle cx="215" cy="92" r="3.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="213" cy="78" r="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="215" cy="66" r="2.8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />

    <!-- Tropical Fish 1: Neon Tetra (Iridescent blue & bright red stripe) -->
    <path d="M 116 92 C 126 88 142 88 152 92 C 142 96 126 96 116 92 Z" fill="#0284C7" stroke="#1E2A3B" stroke-width="1.4" />
    <path d="M 132 93 L 150 93 L 144 96 L 132 95 Z" fill="#EF4444" />
    <polygon points="116,92 108,86 110,96" fill="#38BDF8" stroke="#1E2A3B" stroke-width="1" />
    <circle cx="148" cy="91" r="1.2" fill="#1E2A3B" />

    <!-- Tropical Fish 2: Golden Guppy with flowing veil tail -->
    <ellipse cx="164" cy="116" rx="14" ry="8" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.4" />
    <path d="M 152 116 C 142 108 132 104 126 110 C 130 118 136 124 150 120 Z" fill="#FB923C" stroke="#1E2A3B" stroke-width="1.4" />
    <polygon points="160,108 168,102 168,109" fill="#FBBF24" />
    <circle cx="172" cy="114" r="1.5" fill="#1E2A3B" />

    <!-- Water Surface Wave Meniscus Line -->
    <line x1="52" y1="64" x2="252" y2="64" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Rectangular Glass Tank Outline -->
  <rect x="52" y="58" width="200" height="92" rx="4" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Diagonal Glass Corner Glare Highlights -->
  <path d="M 60 64 L 72 64 L 62 144 L 56 144 Z" fill="#FFFFFF" opacity="0.3" />
  <line x1="84" y1="68" x2="96" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Black Overhead Aquarium Hood / Lighting Canopy -->
  <polygon points="46,58 258,58 252,44 52,44" fill="#1E293B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <rect x="46" y="54" width="212" height="6" fill="#334155" stroke="#1E2A3B" stroke-width="1.8" />
  <!-- Power switch / indicator LED -->
  <circle cx="62" cy="50" r="2" fill="#22C55E" />
</svg>