<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: volunteer
  CONTEXTUAL_DEFINITION: A person who freely offers time and work without expecting payment.
  PEDAGOGICAL_ART_DIRECTOR: Show a willing helper contributing effort at a community project with a friendly, service-minded cue.
  PEDAGOGICAL_ARCHETYPE: 4 - Voluntary service
  SYNONYM_GUARD: Make the unpaid, freely offered help visible through community context and an unmarked donation box; avoid suggesting a paid job role.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Show one adult helper at x=103..161 carrying a stack of clean blankets or food packages toward a community table at y=130. Two neighbors at x=45..89 and x=204..251 receive the help; a heart icon on an open box signals voluntary community service, with no currency.
-->
