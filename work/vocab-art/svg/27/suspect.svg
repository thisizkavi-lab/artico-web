<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: suspect (Verb)
  CONTEXTUAL_DEFINITION: Believe that someone may be responsible for an offense, without proof.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract judgment shown as uncertain consideration of clues
  SYNONYM_GUARD: Show a detective considering a possible person among alternatives, not a confirmed culprit or an arrest.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A quiet police desk with an open blank case folder.
    - Context_Layer: A magnifying glass rests above a simple shoeprint clue.
    - Focal_Layer: A detective compares two faint person silhouettes and tentatively highlights one.
    - Details_Layer: A dotted line and an incomplete circle show uncertainty, not a conviction.
    - Lighting_Layer: Cool neutral light and muted plum keep the judgment provisional.
-->
