<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: time management
  CONTEXTUAL_DEFINITION: Planning how to use available time and priorities effectively.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker fitting important tasks into a limited schedule with a clear sense of time.
  PEDAGOGICAL_ARCHETYPE: 51 - Priority within limited time
  SYNONYM_GUARD: Emphasize planning personal time and prioritizing tasks, not coordinating a whole project or simply arriving punctually.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a worker beside a blank planner with three time blocks and task icons; show a large analog clock with unnumbered ticks and a highlighted priority task placed first, with remaining tasks fitting the open blocks.
-->
