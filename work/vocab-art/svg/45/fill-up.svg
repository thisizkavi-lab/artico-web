<!-- SELF_PROMPT:
  CHAPTER: 45 - Driving a car
  WORD: fill up
  CONTEXTUAL_DEFINITION: Refill a car's nearly empty fuel tank at a pump.
  PEDAGOGICAL_ART_DIRECTOR: Show a driver holding a nozzle into the open fuel inlet while the pump hose feeds the car; a low-to-full icon gauge reinforces completion.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action + tool
  SYNONYM_GUARD: This is the refueling action, not a gas station as a place or fuel as a substance.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Muted car rear quarter at x=127..267 y=80..148, fuel flap open near (185,105). Pump body at x=41..98 y=55..145; thick hose arcs to nozzle in the inlet. Tiny icon gauge beside flap moves from low empty wedge to full arc without numerals.
-->
