<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: touch base (idiom)
  CONTEXTUAL_DEFINITION: Make brief contact with a coworker to exchange a quick status update.
  PEDAGOGICAL_ARCHETYPE: 4 - Brief interpersonal work action
  SYNONYM_GUARD: Show a short friendly greeting and a compact status exchange between colleagues, not playing baseball or touching a geographic base.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Frame two coworkers meeting in an office corridor, one lightly tapping the other's shoulder while holding a small blank status folder. A small unnumbered clock with short hands indicates the meeting is brief; keep it secondary.
-->
