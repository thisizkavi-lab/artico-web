<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: tourist trap
  CONTEXTUAL_DEFINITION: A place aimed at visitors where souvenirs or services are poor value and cost too much.
  PEDAGOGICAL_ART_DIRECTOR: Show a cluttered tourist shop pushing tacky keepsakes while a visitor hesitates over a tiny remaining coin purse.
  PEDAGOGICAL_ARCHETYPE: 4 - Contrast / Reaction
  SYNONYM_GUARD: Communicate exploitative tourist pricing without any readable signs, price labels, or numbers.
  MODE: STATIC
  COORDINATE_BLUEPRINT: An overstuffed souvenir stall displays rows of gaudy mini landmarks and trinkets; a wary traveler studies a nearly empty coin purse as the seller urges a purchase.
-->
