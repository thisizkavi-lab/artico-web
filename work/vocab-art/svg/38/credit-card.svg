<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: credit card (noun)
  CONTEXTUAL_DEFINITION: A payment card that lets the holder buy now and repay the card issuer later.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with transaction contrast
  SYNONYM_GUARD: Distinguish borrowing-on-card from the debit card's immediate account balance; use a later-arriving bill envelope as the secondary cue.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Large blue rounded card tilted across center; metal chip and tap arcs; terminal at lower right; sealed statement envelope and returning coin arc behind, no letters or digits.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:credit card" data-archetype="hero-object">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="credit-card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EB0DE"/><stop offset=".5" stop-color="#5479AC"/><stop offset="1" stop-color="#3D5F91"/></linearGradient>
    <radialGradient id="credit-chip"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></radialGradient>
    <path id="credit-shape" d="M55 65 Q55 57 64 57 H218 Q228 57 228 67 V123 Q228 132 219 132 H64 Q55 132 55 123 Z"/>
    <clipPath id="credit-clip"><use href="#credit-shape"/></clipPath>
    <filter id="credit-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1E2A3B" flood-opacity=".2"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="150" width="304" height="42" fill="#EEE7DA"/><path d="M0 150 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="146" cy="158" rx="111" ry="10" fill="#DDD4C3"/></g>
  <!-- 2. Later repayment context -->
  <g id="layer-context"><path d="M225 31 H273 L285 43 V92 H225 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/><path d="M273 31 V44 H285" fill="#E5E9F0" stroke="#64748B" stroke-width="1.7"/><path d="M235 55 H269 M235 63 H264 M235 71 H257" stroke="#94A3B8" stroke-width="2"/><path d="M241 81 C247 75 253 88 260 80 C266 74 271 86 277 80" fill="none" stroke="#5479AC" stroke-width="1.8"/></g>
  <!-- 3. Primary borrowing payment card -->
  <g id="layer-focal" filter="url(#credit-shadow)"><use href="#credit-shape" fill="url(#credit-card)" stroke="#1E2A3B" stroke-width="2.7"/><g clip-path="url(#credit-clip)"><path d="M51 118 C102 74 149 78 232 44 V138 H51Z" fill="#3D5F91" opacity=".52"/><path d="M62 61 C101 56 141 65 171 73" fill="none" stroke="#8EB0DE" stroke-width="5" opacity=".55"/></g><rect x="75" y="80" width="32" height="25" rx="4" fill="url(#credit-chip)" stroke="#1E2A3B" stroke-width="1.7"/><path d="M85 81 V104 M96 81 V104 M76 88 H106 M76 97 H106" stroke="#B55B28" stroke-width="1.4"/><path d="M139 116 H204" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".85"/><circle cx="209" cy="114" r="5" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.4"/></g>
  <!-- 4. Contactless payment terminal and deferred bill cue -->
  <g id="layer-details"><path d="M195 129 L222 121 Q229 120 231 127 L237 151 Q238 157 231 159 L202 166 Q197 167 195 160 Z" fill="#CBD5E1" stroke="#1E2A3B" stroke-width="2.2"/><rect x="202" y="130" width="24" height="11" rx="2" fill="#DCECFB" stroke="#64748B" stroke-width="1.4"/><g fill="#5479AC" stroke="#1E2A3B" stroke-width="1"><circle cx="207" cy="148" r="2.1"/><circle cx="215" cy="146" r="2.1"/><circle cx="223" cy="144" r="2.1"/><circle cx="209" cy="155" r="2.1"/><circle cx="217" cy="153" r="2.1"/></g><path d="M233 123 C248 106 261 107 273 118" fill="none" stroke="#4A72B2" stroke-width="2.2" stroke-dasharray="4 4"/><path d="M82 139 Q133 147 182 137" fill="none" stroke="#F2C14E" stroke-width="2.6" stroke-linecap="round"/></g>
  <!-- 5. Directional glints and deferred-payment emphasis -->
  <g id="layer-lighting"><path d="M67 67 H131" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".8"/><path d="M257 22 L257 30 M253 26 H261" stroke="#F2C14E" stroke-width="2.4" stroke-linecap="round"/><path d="M174 149 C192 143 199 137 205 130" fill="none" stroke="#4A72B2" stroke-width="2.2" stroke-linecap="round"/></g>
