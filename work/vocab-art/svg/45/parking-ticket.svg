<!-- SELF_PROMPT:
  CHAPTER: 45 - Driving a car
  WORD: parking ticket
  CONTEXTUAL_DEFINITION: A penalty notice left on a vehicle for a parking violation.
  PEDAGOGICAL_ART_DIRECTOR: Show a plain paper notice tucked beneath the windshield wiper of a car parked beside a restricted curb; use abstract bars but no text.
  PEDAGOGICAL_ARCHETYPE: 2 - Part-of-whole focus callout
  SYNONYM_GUARD: A parking fine notice, not a travel/admission ticket or the meter used to pay.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Muted parked car front windshield fills x=64..240 y=63..144. A white rectangular paper with a folded corner is trapped beneath the wiper near (150,92). Red curb line and a small meter in the background imply parking context.
-->
