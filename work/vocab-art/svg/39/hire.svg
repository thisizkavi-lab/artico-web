<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: hire (verb; employ a person)
  CONTEXTUAL_DEFINITION: Choose and employ someone for a job.
  PEDAGOGICAL_ART_DIRECTOR: Show the employer welcoming a new worker into a ready workplace through a handshake and company badge.
  PEDAGOGICAL_ARCHETYPE: 3 - Professional role exchange
  SYNONYM_GUARD: The chapter's recruitment group selects employ, not rent a car or equipment.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Two professionals face each other across an open, inviting interview area. At x=201,y=101 the manager clasps the new worker's hand; a blue staff badge is offered near x=184,y=106. An empty desk and chair behind the newcomer signal a job opening now filled.
-->
