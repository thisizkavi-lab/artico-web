<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: pickpocketing (Noun)
  CONTEXTUAL_DEFINITION: Secretly taking a person's property from their pocket or bag in a public place.
  PEDAGOGICAL_ARCHETYPE: 4 — Quiet action with a hidden stolen item and an unaware victim
  SYNONYM_GUARD: Show a wallet secretly taken in a crowd without threat or force, distinct from a mugging.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A busy public market walkway with a few softly muted passersby.
    - Context_Layer: A front-facing shopper checks an empty pocket while moving through the crowd.
    - Focal_Layer: A second person quietly turns away with a wallet concealed behind their back.
    - Details_Layer: A dotted path links the empty pocket to the hidden wallet; no technique is shown.
    - Lighting_Layer: Soft market daylight emphasizes secrecy without making the scene menacing.
-->
