<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: key skills
  CONTEXTUAL_DEFINITION: The abilities most important for succeeding in a particular job.
  PEDAGOGICAL_ART_DIRECTOR: Highlight a small set of role-critical capabilities in a candidate's profile.
  PEDAGOGICAL_ARCHETYPE: 2 - Priority capabilities
  SYNONYM_GUARD: Emphasize the most important job-relevant skills, distinct from all skills in general or from personal interests.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center three skill badges above a candidate at x=91..213 and y=48..99: a compact gear-hand icon for technical ability, a two-person link for collaboration, and a speech/listening icon for communication. Outline these three in gold; keep extra profile elements small.
-->
