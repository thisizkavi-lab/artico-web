<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: nine-to-five
  CONTEXTUAL_DEFINITION: A conventional full workday with a regular daytime start and finish.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker arriving during morning light and leaving in late-afternoon light, with two numeral-free analog clock faces as time cues.
  PEDAGOGICAL_ARCHETYPE: 2 - Routine / time range
  SYNONYM_GUARD: Do not print any digits or use text; communicate a regular work schedule through matched clock silhouettes, a workplace, and contrasting sun positions.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place two equal wall clocks at x=58..108 and x=196..246, y=38..88, each with only twelve small tick marks and hands; left hand points to a morning start position, right to a late-afternoon finish. Between them show a small worker at a desk around x=119..184, with a low rising sun by the left clock and a setting sun by the right. Keep all clock faces blank of numerals.
-->
