<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: personal statement
  CONTEXTUAL_DEFINITION: A short first-person description of a candidate's motivations, strengths, and aims.
  PEDAGOGICAL_ART_DIRECTOR: Show a candidate presenting a personal self-description and a clear career aim, with a human-centered profile cue.
  PEDAGOGICAL_ARCHETYPE: 4 - Personal introduction
  SYNONYM_GUARD: Emphasize the candidate's own voice and motivation, distinct from a factual career summary or addressed cover letter.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a candidate bust at x=81..132, y=67..134. To the right, show a profile page at x=145..224 with a portrait circle, heart-shaped motivation cue, and one gold arrow pointing toward a small future-goal icon; use a blank speech cloud with icon marks rather than text.
-->
