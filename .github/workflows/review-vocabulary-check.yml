name: Verify Native Artico Review
on:
  push:
    branches: [feature/artico-review-vocabulary]
  pull_request:
    paths:
      - 'src/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/review-vocabulary-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
