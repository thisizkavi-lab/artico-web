<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: right
  CONTEXTUAL_DEFINITION: The side or direction to the right of a north-up map viewer.
  PEDAGOGICAL_ART_DIRECTOR: Show a clean right-pointing cobalt arrow leaving a central map marker; keep the map north-up so the direction is easy to read.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / direction diagram
  SYNONYM_GUARD: Use the directional side, not correctness or an entitlement; maintain a clear left-to-right arrow.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center map anchor at (139,96); a bold horizontal arrow extends to the right edge ending at (267,96); muted buildings stay behind it.
-->
