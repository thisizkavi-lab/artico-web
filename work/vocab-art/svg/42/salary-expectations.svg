<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: salary expectations
  CONTEXTUAL_DEFINITION: The amount of pay a candidate hopes to receive in a job.
  PEDAGOGICAL_ART_DIRECTOR: Show a candidate and employer discussing a desired pay range professionally.
  PEDAGOGICAL_ARCHETYPE: 15 - Compensation discussion
  SYNONYM_GUARD: Depict a desired range being discussed, not a paycheck already earned or a payslip.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place candidate and hiring manager on opposite sides of a small desk at x=75..122 and x=190..237. Between them show one blank horizontal compensation range card with a pair of gold bracket markers. Keep the card icon-only and avoid currency symbols or numerals.
-->
