<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: pedestrianized street
  CONTEXTUAL_DEFINITION: An urban street reserved for pedestrians and closed to ordinary vehicle traffic.
  PEDAGOGICAL_ART_DIRECTOR: Show people walking and gathering along a paved city street with storefronts and bollards that block car entry; no vehicles occupy the street.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / direction diagram
  SYNONYM_GUARD: It must read as an urban street converted to pedestrian use, not a park path or a regular sidewalk beside traffic.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A paved pedestrian plaza runs lengthwise from y=18..174 between urban storefronts; short bollards close each entrance and three distinct walkers use the broad car-free center.
-->
