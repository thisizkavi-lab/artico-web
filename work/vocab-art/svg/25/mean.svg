<!-- SELF_PROMPT:
  CHAPTER: 25 — Speaking a foreign language
  WORD: mean (Verb, intend or signify)
  CONTEXTUAL_DEFINITION: Have a particular idea or intention when saying something.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action
  SYNONYM_GUARD: Show a speaker indicating the exact idea they intend, not an unkind personality or the listener's completed understanding.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Calm one-to-one conversation.
    - Context_Layer: Listener looks unsure of a vague gesture.
    - Focal_Layer: Speaker points to a concrete matching picture cue in a thought/speech bubble.
    - Details_Layer: Intentional finger point and direct eye contact.
    - Lighting_Layer: Warm focus on the intended idea.
-->
