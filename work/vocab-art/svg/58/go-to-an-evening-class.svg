<!-- SELF_PROMPT:
  CHAPTER: 58 - Free time activities
  WORD: go to an evening class
  CONTEXTUAL_DEFINITION: Travel to and enter an adult leisure class held after dark.
  PEDAGOGICAL_ART_DIRECTOR: Make the arrival action visible at the classroom door while adult learners are already working inside at night.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: Show an adult arriving for an evening hobby lesson; avoid a daytime school scene or an interior-only class portrait.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A moonlit exterior frames an open classroom doorway; an adult learner steps over the threshold with a sketchbook, while seated adults paint inside under warm lamps.
-->
