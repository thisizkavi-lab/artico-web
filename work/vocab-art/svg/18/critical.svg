<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: critical (Adjective)
  CONTEXTUAL_DEFINITION: Carefully examining and judging the strengths or flaws of something.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: A thoughtful reviewer studies a model closely and points to one specific flaw while a peer listens; this is reasoned evaluation, not emergency severity or a sneer.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Community art-review table.
    - Context_Layer: Peer displays a small crafted model.
    - Focal_Layer: Reviewer leans in with a magnifying lens and focused gaze.
    - Details_Layer: Lens, pointed detail, small flaw and attentive peer posture.
    - Lighting_Layer: Clear light on the examined model surface.
-->
