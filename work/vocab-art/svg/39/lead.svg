<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: lead (verb; guide a team)
  CONTEXTUAL_DEFINITION: Guide a group of coworkers toward a shared work goal.
  PEDAGOGICAL_ART_DIRECTOR: Put one person at the front of a moving team, clearly pointing the way while the others follow.
  PEDAGOGICAL_ARCHETYPE: 3 - Expressive professional role / action
  SYNONYM_GUARD: The verb here is guide people, not the metal, a leash, a film projection, or simply supervise schedules.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A team of three colleagues at x=74..212 walk to the right along a blue floor route. Place the leader at x=192,y=91, one step ahead, arm extended toward a gold goal marker at x=260,y=57; followers turn their bodies and eyes toward the leader.
-->
