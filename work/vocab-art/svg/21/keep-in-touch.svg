<!-- SELF_PROMPT:
  CHAPTER: 21 — Family and relationships
  WORD: keep in touch (Idiom)
  CONTEXTUAL_DEFINITION: To continue communicating with someone over time.
  PEDAGOGICAL_ARCHETYPE: 4 — Conceptual metaphor
  SYNONYM_GUARD: Two friends in separate homes wave during a video call on simple unmarked screens, showing continued contact across distance without written messages.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Two home settings divided by a broad distance gap.
    - Context_Layer: Two simple tablets and cozy rooms.
    - Focal_Layer: Each friend smiles and waves through a call.
    - Details_Layer: Soft signal arcs bridge the two spaces.
    - Lighting_Layer: A dotted warm line links the screens.
-->
