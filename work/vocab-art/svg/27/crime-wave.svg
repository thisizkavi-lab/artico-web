<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: crime wave (Noun)
  CONTEXTUAL_DEFINITION: A noticeable increase in criminal activity in an area over a period of time.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract trend shown as repeated incidents rising across a neighborhood
  SYNONYM_GUARD: Use several separate incidents growing more frequent, not a literal water wave or one isolated crime.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A row of neighborhood buildings above a broad sidewalk.
    - Context_Layer: Three small incident markers sit at progressively higher points across the district.
    - Focal_Layer: A police officer studies a rising series of alert markers on a blank neighborhood map.
    - Details_Layer: A curved blue trajectory connects the repeated markers without axes or numbers.
    - Lighting_Layer: Cool civic light and restrained amber alerts keep the trend clear and non-sensational.
-->
