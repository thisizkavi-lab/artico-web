<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: get into debt (verb phrase)
  CONTEXTUAL_DEFINITION: To begin owing money by repeatedly spending more than is available.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action and accumulating consequence
  SYNONYM_GUARD: Show the process of obligations accumulating around spending; unlike “debt,” this card depicts entering the owed state.
  MODE: STATIC action sequence
  COORDINATE_BLUEPRINT: Shopper swipes a card while an account coin stack shrinks; blank unpaid bills pile up and tip forward behind; red dotted path descends below account line.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:get into debt" data-archetype="action-consequence">
