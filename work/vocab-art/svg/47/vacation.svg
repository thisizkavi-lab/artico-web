<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: vacation
  CONTEXTUAL_DEFINITION: A period of leisure away from usual work or routine.
  PEDAGOGICAL_ART_DIRECTOR: Show a calm, leisurely holiday moment after arrival, not the action of leaving home.
