<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: responsible for
  CONTEXTUAL_DEFINITION: Having the duty to take care of a particular task or outcome.
  PEDAGOGICAL_ART_DIRECTOR: Show one worker taking ownership of an assigned workplace task.
  PEDAGOGICAL_ARCHETYPE: 20 - Task ownership
  SYNONYM_GUARD: Make the specific assignment and accountable worker visible; do not confuse owning a duty with supervising other people.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put one worker at x=88..144 beside a single equipment station at x=174..239. The worker holds a small assignment checklist with one green check and a key-like task token; no other worker is present, emphasizing personal duty for this outcome.
-->
