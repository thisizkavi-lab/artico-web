<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: notes (plural noun; banknotes)
  CONTEXTUAL_DEFINITION: Paper money, distinct from metal coins or a payment card.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object / material study
  SYNONYM_GUARD: Show several full rectangular paper banknotes with security patterns; no coins, numerals, words, portraits, or currency glyphs.
