<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:excited" data-archetype="expressive-bust">
  <defs>
    <path id="excited-head" d="M 112 56 C 112 32, 192 32, 192 56 L 190 90 C 190 118, 170 132, 152 132 C 134 132, 114 118, 114 90 Z"/>
    <clipPath id="excited-head-clip">
      <use href="#excited-head"/>
    </clipPath>
    <clipPath id="excited-torso-clip">
      <path d="M 92 178 C 98 140, 116 124, 152 124 C 188 124, 206 140, 212 178 Z"/>
    </clipPath>
  </defs>

  <!-- Sunny Radiant Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEF3C7"/>

  <!-- Arms Raised High in Victory / Cheer \o/ -->
  <path d="M 108 132 L 62 82 L 48 94 L 98 144 Z"
        fill="#F3ECE1" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left Cheering Fist -->
  <circle cx="56" cy="84" r="11" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.4"/>

  <path d="M 196 132 L 242 82 L 256 94 L 206 144 Z"
        fill="#F3ECE1" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right Cheering Fist -->
  <circle cx="248" cy="84" r="11" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.4"/>

  <!-- Torso (Mia) -->
  <g clip-path="url(#excited-torso-clip)">
    <rect x="88" y="120" width="128" height="64" fill="#F3ECE1"/>
    <path d="M 142 128 L 152 144 L 162 128 Z" fill="#CE3D4E"/>
    <path d="M 88 178 C 96 146, 110 132, 126 128 L 126 178 Z" fill="#E2DACD"/>
  </g>
  <path d="M 92 178 C 98 140, 116 124, 152 124 C 188 124, 206 140, 212 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="110" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Shading -->
  <g clip-path="url(#excited-head-clip)">
    <rect x="105" y="30" width="94" height="106" fill="#F5BFA3"/>
    <!-- Big joyful cheek blush -->
    <ellipse cx="128" cy="94" rx="11" ry="7" fill="#F58D82" opacity="0.65"/>
    <ellipse cx="176" cy="94" rx="11" ry="7" fill="#F58D82" opacity="0.65"/>
    <path d="M 112 116 C 132 132, 172 132, 192 116 L 192 136 L 112 136 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#excited-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Bouncing Hair (Mia) -->
  <path d="M 104 62 C 100 32, 122 16, 152 16 C 182 16, 204 32, 200 62 C 208 86, 210 120, 200 136 C 192 126, 188 94, 184 70 C 176 42, 128 42, 120 70 C 116 94, 112 126, 104 136 C 94 120, 96 86, 104 62 Z"
        fill="#6E473B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Upward Arched Happy Brows -->
  <path d="M 124 64 Q 134 56 144 64" fill="none" stroke="#1E2A3B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 160 64 Q 170 56 180 64" fill="none" stroke="#1E2A3B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sparkling Star Eyes (Pure Joy) -->
  <circle cx="134" cy="76" r="8" fill="#1E2A3B"/>
  <path d="M 134 70 L 136 74 L 140 76 L 136 78 L 134 82 L 132 78 L 128 76 L 132 74 Z" fill="#FFFFFF"/>

  <circle cx="170" cy="76" r="8" fill="#1E2A3B"/>
  <path d="M 170 70 L 172 74 L 176 76 L 172 78 L 170 82 L 168 78 L 164 76 L 168 74 Z" fill="#FFFFFF"/>

  <!-- Huge Beaming Open Smile -->
  <path d="M 132 94 C 132 116, 172 116, 172 94 Z" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 140 112 C 146 106, 158 106, 164 112 Z" fill="#F58D82"/>
  <path d="M 134 95 Q 152 99 170 95" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Dynamic Excitement Sparkles Around Head -->
  <g fill="#F2C14E">
    <path d="M 94 40 Q 98 40 98 34 Q 98 40 102 40 Q 98 40 98 46 Q 98 40 94 40 Z"/>
    <path d="M 204 42 Q 208 42 208 36 Q 208 42 212 42 Q 208 42 208 48 Q 208 42 204 42 Z"/>
    <path d="M 148 24 Q 152 24 152 18 Q 152 24 156 24 Q 152 24 152 30 Q 152 24 148 24 Z"/>
  </g>
</svg>
