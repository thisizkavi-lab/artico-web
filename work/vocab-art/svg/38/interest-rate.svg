<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: interest rate (noun)
  CONTEXTUAL_DEFINITION: The proportion of the borrowed or saved principal charged or earned as interest.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrastive proportion diagram
  SYNONYM_GUARD: Show a measured proportion relative to principal; unlike “interest,” do not depict the extra money alone. No numerals or percent glyph.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Large principal coin stack beside a gauge-like circular arc; a smaller golden wedge and extra-coin stack are highlighted as a fraction of the principal, with nonnumeric tick marks.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:interest rate" data-archetype="contrast-proportion">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="rate-principal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8EB0DE"/><stop offset="1" stop-color="#5479AC"/></linearGradient>
    <radialGradient id="rate-gold"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></radialGradient>
    <path id="rate-coin-stack" d="M45 118 H116 V142 H45 Z"/>
    <clipPath id="rate-stack-clip"><use href="#rate-coin-stack"/></clipPath>
    <filter id="rate-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="153" width="304" height="39" fill="#EEE7DA"/><path d="M0 153 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="151" cy="164" rx="107" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Principal amount and proportion scale -->
  <g id="layer-context"><path d="M46 146 H120" stroke="#3D5F91" stroke-width="2"/><path d="M184 131 A48 48 0 0 1 264 76" fill="none" stroke="#CBD5E1" stroke-width="13" stroke-linecap="round"/><path d="M186 127 A43 43 0 0 1 229 88" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="2 7"/><path d="M233 91 A40 40 0 0 1 258 78" fill="none" stroke="#D97706" stroke-width="11" stroke-linecap="round"/></g>
  <!-- 3. Principal versus proportional borrowing charge -->
  <g id="layer-focal" filter="url(#rate-shadow)"><use href="#rate-coin-stack" fill="url(#rate-principal)" stroke="#1E2A3B" stroke-width="2.2"/><g clip-path="url(#rate-stack-clip)"><path d="M43 126 H118 V144 H43Z" fill="#3D5F91"/><path d="M48 123 H112" stroke="#DCECFB" stroke-width="2"/></g><ellipse cx="80" cy="119" rx="35" ry="10" fill="#8EB0DE" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="80" cy="108" rx="29" ry="9" fill="#5479AC" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="80" cy="97" rx="23" ry="8" fill="#8EB0DE" stroke="#1E2A3B" stroke-width="2"/><path d="M54 119 H106 M59 108 H101" stroke="#3D5F91" stroke-width="1.4"/><ellipse cx="187" cy="140" rx="13" ry="6" fill="#D49B2A" stroke="#1E2A3B" stroke-width="1.5"/><ellipse cx="187" cy="136" rx="13" ry="6" fill="url(#rate-gold)" stroke="#1E2A3B" stroke-width="1.5"/><ellipse cx="224" cy="134" rx="10" ry="5" fill="#D49B2A" stroke="#1E2A3B" stroke-width="1.4"/><ellipse cx="224" cy="130" rx="10" ry="5" fill="#FCE29C" stroke="#1E2A3B" stroke-width="1.4"/></g>
  <!-- 4. Gauge pointer and proportional bracket -->
  <g id="layer-details"><path d="M222 119 L242 88" stroke="#CE3D4E" stroke-width="3" stroke-linecap="round"/><circle cx="222" cy="119" r="5" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="1.3"/><path d="M139 90 V143 M134 90 H144 M134 143 H144" stroke="#4A72B2" stroke-width="2"/><path d="M143 97 H172" stroke="#D97706" stroke-width="1.9" stroke-dasharray="3 3"/><path d="M167 92 L174 97 L167 102 Z" fill="#D97706"/></g>
  <!-- 5. Rate highlight glints -->
  <g id="layer-lighting"><path d="M53 92 Q79 83 104 92" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M238 59 L238 67 M234 63 H242" stroke="#F2C14E" stroke-width="2.3" stroke-linecap="round"/><circle cx="242" cy="87" r="18" fill="#FEF3C7" opacity=".35"/></g>
</svg>
