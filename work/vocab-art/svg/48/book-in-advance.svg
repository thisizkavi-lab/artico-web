<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: book in advance
  CONTEXTUAL_DEFINITION: Arrange or reserve travel before the date when it will be used.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler making a reservation well ahead of a future trip, with an unmistakable blank calendar cue.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: The action must happen before travel; do not show a same-day arrival or ticket inspection.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A traveler places a small plane-and-bed reservation token into a highlighted future square on a clean wall calendar above a booking desk.
-->
