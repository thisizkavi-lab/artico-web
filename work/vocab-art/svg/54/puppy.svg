<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:puppy" data-archetype="hero-object">
  <defs>
    <!-- Chubby young puppy: oversized head, giant sparkling eyes, floppy ears, clumsy paws -->
    <clipPath id="puppy-body-clip">
      <ellipse cx="152" cy="126" rx="36" ry="32" />
    </clipPath>
    <clipPath id="puppy-head-clip">
      <ellipse cx="152" cy="74" rx="34" ry="30" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="108" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="162" rx="48" ry="9" fill="#DDD4C3" />

  <!-- Tiny wagging puppy tail -->
  <path d="M 186 130 C 206 122 216 108 214 96" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M 186 130 C 206 122 216 108 214 96" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <!-- Tail wag motion arcs -->
  <path d="M 218 88 C 224 94 224 102 220 108" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <path d="M 224 92 C 228 98 228 104 225 108" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Chubby Round Body -->
  <g clip-path="url(#puppy-body-clip)">
    <rect x="110" y="90" width="85" height="70" fill="#FBBF24" />
    <!-- White tummy bib -->
    <ellipse cx="152" cy="132" rx="20" ry="24" fill="#FEF3C7" />
    <!-- Shadow under chin and bottom -->
    <ellipse cx="152" cy="98" rx="24" ry="10" fill="#D97706" opacity="0.4" />
    <rect x="110" y="152" width="85" height="10" fill="#D97706" />
  </g>
  <ellipse cx="152" cy="126" rx="36" ry="32" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Clumsy Big Front Paws -->
  <ellipse cx="134" cy="158" rx="12" ry="8" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="170" cy="158" rx="12" ry="8" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2.2" />
  <line x1="130" y1="156" x2="130" y2="164" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="138" y1="156" x2="138" y2="164" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="166" y1="156" x2="166" y2="164" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="174" y1="156" x2="174" y2="164" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Red Puppy Collar with Tiny Bell -->
  <path d="M 128 98 Q 152 106 176 98" stroke="#EF4444" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 128 98 Q 152 106 176 98" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <circle cx="152" cy="106" r="4" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Giant Floppy Puppy Ears -->
  <path d="M 124 58 C 104 60 92 82 96 104 C 100 114 114 114 118 102 L 126 72 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M 180 58 C 200 60 212 82 208 104 C 204 114 190 114 186 102 L 178 72 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Large Round Puppy Head (Tilt slightly) -->
  <g clip-path="url(#puppy-head-clip)">
    <ellipse cx="152" cy="74" rx="34" ry="30" fill="#FBBF24" />
    <path d="M 148 44 Q 152 64 152 82 Q 152 64 156 44 Z" fill="#FEF3C7" />
  </g>
  <ellipse cx="152" cy="74" rx="34" ry="30" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- White Snout Area -->
  <ellipse cx="152" cy="85" rx="16" ry="12" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2" />

  <!-- Little Button Nose -->
  <path d="M 146 79 C 146 76 158 76 158 79 C 158 84 152 87 152 87 C 152 87 146 84 146 79 Z" fill="#1E2A3B" />
  <circle cx="149" cy="78" r="1.2" fill="#FFFFFF" />

  <!-- Tiny Tongue Peeking Out -->
  <path d="M 152 87 L 152 91 M 146 90 Q 152 94 158 90" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 150 91 C 150 97 155 97 155 91 Z" fill="#F43F5E" stroke="#1E2A3B" stroke-width="1.4" />

  <!-- Enormous Sparkling Puppy Eyes -->
  <ellipse cx="136" cy="68" rx="7" ry="8" fill="#1E2A3B" />
  <circle cx="134" cy="65" r="3" fill="#FFFFFF" />
  <circle cx="138" cy="72" r="1.4" fill="#FFFFFF" />

  <ellipse cx="168" cy="68" rx="7" ry="8" fill="#1E2A3B" />
  <circle cx="166" cy="65" r="3" fill="#FFFFFF" />
  <circle cx="170" cy="72" r="1.4" fill="#FFFFFF" />

  <!-- Soft Puppy Eyebrows -->
  <ellipse cx="136" cy="56" rx="3" ry="1.8" fill="#D97706" />
  <ellipse cx="168" cy="56" rx="3" ry="1.8" fill="#D97706" />
</svg>