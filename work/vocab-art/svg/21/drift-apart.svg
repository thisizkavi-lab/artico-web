<!-- SELF_PROMPT:
  CHAPTER: 21 — Family and relationships
  WORD: drift apart (Phrasal Verb)
  CONTEXTUAL_DEFINITION: For people who were close to gradually become less connected.
  PEDAGOGICAL_ARCHETYPE: 4 — Conceptual metaphor
  SYNONYM_GUARD: Two old friends move along separate ends of a long path with increasing empty space and fading shared traces, showing gradual distance without a quarrel.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Long quiet footpath receding toward the horizon.
    - Context_Layer: Two fading footprints diverge gently.
    - Focal_Layer: Two friends are far apart at opposite sides of the scene.
    - Details_Layer: A once-connecting dotted line grows faint and breaks.
    - Lighting_Layer: Cool open space between them.
-->
