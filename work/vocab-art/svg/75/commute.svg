<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: commute
  CONTEXTUAL_DEFINITION: To make the same regular journey between home and work or study.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker aboard a local bus on a repeated route linking a home icon to an office icon, with a loop arrow.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial route diagram with repeated journey cue
  SYNONYM_GUARD: The route repeats between home and workplace; this is not a one-off trip with vacation luggage or changing a setting.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Home at x=26..66 and office at x=238..278; bus centered x=90..211, y=91..142 with a briefcase-carrying rider visible; loop route traces from home to office and back above bus.
; reviewed and reused for Lesson 75. -->
