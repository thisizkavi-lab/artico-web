<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: hold a position (workplace phrase)
  CONTEXTUAL_DEFINITION: Keep or occupy a particular job or role in an organization.
  PEDAGOGICAL_ART_DIRECTOR: Anchor the worker to one recognizable desk role while workplace pressure swirls around them; communicate staying in the role rather than a physical pose.
  PEDAGOGICAL_ARCHETYPE: 3 - Expressive professional role with contextual stability cue
  SYNONYM_GUARD: Do not depict sports rank, military stance, or simply holding an object; show a person occupying a stable work role.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center an office professional seated at x=132..179, y=65..136, behind a fixed desk at y=139. Place a simple unlettered identity badge on the jacket and a chair back framing the shoulders. Let two pale moving-paper arcs pass outside, while a gold focus ring stays centered on the worker and desk.
-->
