<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: unfriendly (Adjective)
  CONTEXTUAL_DEFINITION: Acting coldly or unkindly toward another person.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: The focal person actively turns away and dismisses a greeting, unlike unapproachable which only signals reluctance to engage.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Shared table in a neighborhood room.
    - Context_Layer: Peer offers a small flower from the left.
    - Focal_Layer: Person at right turns shoulder away and refuses the greeting.
    - Details_Layer: Frown, dismissive hand, lowered flower and distance cue.
    - Lighting_Layer: Cooler muted halo on the rejecting gesture.
-->
