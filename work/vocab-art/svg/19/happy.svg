<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:happy" data-archetype="expressive-bust">
  <defs>
    <path id="happy-head" d="M 112 60 C 112 36, 192 36, 192 60 L 190 94 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 94 Z"/>
    <clipPath id="happy-head-clip">
      <use href="#happy-head"/>
    </clipPath>
    <clipPath id="happy-torso-clip">
      <path d="M 76 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 228 178 Z"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEF3C7"/>

  <!-- Torso (Ren: Navy Blue Tee) -->
  <g clip-path="url(#happy-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#5479AC"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 76 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 228 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Shading -->
  <g clip-path="url(#happy-head-clip)">
    <rect x="105" y="34" width="94" height="106" fill="#F5BFA3"/>
    <!-- Rosy cheek blush -->
    <ellipse cx="128" cy="98" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <ellipse cx="176" cy="98" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <!-- Chin shadow -->
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#happy-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Tousled Hair (Ren) -->
  <path d="M 106 68 C 102 38, 124 22, 152 22 C 180 22, 202 38, 198 68 C 192 50, 176 40, 152 40 C 128 40, 114 50, 106 68 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cheerful Happy Face (Curved Eye Arcs, Upward Brow, Open Radiant Smile) -->
  <path d="M 124 72 Q 134 67 144 72" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 160 72 Q 170 67 180 72" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 126 82 Q 134 76 142 82" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 162 82 Q 170 76 178 82" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Cute Nose -->
  <path d="M 152 86 L 150 92 L 154 92" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Big Open Beaming Smile -->
  <path d="M 134 98 C 134 118, 170 118, 170 98 Z" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 142 114 C 146 108, 158 108, 162 114 Z" fill="#F58D82"/>
  <path d="M 136 99 Q 152 103 168 99" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Warm Sparkles (Floating 4-point stars) -->
  <path d="M 86 54 Q 92 54 92 48 Q 92 54 98 54 Q 92 54 92 60 Q 92 54 86 54 Z" fill="#F2C14E"/>
  <path d="M 214 62 Q 220 62 220 56 Q 220 62 226 62 Q 220 62 220 68 Q 220 62 214 62 Z" fill="#F2C14E"/>
</svg>
