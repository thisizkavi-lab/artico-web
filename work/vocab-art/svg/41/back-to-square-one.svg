<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: back to square one (idiom)
  CONTEXTUAL_DEFINITION: A work plan has failed, so the team must restart from its first step.
  PEDAGOGICAL_ARCHETYPE: 6 - Reversed workplace route
  SYNONYM_GUARD: Show a project marker physically returning to the first planning square after a blocked route, not a generic return visit.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Use a large three-step planning board at x=48..256, y=35..141. The blue route ends at a blocked red endpoint; a bold curved arrow returns to the gold first square at x=75,y=113. Add one colleague resetting a marker at the start.
-->
