  CHAPTER: 26 — Communication and beliefs
  WORD: reason (Noun)
  CONTEXTUAL_DEFINITION: The cause or explanation for why something happened or should be done.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept as a causal link
  SYNONYM_GUARD: Connect a visible cause to its result, distinct from evidence that supports a claim or advice about what to do.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Neighborhood garden work surface.
    - Context_Layer: A drooping plant with dry soil is the result needing explanation.
    - Focal_Layer: An empty watering can and dry ground connect to the wilted leaves with a clear causal arrow.
    - Details_Layer: A person points from the cause toward the result.
    - Lighting_Layer: Highlight the simple cause-and-effect path.
-->
