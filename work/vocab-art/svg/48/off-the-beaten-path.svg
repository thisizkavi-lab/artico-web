<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: off the beaten path / off the beaten track
  CONTEXTUAL_DEFINITION: Away from the usual, frequently traveled route.
  PEDAGOGICAL_ART_DIRECTOR: Make the quiet side path visibly branch from a wide, well-worn tourist trail.
  PEDAGOGICAL_ARCHETYPE: 4 - Action / Contrast
  SYNONYM_GUARD: Contrast a familiar busy route with a less-traveled branch, not a person who is simply lost.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A broad track with several footprints leads toward a crowded lookout, while a single traveler turns onto a narrow grassy path winding toward an untouched grove.
-->
