  SYNONYM_GUARD: The traveler is planning a whole holiday, not just reserving a hotel room.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A seated traveler uses a tablet with simple plane, hotel, and sunny beach pictograms while a suitcase waits nearby.
-->
