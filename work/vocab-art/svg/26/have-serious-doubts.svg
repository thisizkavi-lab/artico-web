<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: have serious doubts (Verb phrase)
  CONTEXTUAL_DEFINITION: Feel strong uncertainty about whether a claim is true or a plan will succeed.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive person comparing conflicting claims
  SYNONYM_GUARD: Focus on the person actively questioning conflicting information, distinct from subtle suspicion or concern about the wisdom of a specific choice.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Neighborhood discussion table.
    - Context_Layer: Two small speakers offer conflicting pictorial versions of the same story.
    - Focal_Layer: The central listener holds both mismatched visual claims and looks deeply uncertain.
    - Details_Layer: A large unresolved split path symbol and furrowed brows show strong doubt.
    - Lighting_Layer: Cool neutral shadow suggests uncertainty without implying danger.
-->
