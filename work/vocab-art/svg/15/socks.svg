  <line x1="88" y1="46" x2="126" y2="46" stroke="#EF4444" stroke-width="2.2"/>
  <line x1="88" y1="52" x2="126" y2="52" stroke="#2563EB" stroke-width="2.2"/>

  <!-- RIGHT SOCK (Matching Twin Pair) -->
  <path d="M 168 40 L 206 40 L 206 116 C 206 128 212 136 230 144 L 246 152 C 256 156 258 168 248 174 C 238 180 224 176 210 168 L 180 148 C 168 138 168 126 168 116 Z"
        fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

