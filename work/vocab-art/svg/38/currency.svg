<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: currency (noun)
  CONTEXTUAL_DEFINITION: The system and physical forms of money used in a country or monetary area.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object / contrast pair
  SYNONYM_GUARD: Show multiple distinct note and coin designs together to convey a currency system; no national flags, letters, numbers, or currency glyphs.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Two visually distinct blank note designs on a counter, one cool blue and one sage; varied gold and copper coins below; a small divided exchange tray supports the grouping.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:currency" data-archetype="hero-object">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="currency-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DCECFB"/><stop offset="1" stop-color="#8EB0DE"/></linearGradient>
    <linearGradient id="currency-green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A8D4A2"/><stop offset="1" stop-color="#7FB07A"/></linearGradient>
    <path id="currency-note" d="M60 68 Q60 62 67 62 H166 Q172 62 172 68 V119 Q172 125 166 125 H67 Q60 125 60 119 Z"/>
    <clipPath id="currency-clip"><use href="#currency-note"/></clipPath>
