<!-- SELF_PROMPT:
  CHAPTER: 59 - Abilities and actions
  WORD: move
  CONTEXTUAL_DEFINITION: Change position from one place to another.
  PEDAGOGICAL_ART_DIRECTOR: Show one person shifting across a clear floor from a marked starting place toward a new place, with a visible trail of positions.
  PEDAGOGICAL_ARCHETYPE: 3 - Sequence + Transformation
  SYNONYM_GUARD: Use an ordinary steady sidestep with several faint position echoes, not a fast running stride or a moved object.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A child steps sideways across a quiet indoor floor from a pale circle at left toward a brighter destination circle at right; translucent footprints and a gentle dotted path show the change of position.
-->
