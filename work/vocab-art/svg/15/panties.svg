  <ellipse cx="147" cy="61" rx="4" ry="2.2" transform="rotate(-15 147 61)" fill="#F472B6" stroke="#1E2A3B" stroke-width="1"/>
  <ellipse cx="157" cy="61" rx="4" ry="2.2" transform="rotate(15 157 61)" fill="#F472B6" stroke="#1E2A3B" stroke-width="1"/>
  <path d="M 151 64 L 148 70 M 153 64 L 156 70" stroke="#DB2777" stroke-width="1.2"/>
