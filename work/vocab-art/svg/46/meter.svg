<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: meter / metre
  CONTEXTUAL_DEFINITION: A metric unit used to measure a short length or route segment.
  PEDAGOGICAL_ART_DIRECTOR: Show a very short pedestrian route between two nearby points with a compact finely divided measure bar.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / direction diagram
  SYNONYM_GUARD: This is a unit of length for a short local distance, not a parking meter or electrical meter; use a much smaller span than kilometer.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A compact neighborhood-map fragment shows two nearby pins connected by a short blue segment; beneath it, a small subdivided measuring bar spans the same gap.
-->
