<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: initiative
  CONTEXTUAL_DEFINITION: The willingness to start useful action without waiting to be told.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker noticing an unassigned workplace need and proactively beginning to solve it.
  PEDAGOGICAL_ARCHETYPE: 46 - Self-started action
  SYNONYM_GUARD: Emphasize choosing to start helpful work on one's own, not merely acting independently after receiving a task.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place one worker noticing a loose stack of project materials on a side desk; highlight an unprompted first step as the worker sorts the loose sheets into a ready tray, with no manager pointing or instruction card.
-->
