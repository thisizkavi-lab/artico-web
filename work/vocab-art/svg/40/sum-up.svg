<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: sum up
  CONTEXTUAL_DEFINITION: Briefly state the main points of a discussion at its conclusion.
  PEDAGOGICAL_ART_DIRECTOR: Show a facilitator gathering several discussion points into one concise closing summary card.
  PEDAGOGICAL_ARCHETYPE: 7 - Summary / closure
  SYNONYM_GUARD: Use condensation and recap, not arithmetic, a business objective, or the act of recording every meeting detail.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put three small idea cards along the top of a board at x=66..235, y=47..75. Thin lines converge downward to a single compact summary card at x=126..179, y=95..123 with three short marks. A facilitator at x=130..176 gestures toward that card as the meeting closes.
-->
