<!-- SELF_PROMPT:
  CHAPTER: 13 — Moving and renting
  WORD: local (Adjective)
  CONTEXTUAL_DEFINITION: In or near the area where someone lives.
  PEDAGOGICAL_ARCHETYPE: 5 — Neighborhood distance diagram
  SYNONYM_GUARD: Highlight nearby neighborhood places around the resident's home while distant buildings are muted beyond the radius.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A simplified neighborhood map viewed from above.
    - Context_Layer: Nearby market, park, and bus stop sit inside a circular radius around one home.
    - Focal_Layer: A blue home pin at the center with short paths to nearby services.
    - Details_Layer: Distant gray homes are separated by a dashed boundary.
    - Lighting_Layer: Soft gold halo defines the close local area.
; reviewed and reused for Lesson 75. -->
