<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: calm
  CONTEXTUAL_DEFINITION: Peaceful and not upset or rushed, even when others are busy.
  PEDAGOGICAL_ART_DIRECTOR: Keep a worker composed while mild workplace activity happens around them.
  PEDAGOGICAL_ARCHETYPE: 6 - Composure under pressure
  SYNONYM_GUARD: Show a settled, unflustered state in the moment; patience is about waiting and allowing others time.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center one relaxed worker seated at a desk, hands resting evenly on the surface. Put light motion marks and a small stack of papers at the far edges but leave a clear quiet halo around the worker.
-->
