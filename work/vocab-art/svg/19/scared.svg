<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:scared" data-archetype="expressive-bust">
  <defs>
    <path id="scared-head" d="M 112 60 C 112 36, 192 36, 192 60 L 190 94 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 94 Z"/>
    <clipPath id="scared-head-clip">
      <use href="#scared-head"/>
    </clipPath>
    <clipPath id="scared-torso-clip">
      <path d="M 74 178 C 82 142, 108 128, 152 128 C 196 128, 222 142, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Cool Tinted Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#EEF4FA"/>

  <!-- Crouched Defensively Raised Torso (Kai: Yellow Tee) -->
  <g clip-path="url(#scared-torso-clip)">
    <rect x="70" y="124" width="164" height="60" fill="#F2C14E"/>
    <path d="M 70 178 C 82 146, 100 132, 120 128 L 120 178 Z" fill="#D49B2A"/>
  </g>
  <path d="M 74 178 C 82 142, 108 128, 152 128 C 196 128, 222 142, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Pale Frightened Face with Blue Top Shadow -->
  <g clip-path="url(#scared-head-clip)">
    <rect x="105" y="34" width="94" height="106" fill="#FDE4D4"/>
    <!-- Blue shadow across upper half of face (fright/chill) -->
    <path d="M 105 34 L 199 34 L 199 76 L 105 76 Z" fill="#93C5FD" opacity="0.45"/>
    <!-- Dark vertical chill lines across forehead -->
    <line x1="130" y1="42" x2="130" y2="70" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="142" y1="40" x2="142" y2="72" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="154" y1="40" x2="154" y2="72" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="166" y1="42" x2="166" y2="70" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
  <use href="#scared-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Messy Shivering Hair -->
  <path d="M 106 66 C 102 36, 124 20, 152 20 C 180 20, 202 36, 198 66 C 192 48, 176 38, 152 38 C 128 38, 114 48, 106 66 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- High Wavy Anxious Eyebrows -->
  <path d="M 124 66 Q 134 60 144 68" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 180 66 Q 170 60 160 68" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Wide Scared Pupils with White Ring -->
  <circle cx="134" cy="78" r="9" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="134" cy="78" r="3.2" fill="#1E2A3B"/>
  <circle cx="170" cy="78" r="9" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="170" cy="78" r="3.2" fill="#1E2A3B"/>

  <!-- Trembling Squiggly Mouth -->
  <path d="M 136 106 Q 142 102 148 107 Q 154 102 160 107 Q 166 102 168 106"
        fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Hands Raised Defensively in Front of Chest (Trembling) -->
  <g fill="#FDE4D4" stroke="#1E2A3B" stroke-width="2.2">
    <ellipse cx="126" cy="138" rx="12" ry="9" transform="rotate(-20 126 138)"/>
    <ellipse cx="178" cy="138" rx="12" ry="9" transform="rotate(20 178 138)"/>
  </g>
  <!-- Trembling Vibration Lines -->
  <g stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M 106 134 Q 104 140 106 146"/>
    <path d="M 198 134 Q 200 140 198 146"/>
  </g>

  <!-- Large Blue Sweat Drop Dropping from Temple -->
  <path d="M 188 74 C 188 74, 194 82, 194 85 C 194 88, 191.5 90, 188.5 90 C 185.5 90, 183 88, 183 85 C 183 82, 188 74, 188 74 Z"
        fill="#7CC4FA" stroke="#1E2A3B" stroke-width="1.6"/>
</svg>
