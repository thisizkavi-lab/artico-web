<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: task (noun; assigned piece of work)
  CONTEXTUAL_DEFINITION: A particular job or piece of work that someone is responsible for completing.
  PEDAGOGICAL_ART_DIRECTOR: Make one bounded piece of work the focus, with a supervisor assigning it and an employee beginning to complete it.
  PEDAGOGICAL_ARCHETYPE: 4 - Work action with specific tool
  SYNONYM_GUARD: Show one defined assigned job, smaller than a project and not a general workplace or career.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a manager's single blue work folder at x=111..151 and a worker's clear desk surface across y=133. An employee at x=173..220 reaches to accept the folder; one small tool or single marked checkbox suggests the assigned item is underway.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:task" data-archetype="assigned-work-item">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="task-folder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EB0DE"/><stop offset="1" stop-color="#3D5F91"/></linearGradient>
    <linearGradient id="task-desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E6B477"/><stop offset="1" stop-color="#B6784B"/></linearGradient>
    <radialGradient id="task-focus"><stop stop-color="#FFF1B9" stop-opacity=".7"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <filter id="task-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
    <path id="task-worker" d="M190 128 Q191 107 204 101 L206 91 Q201 85 204 77 Q211 68 221 71 Q230 74 227 84 L224 93 Q238 100 239 122 L234 137 H195 Z"/>
    <clipPath id="task-worker-clip"><use href="#task-worker"/></clipPath>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="154" width="304" height="38" fill="#EEE7DA"/><path d="M0 154 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="152" cy="165" rx="110" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. A manager, one task folder, and a clean work surface -->
  <g id="layer-context"><path d="M30 149 H274" stroke="#C88446" stroke-width="2"/><path d="M52 130 H254 V143 H52 Z" fill="url(#task-desk)" stroke="#1E2A3B" stroke-width="1.8"/><path d="M66 143 V154 M241 143 V154" stroke="#965D28" stroke-width="2.6"/><rect x="53" y="61" width="36" height="42" rx="3" fill="#E5F0E1" stroke="#64748B" stroke-width="1.3"/><path d="M59 69 H82 M59 75 H78 M59 82 H82" stroke="#94A3B8" stroke-width="1.1"/><circle cx="71" cy="91" r="6" fill="#A8D4A2" stroke="#64748B" stroke-width="1"/><path d="M62 101 Q63 94 71 94 Q79 94 80 101" fill="#DCECFB" stroke="#64748B" stroke-width="1"/><path d="M57 113 H83 V126 H57 Z" fill="#EEF4FA" stroke="#64748B" stroke-width="1.1"/><path d="M62 118 H78 M62 122 H75" stroke="#94A3B8" stroke-width=".9"/><rect x="107" y="85" width="43" height="35" rx="3" fill="url(#task-folder)" stroke="#1E2A3B" stroke-width="1.8"/><path d="M112 92 H144 M112 98 H139 M112 104 H145" stroke="#DCECFB" stroke-width="1.1"/><path d="M115 84 V80 Q115 77 119 77 H131 Q135 77 135 84" fill="none" stroke="#1E2A3B" stroke-width="1.3"/></g>
  <!-- 3. Employee accepts one defined piece of assigned work -->
  <g id="layer-focal" filter="url(#task-shadow)"><use href="#task-worker" fill="#5479AC" stroke="#1E2A3B" stroke-width="2.3"/><g clip-path="url(#task-worker-clip)"><path d="M186 104 Q218 92 244 107 V141 H186Z" fill="#3D5F91"/></g><ellipse cx="218" cy="81" rx="8" ry="10" fill="#D89A6C" stroke="#1E2A3B" stroke-width="1.5"/><path d="M210 79 Q211 69 219 69 Q227 70 228 78 Q222 73 216 75 Z" fill="#3D342D" stroke="#1E2A3B" stroke-width="1"/><use href="#task-worker" fill="none" stroke="#1E2A3B" stroke-width="2.3"/><path d="M197 110 Q182 107 168 111 L151 109 L150 116 L170 120 L201 120 Z" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.8"/><path d="M154 107 Q148 105 144 110 L148 117 L155 115 Z" fill="#D89A6C" stroke="#1E2A3B" stroke-width="1.2"/><path d="M227 111 L239 121 L246 118 L236 105" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.7"/><path d="M192 130 L190 149 H200 L206 134 M216 133 L219 151 H229 L227 130" fill="#3D5F91" stroke="#1E2A3B" stroke-width="1.6"/><path d="M187 149 H201 L202 154 H185 Z M218 149 H231 L233 154 H217 Z" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.2"/><rect x="154" y="90" width="38" height="30" rx="3" fill="url(#task-folder)" stroke="#1E2A3B" stroke-width="1.8"/><path d="M158 98 H187 M158 104 H183 M158 111 H183" stroke="#EAF2FC" stroke-width="1"/><path d="M183 114 L187 118 L194 109" fill="none" stroke="#F2C14E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- 4. The manager assigns a single item for completion -->
  <g id="layer-details"><path d="M93 111 H105" stroke="#4A72B2" stroke-width="1.8" stroke-dasharray="3 3"/><path d="M100 107 L107 111 L100 115 Z" fill="#4A72B2"/><circle cx="174" cy="125" r="3" fill="#F2C14E"/><path d="M166 124 H182" stroke="#64748B" stroke-width="1.2"/><rect x="219" y="115" width="17" height="13" rx="2" fill="#F8FBFE" stroke="#94A3B8" stroke-width="1"/><path d="M223 119 H232 M223 123 H229" stroke="#94A3B8" stroke-width=".9"/><path d="M102 66 L108 60 M102 76 H110" stroke="#F2C14E" stroke-width="1.8" stroke-linecap="round"/></g>
  <!-- 5. Focus stays on this one assigned folder -->
  <g id="layer-lighting"><ellipse cx="173" cy="104" rx="43" ry="35" fill="url(#task-focus)"/><ellipse cx="173" cy="105" rx="28" ry="23" fill="none" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4 4"/><path d="M159 94 H176" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></g>
</svg>
