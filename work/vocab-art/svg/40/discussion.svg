<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: discussion
  CONTEXTUAL_DEFINITION: An exchange of ideas and opinions about a topic.
  PEDAGOGICAL_ART_DIRECTOR: Show two or three coworkers actively exchanging viewpoints, with open gestures and multiple idea cues.
  PEDAGOGICAL_ARCHETYPE: 3 - Exchange / deliberation
  SYNONYM_GUARD: Keep the conversation in progress and balanced; avoid a completed agreement card, a one-way presentation, or a vote.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Set two coworkers at x=65..120 and x=185..240 across a table, leaning slightly forward. Two distinct empty idea clouds above them contain different simple icons; a third colleague at x=130..176 listens between them. Add crossing but gentle gesture lines, not arrows to a decision.
-->
