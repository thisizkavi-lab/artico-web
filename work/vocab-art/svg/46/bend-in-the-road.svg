  CHAPTER: 46 - Maps and directions
  WORD: bend in the road
  CONTEXTUAL_DEFINITION: A place where a road curves instead of continuing straight.
  PEDAGOGICAL_ART_DIRECTOR: Show an overhead hillside road that sweeps through a broad, unmistakable curve; avoid a car so the road's bend itself is the focus.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / direction diagram
  SYNONYM_GUARD: Teach the curved section of the road as a place/feature, not the action of turning a vehicle.
  MODE: STATIC
