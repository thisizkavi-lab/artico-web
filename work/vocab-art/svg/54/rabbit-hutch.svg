<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:rabbit hutch" data-archetype="hero-object">
  <defs>
    <!-- Outdoor Wooden Rabbit Hutch: elevated on legs, wire mesh front, wooden bedroom door, slanted felt roof, water bottle -->
    <clipPath id="hutch-wire-clip">
      <rect x="146" y="74" width="86" height="66" rx="2" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="172" rx="118" ry="12" fill="#EAE3D5" />
  <ellipse cx="152" cy="170" rx="64" ry="7" fill="#DDD4C3" />

  <!-- Four Elevated Wooden Legs -->
  <rect x="66" y="138" width="10" height="28" fill="#78350F" stroke="#1E2A3B" stroke-width="2.2" />
  <rect x="88" y="138" width="8" height="24" fill="#5A280B" stroke="#1E2A3B" stroke-width="1.8" />
  <rect x="224" y="138" width="10" height="28" fill="#78350F" stroke="#1E2A3B" stroke-width="2.2" />
  <rect x="206" y="138" width="8" height="24" fill="#5A280B" stroke="#1E2A3B" stroke-width="1.8" />

  <!-- Main Wooden Hutch Cabinet Box (Warm Cedar) -->
  <rect x="62" y="66" width="176" height="78" rx="3" fill="#D97706" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Left Compartment: Enclosed Wooden Bedroom / Nesting Box -->
  <rect x="68" y="72" width="72" height="68" rx="2" fill="#B45309" stroke="#1E2A3B" stroke-width="2.2" />
  <!-- Horizontal wood slats on bedroom door -->
  <line x1="68" y1="88" x2="140" y2="88" stroke="#78350F" stroke-width="2" />
  <line x1="68" y1="106" x2="140" y2="106" stroke="#78350F" stroke-width="2" />
  <line x1="68" y1="124" x2="140" y2="124" stroke="#78350F" stroke-width="2" />
  <!-- Cute Heart / Bunny cutout ventilation hole in bedroom door -->
  <path d="M 104 88 C 100 82 94 82 94 88 C 94 96 104 102 104 102 C 104 102 114 96 114 88 C 114 82 108 82 104 88 Z" fill="#451A03" stroke="#1E2A3B" stroke-width="1.4" />
  <!-- Wooden swivel turn-button latch on bedroom door -->
  <rect x="134" y="100" width="10" height="4" rx="2" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.2" />

  <!-- Right Compartment: Open Wire Mesh Run -->
  <g clip-path="url(#hutch-wire-clip)">
    <!-- Interior shadow & back wall -->
    <rect x="142" y="70" width="94" height="74" fill="#FEF3C7" />
    <rect x="142" y="70" width="94" height="14" fill="#FDE68A" />

    <!-- Fresh Yellow Straw Bedding on Floor -->
    <rect x="142" y="126" width="94" height="18" fill="#FACC15" />
    <path d="M 148 132 L 158 126 M 164 134 L 176 128 M 184 134 L 196 126 M 204 136 L 218 128" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

    <!-- Wire Mesh Grid -->
    <!-- Vertical wires -->
    <g stroke="#94A3B8" stroke-width="1.2">
      <line x1="156" y1="74" x2="156" y2="140" />
      <line x1="168" y1="74" x2="168" y2="140" />
      <line x1="180" y1="74" x2="180" y2="140" />
      <line x1="192" y1="74" x2="192" y2="140" />
      <line x1="204" y1="74" x2="204" y2="140" />
      <line x1="216" y1="74" x2="216" y2="140" />
      <line x1="228" y1="74" x2="228" y2="140" />
      <!-- Horizontal wires -->
      <line x1="146" y1="84" x2="232" y2="84" />
      <line x1="146" y1="96" x2="232" y2="96" />
      <line x1="146" y1="108" x2="232" y2="108" />
      <line x1="146" y1="120" x2="232" y2="120" />
      <line x1="146" y1="132" x2="232" y2="132" />
    </g>
  </g>
  <!-- Wire Door Wooden Outer Frame -->
  <rect x="144" y="72" width="90" height="70" rx="2" fill="none" stroke="#1E2A3B" stroke-width="2.4" />
  <!-- Door frame latch -->
  <rect x="142" y="102" width="6" height="10" rx="1.5" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.2" />

  <!-- Clear Plastic Gravity Water Bottle Attached to Wire Mesh -->
  <rect x="210" y="80" width="14" height="34" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6" />
  <!-- Water level inside bottle -->
  <rect x="212" y="90" width="10" height="22" rx="2" fill="#7DD3FC" />
  <!-- Metal mounting wire band -->
  <line x1="206" y1="92" x2="228" y2="92" stroke="#64748B" stroke-width="2" />
  <!-- Metal drinking sipper tube with ball tip -->
  <path d="M 216 114 L 210 128" stroke="#94A3B8" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 216 114 L 210 128" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Weather-Proof Slanted Asphalt Green Felt Roof -->
  <polygon points="52,66 248,66 244,52 48,52" fill="#15803D" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <line x1="50" y1="58" x2="246" y2="58" stroke="#22C55E" stroke-width="2" />
  <!-- Front eave drip edge -->
  <rect x="46" y="64" width="206" height="6" rx="2" fill="#14532D" stroke="#1E2A3B" stroke-width="1.8" />
</svg>