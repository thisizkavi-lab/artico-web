<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: interview
  CONTEXTUAL_DEFINITION: A formal conversation in which an employer asks a candidate questions to assess suitability for a job.
  PEDAGOGICAL_ART_DIRECTOR: Show the interview meeting as a structured question-and-answer exchange across a desk.
  PEDAGOGICAL_ARCHETYPE: 13 - Hiring conversation
  SYNONYM_GUARD: Depict the formal event with interviewer notes and a candidate responding; this noun is distinct from the action phrase have an interview.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Position one interviewer left and one candidate right, facing each other across a table at y=119..143. Above the interviewer place a blank note sheet and one speech cue; above the candidate show a simple listening/response cue. Keep the scene centered and symmetrical.
-->
