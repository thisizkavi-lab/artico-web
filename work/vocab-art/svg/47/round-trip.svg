<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: round-trip
  CONTEXTUAL_DEFINITION: A journey that goes from a starting place to a destination and then returns to the start.
  PEDAGOGICAL_ART_DIRECTOR: Show an outward route and a distinct return route joining the same two endpoints.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / travel diagram
  SYNONYM_GUARD: Include both outward and return directions but do not make a physical ticket the focal object.
  MODE: STATIC
  COORDINATE_BLUEPRINT: On a clean map, two curved lines link one hotel and one airport; one arrow points outward and another back along a parallel path.
-->
