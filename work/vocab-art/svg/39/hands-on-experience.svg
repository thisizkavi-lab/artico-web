<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: hands-on experience
  CONTEXTUAL_DEFINITION: Practical knowledge gained by doing a job or activity directly.
  PEDAGOGICAL_ART_DIRECTOR: Show the learner actively building a real object at a workplace bench, with tools and an experienced coworker nearby.
  PEDAGOGICAL_ARCHETYPE: 4 - Practical learning / experience
  SYNONYM_GUARD: Keep the learner's hands visibly engaged in the work; this is acquired practical experience, distinct from a trainer demonstrating a lesson and from hands-full workload.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Use a sturdy workshop desk at y=133. Place a trainee centered x=121..179, shoulders leaning toward a small unbranded device at x=127..180, both hands assembling it. Put a second coworker at x=222..258 watching with a supportive gesture; show two small tools on the desk and a warm highlight on the trainee's working hands.
-->
