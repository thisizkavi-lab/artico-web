  SYNONYM_GUARD: The person lies on a compact bodyboard; they are not standing on a long surfboard.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Smiling swimmer lies flat on a short rounded board as a turquoise wave pushes the board toward shore.
-->
