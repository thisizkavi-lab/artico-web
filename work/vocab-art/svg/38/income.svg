<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: income (noun)
  CONTEXTUAL_DEFINITION: Money regularly received from work, business, or investments.
  PEDAGOGICAL_ARCHETYPE: 3 - Role with incoming money
  SYNONYM_GUARD: Show money arriving to a person from completed work, distinct from money handed out as pay or a one-time sales receipt.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Worker completes a task at desk; a recurring stream of blank pay envelopes and coins flows into an open household wallet, with green upward arrow to suggest received funds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:income" data-archetype="role-inflow">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="income-envelope" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5F0E1"/></linearGradient>
    <radialGradient id="income-coin"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></radialGradient>
    <path id="income-worker" d="M75 151 Q78 117 104 112 Q131 107 145 130 L142 159 H75 Z"/>
    <clipPath id="income-clip"><use href="#income-worker"/></clipPath>
    <filter id="income-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="153" width="304" height="39" fill="#EEE7DA"/><path d="M0 153 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="151" cy="164" rx="104" ry="8" fill="#DDD4C3"/></g>
