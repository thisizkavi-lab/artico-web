  <g id="layer-focal" filter="url(#debit-shadow)"><use href="#debit-shape" fill="url(#debit-card)" stroke="#1E2A3B" stroke-width="2.6"/><g clip-path="url(#debit-clip)"><path d="M70 108 C114 64 170 73 232 39 V125 H70Z" fill="#568552" opacity=".42"/><path d="M84 60 H145" stroke="#D9EED5" stroke-width="4" stroke-linecap="round" opacity=".8"/></g><rect x="93" y="77" width="27" height="22" rx="3" fill="url(#debit-chip)" stroke="#1E2A3B" stroke-width="1.6"/><path d="M101 78 V98 M111 78 V98 M94 85 H119 M94 92 H119" stroke="#B55B28" stroke-width="1.2"/><circle cx="196" cy="97" r="5" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.4"/></g>
