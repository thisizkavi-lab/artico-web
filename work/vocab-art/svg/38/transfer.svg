<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: transfer (noun/verb; bank funds transfer)
  CONTEXTUAL_DEFINITION: The movement of money from one bank account to another.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / directional diagram
  SYNONYM_GUARD: Show two separate financial accounts and one-way money movement between them; reserve the next “transfer money” card for a person carrying out the action.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Two clear account folders at x31..103 and x201..273, coin cluster moving along a bold Artico-blue arrow across center; source funds decrease, destination funds increase.
-->
