  CHAPTER: 12 — Tools and gardening
  WORD: unclog the sink (Verb phrase)
  CONTEXTUAL_DEFINITION: Clear a blocked sink drain, often by pumping a plunger over the plughole.
  PEDAGOGICAL_ARCHETYPE: 4 — Tool, force, and restored flow
  SYNONYM_GUARD: A rubber-cup plunger seals over the drain and makes water swirl away; unblock-the-sink shows a drain snake removing a solid plug.
