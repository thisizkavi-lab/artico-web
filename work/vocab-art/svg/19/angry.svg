<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:angry" data-archetype="expressive-bust">
  <defs>
    <path id="angry-head" d="M 112 60 C 112 36, 192 36, 192 60 L 190 94 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 94 Z"/>
    <clipPath id="angry-head-clip">
      <use href="#angry-head"/>
    </clipPath>
    <clipPath id="angry-torso-clip">
      <path d="M 72 178 C 80 136, 106 122, 152 122 C 198 122, 224 136, 232 178 Z"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEE2E2"/>

  <!-- Tense Torso with Clenched Shoulders (Sam: Sky-blue Shirt) -->
  <g clip-path="url(#angry-torso-clip)">
    <rect x="68" y="118" width="168" height="66" fill="#7FA1CF"/>
    <path d="M 146 122 L 158 136 L 158 178 L 146 178 Z" fill="#5479AC"/>
    <path d="M 68 178 C 78 144, 98 130, 118 126 L 118 178 Z" fill="#5479AC"/>
  </g>
  <path d="M 72 178 C 80 136, 106 122, 152 122 C 198 122, 224 136, 232 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="110" width="24" height="20" rx="6" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Flushed Angry Shading -->
  <g clip-path="url(#angry-head-clip)">
    <rect x="105" y="34" width="94" height="106" fill="#D89A6C"/>
    <!-- Angry red cheek & brow flush -->
    <ellipse cx="152" cy="74" rx="36" ry="16" fill="#EF4444" opacity="0.35"/>
    <circle cx="128" cy="96" r="10" fill="#EF4444" opacity="0.4"/>
    <circle cx="176" cy="96" r="10" fill="#EF4444" opacity="0.4"/>
  </g>
  <use href="#angry-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neat Hair (Sam) -->
  <path d="M 108 66 C 104 38, 126 22, 152 22 C 178 22, 200 38, 196 66 C 192 52, 180 42, 152 42 C 124 42, 112 52, 108 66 Z"
        fill="#3A2E2B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Sharp Angled V-Eyebrows (Classic Anger) -->
  <path d="M 124 74 L 144 80" stroke="#1E2A3B" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 180 74 L 160 80" stroke="#1E2A3B" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Forehead Furrow Crinkle Lines -->
  <path d="M 148 74 L 148 82 M 156 74 L 156 82" stroke="#B6784B" stroke-width="2" stroke-linecap="round"/>

  <!-- Glaring Eyes -->
  <circle cx="134" cy="86" r="4.5" fill="#1E2A3B"/>
  <circle cx="170" cy="86" r="4.5" fill="#1E2A3B"/>

  <!-- Gritted Teeth / Snarl Mouth -->
  <path d="M 134 104 L 170 104 C 170 114, 134 114, 134 104 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="134" y1="109" x2="170" y2="109" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="144" y1="104" x2="144" y2="114" stroke="#1E2A3B" stroke-width="1.5"/>
  <line x1="152" y1="104" x2="152" y2="114" stroke="#1E2A3B" stroke-width="1.5"/>
  <line x1="160" y1="104" x2="160" y2="114" stroke="#1E2A3B" stroke-width="1.5"/>

  <!-- Clenched Shaking Fists at Sides -->
  <!-- Left Fist -->
  <circle cx="86" cy="154" r="13" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.4"/>
  <path d="M 78 152 C 84 148, 92 148, 96 154" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right Fist -->
  <circle cx="218" cy="154" r="13" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.4"/>
  <path d="M 210 152 C 216 148, 224 148, 228 154" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Vibration / Shake Marks beside Fists -->
  <g stroke="#EF4444" stroke-width="2" stroke-linecap="round">
    <path d="M 68 146 Q 66 154 68 162"/>
    <path d="M 236 146 Q 238 154 236 162"/>
  </g>

  <!-- Small Anger Vein (Cross) near Temple -->
  <g stroke="#EF4444" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M 188 56 Q 192 60 196 56"/>
    <path d="M 196 56 Q 200 60 196 64"/>
    <path d="M 196 64 Q 192 60 188 64"/>
    <path d="M 188 64 Q 184 60 188 56"/>
  </g>
</svg>
