<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: bank statement (noun)
  CONTEXTUAL_DEFINITION: A bank-produced record listing deposits, withdrawals, and other account transactions over a period.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero document with transaction history
  SYNONYM_GUARD: Use several chronological transaction rows and paired in/out symbols; unlike balance, emphasize a history record rather than one remaining amount.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Full white statement page x76..228 on a blue account folder; rows of alternating green incoming and copper outgoing markers with ruled lines; no words or numerals.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:bank statement" data-archetype="hero-object">
