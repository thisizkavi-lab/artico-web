  CHAPTER: 21 — Family and relationships
  WORD: think the world of someone (Idiom)
  CONTEXTUAL_DEFINITION: To love, admire, and value someone very much.
  PEDAGOGICAL_ARCHETYPE: 4 — Conceptual metaphor
  SYNONYM_GUARD: A person proudly treasures a small portrait of a beloved mentor and shares a grateful embrace, expressing deep admiration rather than romantic dating.
