<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: urban myth (Noun)
  CONTEXTUAL_DEFINITION: A modern but unverified story repeated as though it were true, often in a city.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept shown as a circulating modern story
  SYNONYM_GUARD: Show city residents passing an unbelievable, unconfirmed story from a phone, distinct from old village folklore and ordinary informal gossip.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A modern city sidewalk beside a subway entrance at night.
    - Context_Layer: Storefronts, lit windows, and a manhole locate the scene in an urban setting.
    - Focal_Layer: One commuter shows a phone to another while a dashed story cloud depicts an oversized sewer creature.
    - Details_Layer: A broken dotted trail carries the strange image between listeners without any confirmation mark.
    - Lighting_Layer: Cool evening blue contrasts with a pale uncertain story cloud.
-->
