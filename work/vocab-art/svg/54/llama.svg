<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:llama" data-archetype="hero-object">
  <defs>
    <!-- Llama: long curved banana ears, very tall upright woolly neck, shaggy fleece, colorful woven halter with tassels -->
    <clipPath id="llama-body-clip">
      <path d="M 124 102 C 122 84 146 76 186 78 C 220 80 236 94 234 134 C 230 152 206 156 168 154 C 132 152 126 130 124 102 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="160" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="162" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Short Fluffy Woolly Tail -->
  <path d="M 230 106 C 242 98 248 106 244 116 C 240 124 232 122 228 116 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Slender Legs & Two-Toed Padded Feet -->
  <path d="M 200 126 L 198 162 L 210 162 L 216 128 Z" fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="198" y="156" width="12" height="6" fill="#64748B" stroke="#1E2A3B" stroke-width="1.6" />

  <path d="M 214 128 L 218 160 L 228 160 L 230 132 Z" fill="#CBD5E1" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="218" y="154" width="10" height="6" fill="#64748B" stroke="#1E2A3B" stroke-width="1.6" />

  <path d="M 136 118 L 134 162 L 146 162 L 150 122 Z" fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="134" y="156" width="12" height="6" fill="#64748B" stroke="#1E2A3B" stroke-width="1.6" />

  <path d="M 150 120 L 154 160 L 164 160 L 164 124 Z" fill="#CBD5E1" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="154" y="154" width="10" height="6" fill="#64748B" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Shaggy Woolly Llama Body (Cream & Warm Biscuit) -->
  <g clip-path="url(#llama-body-clip)">
    <!-- Base Warm Cream Fleece -->
    <rect x="115" y="70" width="125" height="90" fill="#F8FAFC" />
    <!-- Biscuit / Toffee Fleece Patches -->
    <path d="M 150 78 C 170 78 190 90 186 114 C 182 136 160 142 144 130 Z" fill="#D97706" />
    <path d="M 200 86 C 220 86 232 100 230 126 L 206 142 Z" fill="#B45309" />
    <!-- Fluffy cloud scallops -->
    <circle cx="134" cy="98" r="8" fill="#F8FAFC" />
    <circle cx="140" cy="112" r="9" fill="#F8FAFC" />
    <circle cx="136" cy="128" r="8" fill="#F8FAFC" />
  </g>
  <!-- Body Contour -->
  <path d="M 124 102 C 122 84 146 76 186 78 C 220 80 236 94 234 134 C 230 152 206 156 168 154 C 132 152 126 130 124 102 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Very Long Upright Woolly Neck -->
  <path d="M 124 108 C 122 76 128 42 138 28 C 148 26 156 36 148 68 C 142 90 140 102 138 118" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Woolly tufts along neck back -->
  <path d="M 148 40 Q 154 44 146 50 M 146 56 Q 152 60 144 66 M 142 72 Q 148 76 140 82" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Banana-Shaped Curved Ears (Classic Llama Ear Shape) -->
  <!-- Left Ear (Far) -->
  <path d="M 130 24 C 126 10 134 2 142 4 C 144 10 138 18 136 26 Z" fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Ear (Near) -->
  <path d="M 122 26 C 118 12 126 4 134 6 C 136 12 130 20 128 28 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 124 24 C 122 14 126 8 132 10" stroke="#FDA4AF" stroke-width="1.8" fill="none" />

  <!-- Llama Head -->
  <path d="M 132 30 C 124 22 108 26 98 36 C 88 46 86 58 96 66 C 108 72 124 66 130 52 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Big Dark Liquid Eyes with Long Eyelashes -->
  <circle cx="114" cy="40" r="5" fill="#1E2A3B" />
  <circle cx="112.5" cy="38.5" r="1.6" fill="#FFFFFF" />
  <line x1="110" y1="34" x2="108" y2="30" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round" />
  <line x1="114" y1="34" x2="114" y2="29" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Snout with Cleft Camelid Lip -->
  <ellipse cx="94" cy="54" rx="10" ry="8" fill="#F1F5F9" stroke="#1E2A3B" stroke-width="1.8" />
  <circle cx="90" cy="52" r="2" fill="#64748B" />
  <path d="M 90 56 L 90 60 M 86 60 Q 90 63 94 60" fill="none" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Colorful Andean Woven Halter with Tassels -->
  <path d="M 102 38 L 92 52 M 116 48 L 98 56" stroke="#EF4444" stroke-width="2.4" stroke-linecap="round" />
  <path d="M 98 54 L 118 64" stroke="#3B82F6" stroke-width="2.4" stroke-linecap="round" />
  <!-- Colorful hanging pom-poms / tassels -->
  <circle cx="98" cy="62" r="3" fill="#FACC15" />
  <circle cx="106" cy="67" r="3" fill="#10B981" />
  <circle cx="114" cy="72" r="3" fill="#EC4899" />
</svg>