<!-- SELF_PROMPT:
  CHAPTER: 13 — Moving and renting
  WORD: detached houses (Noun)
  CONTEXTUAL_DEFINITION: Separate homes that do not share walls with neighboring homes.
  PEDAGOGICAL_ARCHETYPE: 6 — Clear spatial comparison
  SYNONYM_GUARD: Show visible open air between two stand-alone houses; semi-detached houses share one wall and row houses share several walls.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Suburban sky and continuous garden ground.
    - Context_Layer: Two separate plots with lawns and short paths.
    - Focal_Layer: Two standalone homes with a wide visible gap between their side walls.
    - Details_Layer: Each home has its own roof, entrance, and windows.
    - Lighting_Layer: A blue open-space cue through the gap links the separation.
-->
