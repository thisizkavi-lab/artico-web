<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: stormy (Adjective)
  CONTEXTUAL_DEFINITION: A sky threatening or experiencing a storm, with turbulent clouds and gusts but without focusing on a single lightning flash.
  PEDAGOGICAL_ART_DIRECTOR: Make the full sky look unsettled with layered twisting clouds and sweeping gusts; keep lightning absent.
  PEDAGOGICAL_ARCHETYPE: 3 - Broad threatening weather condition
  SYNONYM_GUARD: Stormy describes the turbulent atmospheric condition, not one storm bolt or the combined event itself.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Heavy layered clouds race above a dark restless shoreline, with wind bending a slim tree and small rain streaks.
-->
