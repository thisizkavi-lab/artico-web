    - Focal_Layer: Hands smooth a timber blank into a curved molding profile, with the new outline prominent at right.
    - Details_Layer: Curled shavings, grain, profile edge, tool pressure marks, and two small wood chips.
    - Lighting_Layer: Upper-left highlights along the finished curved surface.
-->
