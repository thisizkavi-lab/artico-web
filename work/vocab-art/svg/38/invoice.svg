<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: invoice (noun)
  CONTEXTUAL_DEFINITION: A formal itemized document sent by a seller requesting payment for goods supplied.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero document with delivery context
  SYNONYM_GUARD: Attach the detailed document to a supplier's delivered goods; distinguish it from a restaurant bill due at the table.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Tall formal sheet clipped to a delivery carton, several aligned item rows and a prominent total rule; sealed shipment box and outgoing parcel behind, all text-free.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:invoice" data-archetype="hero-document">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="invoice-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5E9F0"/></linearGradient>
    <radialGradient id="invoice-seal"><stop stop-color="#A8D4A2"/><stop offset="1" stop-color="#568552"/></radialGradient>
    <path id="invoice-sheet" d="M87 34 H201 L225 58 V151 H87 Z"/>
    <clipPath id="invoice-clip"><use href="#invoice-sheet"/></clipPath>
    <filter id="invoice-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="154" width="304" height="38" fill="#EEE7DA"/><path d="M0 154 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="154" cy="164" rx="82" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Supplier delivery context -->
  <g id="layer-context"><path d="M35 114 L76 90 L116 114 V150 H35 Z" fill="#C88446" stroke="#1E2A3B" stroke-width="2"/><path d="M35 114 L76 137 L116 114 M76 137 V150" fill="none" stroke="#965D28" stroke-width="2"/><path d="M44 109 L76 92 L108 109" fill="none" stroke="#E3AC77" stroke-width="2"/><rect x="235" y="99" width="40" height="48" rx="3" fill="#E5E9F0" stroke="#64748B" stroke-width="1.8"/><path d="M241 107 H269 M241 114 H269" stroke="#94A3B8" stroke-width="1.4"/><path d="M245 119 V139 M264 119 V139" stroke="#94A3B8" stroke-width="1.3"/></g>
  <!-- 3. Primary itemized invoice requesting payment -->
  <g id="layer-focal" filter="url(#invoice-shadow)"><use href="#invoice-sheet" fill="url(#invoice-paper)" stroke="#1E2A3B" stroke-width="2.6"/><g clip-path="url(#invoice-clip)"><path d="M101 60 H177" stroke="#5479AC" stroke-width="3" stroke-linecap="round"/><path d="M101 69 H163" stroke="#94A3B8" stroke-width="1.6"/><path d="M101 82 H208 M101 97 H208 M101 112 H208" stroke="#CBD5E1" stroke-width="1.3"/><path d="M105 87 H147 M105 102 H155 M105 117 H142" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/><path d="M175 87 H199 M175 102 H199 M175 117 H199" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/><path d="M101 130 H207" stroke="#CE3D4E" stroke-width="2.1"/><path d="M162 138 H207" stroke="#5479AC" stroke-width="2.4"/></g></g>
  <!-- 4. Folded corner, supplier seal and shipped goods -->
  <g id="layer-details"><path d="M201 34 V58 H225" fill="#E5E9F0" stroke="#64748B" stroke-width="1.7"/><circle cx="193" cy="52" r="8" fill="url(#invoice-seal)" stroke="#1E2A3B" stroke-width="1.5"/><path d="M189 52 L192 55 L197 49" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 114 L76 128 L102 114" fill="none" stroke="#1E2A3B" stroke-width="1.6"/><path d="M239 99 L255 91 L273 99" fill="none" stroke="#64748B" stroke-width="1.5"/></g>
  <!-- 5. Payment-request emphasis -->
  <g id="layer-lighting"><path d="M97 42 H144" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/><path d="M226 74 C238 69 244 74 248 82" fill="none" stroke="#4A72B2" stroke-width="2" stroke-dasharray="3 3"/><path d="M275 56 L275 65 M271 60 H279" stroke="#F2C14E" stroke-width="2.3" stroke-linecap="round"/></g>
</svg>
