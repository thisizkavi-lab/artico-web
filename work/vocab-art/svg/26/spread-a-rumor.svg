  CHAPTER: 26 — Communication and beliefs
  WORD: spread a rumor (Verb phrase)
  CONTEXTUAL_DEFINITION: Pass along an unverified story so it reaches more people.
  PEDAGOGICAL_ARCHETYPE: 3 — Person-to-person message chain
  SYNONYM_GUARD: Show one recipient actively relaying a hazy story onward through several people, distinct from originating it or the rumor itself.
