<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: tackle something head-on (work idiom)
  CONTEXTUAL_DEFINITION: Deal with a difficult work problem directly and without avoiding it.
  PEDAGOGICAL_ART_DIRECTOR: Show a determined worker facing one specific work obstacle straight on and pushing into the solution, not playing a contact sport.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment work action
  SYNONYM_GUARD: Chapter tasks context selects directly addressing a problem; avoid football tackles, fighting, and generic exertion.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place an upright employee at x=81..145 facing right toward a large unstable file stack at x=182..257. Both arms extend forward to brace and straighten the stack; a thick straight blue arrow travels directly from worker to files, with no curved detour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:tackle something head-on" data-archetype="direct-work-action">
