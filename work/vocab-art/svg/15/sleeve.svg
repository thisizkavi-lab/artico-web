<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:sleeve" data-archetype="part-focus">
  <defs>
    <clipPath id="sleeve-arm-clip">
      <path d="M 124 50 C 132 50 144 56 150 64 L 236 122 C 246 128 248 138 242 146 L 222 158 C 214 164 204 160 196 154 L 118 96 C 114 84 116 66 124 50 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Soft Golden Focus Halo Behind the Entire Arm Sleeve Zone -->
  <ellipse cx="180" cy="108" rx="80" ry="54" fill="#FEF3C7"/>
  <ellipse cx="180" cy="108" rx="68" ry="42" fill="#FDE68A" opacity="0.6"/>

  <!-- GHOSTED CONTEXT: Jacket/Shirt Torso & Left Shoulder on Left -->
  <path d="M 68 44 L 126 50 L 118 96 L 114 166 L 52 166 L 52 92 L 32 126 L 18 116 L 36 62 Z"
        fill="#E6ECF2" stroke="#7B8A9E" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Ghosted Collar & Placket -->
  <path d="M 68 44 C 76 38 98 38 106 44 L 98 60 L 76 60 Z"
        fill="#DCE3EC" stroke="#7B8A9E" stroke-width="1.6"/>
  <line x1="86" y1="60" x2="86" y2="166" stroke="#7B8A9E" stroke-width="1.6"/>
  <circle cx="86" cy="84" r="2" fill="#94A3B8"/>
  <circle cx="86" cy="112" r="2" fill="#94A3B8"/>
  <circle cx="86" cy="140" r="2" fill="#94A3B8"/>

  <!-- FULL-COLOR TARGET PART: Full Diagonal Arm Sleeve -->
  <!-- Arm Sleeve Shell -->
  <path d="M 124 50 C 132 50 144 56 150 64 L 236 122 C 246 128 248 138 242 146 L 222 158 C 214 164 204 160 196 154 L 118 96 C 114 84 116 66 124 50 Z"
        fill="#2563EB" stroke="#1E2A3B" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- 3-Tone Shading & Crease Contours inside Sleeve -->
  <g clip-path="url(#sleeve-arm-clip)">
    <!-- Underside Arm Shadow -->
    <path d="M 118 96 L 196 154 L 222 158 L 190 168 L 110 110 Z" fill="#1D4ED8"/>
    <!-- Shoulder Cap Shadow -->
    <path d="M 124 50 C 120 70 118 84 118 96 L 132 82 C 130 68 128 58 124 50 Z" fill="#1E3A8A" opacity="0.4"/>
    <!-- Top Highlight Crest running down arm -->
    <path d="M 136 58 L 226 120 L 220 128 L 132 66 Z" fill="#60A5FA"/>

    <!-- Natural Elbow Bend Dynamic Crease Folds -->
    <path d="M 174 94 C 182 108 178 122 170 134" stroke="#1E3A8A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 182 100 C 190 112 186 124 178 136" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Structured Shoulder Armhole Set-In Seam (Where Sleeve Connects to Torso) -->
  <path d="M 124 50 C 120 68 116 82 118 96"
        stroke="#1E2A3B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 122 52 C 118 68 114 82 116 94"
        stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="2 1.5" fill="none"/>

  <!-- Sleeve Wrist Cuff Finish at End -->
  <path d="M 236 122 L 248 130 C 252 134 250 142 244 146 L 224 158 L 222 158 C 214 164 204 160 196 154 L 206 148 Z"
        fill="#1D4ED8" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="236" y1="122" x2="196" y2="154" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="228" cy="144" r="2.2" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1.2"/>
</svg>