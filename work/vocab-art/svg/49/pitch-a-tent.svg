  CHAPTER: 49 - Camping and cycling
  WORD: pitch a tent (Verb Phrase)
  CONTEXTUAL_DEFINITION: Erect and secure a tent at a campsite.
  PEDAGOGICAL_ART_DIRECTOR: Show the camper raising the tent canopy and fastening a corner to the ground.
