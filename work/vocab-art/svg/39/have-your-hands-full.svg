  <g id="layer-details"><rect x="228" y="104" width="34" height="20" rx="2" transform="rotate(-8 228 104)" fill="#DCECFB" stroke="#64748B" stroke-width="1.3"/><path d="M233 110 H256 M233 115 H250" stroke="#94A3B8" stroke-width="1"/><path d="M222 73 L228 67 M224 80 H232 M226 88 L233 91" stroke="#F2C14E" stroke-width="1.8" stroke-linecap="round"/><path d="M103 105 V110 M107 106 V111" stroke="#D89A6C" stroke-width="2" stroke-linecap="round"/><path d="M192 79 Q199 74 206 78" fill="none" stroke="#CE3D4E" stroke-width="1.6" stroke-dasharray="2 3"/></g>
