<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: background check
  CONTEXTUAL_DEFINITION: Verification of a job candidate's identity and relevant history during hiring.
  PEDAGOGICAL_ART_DIRECTOR: Show a recruiter checking identity and records on a secure candidate file, with a clear verification symbol.
  PEDAGOGICAL_ARCHETYPE: 5 - Hiring verification
  SYNONYM_GUARD: Background refers to a person's history, not scenery; avoid police lights, handcuffs, or a generic criminal interrogation.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a recruiter at x=59..112 looking at a record page at x=121..188. Put a candidate ID portrait card beside a large magnifying glass over the record and a small green shield/check at x=210..237; the office wall stays plain and secondary.
-->
