    </clipPath>
  </defs>

  <!-- Warm Kitchen Stage & Countertop -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <rect x="0" y="164" width="304" height="28" fill="#EAE2D3"/>
  <line x1="0" y1="164" x2="304" y2="164" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Tall Pleated White Toque Blanche (Iconic Chef Hat) -->
  <path d="M 88 54
           C 74 48, 76 26, 94 24
           C 100 14, 118 12, 126 20
           C 136 12, 154 14, 158 24
           C 176 26, 178 48, 164 54 Z"
        fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M 146 20 C 156 26, 160 40, 156 52 L 163 52 C 172 46, 170 28, 158 24 Z" fill="#E4ECF5"/>
  <rect x="92" y="50" width="68" height="16" rx="3" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.5"/>
  <rect x="94" y="60" width="64" height="4.5" fill="#E4ECF5"/>
  <g stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round">
    <line x1="108" y1="30" x2="110" y2="48"/>
    <line x1="126" y1="26" x2="126" y2="48"/>
    <line x1="144" y1="30" x2="142" y2="48"/>
  </g>

  <!-- Chef Coat Torso (Clipped 3-tone shading + crisp stamped outline) -->
  <g clip-path="url(#chef-coat-clip)">
    <rect x="58" y="110" width="136" height="58" fill="#FFFFFF"/>
    <rect x="58" y="110" width="36" height="58" fill="#E8EEF5"/>
    <path d="M 106 116 L 146 125 L 146 166 L 106 166 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <use href="#chef-coat-shape" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Two Columns of Classic Chef Coat Buttons -->
  <g fill="#27364B">
    <circle cx="115" cy="135" r="2.8"/>
    <circle cx="115" cy="151" r="2.8"/>
    <circle cx="137" cy="135" r="2.8"/>
    <circle cx="137" cy="151" r="2.8"/>
  </g>

  <!-- Red Chef Neckerchief at Collar -->
  <path d="M 104 114 L 126 128 L 148 114 L 138 108 L 114 108 Z"
