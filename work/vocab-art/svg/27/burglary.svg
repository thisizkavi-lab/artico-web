<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: burglary (Noun)
  CONTEXTUAL_DEFINITION: Unlawful entry into a building with intent to steal.
  PEDAGOGICAL_ARCHETYPE: 6 — Crime shown through a non-graphic entry-and-theft scene
  SYNONYM_GUARD: Include a building, a broken entry point, and missing property so the act is burglary rather than generic street theft.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A quiet house interior at dusk with a window and a small cabinet.
    - Context_Layer: The window is damaged and an open empty jewelry box shows a loss.
    - Focal_Layer: A shadowy intruder leaves through the doorway carrying an unmarked bag while a worried resident calls for help.
    - Details_Layer: A few glass fragments remain near the sill; no tools or entry instructions appear.
    - Lighting_Layer: A warm interior lamp makes the loss visible against cool evening blue.
-->
