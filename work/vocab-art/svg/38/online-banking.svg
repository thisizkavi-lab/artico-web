  COORDINATE_BLUEPRINT: Open laptop x70..235 with broad browser-like bank dashboard, simple tab row, account panels and network nodes; blank card and houseplant in background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:online banking" data-archetype="hero-object">
