  <path d="M 102 58 C 105 55 107 55 110 58 C 113 55 115 55 118 58 C 121 55 123 55 126 59 C 129 56 131 56 134 60 C 137 57 139 57 142 60 C 145 57 147 57 150 61 C 153 58 155 58 158 61 C 161 58 163 58 166 60 C 169 57 171 57 174 60 C 177 56 179 56 182 59 C 185 55 187 55 190 58 C 193 55 195 55 198 58 C 201 55 203 55 204 58"
