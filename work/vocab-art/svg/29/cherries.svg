<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:cherries" data-archetype="hero-object">
  <defs>
    <!-- Cherries: pair of glossy deep red cherries joined by slender arching twin stems with green leaf, plus one loose cherry -->
    <clipPath id="cherry-left-clip">
      <path d="M 102 110 C 102 96 114 96 116 102 C 118 96 130 96 130 110 C 130 134 116 146 116 146 C 116 146 102 134 102 110 Z" />
    </clipPath>
    <clipPath id="cherry-right-clip">
      <path d="M 162 120 C 162 106 174 106 176 112 C 178 106 190 106 190 120 C 190 144 176 156 176 156 C 176 156 162 144 162 120 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="116" cy="162" rx="36" ry="7" fill="#DDD4C3" />
  <ellipse cx="176" cy="164" rx="36" ry="7" fill="#DDD4C3" />
  <ellipse cx="228" cy="162" rx="28" ry="6" fill="#DDD4C3" />

  <!-- Shared Twin-Stem Junction at Top -->
  <g transform="translate(142, 42)">
    <!-- Joint top knot -->
    <circle cx="0" cy="0" r="3.5" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="1.8" />
    <!-- Leaf at junction -->
    <path d="M 0 0 C 12 -12 28 -14 36 -4 C 28 6 12 4 0 0 Z" fill="#65A30D" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 0 Q 18 -6 34 -4" stroke="#365314" stroke-width="1.5" fill="none" />

    <!-- Slender green twin stems branching down -->
    <!-- Left stem -->
    <path d="M 0 0 C -12 20 -24 40 -26 62" stroke="#65A30D" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 0 0 C -12 20 -24 40 -26 62" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <!-- Right stem -->
    <path d="M 0 0 C 10 24 24 50 34 72" stroke="#65A30D" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 0 0 C 10 24 24 50 34 72" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Left Cherry (Glossy Heart-Spherical) -->
  <g clip-path="url(#cherry-left-clip)">
    <!-- Base deep crimson-red -->
    <rect x="95" y="90" width="45" height="60" fill="#DC2626" />
    <!-- Rich dark side shade -->
    <path d="M 98 126 C 106 142 126 144 132 130 L 132 150 L 98 150 Z" fill="#881337" />
    <!-- Glossy high-contrast specular reflection -->
    <ellipse cx="110" cy="108" rx="8" ry="11" transform="rotate(-25 110 108)" fill="#FCA5A5" opacity="0.85" />
    <ellipse cx="108" cy="104" rx="3" ry="5" transform="rotate(-25 108 104)" fill="#FFFFFF" opacity="0.95" />
  </g>
  <!-- Contour -->
  <path d="M 102 110 C 102 96 114 96 116 102 C 118 96 130 96 130 110 C 130 134 116 146 116 146 C 116 146 102 134 102 110 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Stem dimple indentation -->
  <ellipse cx="116" cy="102" rx="4" ry="1.5" fill="#881337" />

  <!-- Right Cherry -->
  <g clip-path="url(#cherry-right-clip)">
    <rect x="155" y="100" width="45" height="60" fill="#DC2626" />
    <path d="M 158 136 C 166 152 186 154 192 140 L 192 160 L 158 160 Z" fill="#881337" />
    <ellipse cx="170" cy="118" rx="8" ry="11" transform="rotate(-25 170 118)" fill="#FCA5A5" opacity="0.85" />
    <ellipse cx="168" cy="114" rx="3" ry="5" transform="rotate(-25 168 114)" fill="#FFFFFF" opacity="0.95" />
  </g>
  <!-- Contour -->
  <path d="M 162 120 C 162 106 174 106 176 112 C 178 106 190 106 190 120 C 190 144 176 156 176 156 C 176 156 162 144 162 120 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <ellipse cx="176" cy="112" rx="4" ry="1.5" fill="#881337" />

  <!-- Third Loose Single Cherry Resting in Foreground Right -->
  <g transform="translate(228, 142)">
    <circle cx="0" cy="0" r="18" fill="#B91C1C" stroke="#1E2A3B" stroke-width="2.4" />
    <!-- Stem notch -->
    <ellipse cx="0" cy="-14" rx="4" ry="1.8" fill="#4C0519" />
    <!-- Specular gleam -->
    <ellipse cx="-6" cy="-4" rx="5" ry="7" transform="rotate(-30 -6 -4)" fill="#FCA5A5" />
    <circle cx="-7" cy="-6" r="2" fill="#FFFFFF" />
  </g>
</svg>
