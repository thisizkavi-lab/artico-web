<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: make a loss (verb phrase)
  CONTEXTUAL_DEFINITION: To spend more on a business than it earns, leaving a financial shortfall.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrastive financial outcome
  SYNONYM_GUARD: Make outgoing business costs visibly exceed incoming sales; contrast with break even where both sides match.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Small shop ledger with short green revenue stack on left and taller crimson cost stack on right; owner sees cash flowing downward into red deficit tray.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:make a loss" data-archetype="financial-outcome">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
