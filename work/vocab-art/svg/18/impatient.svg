  CHAPTER: 18 — Personality traits
  WORD: impatient (Adjective)
  CONTEXTUAL_DEFINITION: Becoming annoyed or restless while waiting for something to happen.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: The focal person taps a foot and drums fingers in a slow queue while others calmly wait ahead.
