<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: public speaking
  CONTEXTUAL_DEFINITION: Speaking to an audience in a formal or prepared way.
  PEDAGOGICAL_ART_DIRECTOR: Show a confident presenter addressing a small audience from the front of a room.
  PEDAGOGICAL_ARCHETYPE: 32 - Live audience address
  SYNONYM_GUARD: Make the group audience and presenter role unmistakable; this is not a private conversation or ordinary message exchange.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put the presenter at x=150 on a low platform at y=132, with a blank icon-only display behind them at upper right; put three audience silhouettes across the foreground and sound arcs from the presenter's microphone toward the group.
-->
