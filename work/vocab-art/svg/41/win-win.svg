<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: win-win (idiom)
  CONTEXTUAL_DEFINITION: An agreement in which both sides gain an equally useful benefit.
  PEDAGOGICAL_ARCHETYPE: 6 - Balanced reciprocal benefit
  SYNONYM_GUARD: Two business partners each receive a matching useful parcel and stand level at a balanced scale; there is no single winner or competition.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a balanced gold scale at x=151,y=91. Hang identical green parcels at x=105 and x=197. Put one business partner at each side, facing each other across the scale and sharing a handshake below it.
-->
