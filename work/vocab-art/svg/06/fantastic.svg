  COORDINATE_BLUEPRINT:
    - Backdrop: Ivory theater stage with plum curtain panels and warm footlights.
    - Context_Layer: Audience faces and raised hands across the lower corners.
    - Focal_Layer: Singer-dancer at x=154,y=91 under a gold spotlight, arms open in a finishing pose.
    - Details_Layer: Stage boards, applause arcs, costume folds, star-shaped lights, curtain tassels.
    - Lighting_Layer: Cream highlight across the stage and a soft upper-left beam.
-->
