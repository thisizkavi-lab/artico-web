  CHAPTER: 26 — Communication and beliefs
  WORD: folklore (Noun)
  CONTEXTUAL_DEFINITION: Traditional stories, customs, and beliefs shared by a community across generations.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept shown as shared oral tradition
  SYNONYM_GUARD: Show a familiar story motif being repeated among older and younger community members, distinct from one child's magical storybook and a modern city rumor.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A warmly lit village room with a simple hearth and a low wooden bench.
    - Context_Layer: Three ages sit together around a patterned cloth woven with a repeated flower-and-moon emblem.
    - Focal_Layer: An elder tells a story while an adult repeats its picture motif and a child listens.
    - Details_Layer: Three connected, faint speech clouds repeat the same tiny fox-under-moon picture across the generations.
    - Lighting_Layer: Amber hearth light warms the group and shared tradition symbols.
-->
