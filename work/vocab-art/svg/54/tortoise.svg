<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:tortoise" data-archetype="hero-object">
  <defs>
    <!-- Land Tortoise: high domed carapace with geometric scutes, elephantine pillar legs, leathery neck -->
    <clipPath id="tortoise-shell-clip">
      <path d="M 96 142 C 92 84 134 54 186 54 C 238 54 258 92 254 142 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="160" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="166" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Tiny Stubby Tail Peeking Out from Back of Shell -->
  <polygon points="252,136 264,138 252,144" fill="#65A30D" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Heavy Elephantine Hind Leg (Pillar-like, land adapted) -->
  <path d="M 216 134 L 214 162 L 236 162 L 238 134 Z" fill="#65A30D" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Stubby terrestrial claws -->
  <circle cx="218" cy="162" r="2.5" fill="#FEF08A" stroke="#1E2A3B" stroke-width="1.4" />
  <circle cx="225" cy="163" r="2.5" fill="#FEF08A" stroke="#1E2A3B" stroke-width="1.4" />
  <circle cx="232" cy="162" r="2.5" fill="#FEF08A" stroke="#1E2A3B" stroke-width="1.4" />

  <!-- Wrinkled Leathery Neck Extending from Front -->
  <path d="M 112 136 C 96 136 84 126 78 114 C 74 104 82 96 92 98 C 104 100 114 116 116 128" fill="#84CC16" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Leathery neck skin folds -->
  <path d="M 88 106 Q 84 114 88 122 M 96 110 Q 94 118 98 126" stroke="#4D7C0F" stroke-width="1.6" fill="none" stroke-linecap="round" />

  <!-- Heavy Elephantine Front Leg -->
  <path d="M 124 136 L 122 162 L 144 162 L 146 136 Z" fill="#65A30D" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Heavy armor scales on front leg -->
  <circle cx="128" cy="144" r="3" fill="#4D7C0F" />
  <circle cx="136" cy="148" r="3.5" fill="#4D7C0F" />
  <circle cx="130" cy="154" r="3" fill="#4D7C0F" />
  <!-- Front claws -->
  <circle cx="126" cy="162" r="2.5" fill="#FEF08A" stroke="#1E2A3B" stroke-width="1.4" />
  <circle cx="133" cy="163" r="2.5" fill="#FEF08A" stroke="#1E2A3B" stroke-width="1.4" />
  <circle cx="140" cy="162" r="2.5" fill="#FEF08A" stroke="#1E2A3B" stroke-width="1.4" />

  <!-- High Domed Carapace (Tortoise Shell) -->
  <g clip-path="url(#tortoise-shell-clip)">
    <!-- Base dark olive shell -->
    <rect x="90" y="50" width="170" height="100" fill="#78350F" />
    <!-- Yellow/amber center of scutes -->
    <rect x="90" y="50" width="170" height="100" fill="#B45309" opacity="0.6" />

    <!-- Vertebral and Costal Scutes (Geometric Shield Plates) -->
    <!-- Center top scute -->
    <polygon points="166,62 186,60 196,78 186,96 166,96 156,78" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="170,68 182,66 190,78 182,90 170,90 162,78" fill="#78350F" />

    <!-- Front top scute -->
    <polygon points="132,68 152,66 162,84 152,102 132,102 122,84" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="136,74 148,72 156,84 148,96 136,96 128,84" fill="#78350F" />

    <!-- Rear top scute -->
    <polygon points="200,68 220,66 230,84 220,102 200,102 190,84" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="204,74 216,72 224,84 216,96 204,96 196,84" fill="#78350F" />

    <!-- Lower row scutes -->
    <polygon points="112,108 136,104 144,124 126,140 104,136" fill="#D97706" stroke="#1E2A3B" stroke-width="1.8" />
    <polygon points="148,106 176,104 182,126 160,140 142,136" fill="#D97706" stroke="#1E2A3B" stroke-width="1.8" />
    <polygon points="184,106 212,104 218,126 196,140 178,136" fill="#D97706" stroke="#1E2A3B" stroke-width="1.8" />
    <polygon points="220,108 244,104 250,136 232,140 214,136" fill="#D97706" stroke="#1E2A3B" stroke-width="1.8" />
  </g>
  <!-- Carapace Outer Outline -->
  <path d="M 96 142 C 92 84 134 54 186 54 C 238 54 258 92 254 142 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Marginal Scute Flange at Bottom of Shell -->
  <path d="M 94 142 C 140 146 210 146 256 142" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 94 142 C 140 146 210 146 256 142" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Wise Ancient Tortoise Head -->
  <path d="M 76 98 C 66 94 56 102 54 112 C 52 120 60 126 70 124 C 80 122 84 112 82 102 Z" fill="#84CC16" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Dark Ancient Eye -->
  <circle cx="68" cy="108" r="3.5" fill="#1E2A3B" />
  <circle cx="67" cy="107" r="1.1" fill="#FFFFFF" />

  <!-- Beaked Jaws Munching Green Dandelion Leaf -->
  <path d="M 54 114 Q 64 118 74 114" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="56" cy="108" r="1" fill="#1E2A3B" />

  <!-- Dandelion Leaf in mouth -->
  <path d="M 52 118 C 42 120 34 114 28 118 C 34 126 44 126 50 122 Z" fill="#22C55E" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />
  <line x1="32" y1="120" x2="48" y2="120" stroke="#15803D" stroke-width="1.2" />
</svg>