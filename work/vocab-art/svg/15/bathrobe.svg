<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:bathrobe">
  <defs>
    <clipPath id="bathrobe-body-clip">
      <path d="M 120 42 L 72 58 L 60 144 L 84 148 L 94 110 L 90 166 L 214 166 L 210 110 L 220 148 L 244 144 L 232 58 L 184 42 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop soft spa/bathroom warmth -->
  <ellipse cx="152" cy="110" rx="92" ry="62" fill="#E0F2FE" opacity="0.6"/>

  <!-- Wooden Wall Peg / Hook -->
  <circle cx="152" cy="24" r="5" fill="#9A6945" stroke="#1E2A3B" stroke-width="2"/>
  <path d="M 152 24 L 152 38" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Left Plush Sleeve with Wide Turned Cuff -->
  <path d="M 84 58 L 60 144 L 84 148 L 96 110 L 106 64 Z"
        fill="#FAF8F3" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Wide Turned-back Waffle Cuff -->
  <path d="M 60 134 L 84 138 L 82 148 L 58 144 Z"
        fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="65" y1="135" x2="63" y2="145" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="72" y1="136" x2="70" y2="146" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="79" y1="137" x2="77" y2="147" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Right Plush Sleeve -->
  <path d="M 220 58 L 244 144 L 220 148 L 208 110 L 198 64 Z"
        fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 220 148 L 244 144 L 246 134 L 222 138 Z"
        fill="#CBD5E1" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="227" y1="147" x2="229" y2="137" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="234" y1="146" x2="236" y2="136" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="241" y1="145" x2="243" y2="135" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Main Bathrobe Body -->
  <path d="M 120 42 L 84 58 L 90 166 L 214 166 L 220 58 L 184 42 Z"
        fill="#FAF8F3" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Right Side Shadow & Waffle Terry Texture -->
  <g clip-path="url(#bathrobe-body-clip)">
    <path d="M 152 42 L 220 58 L 214 166 L 152 166 Z" fill="#E2E8F0" opacity="0.5"/>
    <!-- Subtle waffle grid texture lines on left side -->
    <path d="M 98 80 L 134 80 M 98 94 L 134 94 M 98 136 L 134 136 M 98 150 L 134 150"
          stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 3"/>
  </g>

  <!-- Deep Plush Shawl Collar (Signature Bathrobe Feature) -->
  <!-- Left Shawl Lapel wrapping across chest -->
  <path d="M 124 40 C 136 34 168 34 180 40 L 186 64 C 182 86 166 104 138 112 L 138 166 L 90 166 L 90 110 C 96 84 110 58 124 40 Z"
        fill="#F1F5F9" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Left Roll Edge -->
  <path d="M 124 40 C 136 58 148 76 172 108" stroke="#1E2A3B" stroke-width="2" fill="none"/>
  <path d="M 180 40 C 172 58 164 76 138 110" stroke="#1E2A3B" stroke-width="2" fill="none"/>

  <!-- Terrycloth Tie Belt Wrapped at Waist -->
  <rect x="88" y="108" width="128" height="11" rx="2" fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2"/>
  <!-- Belt Knot in Center -->
  <ellipse cx="148" cy="113.5" rx="7" ry="6" fill="#CBD5E1" stroke="#1E2A3B" stroke-width="1.8"/>
  <!-- Draped Belt Ends -->
  <path d="M 144 118 C 142 134 140 148 138 160 L 146 161 C 148 149 150 135 150 118 Z"
        fill="#CBD5E1" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 149 118 C 153 132 156 144 160 156 L 152 158 C 149 146 146 134 146 118 Z"
        fill="#94A3B8" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Left Patch Pocket -->
  <rect x="100" y="126" width="26" height="28" rx="2.5" fill="#F1F5F9" stroke="#1E2A3B" stroke-width="2"/>
  <line x1="100" y1="132" x2="126" y2="132" stroke="#94A3B8" stroke-width="1.4"/>
</svg>