  <line x1="149" y1="74" x2="155" y2="78" stroke="#1E3A8A" stroke-width="1.8"/>
  <line x1="149" y1="84" x2="155" y2="88" stroke="#F59E0B" stroke-width="1.8"/>

  <!-- Blazer Lapels -->
  <!-- Left Lapel -->
  <path d="M 124 38 L 108 66 L 122 70 L 112 96 L 152 108 L 152 48 Z"
