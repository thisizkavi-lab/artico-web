<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" width="100%" height="100%" data-vocab-key="19:curious">
  <defs>
    <!-- Curious: leaning forward, inspecting through magnifying glass, one enlarged eye, intrigued smile -->
    <clipPath id="lens-clip">
      <circle cx="120" cy="78" r="26" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="304" height="192" fill="#F0FDF4" rx="16" />

  <!-- Footprints / trail being tracked on ground -->
  <g transform="translate(186, 150) rotate(-10)" opacity="0.7">
    <ellipse cx="20" cy="8" rx="5" ry="7" fill="#64748B" />
    <circle cx="16" cy="-2" r="2" fill="#64748B" />
    <circle cx="21" cy="-4" r="2" fill="#64748B" />
    <circle cx="26" cy="-2" r="2" fill="#64748B" />

    <g transform="translate(36, 12) rotate(15)">
      <ellipse cx="20" cy="8" rx="5" ry="7" fill="#64748B" />
      <circle cx="16" cy="-2" r="2" fill="#64748B" />
      <circle cx="21" cy="-4" r="2" fill="#64748B" />
      <circle cx="26" cy="-2" r="2" fill="#64748B" />
    </g>
  </g>

  <!-- Torso (leaning forward to the left) -->
  <path d="M 122 142 C 122 130 144 120 174 122 C 200 124 216 136 216 150 L 224 186 L 110 186 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Neck -->
  <rect x="156" y="106" width="16" height="18" fill="#FCE7D6" stroke="#1E2A3B" stroke-width="2" transform="rotate(-12 164 115)" />

  <!-- Head Base (tilted forward) -->
  <g transform="rotate(-10 160 84)">
    <circle cx="162" cy="78" r="32" fill="#FCE7D6" stroke="#1E2A3B" stroke-width="2.6" />

    <!-- Sleek hair with side part -->
    <path d="M 132 74 C 130 50 142 36 160 36 C 178 36 196 46 194 66 C 194 80 190 88 190 88 C 196 70 184 46 164 46 C 142 46 134 64 132 74 Z" fill="#92400E" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

    <!-- Right Eye (normal size, focused toward lens) -->
    <ellipse cx="178" cy="74" rx="4.5" ry="5.5" fill="#1E2A3B" />
    <circle cx="176.5" cy="72" r="1.5" fill="#FFFFFF" />
    <path d="M 172 65 Q 179 61 185 66" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Cute intrigued half-smile -->
    <path d="M 152 94 Q 160 100 168 93" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Arm holding magnifying glass -->
  <path d="M 154 148 C 140 140 114 132 108 114 L 112 102" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 154 148 C 140 140 114 132 108 114 L 112 102" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <!-- Hand gripping handle -->
  <circle cx="112" cy="104" r="6" fill="#FCE7D6" stroke="#1E2A3B" stroke-width="2" />

  <!-- Magnifying glass handle -->
  <line x1="112" y1="104" x2="118" y2="92" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
  <line x1="112" y1="104" x2="118" y2="92" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />

  <!-- Magnifying glass Lens with magnified giant eye inside! -->
  <circle cx="120" cy="78" r="26" fill="#E0F2FE" opacity="0.9" stroke="#1E2A3B" stroke-width="3.2" />

  <!-- Magnified features inside lens -->
  <g clip-path="url(#lens-clip)">
    <!-- Magnified Eye -->
    <circle cx="120" cy="78" r="15" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="121" cy="78" r="8" fill="#0284C7" />
    <circle cx="121" cy="78" r="4.5" fill="#1E2A3B" />
    <circle cx="124" cy="75" r="2.2" fill="#FFFFFF" />
    <!-- Magnified inquisitive arched eyebrow -->
    <path d="M 106 60 Q 120 50 134 60" stroke="#1E2A3B" stroke-width="3.6" stroke-linecap="round" fill="none" />
    <!-- Lens reflection highlight -->
    <path d="M 102 68 A 22 22 0 0 1 128 58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
