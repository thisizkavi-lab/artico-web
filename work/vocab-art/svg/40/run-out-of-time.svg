<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: run out of time
  CONTEXTUAL_DEFINITION: Have no time left before a meeting ends, often leaving work unfinished.
  PEDAGOGICAL_ART_DIRECTOR: Show an almost-finished hourglass beside an unfinished meeting agenda and participants preparing to leave.
  PEDAGOGICAL_ARCHETYPE: 7 - Time pressure / unfinished work
  SYNONYM_GUARD: Show the meeting's remaining time being exhausted, not a generic clock, a late arrival, or an abstract running action.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a numeral-free round wall clock at x=210..263, y=32..85 and an hourglass at x=172..200, y=76..121. On the left, a meeting sheet with three rows has two checks and one unfinished row; two coworkers at the table gather their papers while the last row remains open.
-->
