<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: turn / turning
  CONTEXTUAL_DEFINITION: Change the direction of travel by steering around a street curve.
  PEDAGOGICAL_ART_DIRECTOR: Show a top-down car rotating through a sweeping curved lane, with the car body visibly angled to its new heading and a curved cobalt trajectory.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment travel action
  SYNONYM_GUARD: Teach a vehicle changing heading in a route scene, not turning an object or a clock hand.
  MODE: STATIC
  COORDINATE_BLUEPRINT: S-curved street wraps from bottom center (152,176), through (189,120), then exits toward upper-right (260,35); blue car at (200,97) is rotated about -40 degrees along the curve.
-->
