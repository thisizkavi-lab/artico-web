<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: get out of a taxi
  CONTEXTUAL_DEFINITION: To leave a taxi through the passenger door after arriving at a destination.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler already outside the open rear door, turning away from the taxi with one foot on the pavement.
