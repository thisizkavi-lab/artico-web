<!-- SELF_PROMPT:
  CHAPTER: 19 — Feelings and moods
  WORD: unhappy (Adjective)
  CONTEXTUAL_DEFINITION: Quietly sad or displeased, without a single intense shock.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive emotion scene
  SYNONYM_GUARD: A person is visibly unhappy with an unappealing meal, shown by a small frown and turned shoulders; there are no tears, unlike sad.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Warm dining nook and simple tabletop.
    - Context_Layer: Plain, overcooked meal on a small plate.
    - Focal_Layer: Seated adult with shoulders slightly lowered and an unmistakable mild frown.
    - Details_Layer: Folded hands, downturned eyes, and untouched fork beside the plate.
    - Lighting_Layer: Soft cool wash behind the person, not a storm scene.
-->
