  CHAPTER: 21 — Family and relationships
  WORD: see eye to eye with someone (Idiom)
  CONTEXTUAL_DEFINITION: To agree with another person's opinion.
  PEDAGOGICAL_ARCHETYPE: 4 — Conceptual metaphor
  SYNONYM_GUARD: Two coworkers point to the same solution on an unmarked plan and nod in agreement, showing shared opinion rather than identical eye color.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Quiet meeting table with a blank visual plan.
    - Context_Layer: A simple geometric route and matching markers.
    - Focal_Layer: Two adults lean toward the same choice and nod together.
    - Details_Layer: Parallel gaze lines converge on one point.
    - Lighting_Layer: Soft check-shaped arc above the shared choice.
-->
