<!-- SELF_PROMPT:
  CHAPTER: 19 — Feelings and moods
  WORD: frightened (Adjective)
  CONTEXTUAL_DEFINITION: Afraid and recoiling from a sudden, visible cue.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive emotion scene
  SYNONYM_GUARD: A startled person leans away and shields themself from a small dog that barks; the moving retreat distinguishes frightened from the frozen alert face of scared and the extreme panic of terrified.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Quiet garden path with low shrubs.
    - Context_Layer: Small dog on the left with perked ears and open barking mouth.
    - Focal_Layer: Person on the right stepping backward, arms raised protectively, eyes wide.
    - Details_Layer: Paw marks, curved bark burst strokes, and a backward motion arc.
    - Lighting_Layer: Cool pale halo around the recoiling person.
-->
