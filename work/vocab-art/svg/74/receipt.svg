  <!-- 5. Directional emphasis on the proof slip -->
  <g id="layer-lighting"><path d="M204 63 Q219 74 213 93" fill="none" stroke="#4A72B2" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"/><path d="M209 88 L213 96 L218 89 Z" fill="#4A72B2"/><path d="M124 45 H146" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M91 67 L91 75 M87 71 H95" stroke="#F2C14E" stroke-width="2.3" stroke-linecap="round"/></g>
