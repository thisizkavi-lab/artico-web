  <line x1="32" y1="142" x2="66" y2="142" stroke="#1E2A3B" stroke-width="2" />
  <line x1="238" y1="142" x2="272" y2="142" stroke="#1E2A3B" stroke-width="2" />

  <!-- Little Bush Greenery on Lawn -->
  <path d="M 28 160 Q 36 150 44 160 Z" fill="#16A34A" stroke="#1E2A3B" stroke-width="1.6" />
  <path d="M 260 160 Q 268 150 276 160 Z" fill="#16A34A" stroke="#1E2A3B" stroke-width="1.6" />
</svg>