<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: quit (verb; voluntarily leave a job)
  CONTEXTUAL_DEFINITION: Choose to stop working at a job and leave it.
  PEDAGOGICAL_ART_DIRECTOR: Show the employee's own decision: they calmly leave their badge on the desk and walk through an open door without a manager directing them.
  PEDAGOGICAL_ARCHETYPE: 3 - Voluntary workplace departure
  SYNONYM_GUARD: Unlike fired or laid off, the worker initiates the departure; unlike resign, keep the setting everyday and informal.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put the worker at x=154..207 stepping away to the right, shoulders relaxed and head turned toward the open exit. At x=48..137 an empty desk holds the badge the worker has chosen to leave behind; no boss or disciplinary cues.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:quit" data-archetype="voluntary-departure">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="quit-desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E6B477"/><stop offset="1" stop-color="#B6784B"/></linearGradient>
    <linearGradient id="quit-jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EB0DE"/><stop offset="1" stop-color="#3D5F91"/></linearGradient>
    <radialGradient id="quit-focus"><stop stop-color="#DCECFB" stop-opacity=".64"/><stop offset="1" stop-color="#8EB0DE" stop-opacity="0"/></radialGradient>
    <filter id="quit-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
    <path id="quit-worker" d="M163 121 Q164 101 177 96 L179 87 Q174 81 177 73 Q183 64 193 67 Q202 70 199 80 L196 89 Q210 95 211 118 L206 131 H167 Z"/>
    <clipPath id="quit-worker-clip"><use href="#quit-worker"/></clipPath>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="154" width="304" height="38" fill="#EEE7DA"/><path d="M0 154 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="152" cy="165" rx="111" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Emptying desk and an open door with daylight -->
  <g id="layer-context"><path d="M32 149 H273" stroke="#C88446" stroke-width="2"/><path d="M37 132 H146 V145 H37 Z" fill="url(#quit-desk)" stroke="#1E2A3B" stroke-width="2"/><path d="M48 145 V154 M136 145 V154" stroke="#965D28" stroke-width="3" stroke-linecap="round"/><rect x="41" y="77" width="38" height="43" rx="3" fill="#EEF4FA" stroke="#64748B" stroke-width="1.4"/><path d="M47 86 H73 M47 93 H69 M47 100 H73" stroke="#94A3B8" stroke-width="1.1"/><path d="M226 42 H270 V149 H226 Z" fill="#DCECFB" stroke="#64748B" stroke-width="1.8"/><path d="M230 48 H265 V143 H230 Z" fill="#F8FBFE" stroke="#94A3B8" stroke-width="1.1"/><path d="M219 50 L236 59 V135 L219 144 Z" fill="#E5E9F0" stroke="#64748B" stroke-width="1.4"/><circle cx="255" cy="96" r="2.2" fill="#C88446"/><path d="M235 53 V141" stroke="#FFFFFF" stroke-width="1.6"/></g>
  <!-- 3. Worker deliberately turns away from the former job -->
  <g id="layer-focal" filter="url(#quit-shadow)"><use href="#quit-worker" fill="url(#quit-jacket)" stroke="#1E2A3B" stroke-width="2.4"/><g clip-path="url(#quit-worker-clip)"><path d="M158 99 Q191 88 218 103 V137 H158Z" fill="#3D5F91"/><path d="M170 102 Q188 96 204 102" fill="none" stroke="#BBD2EF" stroke-width="2.4"/></g><ellipse cx="188" cy="76" rx="8" ry="10" fill="#D89A6C" stroke="#1E2A3B" stroke-width="1.6"/><path d="M180 74 Q181 64 189 64 Q197 65 198 73 Q191 68 185 70 Z" fill="#3D342D" stroke="#1E2A3B" stroke-width="1"/><use href="#quit-worker" fill="none" stroke="#1E2A3B" stroke-width="2.4"/><path d="M170 116 L157 126 L160 132 L176 126 Z" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.5"/><path d="M199 116 L211 126 L219 123 L208 110 Z" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.5"/><path d="M171 128 L166 147 L176 151 L185 132 M190 130 L195 149 L205 149 L203 128" fill="#3D5F91" stroke="#1E2A3B" stroke-width="1.7"/><path d="M165 147 H178 L179 152 H163 Z M195 147 H207 L210 152 H194 Z" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.3"/></g>
  <!-- 4. Badge is intentionally set down before the worker exits -->
  <g id="layer-details"><rect x="92" y="114" width="18" height="14" rx="2" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.3"/><circle cx="101" cy="118" r="2" fill="#FFFFFF"/><path d="M97 123 H105" stroke="#965D28" stroke-width=".9"/><path d="M123 109 H146" stroke="#4A72B2" stroke-width="2" stroke-dasharray="3 4"/><path d="M141 105 L148 109 L141 113 Z" fill="#4A72B2"/><path d="M276 76 L282 70 M278 87 H286 M276 106 L282 112" stroke="#F2C14E" stroke-width="2" stroke-linecap="round"/><rect x="52" y="117" width="12" height="11" rx="2" fill="#DCECFB" stroke="#64748B" stroke-width="1"/></g>
  <!-- 5. Cool light frames the employee's self-directed exit -->
  <g id="layer-lighting"><ellipse cx="248" cy="98" rx="36" ry="61" fill="url(#quit-focus)"/><ellipse cx="249" cy="98" rx="25" ry="49" fill="none" stroke="#4A72B2" stroke-width="1.3" stroke-dasharray="4 5" opacity=".65"/><path d="M185 69 H193" stroke="#F5BFA3" stroke-width="1.5" stroke-linecap="round"/><path d="M119 87 L125 81 M118 96 H126" stroke="#D49B2A" stroke-width="1.7" stroke-linecap="round"/></g>
</svg>
