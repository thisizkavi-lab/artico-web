<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: motivated
  CONTEXTUAL_DEFINITION: Eager to act because one has a reason, purpose, or goal.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker beginning a task with purposeful energy directed toward a meaningful outcome.
  PEDAGOGICAL_ARCHETYPE: 19 - Purpose-driven action
  SYNONYM_GUARD: Connect action to a clear reason or purpose; energetic describes lively activity, while ambitious is about a larger personal aspiration.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a worker at x=102..154 looking toward a small helpful outcome on a board at x=202..252, such as a completed project that helps a customer. Add one gentle line from a meaningful goal symbol to the worker's hands starting the task.
-->
