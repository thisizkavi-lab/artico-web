<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:bird" data-archetype="hero-object">
  <defs>
    <!-- Domestic pet bird (canary / budgie) perched on wooden bar -->
    <clipPath id="bird-body-clip">
      <path d="M 124 50 C 148 42 176 56 178 88 C 180 120 162 144 140 144 C 122 144 116 122 118 90 Z" />
    </clipPath>
    <clipPath id="bird-wing-clip">
      <path d="M 126 84 C 140 76 160 84 162 108 C 164 126 142 146 128 140 C 120 134 118 100 126 84 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="90" ry="12" fill="#EAE3D5" />
  <ellipse cx="152" cy="166" rx="42" ry="7" fill="#DDD4C3" />

  <!-- Wooden Perch Stand -->
  <!-- Base upright post -->
  <rect x="148" y="138" width="8" height="30" fill="#B45309" stroke="#1E2A3B" stroke-width="2" rx="2" />
  <!-- Horizontal perch bar -->
  <rect x="80" y="132" width="144" height="10" rx="4" fill="#D97706" stroke="#1E2A3B" stroke-width="2.4" />
  <line x1="86" y1="135" x2="218" y2="135" stroke="#FDE68A" stroke-width="1.8" stroke-linecap="round" />

  <!-- Tail Feathers Extending Down-Back -->
  <path d="M 128 136 L 94 166 L 108 168 L 136 142 Z" fill="#65A30D" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 124 138 L 102 166 L 112 168 L 132 142 Z" fill="#84CC16" />

  <!-- Bird Body -->
  <g clip-path="url(#bird-body-clip)">
    <!-- Base canary yellow -->
    <rect x="105" y="40" width="85" height="110" fill="#FACC15" />
    <!-- Olive green back/cape -->
    <path d="M 115 50 Q 150 50 178 88 L 180 144 L 115 144 Z" fill="#A3E635" />
    <!-- Warm golden chest -->
    <ellipse cx="160" cy="98" rx="20" ry="34" fill="#FEF08A" />
    <!-- Lower body shadow -->
    <ellipse cx="140" cy="140" rx="30" ry="12" fill="#CA8A04" />
  </g>
  <!-- Body Outline -->
  <path d="M 124 50 C 148 42 176 56 178 88 C 180 120 162 144 140 144 C 122 144 116 122 118 90 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Layered Wing -->
  <g clip-path="url(#bird-wing-clip)">
    <rect x="110" y="75" width="60" height="75" fill="#65A30D" />
    <!-- Wing flight feathers -->
    <path d="M 122 96 C 136 96 154 104 156 118" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 124 108 C 136 108 152 116 150 130" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 126 120 C 136 120 146 126 142 138" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Yellow wing bar highlight -->
    <path d="M 130 84 Q 148 88 158 98" stroke="#FACC15" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
  <path d="M 126 84 C 140 76 160 84 162 108 C 164 126 142 146 128 140 C 120 134 118 100 126 84 Z" fill="none" stroke="#1E2A3B" stroke-width="2.4" />

  <!-- Little Claws Gripping the Perch -->
  <path d="M 138 132 C 138 130 142 128 146 128 C 148 132 146 138 140 138" fill="#F97316" stroke="#1E2A3B" stroke-width="2" />
  <path d="M 152 132 C 152 130 156 128 160 128 C 162 132 160 138 154 138" fill="#F97316" stroke="#1E2A3B" stroke-width="2" />

  <!-- Conical Beak -->
  <polygon points="172,66 192,72 172,78" fill="#FB923C" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <line x1="172" y1="72" x2="188" y2="72" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Shiny Round Eye -->
  <circle cx="160" cy="66" r="4.5" fill="#1E2A3B" />
  <circle cx="158.5" cy="64.5" r="1.6" fill="#FFFFFF" />

  <!-- Cheek Blush Patch -->
  <circle cx="164" cy="74" r="5" fill="#FB7185" opacity="0.6" />

  <!-- Musical Notes / Chirping Singing Motif -->
  <path d="M 204 56 Q 212 50 216 42 L 226 44 L 224 58 M 216 48 L 224 50" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="204" cy="56" r="3.5" fill="#0284C7" />
  <circle cx="224" cy="58" r="3.5" fill="#0284C7" />

  <path d="M 234 68 Q 238 64 240 58" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <circle cx="234" cy="68" r="3" fill="#38BDF8" />
</svg>