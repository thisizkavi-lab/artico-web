  CHAPTER: 26 — Communication and beliefs
  WORD: agree (Verb)
  CONTEXTUAL_DEFINITION: Have the same opinion or reach a shared decision.
  PEDAGOGICAL_ARCHETYPE: 3 — Person-to-person interaction
