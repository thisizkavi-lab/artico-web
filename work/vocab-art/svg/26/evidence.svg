<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: evidence (Noun)
  CONTEXTUAL_DEFINITION: Observable information or objects that support a conclusion.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept through physical clues
  SYNONYM_GUARD: Show several visible clues being compared to support a conclusion, distinct from the conclusion itself (fact) or its explanation (reason).
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Garden path at the edge of the community room.
    - Context_Layer: A small trail of footprints and a snapped leaf lie on the ground.
    - Focal_Layer: An observer uses a hand lens to compare a print with a muddy paw-shaped mark.
    - Details_Layer: Dotted connector marks link the two clues to a simple animal silhouette in grass.
    - Lighting_Layer: Highlight the collected clues rather than an imagined final verdict.
-->
