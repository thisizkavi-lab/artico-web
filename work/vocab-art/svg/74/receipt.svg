  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="151" width="304" height="41" fill="#EEE7DA"/><path d="M0 151 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="153" cy="164" rx="72" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Completed retail transaction context -->
  <g id="layer-context"><path d="M29 137 H276 V150 H29 Z" fill="#C88446" stroke="#1E2A3B" stroke-width="2"/><path d="M38 142 H267" stroke="#E3AC77" stroke-width="2"/><rect x="47" y="91" width="55" height="44" rx="6" fill="#CBD5E1" stroke="#1E2A3B" stroke-width="2"/><rect x="54" y="98" width="41" height="16" rx="2" fill="#DCECFB" stroke="#64748B" stroke-width="1.3"/><path d="M57 122 H92" stroke="#94A3B8" stroke-width="2"/><path d="M207 112 Q230 101 250 112 L251 137 H207 Z" fill="#7FB07A" stroke="#1E2A3B" stroke-width="2"/><path d="M212 111 Q229 92 246 111" fill="none" stroke="#568552" stroke-width="2.4"/></g>
  <!-- 3. Primary narrow receipt strip -->
  <g id="layer-focal" filter="url(#receipt-shadow)"><use href="#receipt-slip" fill="url(#receipt-paper)" stroke="#1E2A3B" stroke-width="2.5"/><g clip-path="url(#receipt-clip)"><path d="M120 44 H190 V73 Q155 61 120 73Z" fill="#F4F6FA"/><path d="M130 55 H179 M130 62 H174" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/><path d="M131 80 H177 M131 88 H168 M131 96 H177 M131 104 H162" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/><path d="M131 114 H179" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="3 3"/><path d="M131 124 H158 M131 131 H174" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/></g></g>
  <!-- 4. Paid transaction cue and printer slot -->
