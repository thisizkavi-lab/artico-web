<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: go abroad
  CONTEXTUAL_DEFINITION: Travel from one's own country to another country.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler with passport and luggage on a plane route crossing the ocean between two different coasts.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: Make the border-crossing to another country explicit, not just a domestic flight.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A traveler holding an open passport stands before a globe whose curved route crosses blue ocean from one landmass to another; a plane follows the route.
-->
