<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: bank account (noun)
  CONTEXTUAL_DEFINITION: A personal arrangement with a bank for keeping and accessing money.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with person-account relation
  SYNONYM_GUARD: Show one person's linked passbook/card and protected funds; keep this personal record distinct from the bank building and bank statement paper.
  MODE: STATIC
