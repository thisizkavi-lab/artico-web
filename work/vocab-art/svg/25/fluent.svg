<!-- SELF_PROMPT:
  CHAPTER: 25 — Speaking a foreign language
  WORD: fluent (Adjective)
  CONTEXTUAL_DEFINITION: Able to speak smoothly and easily without frequent pauses.
  PEDAGOGICAL_ARCHETYPE: 2 — People in environment
  SYNONYM_GUARD: Show one confident speaker producing a long, smooth, unbroken speech flow and an engaged listener; distinguish smooth delivery from accurate pronunciation.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Relaxed language conversation space.
    - Context_Layer: One listener faces a confident speaker.
    - Focal_Layer: Speaker gestures naturally while a continuous flowing speech ribbon reaches the listener.
    - Details_Layer: Listener follows along without hesitation or confusion.
    - Lighting_Layer: Smooth visual flow across the exchange.
-->
