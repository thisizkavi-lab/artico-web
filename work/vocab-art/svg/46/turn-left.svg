<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="46:turn left" data-archetype="spatial-direction">
  <!-- Landscaped City Block Park Lawn Backdrop -->
  <rect width="304" height="192" fill="#DCEAD6"/>

  <!-- Sidewalk Aprons Framing a Clean 3-Way / 4-Way Street Intersection -->
  <path d="M 0 54 L 122 54 L 122 0 L 222 0 L 222 54 L 304 54 L 304 138 L 222 138 L 222 192 L 122 192 L 122 138 L 0 138 Z"
        fill="#EFECE4" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Asphalt Road Surface -->
  <path d="M 0 64 L 132 64 L 132 0 L 212 0 L 212 64 L 304 64 L 304 128 L 212 128 L 212 192 L 132 192 L 132 128 L 0 128 Z"
