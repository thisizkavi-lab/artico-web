<!-- SELF_PROMPT:
  CHAPTER: 59 - Abilities and actions
  WORD: understand (verb)
  CONTEXTUAL_DEFINITION: Grasp an idea or meaning that someone communicates.
  PEDAGOGICAL_ARCHETYPE: A listener recognizes the message they have just heard
  SYNONYM_GUARD: Repeat the same simple visual idea in the speaker and listener bubbles so the meaning visibly clicks; do not show general attention without comprehension.
  MODE: STATIC
  COORDINATE_BLUEPRINT: One person shares a simple shape idea; the listener's bubble repeats the same shapes and a small glow signals understanding.
-->
