<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: be delayed
  CONTEXTUAL_DEFINITION: A traveler must wait because the plane has not departed on time.
  PEDAGOGICAL_ART_DIRECTOR: Show the passenger waiting in the terminal with bags while a plane remains parked outside.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: Focus on the passenger's experience of waiting, not merely on the aircraft's delayed status.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A seated traveler waits beside a rolling case and a quiet analog clock; through the large terminal glass a plane is still at its gate.
-->
