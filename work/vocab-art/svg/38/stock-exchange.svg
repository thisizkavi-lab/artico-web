<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: stock exchange (noun)
  CONTEXTUAL_DEFINITION: An organized market where investors buy and sell shares of companies.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero place / exchange scene
  SYNONYM_GUARD: Show company-share certificates and traders in a financial marketplace; not currency exchange or a grocery market.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Traders at desks beneath a large chart board with rising and falling line, exchange blank company certificates bearing building silhouettes, coin stack and network lines.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:stock exchange" data-archetype="financial-market">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="stock-board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E5E9F0"/><stop offset="1" stop-color="#CBD5E1"/></linearGradient>
    <radialGradient id="stock-seal"><stop stop-color="#A8D4A2"/><stop offset="1" stop-color="#568552"/></radialGradient>
    <path id="stock-certificate" d="M40 99 H106 V143 H40 Z"/>
    <clipPath id="stock-cert-clip"><use href="#stock-certificate"/></clipPath>
    <filter id="stock-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
