<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:frustrated" data-archetype="expressive-bust">
  <defs>
    <path id="frustrated-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="frustrated-head-clip">
      <use href="#frustrated-head"/>
    </clipPath>
    <clipPath id="frustrated-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEE2E2"/>

  <!-- Hands Pulling at Hair in Extreme Frustration -->
  <path d="M 94 136 L 72 82 L 86 78 L 108 126 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left Gripping Hand Clutched in Hair -->
  <circle cx="88" cy="74" r="10" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2"/>

  <path d="M 210 136 L 232 82 L 218 78 L 196 126 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right Gripping Hand Clutched in Hair -->
  <circle cx="216" cy="74" r="10" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Torso (Ren) -->
  <g clip-path="url(#frustrated-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#5479AC"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Flushed Grimace Shading -->
  <g clip-path="url(#frustrated-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="94" rx="10" ry="6" fill="#EF4444" opacity="0.4"/>
    <ellipse cx="176" cy="94" rx="10" ry="6" fill="#EF4444" opacity="0.4"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#frustrated-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Messy Pulled Hair (Ren) -->
  <path d="M 96 66 L 82 46 L 102 48 L 110 26 L 134 38 L 152 18 L 170 38 L 194 26 L 202 48 L 222 46 L 208 66 C 194 50, 176 40, 152 40 C 128 40, 110 50, 96 66 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Squeezed Shut Frustrated Grimace (> <) -->
  <path d="M 124 76 L 134 80 L 124 84" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 180 76 L 170 80 L 180 84" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tightly Gritted Teeth / Angled Grimace -->
  <path d="M 132 98 L 172 98 C 172 108, 132 108, 132 98 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="132" y1="103" x2="172" y2="103" stroke="#1E2A3B" stroke-width="1.6"/>
  <line x1="142" y1="98" x2="142" y2="108" stroke="#1E2A3B" stroke-width="1.4"/>
  <line x1="152" y1="98" x2="152" y2="108" stroke="#1E2A3B" stroke-width="1.4"/>
  <line x1="162" y1="98" x2="162" y2="108" stroke="#1E2A3B" stroke-width="1.4"/>

  <!-- Tangled Hopeless Cable/Wire in Foreground (Cause of Frustration) -->
  <path d="M 118 162 Q 134 140 148 168 Q 162 144 186 164 Q 172 176 152 154 Q 138 174 118 162"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
</svg>
