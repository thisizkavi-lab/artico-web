<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: unkind (Adjective)
  CONTEXTUAL_DEFINITION: Not kind; withholding ordinary warmth or help in a way that hurts someone.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: A person notices a peer's clear request for help but deliberately turns away, unlike insensitive which is failure to notice.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Shared room with a heavy box near the floor.
    - Context_Layer: Peer asks for help lifting the box.
    - Focal_Layer: Unkind person looks directly at them, then turns their back.
    - Details_Layer: Pleading hand, averted shoulder and visible box.
    - Lighting_Layer: Cool gentle accent around the ignored request.
-->
