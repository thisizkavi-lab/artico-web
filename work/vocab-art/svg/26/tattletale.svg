<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: tattletale (Noun, common US term)
  CONTEXTUAL_DEFINITION: A child who secretly reports a classmate's misbehavior to a teacher.
  PEDAGOGICAL_ARCHETYPE: 3 — Person-to-person reporting
  SYNONYM_GUARD: Show a child pointing out a small classroom rule-breaking to the teacher, distinct from ordinary gossip or spreading a rumor.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Bright elementary classroom with low desk and art supplies.
    - Context_Layer: One classmate quietly uses another's crayons without permission.
    - Focal_Layer: A child raises a hand and points the teacher toward the small misbehavior.
    - Details_Layer: The teacher turns to look while the reported classmate looks back.
    - Lighting_Layer: Keep the scene mild and school-like, without depicting serious wrongdoing.
-->
