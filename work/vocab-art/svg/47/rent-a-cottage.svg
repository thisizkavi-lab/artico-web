<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: rent a cottage
  CONTEXTUAL_DEFINITION: To pay for temporary use of a small holiday cottage.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler receiving the cottage key for a short stay, with luggage ready beside the doorway.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: Make a temporary rental handover visible, not just a cabin or permanent home.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A small stone cottage sits behind a host's extended hand offering a key to a visitor's open palm; a travel bag waits by the path.
-->
