<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: hitchhike
  CONTEXTUAL_DEFINITION: To ask passing drivers for a free lift by standing safely beside a road and signaling with a raised thumb.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler with thumb raised at a safe roadside pull-off as a car approaches on the road.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action + route cue
  SYNONYM_GUARD: Use an outstretched thumb and passing road vehicle; no rideshare phone or taxi markings.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Safe verge along x=29..153, road across x=151..295 y=127..166; traveler at x=77..128 with raised thumb; unmarked car approaches from x=184..274, y=91..139.
-->
