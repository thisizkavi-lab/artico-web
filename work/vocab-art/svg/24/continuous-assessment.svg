<!-- SELF_PROMPT:
  CHAPTER: 24 — Studying
  WORD: continuous assessment (Noun)
  CONTEXTUAL_DEFINITION: A learner's progress is evaluated through several tasks over time rather than one final exam.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Arrange several different completed coursework pieces across a timeline, not one large examination paper.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Classroom worktable and wall planner.
    - Context_Layer: Several spaced calendar markers imply assessment across a course.
    - Focal_Layer: A set of graded project, quiz, and written work pages.
    - Details_Layer: Check marks and progress dots without numerals or letters.
    - Lighting_Layer: Even light across the sequence of work samples.
-->
