<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: follow-up
  CONTEXTUAL_DEFINITION: A later check, message, or action that continues a discussion after the initial meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show the first meeting as already finished and one colleague making a later contact to continue an agreed point.
  PEDAGOGICAL_ARCHETYPE: 7 - Subsequent contact
  SYNONYM_GUARD: Emphasize a later stage connected to the meeting, not physical pursuit or a task list by itself.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a small finished meeting note and two empty chairs on the left at x=35..120, y=89..139. On the right, a coworker at a desk uses a phone beside a calendar with two pages, one gold page turned forward; a curved dotted line connects the earlier note to the later call.
-->
