<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: groundsheet (Noun)
  CONTEXTUAL_DEFINITION: A waterproof sheet spread on the ground beneath a tent to protect its floor from damp soil.
  PEDAGOGICAL_ART_DIRECTOR: Reveal the waterproof sheet extending beneath the tent footprint, with rain and wet ground nearby.
  PEDAGOGICAL_ARCHETYPE: 2 - Part-of-whole protective layer
  SYNONYM_GUARD: Keep the sheet flat under the tent floor rather than suspended as an awning or used as a sleeping blanket.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Low tent side view, front flap lifted enough to reveal a blue waterproof groundsheet with broad margins over damp earth.
-->
