<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:kennel" data-archetype="hero-object">
  <defs>
    <!-- Wire Dog Crate / Kennel: metal wire mesh enclosure, front latching door, top carrying handle, bottom tray -->
    <clipPath id="kennel-interior-clip">
      <polygon points="68,64 212,64 236,88 236,154 92,154 68,130" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Kennel Interior (Through Wire Mesh) -->
  <g clip-path="url(#kennel-interior-clip)">
    <!-- Pale slate interior backdrop -->
    <rect x="60" y="55" width="185" height="105" fill="#F1F5F9" />

    <!-- Interior Plush Blue Dog Mat / Bed Pad -->
    <polygon points="80,146 220,146 206,128 72,128" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.6" />
    <polygon points="84,142 216,142 204,130 76,130" fill="#60A5FA" />

    <!-- Rear Wire Grid Lines -->
    <g stroke="#94A3B8" stroke-width="1.4" opacity="0.6">
      <line x1="86" y1="64" x2="86" y2="136" />
      <line x1="106" y1="64" x2="106" y2="136" />
      <line x1="126" y1="64" x2="126" y2="136" />
      <line x1="146" y1="64" x2="146" y2="136" />
      <line x1="166" y1="64" x2="166" y2="136" />
      <line x1="186" y1="64" x2="186" y2="136" />
      <line x1="206" y1="64" x2="206" y2="136" />
      <!-- Horizontal rear wires -->
      <line x1="68" y1="84" x2="212" y2="84" />
      <line x1="68" y1="104" x2="212" y2="104" />
      <line x1="68" y1="124" x2="212" y2="124" />
    </g>
  </g>

  <!-- Top Carrying Handle -->
  <path d="M 136 54 C 136 44 168 44 168 54" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
  <path d="M 136 54 C 136 44 168 44 168 54" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Sturdy Heavy-Gauge Outer Wire Frame (3D Perspective Box) -->
  <!-- Top roof wire grid -->
  <polygon points="68,64 212,64 236,88 92,88" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <line x1="104" y1="64" x2="128" y2="88" stroke="#334155" stroke-width="2" />
  <line x1="140" y1="64" x2="164" y2="88" stroke="#334155" stroke-width="2" />
  <line x1="176" y1="64" x2="200" y2="88" stroke="#334155" stroke-width="2" />

  <!-- Right side wall wire grid -->
  <polygon points="212,64 236,88 236,154 212,130" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <line x1="224" y1="76" x2="224" y2="142" stroke="#334155" stroke-width="2" />
  <line x1="212" y1="86" x2="236" y2="110" stroke="#334155" stroke-width="2" />
  <line x1="212" y1="108" x2="236" y2="132" stroke="#334155" stroke-width="2" />

  <!-- Front Door Wire Face (Main Face) -->
  <rect x="68" y="88" width="144" height="66" fill="none" stroke="#1E2A3B" stroke-width="2.6" rx="2" />

  <!-- Front Face Vertical Heavy Wires -->
  <g stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round">
    <line x1="84" y1="88" x2="84" y2="154" />
    <line x1="100" y1="88" x2="100" y2="154" />
    <line x1="116" y1="88" x2="116" y2="154" />
    <line x1="132" y1="88" x2="132" y2="154" />
    <line x1="148" y1="88" x2="148" y2="154" />
    <line x1="164" y1="88" x2="164" y2="154" />
    <line x1="180" y1="88" x2="180" y2="154" />
    <line x1="196" y1="88" x2="196" y2="154" />
  </g>

  <!-- Front Face Horizontal Support Wires -->
  <line x1="68" y1="110" x2="212" y2="110" stroke="#1E2A3B" stroke-width="2.6" />
  <line x1="68" y1="132" x2="212" y2="132" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Heavy Duty Slide-Bolt Latches on Door -->
  <!-- Top latch -->
  <rect x="188" y="102" width="18" height="6" rx="2" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="192" y1="105" x2="204" y2="105" stroke="#78350F" stroke-width="2" />
  <!-- Bottom latch -->
  <rect x="188" y="136" width="18" height="6" rx="2" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="192" y1="139" x2="204" y2="139" stroke="#78350F" stroke-width="2" />

  <!-- Removable Plastic Bottom Pan / Floor Tray -->
  <path d="M 64 154 L 216 154 L 240 162 L 88 162 Z" fill="#0F172A" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="64" y="152" width="152" height="5" rx="1" fill="#334155" stroke="#1E2A3B" stroke-width="1.6" />
</svg>