<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: bank loan (noun)
  CONTEXTUAL_DEFINITION: A sum of money lent by a bank to a borrower, to be repaid over time.
  PEDAGOGICAL_ARCHETYPE: 3 - Financial role exchange
  SYNONYM_GUARD: Make the bank the lender and show money moving from its teller to a customer alongside a repayment contract; not peer-to-peer lending.
