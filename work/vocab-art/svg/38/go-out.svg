  <g id="layer-details"><ellipse cx="151" cy="120" rx="9" ry="5" fill="url(#goout-coin)" stroke="#1E2A3B" stroke-width="1.4"/><ellipse cx="171" cy="121" rx="8" ry="4.5" fill="#D97A43" stroke="#1E2A3B" stroke-width="1.4"/><ellipse cx="187" cy="118" rx="8" ry="4.5" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.4"/><path d="M143 78 H195" fill="none" stroke="#4A72B2" stroke-width="2.5" stroke-linecap="round"/><path d="M188 71 L198 78 L188 85 Z" fill="#4A72B2"/><path d="M212 117 H242" stroke="#CE3D4E" stroke-width="2" stroke-dasharray="3 3"/><circle cx="191" cy="60" r="5" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.2"/></g>
  <!-- 5. Outflow accent -->
  <g id="layer-lighting"><path d="M54 92 H86" stroke="#FFD0B0" stroke-width="2" stroke-linecap="round"/><path d="M152 94 L152 102 M148 98 H156" stroke="#F2C14E" stroke-width="2.2" stroke-linecap="round"/><path d="M261 55 L261 64 M257 59 H265" stroke="#4A72B2" stroke-width="2.1" stroke-linecap="round"/></g>
</svg>
