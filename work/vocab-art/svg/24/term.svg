  CHAPTER: 24 — Studying
  WORD: term (Noun, academic period)
  CONTEXTUAL_DEFINITION: A period of teaching in a school or university year.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Show one shorter teaching block within the academic year and the return of classroom activity; this is an academic term, not a technical word or a half-year semester.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: School wall with a bell and classroom window.
    - Context_Layer: Three uneven study periods on a planner with one current block highlighted.
    - Focal_Layer: Wall planner and ringing school bell establish a bounded teaching period.
    - Details_Layer: Smaller break gaps and classroom door.
    - Lighting_Layer: Warm light marks the current active term.
-->
