<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: taxi
  CONTEXTUAL_DEFINITION: A car for hire that carries passengers to their chosen destination for a fare.
  PEDAGOGICAL_ART_DIRECTOR: Use the instantly recognized hired-car silhouette, roof dome, and checker band; give it a curbside pickup cue.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with contextual cue
  SYNONYM_GUARD: Unlike rideshare, present a dedicated cab with roof light and checker detail; unlike a private car, show a fare meter and waiting passenger.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put the yellow cab from x=55..250 and y=76..151, wheels at (91,143) and (214,143); add roof lamp at (155,69), checker tiles across the door, and a small waiting traveler at x=259.
-->
