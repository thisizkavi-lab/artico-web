  <g id="layer-focal" filter="url(#income-shadow)"><circle cx="111" cy="83" r="18" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2"/><path d="M91 82 Q93 63 111 64 Q129 64 131 82 L123 78 L117 73 L109 79 L99 74 Z" fill="#3A2E2B" stroke="#1E2A3B" stroke-width="1.6"/><path d="M103 85 Q111 89 119 85" fill="none" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round"/><use href="#income-worker" fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5"/><g clip-path="url(#income-clip)"><path d="M76 134 Q109 119 145 135 V166 H74Z" fill="#3D5F91"/><path d="M104 116 L114 129 L126 116" fill="#F8FBFE" stroke="#1E2A3B" stroke-width="1.3"/></g><path d="M139 133 C151 125 157 124 170 130" fill="none" stroke="#7FB07A" stroke-width="2.6" stroke-linecap="round"/><path d="M165 125 L174 132 L164 135 Z" fill="#7FB07A"/></g>
