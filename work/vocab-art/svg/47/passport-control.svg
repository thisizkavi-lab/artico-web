<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: passport control
  CONTEXTUAL_DEFINITION: The airport border checkpoint where an officer verifies travelers' passports.
  PEDAGOGICAL_ART_DIRECTOR: Show a border officer checking a traveler's open passport at a controlled airport booth with lane barriers.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: Make this an international airport document checkpoint, not hotel check-in or general security screening.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A traveler presents an open passport across a glass-topped border counter to an officer seated behind it; queue barriers and terminal glazing establish the airport control area.
-->
