<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: arrest somebody (Verb phrase)
  CONTEXTUAL_DEFINITION: Take a specific person into police custody.
  PEDAGOGICAL_ARCHETYPE: 4 — Action phrase with agent physically guiding the target person
  SYNONYM_GUARD: Make the person being taken into custody the clear target, distinct from the general arrest event and from suspicion alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A civic sidewalk beside a parked police vehicle.
    - Context_Layer: The car door stands open to show where the person is being escorted.
    - Focal_Layer: A uniformed officer gently holds the person's upper arm and guides them toward the car.
    - Details_Layer: A visible hand-to-arm connection and the person's turn toward the officer clarify who is arrested.
    - Lighting_Layer: Calm daylight keeps the detention non-violent.
-->
