<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:cheerful" data-archetype="expressive-bust">
  <defs>
    <path id="cheerful-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="cheerful-head-clip">
      <use href="#cheerful-head"/>
    </clipPath>
    <clipPath id="cheerful-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Bright Sunny Yellow Backdrop -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEF3C7"/>

  <!-- Cheerful Waving Right Arm -->
  <path d="M 194 134 L 234 94 L 246 104 L 206 146 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Open Waving Hand with Friendly Splayed Fingers -->
  <circle cx="242" cy="94" r="10.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <g stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round">
    <line x1="240" y1="84" x2="242" y2="78"/>
    <line x1="246" y1="86" x2="250" y2="80"/>
    <line x1="251" y1="91" x2="256" y2="87"/>
  </g>
  <!-- Motion Wave Arcs -->
  <g fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <path d="M 258 78 Q 262 86 258 94"/>
    <path d="M 264 74 Q 270 86 264 98"/>
  </g>

  <!-- Torso (Ren) -->
  <g clip-path="url(#cheerful-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#5479AC"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Warm Cheerful Blush -->
  <g clip-path="url(#cheerful-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="96" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <ellipse cx="176" cy="96" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#cheerful-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Ren) -->
  <path d="M 106 66 C 102 36, 124 20, 152 20 C 180 20, 202 36, 198 66 C 192 48, 176 38, 152 38 C 128 38, 114 48, 106 66 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Big Sunny Winking Expression / Wide Smile -->
  <path d="M 124 70 Q 134 64 144 70" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 160 70 Q 170 64 180 70" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Left Open Eye -->
  <circle cx="134" cy="80" r="7.5" fill="#1E2A3B"/>
  <circle cx="132" cy="78" r="2.2" fill="#FFFFFF"/>
  <!-- Right Winking Eye (Playful Crescent) -->
  <path d="M 162 80 Q 170 74 178 80" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Broad Radiant Grin -->
  <path d="M 134 94 C 134 116, 170 116, 170 94 Z" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 142 112 C 146 106, 158 106, 162 112 Z" fill="#F58D82"/>
  <path d="M 136 95 Q 152 99 168 95" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Floating Sun Radiance Icon in Upper Corner -->
  <circle cx="82" cy="46" r="10" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2"/>
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <line x1="82" y1="30" x2="82" y2="34"/>
    <line x1="82" y1="58" x2="82" y2="62"/>
    <line x1="66" y1="46" x2="70" y2="46"/>
    <line x1="94" y1="46" x2="98" y2="46"/>
    <line x1="71" y1="35" x2="74" y2="38"/>
    <line x1="90" y1="54" x2="93" y2="57"/>
  </g>
</svg>
