<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:sniff" data-archetype="dynamic-action">
  <defs>
    <!-- Hound Dog Sniffing: nose pressed to ground following curling scent trail, aroma particles entering nostrils, antenna tail -->
    <clipPath id="sniff-dog-clip">
      <path d="M 124 136 C 118 104 148 88 184 88 C 218 88 238 110 234 142 C 228 156 200 160 168 158 C 136 156 126 146 124 136 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Mysterious Winding Scent Trail / Scent Puffs along the Ground -->
  <path d="M 28 162 C 40 162 48 156 56 158 C 66 160 72 152 82 150" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" />
  <!-- Aroma Swirls Curling Upward into Moist Dog Nose -->
  <path d="M 62 154 C 62 144 72 140 76 146 C 78 150 74 154 70 152" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <path d="M 74 148 C 76 138 88 136 90 142" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" />
  <!-- Aroma Scent Floating Droplets / Odor Molecules -->
  <circle cx="52" cy="150" r="2.5" fill="#F59E0B" />
  <circle cx="68" cy="142" r="3" fill="#10B981" />
  <circle cx="82" cy="136" r="2.5" fill="#3B82F6" />

  <!-- Sniff Inhalation Air Suction Arcs into Nostril -->
  <path d="M 80 140 Q 86 138 90 144" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 78 144 Q 84 144 88 148" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

  <!-- Long Slender Antenna Tail Pointed Straight Up (Hunting Scent Focus) -->
  <path d="M 230 118 C 242 100 248 76 244 54 C 240 50 234 56 236 74 C 236 94 226 112 216 122" stroke="#D97706" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 230 118 C 242 100 248 76 244 54 C 240 50 234 56 236 74 C 236 94 226 112 216 122" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <!-- White tip on tail antenna -->
  <path d="M 244 54 C 240 50 234 56 236 66 L 243 64 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Hound Dog Body (Low Slung, Tracking Posture) -->
  <!-- Hindlegs & Paws -->
  <ellipse cx="206" cy="140" rx="18" ry="16" fill="#B45309" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="208" cy="160" rx="10" ry="6" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2" />

  <g clip-path="url(#sniff-dog-clip)">
    <!-- Base Tricolor Hound / Beagle Coat -->
    <rect x="115" y="80" width="130" height="85" fill="#F59E0B" />
    <!-- Large black saddle patch on back -->
    <ellipse cx="178" cy="114" rx="34" ry="22" fill="#1E293B" />
    <!-- White underbelly -->
    <rect x="115" y="146" width="130" height="15" fill="#FFFBEB" />
  </g>
  <path d="M 124 136 C 118 104 148 88 184 88 C 218 88 238 110 234 142 C 228 156 200 160 168 158 C 136 156 126 146 124 136 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Front Legs (Low, creeping forward) -->
  <ellipse cx="138" cy="144" rx="10" ry="14" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.2" />
  <ellipse cx="134" cy="160" rx="9" ry="6" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2" />

  <!-- Hound Neck Lowered to Ground -->
  <path d="M 132 108 L 94 132 L 102 144 L 140 128 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Giant Long Drooping Floppy Ears Puddling Near Ground -->
  <path d="M 112 116 C 104 116 88 136 86 156 C 84 164 96 166 102 158 C 112 146 122 130 120 120 Z" fill="#B45309" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M 94 134 Q 92 152 98 158" stroke="#78350F" stroke-width="2" fill="none" />

  <!-- Head Lowered Completely to Track Scent -->
  <path d="M 116 122 C 108 114 96 120 86 130 C 78 138 78 146 88 150 C 100 152 114 144 122 134 Z" fill="#FEF3C7" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Focused Tracking Eye Looking Along the Ground -->
  <ellipse cx="104" cy="126" rx="3.5" ry="4" fill="#1E2A3B" />
  <circle cx="102.5" cy="124.5" r="1.1" fill="#FFFFFF" />

  <!-- Big Moist Black Sniffing Nose Touching the Scent Trail -->
  <ellipse cx="80" cy="144" rx="8" ry="7" fill="#1E2A3B" stroke="#0F172A" stroke-width="1.8" />
  <!-- Moist nose shine highlight -->
  <ellipse cx="78" cy="142" rx="3" ry="1.8" fill="#FFFFFF" opacity="0.6" />
  <!-- Nostril opening inhaling -->
  <ellipse cx="80" cy="146" rx="2.5" ry="3" fill="#1E2A3B" />
</svg>