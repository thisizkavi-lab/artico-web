  CHAPTER: 41 - Work and business idioms
  WORD: on the same page (idiom)
  CONTEXTUAL_DEFINITION: Two or more coworkers share the same understanding of a plan or decision.
  PEDAGOGICAL_ARCHETYPE: 6 - Shared focus on one common reference
  SYNONYM_GUARD: Both coworkers point to the same highlighted place on one shared blank page, not to separate documents or a book-reading lesson.
