  CHAPTER: 43 - Workplace skills and abilities
  WORD: organized
  CONTEXTUAL_DEFINITION: Able to keep work, materials, and plans arranged clearly.
  PEDAGOGICAL_ART_DIRECTOR: Show a person with an orderly workstation and a clear plan for the work ahead.
  PEDAGOGICAL_ARCHETYPE: 20 - Orderly personal system
  SYNONYM_GUARD: Apply the quality to the worker and their prepared workspace; organization is the process or system of arranging things.
