<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: ticket
  CONTEXTUAL_DEFINITION: A paper slip or pass that proves a traveler has paid or is allowed to board.
  PEDAGOGICAL_ART_DIRECTOR: Make the travel ticket the hero object and show it being validated at a transit gate.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action + travel tool
  SYNONYM_GUARD: The ticket is proof of travel access; do not depict the fare amount or a generic payment card reader as the main subject.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Large pale ticket spans x=77..218, y=62..134 with clipped corners, perforation, a small route symbol, and abstract bars; hand presents it toward a validator at x=220..257 y=94..139.
-->
