<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: change money (verb phrase; exchange one currency for another)
  CONTEXTUAL_DEFINITION: To exchange money in one currency for money in a different currency.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action plus tool
  SYNONYM_GUARD: Japanese gloss can mean going out; group and chapter lock this to currency exchange. Show visibly different note designs swapping at an exchange counter, not small change returned after purchase.
  MODE: STATIC exchange moment
  COORDINATE_BLUEPRINT: Traveler passes a cool-blue blank note over a counter and receives a green differently patterned note plus copper/gold coins; exchange tray divides both sides.
-->
