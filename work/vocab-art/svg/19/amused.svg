<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:amused" data-archetype="expressive-bust">
  <defs>
    <path id="amused-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="amused-head-clip">
      <use href="#amused-head"/>
    </clipPath>
    <clipPath id="amused-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Warm Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEF3C7"/>

  <!-- Torso (Ren) -->
  <g clip-path="url(#amused-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#5479AC"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Amused Giggle Shading -->
  <g clip-path="url(#amused-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <ellipse cx="176" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#amused-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hand Raised Covering Mouth Mid-Chuckle -->
  <g fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round">
    <ellipse cx="152" cy="104" rx="14" ry="10"/>
    <path d="M 142 96 C 146 92, 158 92, 162 96"/>
  </g>

  <!-- Hair (Ren) -->
  <path d="M 106 66 C 102 36, 124 20, 152 20 C 180 20, 202 36, 198 66 C 192 48, 176 38, 152 38 C 128 38, 114 48, 106 66 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Squeezed Laughing Eyes (> <) -->
  <path d="M 125 76 L 134 80 L 125 84" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 179 76 L 170 80 L 179 84" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chuckle / Snicker Motion Marks (Hehe!) -->
  <g fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <path d="M 188 96 Q 194 92 198 96"/>
    <path d="M 192 102 Q 198 98 202 102"/>
  </g>
</svg>
