<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: job ad
  CONTEXTUAL_DEFINITION: A public notice advertising a job opening.
  PEDAGOGICAL_ART_DIRECTOR: Show a printed vacancy advertisement on a community or career noticeboard with a clear work-role image.
  PEDAGOGICAL_ARCHETYPE: 5 - Printed vacancy notice
  SYNONYM_GUARD: Use a printed advertisement surface; distinguish it from the structured online job posting shown on a digital screen.
