<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: travel
  CONTEXTUAL_DEFINITION: Make a journey, especially a long-distance journey.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler in motion on a long-distance airplane journey, visibly watching the world pass below.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action + Tool
  SYNONYM_GUARD: Depict the act of journeying by air, rather than a passport, booking, or vacation departure.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Inside an airplane cabin, a seated traveler looks through a large oval window at a wing crossing above distant clouds, with a carry-on beside the seat.
-->
