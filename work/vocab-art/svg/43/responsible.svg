<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: responsible
  CONTEXTUAL_DEFINITION: Conscientious and willing to accept the consequences of one's actions.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker noticing an issue, owning it, and taking the first careful step to make it right.
  PEDAGOGICAL_ARCHETYPE: 27 - Accountable conduct
  SYNONYM_GUARD: Depict the general quality of accountability, not the exact assigned-duty phrase responsible for from Lesson 42.
  MODE: STATIC
