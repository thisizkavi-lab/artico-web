  <line x1="65" y1="126" x2="81" y2="129" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="70" cy="132" r="1.6" fill="#F59E0B"/>
  <circle cx="75" cy="133" r="1.6" fill="#F59E0B"/>

