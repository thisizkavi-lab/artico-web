<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: mobile banking (noun)
  CONTEXTUAL_DEFINITION: Accessing bank services through a banking app on a mobile phone.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with user context
  SYNONYM_GUARD: Make the smartphone the unmistakable interface; distinguish this from online banking on a laptop.
