  CHAPTER: 44 - Transportation and travel
  WORD: ride
  CONTEXTUAL_DEFINITION: To travel aboard a vehicle or animal as its rider or passenger.
  PEDAGOGICAL_ART_DIRECTOR: Show a helmeted passenger seated behind a motorcycle driver, holding on while they travel along a road.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action + vehicle
  SYNONYM_GUARD: Use the broad act of traveling aboard; unlike ride a bike or ride a horse, do not specify bicycle pedals or an animal.
  MODE: STATIC
