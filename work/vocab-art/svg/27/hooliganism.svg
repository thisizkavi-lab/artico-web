  CHAPTER: 27 — Crime and the law
  WORD: hooliganism (Noun)
  CONTEXTUAL_DEFINITION: Rowdy and destructive behavior in a public place.
  PEDAGOGICAL_ARCHETYPE: 4 — Group action with public disorder and property impact
  SYNONYM_GUARD: Show a noisy group damaging public property after an event, without injury or weapons; distinguish it from one person's quiet vandalism.
