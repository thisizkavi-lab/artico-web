    <radialGradient id="take-star"><stop stop-color="#FFF1B9" stop-opacity=".9"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <filter id="take-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".17"/></filter>
    <path id="take-case" d="M207 50 H230 Q234 50 234 54 V71 H203 V54 Q203 50 207 50 Z"/>
    <clipPath id="take-case-clip"><use href="#take-case"/></clipPath>
  </defs>
