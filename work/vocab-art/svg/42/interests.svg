<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: interests
  CONTEXTUAL_DEFINITION: Activities or subjects a job candidate enjoys or wants to pursue.
  PEDAGOGICAL_ART_DIRECTOR: Show a few personal interests as hobby cues in a candidate profile, away from salary or ownership imagery.
  PEDAGOGICAL_ARCHETYPE: 1 - Personal interests
  SYNONYM_GUARD: Use enjoyable activities such as reading, photography, or outdoor pursuits; do not show financial shares or professional skills as the main subject.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a candidate profile card at x=77..227, y=44..126, with a small portrait and three distinct hobby icons (open book, camera, leaf/footpath) in evenly spaced circles. The candidate at x=42..83 looks toward the card; keep icons outside work credentials.
-->
