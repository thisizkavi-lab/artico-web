    - Context_Layer: One person enthusiastically gestures about an enormous catch.
    - Focal_Layer: The listener looks doubtful and pinches a few salt crystals above a small plate.
    - Details_Layer: The fish appears implausibly large in the storyteller's hands.
    - Lighting_Layer: Clear warm indoor light.
-->
