<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: train
  CONTEXTUAL_DEFINITION: Teach a coworker the skills needed to do a job.
  PEDAGOGICAL_ART_DIRECTOR: Show an experienced worker demonstrating a task while a newer colleague watches and practices at the same workstation.
  PEDAGOGICAL_ARCHETYPE: 4 - Coaching / skill transfer
  SYNONYM_GUARD: In this workplace group, train is the verb meaning teach a person; do not show a railway train or athletic exercise. Distinguish from hands-on experience by making the coach's demonstration and learner's attention the focal action.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a workbench from x=40..264 at y=132. Place the trainer at x=76..126, standing on the left and pointing toward a simple machine part. Place the trainee at x=177..222, leaning forward and watching, hands ready to imitate. Add a small visual sequence of three icon-only steps above the bench, with no letters or numbers.
-->
