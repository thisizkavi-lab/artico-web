<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: check (payment) / cheque (UK spelling) (noun)
  CONTEXTUAL_DEFINITION: A signed paper instruction authorizing a bank to pay the named amount from an account.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with real transaction context
  SYNONYM_GUARD: Show a paper check being handed across a checkout, not a tick mark, inspection, or the verb “stop.”
  MODE: STATIC
