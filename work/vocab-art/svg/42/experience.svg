<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: experience
  CONTEXTUAL_DEFINITION: Knowledge and practical ability gained from doing work or activities over time.
  PEDAGOGICAL_ART_DIRECTOR: Show a candidate with a visible history of completed work stages, distinct from a formal degree or deep theoretical knowledge.
  PEDAGOGICAL_ARCHETYPE: 4 - Practical work history
  SYNONYM_GUARD: Use evidence of repeated real work over time rather than a school diploma or one specialized reference book.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a horizontal work-history timeline from x=59..245, y=81, with three milestones: tool use, project completion, and team contribution. A candidate at x=127..177 stands in front holding a finished work sample, with the three past stages arranged behind as completed snapshots.
-->
