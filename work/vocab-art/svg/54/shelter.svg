<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:shelter" data-archetype="scene">
  <defs>
    <!-- Animal Shelter: welcoming cottage building, heart & paw emblem on gable, adoption paddock fence, warm light -->
    <clipPath id="shelter-window-clip">
      <rect x="74" y="92" width="28" height="34" rx="4" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="122" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="166" rx="72" ry="8" fill="#DDD4C3" />

  <!-- Green Lawn Mound -->
  <path d="M 38 164 Q 152 148 266 164 Q 152 178 38 164 Z" fill="#86EFAC" stroke="#22C55E" stroke-width="1.8" />

  <!-- Main Shelter Building Facade (Warm Cream & White Trim) -->
  <polygon points="62,78 152,28 242,78 242,158 62,158" fill="#FFFBEB" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

