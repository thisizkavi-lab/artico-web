<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: deadline (noun)
  CONTEXTUAL_DEFINITION: The final date or time by which a piece of work must be completed.
  PEDAGOGICAL_ART_DIRECTOR: Pair a numberless calendar's single marked day with nearly finished time in an hourglass and the last work folder.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with work-time cue
  SYNONYM_GUARD: Show the final cutoff for a work task, not a generic appointment or a person merely being late.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a large blank calendar sheet at x=52..139,y=44..119 with one gold day square in its grid. A glass hourglass at x=172..218,y=48..127 holds only a small amount of sand above the neck; a finished folder waits on the desk at y=133.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:deadline" data-archetype="deadline-time-cue">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="deadline-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#A9C6E8" stop-opacity=".7"/></linearGradient>
    <linearGradient id="deadline-sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></linearGradient>
    <radialGradient id="deadline-focus"><stop stop-color="#FFF1B9" stop-opacity=".8"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <filter id="deadline-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="155" width="304" height="37" fill="#EEE7DA"/><path d="M0 155 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="151" cy="165" rx="104" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Desk calendar with one final work day marked -->
  <g id="layer-context"><path d="M31 145 H274" stroke="#C88446" stroke-width="2"/><path d="M38 135 H266 V148 H38 Z" fill="#D79B61" stroke="#1E2A3B" stroke-width="1.8"/><path d="M52 148 V155 M253 148 V155" stroke="#965D28" stroke-width="2.7"/><rect x="49" y="43" width="91" height="80" rx="4" fill="#EEF4FA" stroke="#64748B" stroke-width="1.7"/><rect x="49" y="43" width="91" height="17" rx="4" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.4"/><path d="M68 40 V49 M120 40 V49" stroke="#64748B" stroke-width="3" stroke-linecap="round"/><path d="M58 72 H131 M58 88 H131 M58 104 H131 M76 63 V116 M96 63 V116 M116 63 V116" stroke="#CBD5E1" stroke-width="1.1"/><rect x="98" y="90" width="16" height="14" rx="2" fill="#F2C14E" stroke="#D97706" stroke-width="1.3"/><circle cx="210" cy="61" r="22" fill="#F8FBFE" stroke="#64748B" stroke-width="1.7"/><path d="M210 47 V62 L220 68" fill="none" stroke="#5479AC" stroke-width="2.2" stroke-linecap="round"/></g>
  <!-- 3. Nearly spent hourglass and final work folder -->
  <g id="layer-focal" filter="url(#deadline-shadow)"><path d="M165 43 H222 V50 Q220 67 204 80 Q198 85 204 91 Q220 104 222 121 V129 H165 V121 Q168 104 184 91 Q190 85 184 80 Q168 67 165 50 Z" fill="url(#deadline-glass)" stroke="#1E2A3B" stroke-width="2.3"/><path d="M171 50 Q174 66 188 77 L194 82 L200 77 Q214 66 216 50 Z" fill="#DCECFB" fill-opacity=".7"/><path d="M170 120 Q175 105 188 95 L194 91 L200 95 Q213 105 218 120 Z" fill="url(#deadline-sand)"/><path d="M189 84 H197 M189 88 H197" stroke="#D49B2A" stroke-width="2.2" stroke-linecap="round"/><path d="M162 43 H225 V49 H162 Z M162 126 H225 V132 H162 Z" fill="#5479AC" stroke="#1E2A3B" stroke-width="1.8"/><rect x="72" y="119" width="48" height="24" rx="3" fill="#DCECFB" stroke="#1E2A3B" stroke-width="1.7"/><path d="M78 125 H113 M78 131 H108" stroke="#94A3B8" stroke-width="1.2"/><path d="M85 119 V115 Q85 112 89 112 H101 Q105 112 105 119" fill="none" stroke="#64748B" stroke-width="1.4"/></g>
  <!-- 4. Final task rests immediately beside the time limit -->
  <g id="layer-details"><path d="M132 128 H158" stroke="#CE3D4E" stroke-width="2" stroke-dasharray="3 3"/><path d="M153 124 L160 128 L153 132 Z" fill="#CE3D4E"/><circle cx="183" cy="74" r="2.3" fill="#F2C14E"/><circle cx="202" cy="73" r="2.3" fill="#F2C14E"/><path d="M171 57 H183 M171 63 H179" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/><path d="M236 104 L242 98 M239 114 H247" stroke="#F2C14E" stroke-width="2" stroke-linecap="round"/><path d="M66 128 H70 M122 127 H126" stroke="#64748B" stroke-width="1.2"/></g>
  <!-- 5. Halo ties the marked final day to the dwindling sand -->
  <g id="layer-lighting"><ellipse cx="191" cy="91" rx="58" ry="61" fill="url(#deadline-focus)"/><ellipse cx="106" cy="96" rx="16" ry="15" fill="none" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3 3"/><path d="M172 46 H190" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><path d="M152 79 L158 73 M152 91 L160 91" stroke="#F2C14E" stroke-width="1.8" stroke-linecap="round"/></g>
</svg>
