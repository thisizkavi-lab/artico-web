  CHAPTER: 27 — Crime and the law
  WORD: speeding (Noun)
  CONTEXTUAL_DEFINITION: Driving a vehicle faster than the permitted or safe speed.
  PEDAGOGICAL_ARCHETYPE: 4 — Peak-moment action with motion and roadside enforcement
  SYNONYM_GUARD: Show a car moving unusually fast past an officer's roadside check, without a crash or numeric speed display.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A straight neighborhood road with a sidewalk and street trees.
    - Context_Layer: A roadside speed-check device has a plain dial with no numerals.
    - Focal_Layer: A compact car passes with strong blue motion trails while an officer aims the check device.
    - Details_Layer: The needle sits in the upper zone and the car's compressed motion lines imply excessive speed.
    - Lighting_Layer: Bright daylight keeps the road and vehicle legible.
-->
