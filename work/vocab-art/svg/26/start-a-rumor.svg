<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: start a rumor (Verb phrase)
  CONTEXTUAL_DEFINITION: Be the first to introduce an unverified story into conversation.
  PEDAGOGICAL_ARCHETYPE: 3 — Person-originated message
  SYNONYM_GUARD: Make one source whisper the first vague claim to one listener, distinct from passing an already circulating story along.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Neighborhood room with one quiet table and empty chairs nearby.
    - Context_Layer: One person faces a single listener; no message chain exists yet.
    - Focal_Layer: The first speaker leans close as a faint, uncertain story bubble begins to form.
    - Details_Layer: Only one dotted path leaves the originator.
    - Lighting_Layer: Focus on the source of the new unverified message.
-->
