  CHAPTER: 51 - Weather and climate
  WORD: snowdrift (Noun)
  CONTEXTUAL_DEFINITION: A deep mound of windblown snow piled against a fence or wall.
  PEDAGOGICAL_ART_DIRECTOR: Make one high wind-sculpted mound bank up against a low wooden fence, with the lower rails partly buried.
