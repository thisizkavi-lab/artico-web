  CHAPTER: 44 - Transportation and travel
  WORD: get on a bus
  CONTEXTUAL_DEFINITION: To board a bus by stepping up from the pavement into its passenger area.
  PEDAGOGICAL_ART_DIRECTOR: Show a waiting passenger moving up the bus steps and grasping a handrail as they enter.
