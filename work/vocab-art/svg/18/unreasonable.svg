  CHAPTER: 18 — Personality traits
  WORD: unreasonable (Adjective)
  CONTEXTUAL_DEFINITION: Lacking sensible judgment and making an excessive, impractical demand.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: One person demands almost the entire shared task pile while two peers hold modest portions, contrasting the balanced reasonable decision.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Shared planning table with three people.
    - Context_Layer: Two peers each hold a small stack of task cards.
    - Focal_Layer: Demanding person gestures at an oversized stack for someone else.
    - Details_Layer: Uneven pile, raised brow, peers' surprised gestures.
    - Lighting_Layer: Muted contrast emphasizes the disproportion.
-->
