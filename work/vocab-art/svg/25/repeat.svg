  CHAPTER: 25 — Speaking a foreign language
  WORD: repeat (Verb)
  CONTEXTUAL_DEFINITION: Say the same sound or phrase again.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action
  SYNONYM_GUARD: Show a learner deliberately echoing a model phrase a second time, distinct from merely hearing or understanding it.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Language classroom with two people facing one another.
    - Context_Layer: A partner gives a short spoken model.
    - Focal_Layer: Learner repeats the same phrase back toward the partner.
    - Details_Layer: Matching wave patterns and a curved return arrow show the repeated phrase.
    - Lighting_Layer: Emphasize the learner's second utterance.
-->
