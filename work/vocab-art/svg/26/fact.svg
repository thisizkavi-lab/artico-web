  CHAPTER: 26 — Communication and beliefs
  WORD: fact (Noun)
  CONTEXTUAL_DEFINITION: Something that is objectively true and can be verified.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept through observable reality
  SYNONYM_GUARD: Ground the conclusion in a visible, checkable event, distinct from the clues that support it or a person's view about it.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
