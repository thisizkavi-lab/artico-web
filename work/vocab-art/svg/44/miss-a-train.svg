<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: miss a train
  CONTEXTUAL_DEFINITION: To arrive too late to board a train before it has departed.
  PEDAGOGICAL_ART_DIRECTOR: Show the train already pulling away while a traveler is left behind on the platform, arm reaching after it.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action + departure cue
  SYNONYM_GUARD: The traveler is not boarding; the moving train has left the platform, opposite of catch a train.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Platform foreground y=123..148; departing train recedes toward x=256..297, y=67..119 with motion strokes behind; late traveler with bag stands at x=77..128, hand extended toward train.
-->
