<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: unshakable belief (Noun phrase)
  CONTEXTUAL_DEFINITION: A conviction so firm that pressure cannot change it.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept through contrast
  SYNONYM_GUARD: Show one person remaining steady while surrounding pressure moves, distinct from a mere belief or a set of connected ideas.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Open garden edge with wind moving loose leaves.
    - Context_Layer: Nearby grass and a flexible sapling bend in the breeze.
    - Focal_Layer: A grounded person stands firm and holds a glowing idea emblem at chest height.
    - Details_Layer: Wind arcs pass around the stable figure while the emblem remains level.
    - Lighting_Layer: Warm halo centers on the unwavering idea.
-->
