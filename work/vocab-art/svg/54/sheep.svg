  <ellipse cx="82" cy="98" rx="8" ry="6" fill="#1E293B" />
  <circle cx="79" cy="97" r="1.5" fill="#475569" />
  <path d="M 80 102 Q 83 105 86 102" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round" />

  <!-- Fresh Green Grass Blade in mouth -->
  <path d="M 80 102 Q 68 108 58 100" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>