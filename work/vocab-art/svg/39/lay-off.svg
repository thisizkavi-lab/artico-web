<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: lay off (phrasal verb; workforce reduction)
  CONTEXTUAL_DEFINITION: Stop employing workers because there is not enough work or the organization is reducing staff.
  PEDAGOGICAL_ART_DIRECTOR: Show an employer action affecting several employees alongside idle workstations, separating a staffing reduction from an individual firing.
  PEDAGOGICAL_ARCHETYPE: 3 - Group workplace transition
  SYNONYM_GUARD: Focus on an economic/workload reason and multiple people, not individual misconduct or a flame.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A manager stands at x=223,y=93 facing three workers clustered x=89..189. Their factory/office row behind has inactive empty workstations, and a small downward workload curve sits overhead. Several personal boxes establish the group consequence.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:lay off" data-archetype="workforce-reduction">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
