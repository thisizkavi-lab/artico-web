<!-- SELF_PROMPT:
  CHAPTER: 14 — The body
  WORD: eyebrow (Noun)
  CONTEXTUAL_DEFINITION: The curved band of hair above an eye.
  PEDAGOGICAL_ARCHETYPE: 2 — Small part callout
  SYNONYM_GUARD: Highlight only the hair arc above the eye; eyelashes grow along the eyelid edge.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Close crop of one eye and brow area.
    - Context_Layer: Eye, nose bridge, and surrounding skin are muted.
