<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: punctual
  CONTEXTUAL_DEFINITION: Arriving or finishing at the agreed time.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker arriving just as a workplace meeting begins.
  PEDAGOGICAL_ARCHETYPE: 25 - Timely arrival
  SYNONYM_GUARD: Show on-time arrival through a clock and a meeting start cue; avoid readable numerals or deadlines.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a clean analog wall clock with only hands and simple tick marks above a meeting-room doorway. Show one worker arriving through the open door as two colleagues are seated and ready at the table.
-->
