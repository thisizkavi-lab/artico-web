<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: ball is in your court (idiom)
  CONTEXTUAL_DEFINITION: It is now your responsibility to make the next decision or take the next action.
  PEDAGOGICAL_ARCHETYPE: 6 - Turn-taking trajectory between coworkers
  SYNONYM_GUARD: The ball has crossed from one colleague's side to the recipient beside a waiting work folder, making the next move a business responsibility rather than a sports lesson.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Divide a pale rectangular tabletop into two halves with a central seam. Place a blue ball and closed folder on the right beside the waiting coworker; the left coworker has just sent the ball across with a curved blue trajectory.
-->
