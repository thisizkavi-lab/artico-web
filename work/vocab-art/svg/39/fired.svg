<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: fired (past participle; employment dismissal)
  CONTEXTUAL_DEFINITION: Having been removed from a job by an employer.
  PEDAGOGICAL_ART_DIRECTOR: Put the dismissed worker in the foreground carrying personal desk belongings toward the exit; the viewpoint is the employee affected.
  PEDAGOGICAL_ARCHETYPE: 3 - Professional role transition
  SYNONYM_GUARD: Show involuntary job loss, not resigning or being laid off in a company-wide reduction; keep the manager's dismissal decision implied in the empty work station.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a worker carrying a small box at x=117..190,y=84..149 walking toward a door at x=239. Behind, leave their desk and chair empty; show the access badge tucked among personal items in the box.
-->
