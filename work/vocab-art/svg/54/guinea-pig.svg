<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:guinea pig" data-archetype="hero-object">
  <defs>
    <!-- Guinea Pig: oblong potato-shaped tailless cavy with calico patches, petal ears, munching lettuce -->
    <clipPath id="guinea-body-clip">
      <path d="M 86 130 C 84 94 116 78 168 78 C 218 78 244 98 242 136 C 240 162 208 164 164 164 C 114 164 88 154 86 130 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="162" cy="168" rx="100" ry="14" fill="#EAE3D5" />
  <ellipse cx="160" cy="166" rx="56" ry="8" fill="#DDD4C3" />

  <!-- Oblong Cavy Body (Tailless) -->
  <g clip-path="url(#guinea-body-clip)">
    <!-- Base White Patch -->
    <rect x="75" y="70" width="180" height="100" fill="#FFFBEB" />
    <!-- Ginger Orange Front Patch -->
    <path d="M 80 70 L 144 70 L 126 170 L 80 170 Z" fill="#D97706" />
    <!-- Dark Chocolate Brown Rump Patch -->
    <path d="M 188 70 L 250 70 L 250 170 L 174 170 Z" fill="#451A03" />
    <!-- White middle blaze / saddle band -->
    <path d="M 134 70 L 180 70 L 168 170 L 120 170 Z" fill="#FFFFFF" />
    <!-- Lower shadow line -->
    <rect x="75" y="154" width="180" height="16" fill="#1E293B" opacity="0.15" />
  </g>
  <!-- Body Outline -->
  <path d="M 86 130 C 84 94 116 78 168 78 C 218 78 244 98 242 136 C 240 162 208 164 164 164 C 114 164 88 154 86 130 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Tiny Feet Peeking Out Below Robust Body -->
  <ellipse cx="118" cy="164" rx="8" ry="4.5" fill="#FDE68A" stroke="#1E2A3B" stroke-width="2" />
  <ellipse cx="196" cy="164" rx="10" ry="5" fill="#FDE68A" stroke="#1E2A3B" stroke-width="2" />

  <!-- Droopy Petal Ears -->
  <path d="M 132 82 C 128 72 138 66 146 72 C 146 80 140 86 132 82 Z" fill="#B45309" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <path d="M 134 80 C 132 74 138 70 142 74" fill="#FDA4AF" />

  <!-- Plump Face & Cheek -->
  <ellipse cx="106" cy="116" rx="20" ry="24" fill="#D97706" stroke="#1E2A3B" stroke-width="2.2" />
  <!-- White Nose Blaze -->
  <path d="M 94 98 Q 102 114 96 128 L 86 126 Q 90 108 94 98 Z" fill="#FFFFFF" />

  <!-- Dark Shiny Eye -->
  <circle cx="116" cy="106" r="4.5" fill="#1E2A3B" />
  <circle cx="114.5" cy="104.5" r="1.6" fill="#FFFFFF" />

  <!-- Pink Cavy Nose -->
  <polygon points="84,124 90,123 88,128" fill="#F43F5E" stroke="#1E2A3B" stroke-width="1.2" />
  <path d="M 88 128 Q 91 133 95 130" fill="none" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Crisp Green Lettuce Leaf being nibbled -->
  <path d="M 70 134 C 62 120 74 114 84 122 C 78 132 90 134 84 140 C 72 144 64 140 70 134 Z" fill="#22C55E" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <path d="M 72 132 Q 78 128 82 126 M 74 136 Q 80 134 82 132" stroke="#15803D" stroke-width="1.4" fill="none" stroke-linecap="round" />

  <!-- Whiskers -->
  <line x1="88" y1="124" x2="68" y2="116" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />
  <line x1="88" y1="127" x2="66" y2="128" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />
  <line x1="88" y1="130" x2="70" y2="138" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />
</svg>