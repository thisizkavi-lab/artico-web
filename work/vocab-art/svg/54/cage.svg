<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:cage" data-archetype="hero-object">
  <defs>
    <!-- Domed wire bird cage with hanging top loop, interior wooden perch, swing, seed cup, bottom tray -->
    <clipPath id="cage-interior-clip">
      <path d="M 88 152 L 88 88 C 88 52 116 38 152 38 C 188 38 216 52 216 88 L 216 152 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="88" ry="12" fill="#EAE3D5" />
  <ellipse cx="152" cy="166" rx="46" ry="7" fill="#DDD4C3" />

  <!-- Top Suspension Ring / Hook -->
  <circle cx="152" cy="24" r="10" fill="none" stroke="#D97706" stroke-width="3" />
  <circle cx="152" cy="24" r="10" fill="none" stroke="#1E2A3B" stroke-width="1.8" />
  <rect x="149" y="32" width="6" height="8" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Cage Interior Elements (Behind front bars) -->
  <g clip-path="url(#cage-interior-clip)">
    <!-- Pale airy interior tint -->
    <rect x="80" y="30" width="144" height="130" fill="#F8FAFC" />

    <!-- Hanging Swing Trapeze from dome ceiling -->
    <line x1="142" y1="44" x2="142" y2="76" stroke="#D97706" stroke-width="1.8" />
    <line x1="162" y1="44" x2="162" y2="76" stroke="#D97706" stroke-width="1.8" />
    <rect x="136" y="76" width="32" height="4" rx="2" fill="#B45309" stroke="#1E2A3B" stroke-width="1.4" />

    <!-- Wooden Horizontal Perch Bar across center -->
    <rect x="94" y="112" width="116" height="6" rx="3" fill="#D97706" stroke="#1E2A3B" stroke-width="1.6" />
    <line x1="98" y1="114" x2="206" y2="114" stroke="#FDE68A" stroke-width="1.2" />

    <!-- Little Water Font / Seed Trough on inside wall -->
    <rect x="188" y="106" width="18" height="14" rx="3" fill="#38BDF8" stroke="#1E2A3B" stroke-width="1.4" />
    <rect x="190" y="112" width="14" height="6" rx="1" fill="#0284C7" />
  </g>

  <!-- Cage Vertical Wire Bars -->
  <!-- Back / Interior Bars -->
  <g stroke="#94A3B8" stroke-width="1.4" opacity="0.5">
    <line x1="102" y1="74" x2="102" y2="152" />
    <line x1="116" y1="56" x2="116" y2="152" />
    <line x1="130" y1="46" x2="130" y2="152" />
    <line x1="144" y1="40" x2="144" y2="152" />
    <line x1="160" y1="40" x2="160" y2="152" />
    <line x1="174" y1="46" x2="174" y2="152" />
    <line x1="188" y1="56" x2="188" y2="152" />
    <line x1="202" y1="74" x2="202" y2="152" />
  </g>

  <!-- Middle Reinforcing Horizontal Wire Hoops -->
  <path d="M 88 88 Q 152 94 216 88" fill="none" stroke="#F59E0B" stroke-width="3.5" />
  <path d="M 88 88 Q 152 94 216 88" fill="none" stroke="#1E2A3B" stroke-width="1.8" />

  <path d="M 88 128 Q 152 134 216 128" fill="none" stroke="#F59E0B" stroke-width="3.5" />
  <path d="M 88 128 Q 152 134 216 128" fill="none" stroke="#1E2A3B" stroke-width="1.8" />

  <!-- Front Cage Vertical Wire Bars -->
  <g stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round">
    <line x1="102" y1="76" x2="102" y2="152" />
    <line x1="116" y1="58" x2="116" y2="152" />
    <line x1="130" y1="48" x2="130" y2="152" />
    <line x1="144" y1="40" x2="144" y2="152" />
    <line x1="160" y1="40" x2="160" y2="152" />
    <line x1="174" y1="48" x2="174" y2="152" />
    <line x1="188" y1="58" x2="188" y2="152" />
    <line x1="202" y1="76" x2="202" y2="152" />
  </g>
  <!-- Thin dark contours for front wire bars -->
  <g stroke="#1E2A3B" stroke-width="1.4" stroke-linecap="round">
    <line x1="102" y1="76" x2="102" y2="152" />
    <line x1="116" y1="58" x2="116" y2="152" />
    <line x1="130" y1="48" x2="130" y2="152" />
    <line x1="144" y1="40" x2="144" y2="152" />
    <line x1="160" y1="40" x2="160" y2="152" />
    <line x1="174" y1="48" x2="174" y2="152" />
    <line x1="188" y1="58" x2="188" y2="152" />
    <line x1="202" y1="76" x2="202" y2="152" />
  </g>

  <!-- Domed Cage Outer Frame Contour -->
  <path d="M 88 152 L 88 88 C 88 52 116 38 152 38 C 188 38 216 52 216 88 L 216 152" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Removable Bottom Tray & Base Ring -->
  <path d="M 82 152 L 222 152 L 218 164 L 86 164 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <rect x="80" y="150" width="144" height="5" rx="2" fill="#FBBF24" stroke="#1E2A3B" stroke-width="1.8" />
  <!-- Slide-out tray drawer knob -->
  <circle cx="152" cy="158" r="3" fill="#78350F" stroke="#1E2A3B" stroke-width="1.4" />
</svg>