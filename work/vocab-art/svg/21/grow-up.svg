<!-- SELF_PROMPT:
  CHAPTER: 21 — Family and relationships
  WORD: grow up (Phrasal Verb)
  CONTEXTUAL_DEFINITION: To develop from a child into an adult.
  PEDAGOGICAL_ARCHETYPE: 2 — Sequential metaphor
  SYNONYM_GUARD: The same recognizable person appears as a small child, teenager, and adult in three successive moments, making life-stage development distinct from simple height or plant growth.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Gentle sky and floor suggesting time passing.
    - Context_Layer: Three lightly separated stepping spaces.
    - Focal_Layer: Same person at child, teen, and adult ages, with a shared hair shape and facial feature.
    - Details_Layer: A book, school bag, and adult work satchel mark age progression.
    - Lighting_Layer: A single soft arc sweeps from left to right.
-->
