<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: traffic light
  CONTEXTUAL_DEFINITION: A roadside signal with red, amber, and green lamps that controls vehicles at an intersection.
  PEDAGOGICAL_ART_DIRECTOR: Make a three-lens traffic signal prominent beside an urban crossing; the red lens is lit while a car waits behind the crossing.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / direction diagram
  SYNONYM_GUARD: The signal must control an intersection, not appear as a vehicle turn-signal lamp.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A compact crossroads lies behind a tall signal on the near corner at x=82..119; three vertically stacked lenses show red lit, amber and green unlit; a car waits at the stop line.
-->
