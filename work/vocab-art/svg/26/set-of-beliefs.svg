  CHAPTER: 26 — Communication and beliefs
  WORD: set of beliefs (Noun phrase)
  CONTEXTUAL_DEFINITION: A connected group of ideas or convictions that someone holds.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract concept diagram
  SYNONYM_GUARD: Show several distinct ideas linked into one organized whole, unlike the single conviction in belief or the unwavering strength in unshakable belief.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Pale discussion-room wall and warm wooden table.
    - Context_Layer: A person considers a large circular arrangement of ideas.
    - Focal_Layer: Four different visual symbols occupy linked nodes inside one enclosing ring.
    - Details_Layer: Fine connecting paths show that the ideas belong to one system.
    - Lighting_Layer: A soft center glow unifies the related convictions.
-->
