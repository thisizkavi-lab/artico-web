<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="34:chef" data-archetype="role-character">
  <defs>
    <path id="chef-coat-shape" d="M 62 164 C 66 128, 88 114, 126 114 C 164 114, 184 128, 190 164 Z"/>
    <clipPath id="chef-coat-clip">
