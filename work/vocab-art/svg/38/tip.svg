<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: tip (noun; gratuity)
  CONTEXTUAL_DEFINITION: Extra money voluntarily left for restaurant service.
  PEDAGOGICAL_ARCHETYPE: 3 - Role in a clear service scene
  SYNONYM_GUARD: Use the Japanese hospitality/work context to lock tip to gratuity; show a coin left beside a meal bill for a server, not a pointed end or hint.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Cafe table with bill and used cup/plate; customer hand sets a coin on top; server waits at right with tray; no readable receipt text or numerals.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:tip" data-archetype="role-scene">
  <defs>
