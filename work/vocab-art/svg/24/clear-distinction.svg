<!-- SELF_PROMPT:
  CHAPTER: 24 — Studying
  WORD: clear distinction (Noun phrase)
  CONTEXTUAL_DEFINITION: An obvious difference that separates two categories or ideas.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Use a bold clean divider between two visibly different groups; show a clear boundary, not the process of comparing two similar objects.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Plain pale display board.
    - Context_Layer: Two trays at equal height.
    - Focal_Layer: Blue circles grouped on one side and gold triangles on the other, separated by a crisp barrier.
    - Details_Layer: Distinct color fields and a magnifying lens on the boundary.
    - Lighting_Layer: Clear, sharp contrast emphasizes separation.
-->
