<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: graffiti (Noun)
  CONTEXTUAL_DEFINITION: Unauthorized writing or drawings marked on a public or private surface.
  PEDAGOGICAL_ARCHETYPE: 4 — Peak-moment action with marking and property context
  SYNONYM_GUARD: Show unauthorized paint marks on a public wall, distinct from a permitted mural or a blank wall.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A plain civic wall along a paved neighborhood path.
    - Context_Layer: A caretaker's cleaning cloth and a small no-entry barrier signal the wall is not an art display.
    - Focal_Layer: A person sprays abstract non-letter shapes while a uniformed officer notices.
    - Details_Layer: The marks are short squiggles and shapes only, with no letters, names, or slogans.
    - Lighting_Layer: Neutral daylight with muted plum caution cues frames the unauthorized act.
-->
