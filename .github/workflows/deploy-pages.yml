name: Deploy Artico to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache generated licensed vocabulary artwork
        uses: actions/cache@v4
        with:
          path: |
            public/vocabulary-symbols/mulberry
            public/vocabulary-symbols/openmoji
            public/vocabulary-symbols/original
          key: vocabulary-art-v4-${{ hashFiles('src/web/vocabularyMulberryManifest.json', 'src/web/vocabularyOpenmojiManifest.json', 'src/web/vocabularyOriginalScenes.json', 'src/web/vocabularyPersonalityScenes.json', 'scripts/build_vocabulary_original_scenes.py', 'scripts/build_vocabulary_personality_scenes.py') }}

      - name: Generate locally hosted Mulberry vocabulary PNGs
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 scripts/build_vocabulary_library.py

      - name: Cache Artico handwriting worksheets
        id: handwriting-cache
        uses: actions/cache@v4
        with:
          path: public/worksheets
          key: artico-handwriting-v1-${{ hashFiles('scripts/generate_handwriting_worksheets.py') }}

      - name: Generate printable A4 handwriting worksheets
        if: steps.handwriting-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-sil-andika fonts-lato
          python3 -m pip install --quiet numpy pillow scikit-image reportlab
          python3 scripts/generate_handwriting_worksheets.py

      - name: Verify printable worksheets
        run: |
          test -f public/worksheets/Artico_Complete_Handwriting_Workbook.pdf
          test -f public/worksheets/Artico_Handwriting_PDF_Collection.zip
          test "$(find public/worksheets -maxdepth 1 -name '*.pdf' | wc -l)" -eq 58

      - name: Generate original chapter-specific teaching scenes
        run: python3 scripts/build_vocabulary_original_scenes.py

      - name: Generate personality behavior-scene PNGs
        run: python3 scripts/build_vocabulary_personality_scenes.py

      - name: Generate all Lesson 3 time PNG diagrams
        run: python3 scripts/build_vocab_time_png.py

      - name: Produce original daily-commute PNG illustrations
        run: python3 scripts/build_ch04_ai_actions.py

      - name: Cache complete single-voice American IPA word audio
        id: ipa-one-voice-cache
        uses: actions/cache@v4
        with:
          path: public/audio/ipa-one-voice
          key: artico-ipa-one-voice-v1-${{ hashFiles('scripts/generate_ipa_single_voice.py', 'src/web/ipaSounds.js', 'src/web/ipaExamples.json') }}

      - name: Generate every IPA word with one American voice
        if: steps.ipa-one-voice-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet piper-tts==1.8.0
          mkdir -p "$RUNNER_TEMP/artico-voice"
          (cd "$RUNNER_TEMP/artico-voice" && python3 -m piper.download_voices en_US-ljspeech-medium)
          python3 scripts/generate_ipa_single_voice.py "$RUNNER_TEMP/artico-voice/en_US-ljspeech-medium.onnx"

      - name: Verify every IPA word example has its locally hosted WAV
        run: |
          python3 - <<'PY'
          import json, wave
          from pathlib import Path
          directory=Path('public/audio/ipa-one-voice')
          manifest=json.loads((directory/'manifest.json').read_text(encoding='utf-8'))
          entries=manifest['entries']
          assert len(entries)==41, f"Wrong entry count: {len(entries)}"
          examples=manifest['examples']
          assert len(examples)==43
          files={e['file'] for e in entries}
          for ipa, words in examples.items():
              assert 2 <= len(words) <= 4, ipa
              files.update(example['file'] for example in words)
          assert len(files)==manifest['unique_audio_count']
          for filename in files:
              path=directory/filename
              assert path.is_file() and path.stat().st_size>8000, filename
              with wave.open(str(path),'rb') as stream:
                  assert stream.getnframes()>3000 and stream.getnchannels()==1, filename
          assert len(list(directory.glob('*.wav')))==len(files)
          print(f"Verified {len(entries)} IPA entries, {len(files)} playable word examples, one US voice")
          PY

      - name: Crop original AI food picture sheets into local PNGs
        run: python3 scripts/build_vocab_food_sheets.py

      - name: Crop original AI grooming sheets to local PNGs
        run: python3 scripts/build_vocab_grooming_sheets.py

      - name: Test course and learning progress
        run: pnpm test

      - name: Build site
        run: pnpm run build

      - name: Verify all sixteen Daily Routines PNGs reach Pages
        run: |
          test "$(find dist/vocabulary-ai/ch04 -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 16
          test -f dist/vocabulary-ai/ch04/arrive-late.png
          test -f dist/vocabulary-ai/ch04/catch-the-bus.png
          test -f dist/vocabulary-ai/ch04/catch-the-train.png
          test -f dist/vocabulary-ai/ch04/do-homework.png
          test -f dist/vocabulary-ai/ch04/go-home.png
          test -f dist/vocabulary-ai/ch03/03-000.png

      - name: Verify original AI-painted vocabulary images reached the site
        run: |
          test "$(find dist/vocabulary-ai/ch04/sheet -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 25
          test "$(find dist/vocabulary-ai/food -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 24
          test -s dist/vocabulary-ai/ch04/sheet/catch-the-bus.png
          test -s dist/vocabulary-ai/food/tomato.png
          test "$(find dist/vocabulary-ai/grooming -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 16
          test -s dist/vocabulary-ai/grooming/brush-your-hair.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
