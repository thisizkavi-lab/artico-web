<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: passport
  CONTEXTUAL_DEFINITION: An official identity booklet used when crossing national borders.
  PEDAGOGICAL_ART_DIRECTOR: Make the passport unmistakable as an open official travel booklet with a portrait panel and a globe seal, without written content.
  PEDAGOGICAL_ARCHETYPE: 2 - Hero Object
  SYNONYM_GUARD: Show a passport document, not a ticket, guidebook, or hotel key card; include no text or numbers.
  MODE: STATIC
  COORDINATE_BLUEPRINT: An open dark-blue passport lies on a travel counter; one page has a blank portrait panel and the facing page a gold globe emblem with a small border stamp.
-->
