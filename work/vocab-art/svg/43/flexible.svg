<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: flexible
  CONTEXTUAL_DEFINITION: Willing to change a plan or arrangement when needed.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker willingly making room for a colleague by shifting a work schedule.
  PEDAGOGICAL_ARCHETYPE: 14 - Willing adjustment
  SYNONYM_GUARD: Use willingness to alter an arrangement, not a bendable object or a worker suddenly switching job tasks.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a worker at x=100..154 with a small blank schedule board at x=144..230. Show one task card being moved from a full slot into a newly opened alternate slot for a colleague, with a relaxed open hand and curved green arrow.
-->
