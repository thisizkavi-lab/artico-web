<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: apply (verb; job application)
  CONTEXTUAL_DEFINITION: Formally ask to be considered for a job by submitting application materials.
  PEDAGOGICAL_ART_DIRECTOR: Show an applicant handing a portfolio to a hiring professional across an interview desk.
  PEDAGOGICAL_ARCHETYPE: 3 - Professional role exchange
  SYNONYM_GUARD: The Hiring and leaving group selects the job-seeking sense, not applying cream or applying a rule.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Set an applicant at x=76..137 on the left and a recruiter at x=211..267 on the right, facing one another across a narrow desk at y=126. A blue application folder passes from the applicant's hand to the recruiter, with quiet paper strokes but no readable marks.
-->
