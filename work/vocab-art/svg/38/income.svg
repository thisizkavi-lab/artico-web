  <g id="layer-context"><path d="M28 126 H152 V139 H28 Z" fill="#C88446" stroke="#1E2A3B" stroke-width="1.8"/><path d="M34 131 H146" stroke="#E3AC77" stroke-width="1.5"/><rect x="34" y="79" width="57" height="41" rx="4" fill="#E5E9F0" stroke="#64748B" stroke-width="1.8"/><path d="M41 87 H84 M41 94 H80 M41 101 H84" stroke="#94A3B8" stroke-width="1.5"/><path d="M52 108 L63 100 L73 106 L82 96" fill="none" stroke="#5479AC" stroke-width="1.8"/><path d="M169 120 Q169 114 177 114 H270 Q278 114 278 121 V151 H169 Z" fill="#E3AC77" stroke="#1E2A3B" stroke-width="1.8"/><path d="M169 122 Q223 137 278 122" fill="none" stroke="#965D28" stroke-width="1.6"/></g>
