  CHAPTER: 59 - Abilities and actions
  WORD: point
  CONTEXTUAL_DEFINITION: The sharp end or tip of a pencil or needle.
  PEDAGOGICAL_ART_DIRECTOR: Make the needle-sharp graphite tip the unmistakable focus in a magnified close view of a pencil point.
