<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: reflector (Noun)
  CONTEXTUAL_DEFINITION: A bicycle safety reflector that returns light from a vehicle's headlight so the bicycle is visible.
  PEDAGOGICAL_ART_DIRECTOR: Show a small red rear reflector catching a beam and returning bright rays toward the viewer.
  PEDAGOGICAL_ARCHETYPE: 1 - Concrete object
  SYNONYM_GUARD: This passive bicycle reflector returns incoming light; it is not a lamp or a mirror.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Rear bicycle wheel and rack at dusk, with a small red reflector below the saddle catching a warm headlight beam.
-->
