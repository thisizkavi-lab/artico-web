<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: crime (Noun)
  CONTEXTUAL_DEFINITION: An act that breaks the law and is punishable by public authority.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract legal category shown through a civic investigation
  SYNONYM_GUARD: Show a police officer documenting a property offense, without implying a particular violent crime or teaching a method.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A neighborhood shopfront with a paved sidewalk and warm display window.
    - Context_Layer: One display pane is cracked and an empty stand shows property damage or loss.
