  <g id="layer-details"><ellipse cx="38" cy="140" rx="8" ry="4.5" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.5"/><path d="M30 136 V140 C30 146 46 146 46 140 V136" fill="#D49B2A" stroke="#1E2A3B" stroke-width="1.5"/><path d="M51 129 H66" fill="none" stroke="#4A72B2" stroke-width="2.4"/><path d="M64 125 L71 129 L64 133 Z" fill="#4A72B2"/><ellipse cx="251" cy="140" rx="7" ry="4" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.4"/><path d="M227 83 C213 79 201 78 190 80" fill="none" stroke="#4A72B2" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M193 76 L186 80 L193 84 Z" fill="#4A72B2"/></g>
  <!-- 5. Signature-blue money-flow arrow and light accents -->
  <g id="layer-lighting"><path d="M70 127 C91 120 99 116 109 113" fill="none" stroke="#4A72B2" stroke-width="2.6" stroke-linecap="round"/><path d="M105 108 L113 112 L106 118 Z" fill="#4A72B2"/><path d="M84 59 H121" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" opacity=".8"/><path d="M150 39 L150 48 M146 43 H154" stroke="#F2C14E" stroke-width="2.2" stroke-linecap="round"/></g>
