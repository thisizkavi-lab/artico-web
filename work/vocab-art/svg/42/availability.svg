<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: availability
  CONTEXTUAL_DEFINITION: The times when a candidate is free to work or attend an interview.
  PEDAGOGICAL_ART_DIRECTOR: Show an applicant indicating open time slots on a blank schedule for an employer.
  PEDAGOGICAL_ARCHETYPE: 11 - Open schedule
  SYNONYM_GUARD: Depict free time blocks in a work schedule, not product stock or general usefulness.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a broad blank calendar at x=99..214, y=39..121. Keep several pale slots and highlight two open windows in green, leaving others muted. Put a candidate to the left at x=58..104, y=75..135 pointing to the open windows.
-->
