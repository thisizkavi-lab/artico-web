<!-- SELF_PROMPT:
  CHAPTER: 25 — Speaking a foreign language
  WORD: language exchange (Noun phrase)
  CONTEXTUAL_DEFINITION: Two people help each other learn their respective languages by taking turns speaking and listening.
  PEDAGOGICAL_ARCHETYPE: 2 — People in environment
  SYNONYM_GUARD: Show reciprocal teaching with equal turns: each learner models a language and helps the other practice it, distinct from simply sharing one lingua franca.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Language meetup table.
    - Context_Layer: Two learners with different strengths sit face to face.
    - Focal_Layer: They swap picture cards in both directions and take turns speaking.
    - Details_Layer: Two arrows make the exchange reciprocal.
    - Lighting_Layer: Balanced warm light on both partners.
-->
