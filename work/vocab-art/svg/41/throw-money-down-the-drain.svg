<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: throw money down the drain (idiom)
  CONTEXTUAL_DEFINITION: Waste money on something ineffective or useless.
  PEDAGOGICAL_ARCHETYPE: 4 - Money wasted by an ineffective action
  SYNONYM_GUARD: Business coins visibly fall into a floor drain beside a useless project plan; this depicts waste rather than ordinary payment or household cleaning.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Show a worker at left dropping a short arc of gold coins from an open business pouch at x=85..139 toward a clear circular drain at x=205,y=137. A discarded blank project board lies beside the drain as the ineffective expense context.
-->
