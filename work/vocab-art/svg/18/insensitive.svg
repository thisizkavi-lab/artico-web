<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: insensitive (Adjective)
  CONTEXTUAL_DEFINITION: Not noticing or caring about another person's feelings.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: A visibly upset friend seeks comfort while the focal person continues an unrelated activity without looking up; unlike unfriendly, the harm comes from failing to notice.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Shared lounge with a bench.
    - Context_Layer: Sad friend on the left with dropped shoulders.
    - Focal_Layer: Person on the right absorbed in a game-like puzzle and turned away.
    - Details_Layer: Tear, ignored reaching hand, diverted gaze and gap.
    - Lighting_Layer: Cool muted emphasis on the lack of connection.
-->
