<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: step down (phrasal verb; leaving a senior job)
  CONTEXTUAL_DEFINITION: Voluntarily leave a position of authority or responsibility.
  PEDAGOGICAL_ART_DIRECTOR: Show a senior professional descending from a raised office platform while handing the role token to a successor.
  PEDAGOGICAL_ARCHETYPE: 3 - Professional role transition
  SYNONYM_GUARD: This is an intentional departure from a senior role, not dismissal, a physical fall, or a simple step on stairs.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Draw a small raised platform at x=54..183,y=114 with an empty high-backed chair. A senior worker at x=156..207 is mid-step down toward the floor, extending a gold role badge to a younger colleague at x=223..266.
-->
