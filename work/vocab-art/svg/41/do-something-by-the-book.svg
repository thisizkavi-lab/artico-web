<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: do something by the book (idiom)
  CONTEXTUAL_DEFINITION: Carry out a task by following established rules or official procedures.
  PEDAGOGICAL_ARCHETYPE: 4 - Worker follows sequential instructions
  SYNONYM_GUARD: An open procedure manual shows a visual step sequence and the worker checks each step in order; the book is a rule guide, not a literary book.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a large open manual across x=83..234, y=49..138. On its two pages draw three sequential pictorial steps ending in a green check, with no lettering. Show a worker at left aligning a component to the first guide and a small approved result at right.
-->
