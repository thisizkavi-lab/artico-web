<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:duck" data-archetype="hero-object">
  <defs>
    <!-- Farm Duck: white domestic Pekin duck floating on calm blue water with ripples, bright orange spatulate bill -->
    <clipPath id="duck-body-clip">
      <path d="M 116 112 C 114 88 140 76 178 76 C 218 76 238 98 234 136 C 230 152 202 154 158 152 C 122 150 118 132 116 112 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="158" rx="114" ry="16" fill="#BAE6FD" />
  <ellipse cx="152" cy="158" rx="74" ry="10" fill="#7DD3FC" />

  <!-- Calm Water Surface Waves & Ripples -->
  <path d="M 48 158 Q 72 152 96 158 Q 120 164 144 158 Q 168 152 192 158 Q 216 164 240 158" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 76 166 Q 100 162 124 166 Q 148 170 172 166 Q 196 162 220 166" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Upturned Tail Feathers -->
  <path d="M 224 124 C 242 116 254 104 250 96 C 242 98 234 108 226 120 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 220 130 C 238 122 248 112 244 106 C 238 110 230 118 222 126 Z" fill="#F1F5F9" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />

  <!-- White Duck Body -->
  <g clip-path="url(#duck-body-clip)">
    <!-- Base Pure White -->
    <rect x="105" y="70" width="135" height="90" fill="#FFFFFF" />
    <!-- Subtle soft shadow tone on back & lower flank -->
    <path d="M 120 80 Q 175 88 228 114 L 234 155 L 105 155 Z" fill="#F1F5F9" />
    <rect x="105" y="142" width="135" height="15" fill="#E2E8F0" />
  </g>
  <!-- Body Contour -->
  <path d="M 116 112 C 114 88 140 76 178 76 C 218 76 238 98 234 136 C 230 152 202 154 158 152 C 122 150 118 132 116 112 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Folded White Wing on Flank -->
  <path d="M 136 102 C 154 94 186 98 196 122 C 196 138 174 146 150 142 C 138 134 132 114 136 102 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Wing feather arcs -->
  <path d="M 148 112 Q 174 116 186 128 M 146 124 Q 170 128 180 136" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Duck Neck & Head -->
  <path d="M 116 118 C 112 92 118 64 132 58 C 146 54 154 68 144 94 C 140 106 138 118 134 128" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Rounded Head -->
  <ellipse cx="132" cy="62" rx="16" ry="14" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" />

  <!-- Flat Orange Spatulate Duck Bill -->
  <path d="M 122 62 C 114 60 92 62 84 66 C 80 68 84 76 96 76 C 112 76 122 72 124 68 Z" fill="#FB923C" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Bill nostril and median ridge -->
  <ellipse cx="106" cy="66" rx="2" ry="1.2" fill="#EA580C" />
  <line x1="88" y1="70" x2="118" y2="69" stroke="#EA580C" stroke-width="1.6" />

  <!-- Shiny Dark Eye -->
  <circle cx="132" cy="58" r="4" fill="#1E2A3B" />
  <circle cx="130.8" cy="56.8" r="1.3" fill="#FFFFFF" />

  <!-- Water Drops / Splashes -->
  <circle cx="74" cy="148" r="2.5" fill="#38BDF8" />
  <circle cx="82" cy="142" r="1.8" fill="#38BDF8" />
</svg>