  CHAPTER: 18 — Personality traits
  WORD: dishonest (Adjective)
  CONTEXTUAL_DEFINITION: Not truthful; concealing the truth or taking something and hiding it.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
