<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:adopt" data-archetype="scene">
  <defs>
    <!-- Pet Adoption: loving caring human hands gently holding and cradling a rescued happy puppy with glowing heart -->
    <clipPath id="adopt-pup-clip">
      <ellipse cx="152" cy="106" rx="34" ry="38" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="166" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Warm Glowing Radiant Adoption Love Heart in Background -->
  <path d="M 152 46 C 136 24 104 28 104 56 C 104 84 152 114 152 114 C 152 114 200 84 200 56 C 200 28 168 24 152 46 Z" fill="#FEE2E2" opacity="0.8" />
  <path d="M 152 50 C 138 32 112 36 112 58 C 112 80 152 106 152 106 C 152 106 192 80 192 58 C 192 36 166 32 152 50 Z" fill="#FECDD3" opacity="0.6" />

  <!-- Sparkles / Stars of Hope around Heart -->
  <path d="M 96 34 L 100 42 L 108 46 L 100 50 L 96 58 L 92 50 L 84 46 L 92 42 Z" fill="#FACC15" />
  <path d="M 210 36 L 214 42 L 220 45 L 214 48 L 210 54 L 206 48 L 200 45 L 206 42 Z" fill="#FACC15" />

  <!-- Rescued Happy Little Puppy Body -->
  <g clip-path="url(#adopt-pup-clip)">
