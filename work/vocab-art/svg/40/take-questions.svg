  CHAPTER: 40 - Meeting and presenting
  WORD: take questions
  CONTEXTUAL_DEFINITION: Invite questions from an audience and respond to them, often after a presentation.
  PEDAGOGICAL_ART_DIRECTOR: Show a presenter explicitly opening the floor to more than one audience inquiry.
