<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: fast learner
  CONTEXTUAL_DEFINITION: A person who understands and picks up a new skill quickly.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker observing one demonstration and quickly completing the same new procedure.
  PEDAGOGICAL_ARCHETYPE: 13 - Rapid learning
  SYNONYM_GUARD: Make quick uptake visible through a short observe-then-do sequence; trained in indicates instruction received, not the speed of learning.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a trainer at x=60..108 pointing to a two-step procedure board at x=93..170. Put the learner at x=172..219 immediately repeating the task correctly, with a small green check and a short arrow from demonstration to practice.
-->
