<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: culture shock
  CONTEXTUAL_DEFINITION: Surprise or disorientation caused by encountering unfamiliar customs in another culture.
  PEDAGOGICAL_ART_DIRECTOR: Show a visitor respectfully surprised by a different everyday custom while local hosts remain welcoming and ordinary.
  PEDAGOGICAL_ARCHETYPE: 4 - Emotional Reaction + Context
  SYNONYM_GUARD: Make the surprise come from unfamiliar cultural practice, not danger, disgust, or a caricature of another group.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A traveler pauses at a communal meal as a welcoming host demonstrates an unfamiliar serving custom; the traveler looks startled but curious.
-->
