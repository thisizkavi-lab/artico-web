<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: computer skills
  CONTEXTUAL_DEFINITION: The ability to use a computer and its common tools effectively.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker capably using the keyboard and mouse while managing a clear, orderly computer interface.
  PEDAGOGICAL_ARCHETYPE: 38 - Confident computer use
  SYNONYM_GUARD: Show user competence at operating a computer, not software development, general computing as a field, or IT infrastructure support.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a seated worker at x=119 using an unlettered keyboard and mouse; place a large monitor at x=175..260 showing a tidy icon grid, pointer path, and completed check; keep desk and screen free of readable characters.
-->
