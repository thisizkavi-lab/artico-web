<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:disappointed" data-archetype="expressive-bust">
  <defs>
    <path id="disappointed-head" d="M 104 56 C 104 32, 184 32, 184 56 L 182 92 C 182 118, 162 132, 144 132 C 126 132, 106 118, 106 92 Z"/>
    <clipPath id="disappointed-head-clip">
      <use href="#disappointed-head"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <ellipse cx="152" cy="168" rx="96" ry="12" fill="#EAE3D5"/>

  <!-- Slumped Torso (Mia: Looking Down at Dropped Ice Cream) -->
  <path d="M 80 178 C 86 136, 110 122, 148 122 C 188 122, 216 136, 224 178 Z"
        fill="#F3ECE1" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="136" y="112" width="22" height="18" rx="5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour Tilted Forward/Down -->
  <g clip-path="url(#disappointed-head-clip)">
    <rect x="98" y="30" width="94" height="106" fill="#F5BFA3"/>
    <path d="M 104 116 C 124 132, 164 132, 184 116 L 184 136 L 104 136 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#disappointed-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Mia) -->
  <path d="M 98 62 C 94 34, 116 18, 144 18 C 172 18, 194 34, 190 62 C 184 46, 170 36, 144 36 C 118 36, 106 46, 98 62 Z"
        fill="#6E473B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Sad Disappointed Drooping Brows -->
  <path d="M 120 70 Q 128 75 136 71" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 166 71 Q 158 75 150 70" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Eyes Looking Downwards at Ground -->
  <path d="M 122 80 Q 130 86 138 80" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 150 80 Q 158 86 166 80" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Downturned Disappointed Frown -->
  <path d="M 132 104 Q 144 98 156 104" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Hand Holding Empty Waffle Cone -->
  <g transform="translate(196, 126)">
    <circle cx="0" cy="14" r="8" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2"/>
    <!-- Inverted waffle cone empty -->
    <polygon points="-6,10 6,10 0,30" fill="#F2C14E" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Dropped Ice Cream Scoop Splattered on Ground in Foreground (Unmistakable Cause!) -->
  <g transform="translate(202, 168)">
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="#F43F5E" stroke="#1E2A3B" stroke-width="2"/>
    <circle cx="-10" cy="2" r="3" fill="#F43F5E"/>
    <circle cx="12" cy="1" r="2.5" fill="#F43F5E"/>
    <!-- Small melting puddle -->
    <path d="M -12 2 Q 0 6 12 2" fill="none" stroke="#BE123C" stroke-width="1.6"/>
  </g>
</svg>
