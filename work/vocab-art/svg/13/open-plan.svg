<!-- SELF_PROMPT:
  CHAPTER: 13 — Moving and renting
  WORD: open-plan (Adjective)
  CONTEXTUAL_DEFINITION: Describes a home layout with few or no walls separating living areas.
  PEDAGOGICAL_ARCHETYPE: 5 — Cutaway spatial diagram
  SYNONYM_GUARD: Show the kitchen, dining, and sitting spaces flowing together without internal partition walls.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Top-down angled cutaway of one large interior.
    - Context_Layer: Only outer walls remain; one long window spans the rear.
    - Focal_Layer: Kitchen counter, dining table, and sofa share one continuous floor plane.
    - Details_Layer: Rugs and furniture group zones without dividing walls.
    - Lighting_Layer: Blue flow path sweeps through the connected plan.
-->
