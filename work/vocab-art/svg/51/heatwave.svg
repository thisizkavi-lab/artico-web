<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: heatwave (Noun)
  CONTEXTUAL_DEFINITION: A prolonged spell of exceptionally hot weather, shown by repeated hot days and a person cooling off.
  PEDAGOGICAL_ART_DIRECTOR: Use three repeated sunlit day panels over the same parched horizon to suggest a continuing spell, with one person seeking relief in shade.
  PEDAGOGICAL_ARCHETYPE: 3 - Repeated weather condition over time
  SYNONYM_GUARD: Show repeated days of exceptional heat, not simply one hot afternoon or long-term drought.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Three narrow landscape bands each repeat an intense sun and heat shimmer; a person rests in a small patch of shade beside a water jug.
-->
