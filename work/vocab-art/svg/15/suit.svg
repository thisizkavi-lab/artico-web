<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:suit (clothing)">
  <defs>
    <clipPath id="suit-jacket-clip">
      <path d="M 124 38 L 74 54 L 62 130 L 84 134 L 94 98 L 92 144 C 114 148 190 148 212 144 L 210 98 L 220 134 L 242 130 L 230 54 L 180 38 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop executive aura -->
  <ellipse cx="152" cy="110" rx="90" ry="64" fill="#F1F5F9" opacity="0.8"/>

  <!-- Valet Wooden Stand Finial -->
  <path d="M 148 18 L 148 38 L 156 38 L 156 18 Z" fill="#9A6945" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="152" cy="18" r="4.5" fill="#C59B75" stroke="#1E2A3B" stroke-width="1.8"/>

  <!-- Matching Trousers Hanging Below Jacket Hem -->
  <path d="M 116 138 L 188 138 L 186 178 L 158 178 L 152 148 L 146 178 L 118 178 Z"
        fill="#1E293B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Trouser sharp crease lines -->
  <line x1="132" y1="140" x2="132" y2="178" stroke="#475569" stroke-width="1.4"/>
  <line x1="172" y1="140" x2="172" y2="178" stroke="#334155" stroke-width="1.4"/>

  <!-- Left Jacket Sleeve -->
  <path d="M 84 54 L 62 130 L 84 134 L 96 98 L 106 60 Z"
        fill="#334155" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Left Sleeve Kissing Buttons -->
  <circle cx="68" cy="126" r="1.4" fill="#64748B"/>
  <circle cx="72" cy="127" r="1.4" fill="#64748B"/>
  <circle cx="76" cy="128" r="1.4" fill="#64748B"/>

  <!-- Right Jacket Sleeve -->
  <path d="M 220 54 L 242 130 L 220 134 L 208 98 L 198 60 Z"
        fill="#1E293B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Right Sleeve Buttons -->
  <circle cx="228" cy="128" r="1.4" fill="#475569"/>
  <circle cx="232" cy="127" r="1.4" fill="#475569"/>
  <circle cx="236" cy="126" r="1.4" fill="#475569"/>

  <!-- Main Suit Jacket Body -->
  <path d="M 124 38 L 84 54 L 92 144 C 114 148 190 148 212 144 L 220 54 L 180 38 Z"
        fill="#334155" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Right Side Shadow inside jacket -->
  <g clip-path="url(#suit-jacket-clip)">
    <path d="M 152 38 L 220 54 L 212 144 L 152 146 Z" fill="#1E293B" opacity="0.45"/>
  </g>

  <!-- Inner Crisp White Shirt Collar & Red Silk Tie -->
  <path d="M 134 38 L 152 86 L 170 38 Z" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1.8"/>
  <path d="M 134 38 L 152 48 L 146 54 Z" fill="#E2E8F0"/>
  <path d="M 170 38 L 152 48 L 158 54 Z" fill="#CBD5E1"/>

  <!-- Red Silk Necktie -->
  <!-- Tie knot -->
  <polygon points="148,46 156,46 154,54 150,54" fill="#DC2626" stroke="#1E2A3B" stroke-width="1.4"/>
  <!-- Tie body extending down -->
  <polygon points="150,54 154,54 157,98 152,106 147,98" fill="#B91C1C" stroke="#1E2A3B" stroke-width="1.6"/>
  <!-- Tie diagonal jacquard stripe -->
  <line x1="149" y1="68" x2="155" y2="72" stroke="#FEF3C7" stroke-width="1.2"/>
  <line x1="148" y1="82" x2="156" y2="86" stroke="#FEF3C7" stroke-width="1.2"/>

  <!-- Tailored Notched Lapels -->
  <!-- Left Notched Lapel -->
  <path d="M 124 38 L 108 66 L 122 70 L 110 96 L 152 108 L 152 48 Z"
        fill="#475569" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Right Notched Lapel -->
  <path d="M 180 38 L 196 66 L 182 70 L 194 96 L 152 108 L 152 48 Z"
        fill="#1E293B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Left Breast Welt Pocket with Silk Pocket Square -->
  <line x1="104" y1="84" x2="122" y2="84" stroke="#1E2A3B" stroke-width="2.4"/>
  <polygon points="108,84 112,76 118,84" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1.2"/>
  <polygon points="114,84 117,74 121,84" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1.2"/>

  <!-- Two Front Horn Closure Buttons -->
  <circle cx="152" cy="114" r="2.8" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>
  <circle cx="152" cy="126" r="2.8" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>

  <!-- Side Flap Pockets -->
  <rect x="98" y="116" width="24" height="6" rx="1.5" fill="#1E293B" stroke="#1E2A3B" stroke-width="1.6"/>
  <rect x="182" y="116" width="24" height="6" rx="1.5" fill="#0F172A" stroke="#1E2A3B" stroke-width="1.6"/>
</svg>