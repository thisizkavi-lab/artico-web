<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: look forward to something
  CONTEXTUAL_DEFINITION: Feel pleased and excited because something enjoyable is expected to happen.
  PEDAGOGICAL_ART_DIRECTOR: Show cheerful anticipation of a future trip, not the journey itself or merely making a booking.
  PEDAGOGICAL_ARCHETYPE: 4 - Emotional Reaction
  SYNONYM_GUARD: Emphasize eager expectation before the event, with a happy forward-looking expression and travel cue.
  MODE: STATIC
  COORDINATE_BLUEPRINT: At home beside a packed suitcase, a smiling traveler looks toward a sunny plane and destination picture through the window, clasping hands with excitement.
-->
