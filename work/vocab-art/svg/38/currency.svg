  <g id="layer-context"><path d="M35 139 Q149 132 269 139 L257 153 H47 Z" fill="#E5E9F0" stroke="#64748B" stroke-width="2.2"/><path d="M153 138 L151 152" stroke="#94A3B8" stroke-width="2"/><path d="M54 146 H139 M166 146 H249" stroke="#CBD5E1" stroke-width="2"/></g>
