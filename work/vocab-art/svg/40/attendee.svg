<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: attendee
  CONTEXTUAL_DEFINITION: A person who is present at a meeting or event.
  PEDAGOGICAL_ART_DIRECTOR: Focus on one seated participant among a small group, marked by a simple blank event badge rather than an attendance action.
  PEDAGOGICAL_ARCHETYPE: 1 - Participant / role
  SYNONYM_GUARD: This is the person, not the act of attending, the empty seat, or an organizer speaking at the front.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Use a meeting table at y=132. Place the focal attendee centered x=126..178, head y=57..87 and torso y=91..132, wearing a small blank badge; two partial seated coworkers at x=56..100 and x=204..248 frame the person. Keep the focal face and badge visible above the table.
-->
