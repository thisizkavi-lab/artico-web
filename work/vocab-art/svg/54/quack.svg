<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:quack" data-archetype="dynamic-action">
  <defs>
    <!-- Duck Quacking: white duck with orange bill wide open calling loudly, radiating acoustic quack sound shockwaves -->
    <clipPath id="quack-duck-clip">
      <path d="M 124 112 C 122 88 146 78 184 78 C 220 78 238 98 234 136 C 230 152 202 154 162 152 C 128 150 124 132 124 112 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Water -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="160" rx="116" ry="16" fill="#BAE6FD" />
  <ellipse cx="152" cy="160" rx="74" ry="10" fill="#7DD3FC" />

  <!-- Quack Sound Waves Blasting Leftward from Open Bill -->
  <!-- Arc 1 -->
  <path d="M 72 46 C 58 58 50 76 52 96 C 54 110 64 122 76 128" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <path d="M 72 46 C 58 58 50 76 52 96 C 54 110 64 122 76 128" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Arc 2 (Larger shockwave) -->
  <path d="M 52 34 C 32 50 22 76 24 104 C 26 126 40 144 56 150" fill="none" stroke="#EF4444" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 52 34 C 32 50 22 76 24 104 C 26 126 40 144 56 150" fill="none" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />

  <!-- Quack Accent Marks / Sound Burst Rays -->
  <line x1="68" y1="40" x2="56" y2="30" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="48" y1="84" x2="32" y2="84" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <line x1="66" y1="130" x2="52" y2="140" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />

  <!-- White Duck Body on Water -->
  <g clip-path="url(#quack-duck-clip)">
    <rect x="115" y="70" width="130" height="90" fill="#FFFFFF" />
    <path d="M 125 80 Q 180 88 230 114 L 235 155 L 115 155 Z" fill="#F1F5F9" />
    <rect x="115" y="142" width="130" height="15" fill="#E2E8F0" />
  </g>
  <path d="M 124 112 C 122 88 146 78 184 78 C 220 78 238 98 234 136 C 230 152 202 154 162 152 C 128 150 124 132 124 112 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Wing & Upturned Tail Feathers -->
  <path d="M 142 102 C 160 94 192 98 200 122 C 200 138 178 146 156 142 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 226 124 C 242 116 252 104 248 96 C 240 98 234 108 226 120 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Duck Neck & Head (Leaning forward with vocal energy) -->
  <path d="M 126 116 C 122 92 128 66 142 60 C 154 56 162 70 152 96 C 148 106 146 118 142 128" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <ellipse cx="140" cy="64" rx="16" ry="14" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" />

  <!-- Keen Alert Quacking Eye (Squinting enthusiastically) -->
  <circle cx="142" cy="60" r="4" fill="#1E2A3B" />
  <circle cx="140.8" cy="58.8" r="1.3" fill="#FFFFFF" />

  <!-- Wide Open Orange Bill (The Quack!) -->
  <!-- Upper Mandible -->
  <path d="M 130 62 L 96 52 C 92 56 94 62 104 66 L 132 70 Z" fill="#FB923C" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="114" cy="60" rx="2" ry="1.2" fill="#EA580C" />

  <!-- Open Pink/Red Mouth Interior & Tongue -->
  <polygon points="128,68 104,66 106,78 126,76" fill="#881337" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />
  <ellipse cx="116" cy="72" rx="6" ry="3" fill="#F43F5E" />

  <!-- Lower Mandible (Dropped open) -->
  <path d="M 128 74 L 102 78 C 104 84 108 86 116 84 L 130 78 Z" fill="#FB923C" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Water Surface Ripples & Splashes -->
  <path d="M 86 156 Q 106 150 126 156" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
  <circle cx="102" cy="148" r="2" fill="#38BDF8" />
  <circle cx="94" cy="152" r="1.5" fill="#38BDF8" />
</svg>