<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: get off a bike (Verb Phrase)
  CONTEXTUAL_DEFINITION: Dismount a bicycle and step down to stand beside it.
  PEDAGOGICAL_ART_DIRECTOR: Show a rider's foot planted on the ground as the other leg swings clear of the saddle.
  PEDAGOGICAL_ARCHETYPE: 4 - Agent-to-vehicle action
  SYNONYM_GUARD: The rider is leaving the saddle and standing alongside the bicycle, not mounting or pedaling it.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Bicycle stopped upright; rider leans over handlebars, left foot firmly grounded and right leg arcing over the rear of the saddle to step down.
-->
