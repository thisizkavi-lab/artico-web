<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: recruitment agency
  CONTEXTUAL_DEFINITION: A business that helps employers find workers and job seekers find suitable positions.
  PEDAGOGICAL_ART_DIRECTOR: Show the agency as an intermediary connecting a candidate and an employer.
  PEDAGOGICAL_ARCHETYPE: 3 - Matching / intermediary
  SYNONYM_GUARD: Include three distinct roles—candidate, agency recruiter, and employer contact—rather than depicting an employer's internal hiring desk alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a candidate at x=39..88 on the left, a recruiter centered x=126..177 behind an agency desk, and an employer at x=216..264 on the right. Two clear connector arrows pass through the center recruiter; use paired profile cards to show matching.
-->
