<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:collar (pet)" data-archetype="hero-object">
  <defs>
    <!-- Pet Collar: red stitched leather strap coiled in loop, brass buckle, D-ring, dangling bell and engraved paw tag -->
    <clipPath id="collar-band-clip">
      <path d="M 64 96 C 64 62 108 52 152 52 C 196 52 240 62 240 96 C 240 130 196 140 152 140 C 108 140 64 130 64 96 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="162" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Rear Loop of the Leather Collar -->
  <path d="M 74 92 C 74 66 112 56 152 56 C 192 56 230 66 230 92 C 230 102 218 108 198 112" fill="none" stroke="#DC2626" stroke-width="22" stroke-linecap="round" />
  <path d="M 74 92 C 74 66 112 56 152 56 C 192 56 230 66 230 92 C 230 102 218 108 198 112" fill="none" stroke="#991B1B" stroke-width="4" stroke-linecap="round" />

  <!-- Front Loop of the Leather Collar -->
  <path d="M 64 96 C 64 126 104 138 152 138 C 200 138 240 126 240 96" fill="none" stroke="#EF4444" stroke-width="24" stroke-linecap="round" />
  <path d="M 64 96 C 64 126 104 138 152 138 C 200 138 240 126 240 96" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" />
  <!-- Inner boundary stroke of collar -->
  <path d="M 76 96 C 76 116 110 126 152 126 C 194 126 228 116 228 96" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" />

  <!-- White Saddle Stitching along Top and Bottom Leather Edges -->
  <path d="M 72 90 C 72 118 108 132 152 132 C 196 132 232 118 232 90" fill="none" stroke="#FEE2E2" stroke-width="1.8" stroke-dasharray="4 4" />
  <path d="M 80 100 C 80 114 112 122 152 122 C 192 122 224 114 224 100" fill="none" stroke="#FEE2E2" stroke-width="1.8" stroke-dasharray="4 4" />

  <!-- Brass Metal Eyelets / Adjustment Holes on Collar Strap -->
  <circle cx="86" cy="108" r="3.5" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.6" />
  <circle cx="86" cy="108" r="1.5" fill="#78350F" />
  <circle cx="102" cy="116" r="3.5" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.6" />
  <circle cx="102" cy="116" r="1.5" fill="#78350F" />
  <circle cx="120" cy="123" r="3.5" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.6" />
  <circle cx="120" cy="123" r="1.5" fill="#78350F" />

  <!-- Sturdy Brass D-Ring Loop at Front Center -->
  <path d="M 144 134 C 144 144 160 144 160 134" fill="none" stroke="#FACC15" stroke-width="5" stroke-linecap="round" />
  <path d="M 144 134 C 144 144 160 144 160 134" fill="none" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />

  <!-- Connecting Jump Ring for Tags -->
  <circle cx="152" cy="144" r="5" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <circle cx="152" cy="144" r="5" fill="none" stroke="#1E2A3B" stroke-width="1.4" />

  <!-- Dangling Golden Bell -->
  <circle cx="140" cy="158" r="10" fill="#FACC15" stroke="#1E2A3B" stroke-width="2" />
  <circle cx="138" cy="156" r="7" fill="#FDE047" />
  <!-- Bell sound slit -->
  <line x1="134" y1="162" x2="146" y2="162" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="140" cy="162" r="1.8" fill="#78350F" />

  <!-- Dangling Engraved Brass Pet ID Tag (Round Disc with Paw Print) -->
  <circle cx="166" cy="158" r="13" fill="#FACC15" stroke="#1E2A3B" stroke-width="2.2" />
  <circle cx="166" cy="158" r="10" fill="#FDE047" />
  <!-- Paw print engraving on ID tag -->
  <ellipse cx="166" cy="161" rx="4.5" ry="3.5" fill="#78350F" />
  <circle cx="162" cy="154" r="1.5" fill="#78350F" />
  <circle cx="165" cy="152" r="1.5" fill="#78350F" />
  <circle cx="168" cy="152" r="1.5" fill="#78350F" />
  <circle cx="171" cy="154" r="1.5" fill="#78350F" />

  <!-- Heavy Duty Brass Buckle at Right Side -->
  <rect x="210" y="82" width="24" height="28" rx="4" fill="#FACC15" stroke="#1E2A3B" stroke-width="2.4" />
  <rect x="216" y="88" width="12" height="16" rx="2" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="2" />
  <!-- Buckle prong -->
  <line x1="210" y1="96" x2="228" y2="96" stroke="#B45309" stroke-width="3" stroke-linecap="round" />
  <line x1="210" y1="96" x2="228" y2="96" stroke="#1E2A3B" stroke-width="1.4" stroke-linecap="round" />
</svg>