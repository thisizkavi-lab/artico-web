<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:ecstatic" data-archetype="expressive-bust">
  <defs>
    <!-- Head tilted slightly upward in pure bliss -->
    <path id="ecstatic-head" d="M 112 52 C 112 28, 192 28, 192 52 L 190 86 C 190 114, 170 128, 152 128 C 134 128, 114 114, 114 86 Z"/>
    <clipPath id="ecstatic-head-clip">
      <use href="#ecstatic-head"/>
    </clipPath>
    <clipPath id="ecstatic-torso-clip">
      <path d="M 84 178 C 92 136, 114 120, 152 120 C 190 120, 212 136, 220 178 Z"/>
    </clipPath>
  </defs>

  <!-- Golden Euphoric Aura Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="80" fill="#FEF3C7"/>

  <!-- Floating Outstretched Arms -->
  <path d="M 104 130 L 52 108 L 46 122 L 96 146 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="48" cy="114" r="10" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>

  <path d="M 200 130 L 252 108 L 258 122 L 208 146 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="256" cy="114" r="10" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Torso (Ren) -->
  <g clip-path="url(#ecstatic-torso-clip)">
    <rect x="76" y="116" width="152" height="68" fill="#5479AC"/>
    <path d="M 76 178 C 86 142, 104 128, 124 124 L 124 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 84 178 C 92 136, 114 120, 152 120 C 190 120, 212 136, 220 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck (Stretched up in bliss) -->
  <rect x="140" y="104" width="24" height="24" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Glow -->
  <g clip-path="url(#ecstatic-head-clip)">
    <rect x="105" y="26" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="88" rx="12" ry="8" fill="#F58D82" opacity="0.65"/>
    <ellipse cx="176" cy="88" rx="12" ry="8" fill="#F58D82" opacity="0.65"/>
    <path d="M 112 110 C 132 126, 172 126, 192 110 L 192 130 L 112 130 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#ecstatic-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Ren) -->
  <path d="M 106 60 C 102 30, 124 14, 152 14 C 180 14, 202 30, 198 60 C 192 42, 176 32, 152 32 C 128 32, 114 42, 106 60 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Closed Euphoric Blissful Eyes (^ ^ with tears of joy) -->
  <path d="M 124 72 Q 134 64 144 72" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 160 72 Q 170 64 180 72" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Little glint dots at corners -->
  <circle cx="145" cy="74" r="1.5" fill="#7CC4FA"/>
  <circle cx="159" cy="74" r="1.5" fill="#7CC4FA"/>

  <!-- Huge Ecstatic Joyous Open Mouth -->
  <path d="M 130 88 C 130 114, 174 114, 174 88 Z" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 140 108 C 146 100, 158 100, 164 108 Z" fill="#F58D82"/>
  <path d="M 133 90 Q 152 94 171 90" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Golden Rays of Ecstasy Radiating Out -->
  <g stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round">
    <line x1="84" y1="36" x2="72" y2="28"/>
    <line x1="152" y1="12" x2="152" y2="4"/>
    <line x1="220" y1="36" x2="232" y2="28"/>
    <line x1="64" y1="74" x2="52" y2="70"/>
    <line x1="240" y1="74" x2="252" y2="70"/>
  </g>
</svg>
