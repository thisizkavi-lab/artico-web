<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: give and take
  CONTEXTUAL_DEFINITION: A cooperative relationship in which colleagues both make adjustments or contributions.
  PEDAGOGICAL_ART_DIRECTOR: Show two coworkers meeting midway over a shared work plan, each contributing a different piece and both agreeing on a balanced result.
  PEDAGOGICAL_ARCHETYPE: 3 - Cooperative exchange
  SYNONYM_GUARD: Depict mutual compromise rather than a one-way gift, retail transaction, or literal hand-to-hand exchange.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place two adult coworkers at x=52..116 and x=188..252, facing inward across a shared table at y=132. Their arms reach toward a centered board at x=124..180, each adding one differently colored card to a balanced two-column plan; both faces show calm agreement. Use a small centered balance motif, not a scale or text.
-->
