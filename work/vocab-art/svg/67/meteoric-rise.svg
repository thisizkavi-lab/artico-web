<!-- SELF_PROMPT:
 CHAPTER: 67 - Media and celebrity
 WORD: meteoric rise
 CONTEXTUAL_DEFINITION: A very rapid increase in someone's fame or success.
 PEDAGOGICAL_ARCHETYPE: star streaking steeply upward as audience and spotlight grow
 SYNONYM_GUARD: Show a sharp, fast rise in public recognition; distinguish it from simply becoming famous with a before-and-after portrait.
 MODE: STATIC
 COORDINATE_BLUEPRINT: A bright shooting-star trail climbs steeply past progressively larger audience groups and media frames toward a now-prominent performer under a large spotlight.
-->
