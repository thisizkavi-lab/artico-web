<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: have a sneaking suspicion (Verb phrase)
  CONTEXTUAL_DEFINITION: Privately and tentatively think something may be true without proof.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive person noticing a subtle clue
  SYNONYM_GUARD: Make the person quietly infer a hidden truth from a small clue, distinct from a fully supported fact or strong serious doubts.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Discussion-room snack counter with a curtain at one side.
    - Context_Layer: An open cookie plate and a few crumbs remain.
    - Focal_Layer: A person glances sideways as a child peeks from behind a curtain with one crumb on their cheek.
    - Details_Layer: A small, faint cookie thought image signals an unspoken hunch rather than proof.
    - Lighting_Layer: Keep the clue subtle and the thought bubble pale.
-->
