<!-- SELF_PROMPT:
  CHAPTER: 59 - Abilities and actions
  WORD: sit down
  CONTEXTUAL_DEFINITION: Lower the body onto a chair or other seat.
  PEDAGOGICAL_ART_DIRECTOR: Show a person in the clear halfway moment of bending knees and lowering their hips toward a waiting chair, feet planted.
  PEDAGOGICAL_ARCHETYPE: 3 - Sequence + Transformation
  SYNONYM_GUARD: The lowered hips approaching the seat show the transition into sitting, not a person already sitting or standing up.
  MODE: STATIC
  COORDINATE_BLUEPRINT: In a calm room, a person bends both knees and lowers toward a wooden chair, one hand reaching to the chair back, with a soft downward cue aimed at the seat and both feet still planted on the floor.
-->
