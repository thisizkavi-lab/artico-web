  <rect x="132" y="96" width="40" height="62" rx="4" fill="#FDE047" stroke="#1E2A3B" stroke-width="2.4" />
  <line x1="152" y1="96" x2="152" y2="158" stroke="#1E2A3B" stroke-width="2" />
  <!-- Door window panes -->
  <rect x="136" y="102" width="12" height="18" rx="2" fill="#FEF9C3" stroke="#1E2A3B" stroke-width="1.6" />
  <rect x="156" y="102" width="12" height="18" rx="2" fill="#FEF9C3" stroke="#1E2A3B" stroke-width="1.6" />
