<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:dress">
  <defs>
    <clipPath id="skirt-flare-clip">
      <path d="M 132 86 L 82 168 C 112 174 192 174 222 168 L 172 86 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop warm aura -->
  <ellipse cx="152" cy="112" rx="90" ry="62" fill="#FEE2E2" opacity="0.6"/>

  <!-- Mannequin wooden neck finial -->
  <path d="M 146 22 L 146 42 L 158 42 L 158 22 Z" fill="#C59B75" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="152" cy="22" r="5" fill="#E7C8A4" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Bodice Sleeveless Straps / Shoulders -->
  <!-- Left armhole / strap -->
  <path d="M 134 42 C 120 46 114 56 122 72 L 132 88 L 172 88 L 182 72 C 190 56 184 46 170 42 Z"
        fill="#F87171" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Sweetheart / Scoop Neckline Opening showing inner lining -->
  <path d="M 134 42 C 142 56 162 56 170 42 C 160 62 144 62 134 42 Z"
        fill="#EF4444" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>

  <!-- Fitted Bodice Contour & Darts -->
  <path d="M 122 72 L 132 88 L 172 88 L 182 72 C 176 80 166 84 152 84 C 138 84 128 80 122 72 Z"
        fill="#DC2626" opacity="0.25"/>
  <line x1="142" y1="62" x2="140" y2="86" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="2 2"/>
  <line x1="162" y1="62" x2="164" y2="86" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="2 2"/>

  <!-- Flared A-Line Skirt -->
  <path d="M 132 86 L 82 168 C 112 174 192 174 222 168 L 172 86 Z"
        fill="#EF4444" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Skirt Drape Folds and 3-Tone Shading -->
  <g clip-path="url(#skirt-flare-clip)">
    <!-- Right side shadow -->
    <path d="M 172 86 L 222 168 L 185 168 L 158 86 Z" fill="#DC2626"/>
    <path d="M 195 110 L 222 168 L 205 168 Z" fill="#B91C1C"/>

    <!-- Left side pleat deep shadows -->
    <path d="M 132 86 L 102 168 L 115 168 L 140 86 Z" fill="#DC2626"/>
    <!-- Fold highlight crests -->
    <path d="M 132 86 Q 138 126 142 170" stroke="#FCA5A5" stroke-width="2.5" fill="none"/>
    <path d="M 152 86 Q 160 126 168 170" stroke="#FCA5A5" stroke-width="2.5" fill="none"/>
    <path d="M 142 86 Q 120 126 98 170" stroke="#FCA5A5" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Wavy Scalloped / Ruffled Hem Line -->
  <path d="M 82 168 C 102 175 122 168 142 173 C 162 168 182 175 202 170 C 212 168 222 168 222 168"
        stroke="#1E2A3B" stroke-width="2.2" fill="none"/>

  <!-- Cinched Waistband with Golden Buckle -->
  <path d="M 130 84 C 144 86 160 86 174 84 L 174 92 C 160 94 144 94 130 92 Z"
        fill="#1E2A3B" stroke="#1E2A3B" stroke-width="1.8"/>
  <rect x="146" y="83" width="12" height="10" rx="2" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.6"/>
  <rect x="149" y="85" width="6" height="6" rx="1" fill="#FEF3C7"/>

  <!-- Mannequin Wooden Pedestal Pole below hem -->
  <line x1="152" y1="172" x2="152" y2="186" stroke="#9A6945" stroke-width="4" stroke-linecap="round"/>
</svg>