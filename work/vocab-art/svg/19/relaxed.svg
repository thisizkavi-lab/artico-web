<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:relaxed" data-archetype="expressive-bust">
  <defs>
    <path id="relaxed-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="relaxed-head-clip">
      <use href="#relaxed-head"/>
    </clipPath>
  </defs>

  <!-- Cool Sage Green Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#DCFCE7"/>

  <!-- Comfy Plump Armchair / Pillow Behind Shoulders -->
  <path d="M 52 178 C 52 120, 78 98, 152 98 C 226 98, 252 120, 252 178 Z"
