  CHAPTER: 41 - Work and business idioms
  WORD: raise the bar (idiom)
  CONTEXTUAL_DEFINITION: Increase the expected standard or level of performance.
  PEDAGOGICAL_ARCHETYPE: 6 - Higher versus previous standard
