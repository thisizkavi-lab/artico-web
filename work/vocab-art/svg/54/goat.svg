<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:goat" data-archetype="hero-object">
  <defs>
    <!-- Farm Goat: backward curved ridged horns, chin goatee beard, rectangular horizontal pupil, cloven hooves -->
    <clipPath id="goat-body-clip">
      <path d="M 112 88 C 112 72 142 68 180 72 C 214 74 234 88 230 134 C 228 152 204 154 166 152 C 126 150 114 124 112 88 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="160" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="162" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Short Perked Upright Goat Tail -->
  <path d="M 228 108 C 238 98 244 100 242 112 C 238 120 232 122 226 120 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Slender Agile Hind Legs & Cloven Hooves -->
  <path d="M 200 126 L 198 162 L 210 162 L 216 128 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="198" y="156" width="12" height="6" fill="#451A03" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="204" y1="156" x2="204" y2="162" stroke="#FAF8F3" stroke-width="1.2" />

  <path d="M 214 128 L 218 160 L 228 160 L 230 132 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="218" y="154" width="10" height="6" fill="#451A03" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Front Legs & Cloven Hooves -->
  <path d="M 124 118 L 122 162 L 134 162 L 138 122 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="122" y="156" width="12" height="6" fill="#451A03" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="128" y1="156" x2="128" y2="162" stroke="#FAF8F3" stroke-width="1.2" />

  <path d="M 138 120 L 142 160 L 152 160 L 152 124 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="142" y="154" width="10" height="6" fill="#451A03" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Goat Body (Warm Caramel & Cream) -->
  <g clip-path="url(#goat-body-clip)">
    <!-- Base Warm Tan -->
    <rect x="100" y="65" width="140" height="95" fill="#F59E0B" />
    <!-- White belly and chest patch -->
    <ellipse cx="166" cy="144" rx="42" ry="20" fill="#FFFBEB" />
    <!-- Darker caramel spine band -->
    <path d="M 110 74 Q 170 70 230 84 L 230 96 Q 170 82 110 84 Z" fill="#B45309" />
    <!-- Lower body shadow -->
    <rect x="100" y="146" width="140" height="12" fill="#D97706" />
  </g>
  <!-- Body Contour -->
  <path d="M 112 88 C 112 72 142 68 180 72 C 214 74 234 88 230 134 C 228 152 204 154 166 152 C 126 150 114 124 112 88 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Backward Curved Ridged Horns -->
  <!-- Left Horn (Far) -->
  <path d="M 104 54 C 112 36 128 32 142 34 C 136 38 122 42 112 56 Z" fill="#D97706" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Horn (Near) -->
  <path d="M 94 56 C 104 32 122 28 138 30 C 130 36 114 40 102 60 Z" fill="#FDE68A" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Horn ridges -->
  <line x1="104" y1="48" x2="110" y2="44" stroke="#B45309" stroke-width="1.8" />
  <line x1="112" y1="42" x2="118" y2="38" stroke="#B45309" stroke-width="1.8" />
  <line x1="122" y1="36" x2="128" y2="33" stroke="#B45309" stroke-width="1.8" />

  <!-- Sideways Pointed Ears -->
  <ellipse cx="114" cy="68" rx="11" ry="5" transform="rotate(-15 114 68)" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2" />
  <ellipse cx="114" cy="68" rx="7" ry="2.5" transform="rotate(-15 114 68)" fill="#FDA4AF" />

  <!-- Goat Head & Neck -->
  <path d="M 112 78 C 108 62 98 60 88 66 C 78 72 74 88 84 98 C 94 106 110 104 116 92 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- White facial blaze stripes -->
  <path d="M 86 64 L 90 84 M 98 66 L 98 86" stroke="#FFFBEB" stroke-width="3" stroke-linecap="round" />

  <!-- Chin Goatee Beard (Iconic Goat Feature) -->
  <path d="M 76 96 C 68 112 64 122 72 120 C 78 118 80 106 82 98 Z" fill="#FFFBEB" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Horizontal Rectangular Pupil Eye (Characteristic of Goats) -->
  <circle cx="94" cy="74" r="5" fill="#FDE047" stroke="#1E2A3B" stroke-width="1.6" />
  <rect x="91" y="72.5" width="6" height="3" rx="1" fill="#1E2A3B" />

  <!-- Muzzle & Mouth -->
  <ellipse cx="78" cy="90" rx="10" ry="8" fill="#FFFBEB" stroke="#1E2A3B" stroke-width="2" />
  <!-- Nostril -->
  <circle cx="74" cy="88" r="2" fill="#78350F" />
  <path d="M 74 94 Q 78 97 82 94" fill="none" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round" />
</svg>