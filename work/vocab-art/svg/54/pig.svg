<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:pig" data-archetype="hero-object">
  <defs>
    <!-- Farm Pig: plump round pink body, curly corkscrew tail, flat disc snout with two nostrils, floppy ears -->
    <clipPath id="pig-body-clip">
      <path d="M 102 96 C 100 70 134 66 178 70 C 220 74 240 92 238 134 C 234 154 206 158 164 156 C 118 154 104 130 102 96 Z" />
    </clipPath>
    <clipPath id="pig-head-clip">
      <ellipse cx="106" cy="102" rx="28" ry="24" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="160" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="162" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Curly Corkscrew Tail (Classic Pig Feature) -->
  <path d="M 236 112 C 248 106 256 108 252 118 C 248 126 238 122 242 114 C 246 108 258 116 264 122" fill="none" stroke="#F472B6" stroke-width="5" stroke-linecap="round" />
  <path d="M 236 112 C 248 106 256 108 252 118 C 248 126 238 122 242 114 C 246 108 258 116 264 122" fill="none" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />

  <!-- Short Sturdy Trotters / Cloven Pig Feet -->
  <path d="M 194 130 L 192 162 L 206 162 L 210 132 Z" fill="#F472B6" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="192" y="156" width="14" height="6" fill="#DB2777" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="199" y1="156" x2="199" y2="162" stroke="#FAF8F3" stroke-width="1.2" />

  <path d="M 212 132 L 216 160 L 226 160 L 228 134 Z" fill="#EC4899" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="216" y="154" width="10" height="6" fill="#BE185D" stroke="#1E2A3B" stroke-width="1.6" />

  <path d="M 120 126 L 118 162 L 132 162 L 136 128 Z" fill="#F472B6" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="118" y="156" width="14" height="6" fill="#DB2777" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="125" y1="156" x2="125" y2="162" stroke="#FAF8F3" stroke-width="1.2" />

  <path d="M 136 128 L 140 160 L 150 160 L 150 130 Z" fill="#EC4899" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="140" y="154" width="10" height="6" fill="#BE185D" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Plump Pink Barrel Body -->
  <g clip-path="url(#pig-body-clip)">
    <!-- Base Rosy Pink -->
    <rect x="95" y="65" width="150" height="95" fill="#FBCFE8" />
    <!-- Bright pink back highlight -->
    <ellipse cx="170" cy="88" rx="42" ry="18" fill="#FDF2F8" />
    <!-- Flank rosy tone -->
    <ellipse cx="180" cy="116" rx="36" ry="24" fill="#F472B6" opacity="0.3" />
    <!-- Lower shadow -->
    <rect x="95" y="146" width="150" height="15" fill="#DB2777" opacity="0.4" />
  </g>
  <!-- Body Contour -->
  <path d="M 102 96 C 100 70 134 66 178 70 C 220 74 240 92 238 134 C 234 154 206 158 164 156 C 118 154 104 130 102 96 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Floppy Triangular Ears -->
  <!-- Left Ear (Far) -->
  <polygon points="102,76 86,66 98,90" fill="#EC4899" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Pig Head -->
  <g clip-path="url(#pig-head-clip)">
    <ellipse cx="106" cy="102" rx="28" ry="24" fill="#FBCFE8" />
    <!-- Rosy cheek blush -->
    <circle cx="112" cy="112" r="8" fill="#F472B6" opacity="0.6" />
  </g>
  <ellipse cx="106" cy="102" rx="28" ry="24" fill="none" stroke="#1E2A3B" stroke-width="2.4" />

  <!-- Right Floppy Ear (In Front, folded down) -->
  <polygon points="118,80 110,64 132,76" fill="#F472B6" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <polygon points="118,78 114,68 128,76" fill="#FDA4AF" />

  <!-- Cheerful Happy Eye (Curved smile arc or shiny dot) -->
  <ellipse cx="104" cy="94" rx="4" ry="4.5" fill="#1E2A3B" />
  <circle cx="102.5" cy="92.5" r="1.3" fill="#FFFFFF" />

  <!-- Flat Disc Pig Snout with Two Big Round Nostrils (The iconic snout!) -->
  <ellipse cx="76" cy="108" rx="14" ry="12" fill="#F472B6" stroke="#1E2A3B" stroke-width="2.4" />
  <ellipse cx="76" cy="108" rx="11" ry="9" fill="#FB7185" />
  <!-- Nostrils -->
  <ellipse cx="72" cy="108" rx="3" ry="4.5" fill="#881337" />
  <ellipse cx="80" cy="108" rx="3" ry="4.5" fill="#881337" />

  <!-- Smiling Mouth under Snout -->
  <path d="M 80 122 Q 90 126 100 120" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
</svg>