  CHAPTER: 41 - Work and business idioms
  WORD: get the ball rolling (idiom)
  CONTEXTUAL_DEFINITION: Start a project or process so that work begins and others can join in.
  PEDAGOGICAL_ARCHETYPE: 4 - Initiating action with visible consequences
  SYNONYM_GUARD: The ball is the first push that starts a sequence of project blocks moving; the office team and work-plan pieces establish the figurative project sense.
