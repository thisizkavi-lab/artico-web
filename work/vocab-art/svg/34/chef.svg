  <path d="M 108 82 Q 114 77 120 82 M 132 82 Q 138 77 144 82" fill="none" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="106" cy="90" r="5" fill="#F58D82" opacity="0.45"/>
  <circle cx="146" cy="90" r="5" fill="#F58D82" opacity="0.45"/>
  <path d="M 126 93 C 120 90, 111 92, 109 96 C 115 98, 122 97, 126 95 C 130 97, 137 98, 143 96 C 141 92, 132 90, 126 93 Z"
        fill="#3A2E2B" stroke="#1E2A3B" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 119 101 Q 126 106 133 101" fill="none" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round"/>

  <!-- Raised Sleeve & Hand Holding Wooden Tasting Spoon Up From Pot -->
  <path d="M 164 140 L 188 114 L 200 126 L 178 154 Z"
        fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Wooden Spoon Held in Hand (Bowl Raised with Sauce) -->
  <line x1="176" y1="88" x2="203" y2="122" stroke="#1E2A3B" stroke-width="6.4" stroke-linecap="round"/>
  <line x1="176" y1="88" x2="203" y2="122" stroke="#C88446" stroke-width="3.8" stroke-linecap="round"/>
  <ellipse cx="174" cy="85" rx="9.5" ry="6.2" transform="rotate(50 174 85)" fill="#DA9758" stroke="#1E2A3B" stroke-width="2.1"/>
  <ellipse cx="174" cy="85" rx="5.8" ry="3.4" transform="rotate(50 174 85)" fill="#D9483B"/>
  <circle cx="195" cy="113" r="9" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Gleaming Copper Saucepan on Stove Right -->
  <g clip-path="url(#chef-pot-clip)">
    <rect x="192" y="124" width="76" height="40" fill="#D97A43"/>
    <rect x="244" y="124" width="24" height="40" fill="#B55B28"/>
    <rect x="200" y="124" width="12" height="40" fill="#F2A472" opacity="0.65"/>
  </g>
  <rect x="192" y="124" width="76" height="40" rx="6" fill="none" stroke="#1E2A3B" stroke-width="2.6"/>
  <path d="M 184 133 L 192 133 M 268 133 L 277 133" stroke="#1E2A3B" stroke-width="4" stroke-linecap="round"/>
  <rect x="189" y="121" width="82" height="7" rx="3.5" fill="#E8925E" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Fragrant Curling Steam Above Pot -->
  <g fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round">
    <path d="M 220 112 C 215 102, 225 94, 219 83"/>
    <path d="M 236 114 C 231 102, 242 92, 235 78"/>
    <path d="M 252 112 C 247 102, 257 94, 251 84"/>
  </g>
</svg>
