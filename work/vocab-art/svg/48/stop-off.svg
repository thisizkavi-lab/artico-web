<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: stop off
  CONTEXTUAL_DEFINITION: Make a brief stop somewhere during a longer journey before continuing.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler pausing at a roadside viewpoint while the road clearly continues beyond the stop.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Action
  SYNONYM_GUARD: Preserve the sense of a short intermediate pause in an ongoing trip, not the final destination or a separate excursion.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A small tour car pauses at a scenic rest pullout; one passenger steps out to stretch beside the car while the road curves onward in both directions.
-->
