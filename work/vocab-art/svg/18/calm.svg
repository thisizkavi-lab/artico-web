    - Backdrop: Shared room with one lightly gusting open window.
    - Context_Layer: Two peers startled by loose papers.
    - Focal_Layer: Calm person sits steadily and breathes evenly.
    - Details_Layer: Level shoulders, soft face, floating paper and slow breath arcs.
    - Lighting_Layer: Cool gentle halo around the composed figure.
-->
