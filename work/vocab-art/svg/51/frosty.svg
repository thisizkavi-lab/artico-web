<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: frosty (Adjective)
  CONTEXTUAL_DEFINITION: A surface or morning covered with white frost crystals, shown outdoors.
  PEDAGOGICAL_ART_DIRECTOR: Make the whole garden look cold and frost-covered at dawn, with pale-coated grass and branch tips.
  PEDAGOGICAL_ARCHETYPE: 3 - Broad weather condition
  SYNONYM_GUARD: Frosty describes the frosted morning scene; the single crystalline deposit on a leaf belongs to frost.
