<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:proud" data-archetype="expressive-bust">
  <defs>
    <path id="proud-head" d="M 112 56 C 112 32, 192 32, 192 56 L 190 90 C 190 118, 170 132, 152 132 C 134 132, 114 118, 114 90 Z"/>
    <clipPath id="proud-head-clip">
      <use href="#proud-head"/>
    </clipPath>
    <clipPath id="proud-torso-clip">
      <path d="M 72 178 C 80 136, 106 120, 152 120 C 198 120, 224 136, 232 178 Z"/>
    </clipPath>
  </defs>

  <!-- Golden Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEF3C7"/>

  <!-- Hands on Hips (Proud Puffed Chest Posture) -->
  <path d="M 94 136 L 68 154 L 84 178" stroke="#1E2A3B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 94 136 L 68 154 L 84 178" stroke="#5479AC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 210 136 L 236 154 L 220 178" stroke="#1E2A3B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 210 136 L 236 154 L 220 178" stroke="#5479AC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Puffed Chest Torso (Ren) -->
  <g clip-path="url(#proud-torso-clip)">
    <rect x="68" y="116" width="168" height="66" fill="#5479AC"/>
    <!-- Gold 1st Place Medal on Chest Ribbon -->
    <path d="M 136 120 L 152 144 L 168 120" stroke="#CE3D4E" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="152" cy="148" r="10" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2"/>
    <polygon points="152,143 154,147 158,147 155,150 156,154 152,151 148,154 149,150 146,147 150,147" fill="#FEF3C7"/>
    <path d="M 68 178 C 78 144, 98 130, 118 126 L 118 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 72 178 C 80 136, 106 120, 152 120 C 198 120, 224 136, 232 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="108" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour Tilted Slightly Up in Pride -->
  <g clip-path="url(#proud-head-clip)">
    <rect x="105" y="30" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="92" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <ellipse cx="176" cy="92" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <path d="M 112 114 C 132 130, 172 130, 192 114 L 192 134 L 112 134 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#proud-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Ren) -->
  <path d="M 106 62 C 102 32, 124 16, 152 16 C 180 16, 202 32, 198 62 C 192 44, 176 34, 152 34 C 128 34, 114 44, 106 62 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Confident High Eyebrows -->
  <path d="M 124 64 L 144 62" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 160 62 L 180 64" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Proud Beaming Eyes (Closed Smiling Curves) -->
  <path d="M 126 74 Q 134 68 142 74" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 162 74 Q 170 68 178 74" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Broad Smug / Proud Smile -->
  <path d="M 134 90 C 134 110, 170 110, 170 90 Z" fill="#CE3D4E" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 142 106 C 146 100, 158 100, 162 106 Z" fill="#F58D82"/>
  <path d="M 136 91 Q 152 95 168 91" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Proud Sparkle Stars -->
  <path d="M 82 46 Q 86 46 86 40 Q 86 46 90 46 Q 86 46 86 52 Q 86 46 82 46 Z" fill="#F59E0B"/>
  <path d="M 218 46 Q 222 46 222 40 Q 222 46 226 46 Q 222 46 222 52 Q 222 46 218 46 Z" fill="#F59E0B"/>
</svg>
