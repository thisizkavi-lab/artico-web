<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:grateful" data-archetype="expressive-bust">
  <defs>
    <path id="grateful-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="grateful-head-clip">
      <use href="#grateful-head"/>
    </clipPath>
    <clipPath id="grateful-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Warm Gentle Peach Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FDF2F8"/>

  <!-- Hands Pressed Over Heart in Deep Gratitude -->
  <!-- Left Hand over chest -->
  <path d="M 102 168 L 136 142 L 144 154 L 112 178 Z"
        fill="#F3ECE1" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="146" cy="146" rx="11" ry="8" transform="rotate(-15 146 146)" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2"/>
  <!-- Right Hand crossed over left over heart -->
  <path d="M 198 168 L 164 142 L 156 154 L 188 178 Z"
        fill="#F3ECE1" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="158" cy="146" rx="11" ry="8" transform="rotate(15 158 146)" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Torso (Mia) -->
  <g clip-path="url(#grateful-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#F3ECE1"/>
    <path d="M 140 126 L 152 142 L 164 126 Z" fill="#CE3D4E"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#E2DACD"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Warm Touched Blush -->
  <g clip-path="url(#grateful-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <ellipse cx="128" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <ellipse cx="176" cy="94" rx="10" ry="6" fill="#F58D82" opacity="0.6"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#grateful-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Mia) -->
  <path d="M 104 64 C 100 34, 122 18, 152 18 C 182 18, 204 34, 200 64 C 206 90, 206 126, 194 142 C 188 132, 186 96, 184 72 C 176 44, 128 44, 120 72 C 118 96, 116 132, 110 142 C 98 126, 98 90, 104 64 Z"
        fill="#6E473B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Soft Touched Gentle Eyebrows -->
  <path d="M 126 68 Q 134 64 142 68" fill="none" stroke="#1E2A3B" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M 178 68 Q 170 64 162 68" fill="none" stroke="#1E2A3B" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Gentle Closed Smiling Eyes -->
  <path d="M 126 78 Q 134 72 142 78" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 162 78 Q 170 72 178 78" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Soft Warm Grateful Smile -->
  <path d="M 138 98 Q 152 108 166 98" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Small Warm Heart Sparkle near Hands -->
  <path d="M 152 130 C 152 126, 147 124, 144 127 C 141 130, 152 138, 152 138 C 152 138, 163 130, 160 127 C 157 124, 152 126, 152 130 Z"
        fill="#F43F5E" stroke="#1E2A3B" stroke-width="1.4"/>
</svg>
