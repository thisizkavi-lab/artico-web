<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: round-trip ticket
  CONTEXTUAL_DEFINITION: A physical ticket covering both an outward journey and a return journey.
  PEDAGOGICAL_ART_DIRECTOR: Make the ticket document central and print two opposing route arrows on it.
  PEDAGOGICAL_ARCHETYPE: 2 - Hero Object
  SYNONYM_GUARD: Show a physical ticket carrying both directions; distinguish it from the abstract round-trip route diagram.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A large ticket held above a pale tabletop displays an outward arrow and a separate return arrow between matching home and plane icons.
-->
