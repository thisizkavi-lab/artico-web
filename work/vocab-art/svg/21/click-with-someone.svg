<!-- SELF_PROMPT:
  CHAPTER: 21 — Family and relationships
  WORD: click with someone (Idiom)
  CONTEXTUAL_DEFINITION: To feel an immediate, easy connection with someone.
  PEDAGOGICAL_ARCHETYPE: 4 — Conceptual metaphor
  SYNONYM_GUARD: Two people at a first introduction discover the same interest and laugh together, with a small instant spark motif; this is immediate rapport, not a device clicking.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Community bookshop cafe.
    - Context_Layer: Shared open sketchbook and two cups.
    - Focal_Layer: Newly introduced people lean in, both recognizing the same drawing.
    - Details_Layer: Their mirrored delighted expressions and one warm spark.
    - Lighting_Layer: Soft halo links their eyelines.
-->
