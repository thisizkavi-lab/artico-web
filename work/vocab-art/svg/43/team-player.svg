<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: team player
  CONTEXTUAL_DEFINITION: A person who contributes constructively to a group.
  PEDAGOGICAL_ART_DIRECTOR: Highlight one coworker offering a needed piece that helps the whole team complete a shared task.
  PEDAGOGICAL_ARCHETYPE: 33 - Individual contribution to a team
  SYNONYM_GUARD: Center the individual contributor, not only a group acting together or a team leader directing others.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Set three coworkers around a shared project panel; center one highlighted worker at x=152 placing a distinct missing green component into the panel while teammates on each side hold other completed parts.
-->
