 CHAPTER: 67 - Media and celebrity
 WORD: in the public eye
 CONTEXTUAL_DEFINITION: Constantly visible to and watched by the public.
 PEDAGOGICAL_ARCHETYPE: central public figure watched by an audience and recording cameras
