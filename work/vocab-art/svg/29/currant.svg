<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:currant" data-archetype="hero-object">
  <defs>
    <!-- Currant: dried Zante currants (tiny, wrinkled, deep black-violet dried grapes) in a porcelain tasting spoon and scattered on surface -->
    <clipPath id="spoon-bowl-clip">
      <ellipse cx="148" cy="118" rx="54" ry="28" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="148" cy="158" rx="68" ry="10" fill="#DDD4C3" />

  <!-- Elegant Ceramic Tasting Spoon Handle (extending left) -->
  <path d="M 44 98 C 66 102 96 110 114 116 L 112 124 C 92 118 64 110 42 106 Z" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Spoon bowl body -->
  <ellipse cx="152" cy="120" rx="58" ry="32" fill="#F1F5F9" stroke="#1E2A3B" stroke-width="2.6" />
  <ellipse cx="148" cy="118" rx="54" ry="28" fill="#FFFFFF" />

  <!-- Spoon Interior filled with dark wrinkled dried currants -->
  <g clip-path="url(#spoon-bowl-clip)">
    <!-- Base mound fill -->
    <ellipse cx="148" cy="122" rx="48" ry="24" fill="#1E1B4B" />

    <!-- Individual Wrinkled Currant Berries in Spoon -->
    <!-- Back layer -->
    <ellipse cx="120" cy="110" rx="7" ry="5.5" fill="#312E81" stroke="#0F172A" stroke-width="1.2" />
    <ellipse cx="134" cy="106" rx="6.5" ry="5" fill="#1E1B4B" stroke="#0F172A" stroke-width="1.2" />
    <ellipse cx="148" cy="104" rx="7" ry="6" fill="#312E81" stroke="#0F172A" stroke-width="1.2" />
    <ellipse cx="162" cy="106" rx="6" ry="5" fill="#1E1B4B" stroke="#0F172A" stroke-width="1.2" />
    <ellipse cx="174" cy="110" rx="7" ry="5.5" fill="#312E81" stroke="#0F172A" stroke-width="1.2" />

    <!-- Center mound -->
    <ellipse cx="116" cy="120" rx="7.5" ry="6" fill="#1E1B4B" stroke="#0F172A" stroke-width="1.4" />
    <ellipse cx="130" cy="116" rx="8" ry="6.5" fill="#312E81" stroke="#0F172A" stroke-width="1.4" />
    <ellipse cx="146" cy="114" rx="8.5" ry="7" fill="#4338CA" stroke="#0F172A" stroke-width="1.4" />
    <ellipse cx="162" cy="116" rx="8" ry="6.5" fill="#312E81" stroke="#0F172A" stroke-width="1.4" />
    <ellipse cx="178" cy="120" rx="7.5" ry="6" fill="#1E1B4B" stroke="#0F172A" stroke-width="1.4" />

    <!-- Front layer -->
    <ellipse cx="124" cy="128" rx="8" ry="6.5" fill="#312E81" stroke="#0F172A" stroke-width="1.4" />
    <ellipse cx="140" cy="126" rx="8.5" ry="7" fill="#312E81" stroke="#0F172A" stroke-width="1.4" />
    <ellipse cx="156" cy="126" rx="8" ry="7" fill="#1E1B4B" stroke="#0F172A" stroke-width="1.4" />
    <ellipse cx="170" cy="128" rx="7.5" ry="6.5" fill="#0F172A" stroke="#0F172A" stroke-width="1.4" />

    <!-- Wrinkle fold lines on dried currants -->
    <path d="M 143 112 Q 146 116 148 114" stroke="#6366F1" stroke-width="1" fill="none" />
    <path d="M 128 114 Q 131 117 133 115" stroke="#6366F1" stroke-width="1" fill="none" />
    <path d="M 158 114 Q 161 117 164 115" stroke="#6366F1" stroke-width="1" fill="none" />
    <path d="M 137 124 Q 140 128 143 125" stroke="#6366F1" stroke-width="1" fill="none" />
    <path d="M 153 124 Q 156 128 158 125" stroke="#6366F1" stroke-width="1" fill="none" />
  </g>

  <!-- Rim contour highlight on porcelain spoon -->
  <path d="M 94 120 C 94 136 120 148 152 148 C 184 148 210 136 210 120" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Loose Scattered Dried Currants on Table Surface in Foreground -->
  <!-- Currant 1 -->
  <g transform="translate(224, 150)">
    <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="1.8" />
    <path d="M -3 -1 Q 0 2 3 -1" stroke="#6366F1" stroke-width="1" fill="none" />
  </g>
  <!-- Currant 2 -->
  <g transform="translate(238, 154) rotate(25)">
    <ellipse cx="0" cy="0" rx="6.5" ry="5" fill="#312E81" stroke="#1E2A3B" stroke-width="1.8" />
    <path d="M -2 -1 Q 1 1 3 0" stroke="#818CF8" stroke-width="1" fill="none" />
  </g>
  <!-- Currant 3 (Left) -->
  <g transform="translate(94, 152) rotate(-15)">
    <ellipse cx="0" cy="0" rx="7" ry="5" fill="#1E1B4B" stroke="#1E2A3B" stroke-width="1.8" />
    <path d="M -2 -1 Q 0 1 2 0" stroke="#6366F1" stroke-width="1" fill="none" />
  </g>
</svg>
