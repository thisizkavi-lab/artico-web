<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:lime" data-archetype="hero-object">
  <defs>
    <!-- Lime: rounder vivid lime-green citrus, leaf, cut cross section with jewel emerald pulp segments -->
    <clipPath id="lime-body-clip">
      <circle cx="112" cy="108" r="44" />
    </clipPath>
    <clipPath id="lime-half-clip">
      <circle cx="204" cy="116" r="38" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="112" cy="162" rx="46" ry="9" fill="#DDD4C3" />
  <ellipse cx="204" cy="164" rx="40" ry="8" fill="#DDD4C3" />

  <!-- Green Stem and Citrus Leaf -->
  <path d="M 72 82 C 60 76 56 64 62 50 C 76 52 86 64 86 78 Z" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 64 54 Q 74 68 84 76" stroke="#365314" stroke-width="1.6" fill="none" />
  <circle cx="86" cy="78" r="3" fill="#365314" stroke="#1E2A3B" stroke-width="1.8" />

  <!-- Whole Lime on Left -->
  <g clip-path="url(#lime-body-clip)">
    <!-- Base vibrant lime green -->
    <circle cx="112" cy="108" r="44" fill="#65A30D" />
    <!-- Underside shadow -->
    <path d="M 72 118 C 84 148 132 154 156 132 L 156 156 L 72 156 Z" fill="#3F6212" />
    <!-- Top-left bright green highlight -->
    <ellipse cx="98" cy="88" rx="16" ry="22" transform="rotate(-25 98 88)" fill="#84CC16" opacity="0.85" />
    <ellipse cx="94" cy="82" rx="6" ry="10" transform="rotate(-25 94 82)" fill="#BEF264" opacity="0.75" />
    <!-- Fine peel dimples -->
    <circle cx="92" cy="112" r="1.2" fill="#3F6212" />
    <circle cx="120" cy="94" r="1.2" fill="#3F6212" />
    <circle cx="132" cy="116" r="1.2" fill="#3F6212" />
    <circle cx="110" cy="132" r="1.2" fill="#3F6212" />
  </g>
  <!-- Lime Contour & small tip -->
  <circle cx="112" cy="108" r="44" fill="none" stroke="#1E2A3B" stroke-width="2.6" />
  <path d="M 154 104 C 158 106 158 110 154 112" stroke="#1E2A3B" stroke-width="2" fill="none" />

  <!-- Cut Half Lime in Foreground Right -->
  <circle cx="204" cy="116" r="38" fill="#65A30D" stroke="#1E2A3B" stroke-width="2.6" />
  <g clip-path="url(#lime-half-clip)">
    <!-- Thin white pith layer -->
    <circle cx="204" cy="116" r="34" fill="#ECFCCB" />
    <!-- Center white core dot -->
    <circle cx="204" cy="116" r="4" fill="#ECFCCB" stroke="#D9F99D" stroke-width="1" />

    <!-- 8 Emerald Lime Wedges -->
    <path d="M 202 110 L 197 89 C 202 88 207 88 211 89 L 206 110 Z" fill="#A3E635" stroke="#ECFCCB" stroke-width="2" />
    <path d="M 209 112 L 224 96 C 228 100 231 104 232 108 L 211 115 Z" fill="#84CC16" stroke="#ECFCCB" stroke-width="2" />
    <path d="M 211 118 L 233 121 C 232 126 230 130 227 134 L 209 122 Z" fill="#65A30D" stroke="#ECFCCB" stroke-width="2" />
    <path d="M 206 122 L 221 137 C 217 141 212 143 207 144 L 203 124 Z" fill="#4D7C0F" stroke="#ECFCCB" stroke-width="2" />
    <path d="M 201 122 L 196 144 C 191 142 186 139 183 136 L 197 121 Z" fill="#4D7C0F" stroke="#ECFCCB" stroke-width="2" />
    <path d="M 198 116 L 177 120 C 177 115 179 111 182 107 L 200 114 Z" fill="#65A30D" stroke="#ECFCCB" stroke-width="2" />
    <path d="M 201 111 L 186 97 C 190 94 194 91 199 90 L 204 110 Z" fill="#84CC16" stroke="#ECFCCB" stroke-width="2" />

    <!-- Dewy glistening highlights on juice sacs -->
    <circle cx="204" cy="98" r="1.4" fill="#FFFFFF" opacity="0.8" />
    <circle cx="218" cy="106" r="1.4" fill="#FFFFFF" opacity="0.8" />
    <circle cx="220" cy="126" r="1.4" fill="#FFFFFF" opacity="0.8" />
    <circle cx="190" cy="124" r="1.4" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
