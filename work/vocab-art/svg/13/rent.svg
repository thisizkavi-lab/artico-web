<!-- SELF_PROMPT:
  CHAPTER: 13 — Moving and renting
  WORD: rent (Verb / noun)
  CONTEXTUAL_DEFINITION: Pay to use a home that belongs to someone else.
  PEDAGOGICAL_ARCHETYPE: 4 — Payment-for-use action
  SYNONYM_GUARD: Show a renter paying for temporary use of one home, not a tear in fabric; renting is the broader agreement and occupancy arrangement.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Small house exterior with a rental key.
    - Context_Layer: Landlord and tenant face each other.
    - Focal_Layer: Renter hands an envelope payment while landlord holds the home key.
    - Details_Layer: Occupied window, payment tray, and repeated monthly coin stack.
    - Lighting_Layer: Motion cue loops from payment to key to home.
-->
