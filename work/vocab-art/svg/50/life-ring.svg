<!-- SELF_PROMPT:
  CHAPTER: 50 - Beach
  WORD: life ring (Noun)
  CONTEXTUAL_DEFINITION: A circular throwable flotation device with a rope, kept near water for rescue.
  PEDAGOGICAL_ART_DIRECTOR: Make the circular shape and central opening unmistakable; include reflective white bands and a perimeter rope.
  PEDAGOGICAL_ARCHETYPE: 1 - Concrete safety object
  SYNONYM_GUARD: This is a throwable ring, not the wearable flotation vest shown by life preserver.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Bright orange life ring lying on sandy shore, with cream panels, a visible rope loop, ocean behind it, and a clear central hole.
-->
