<!-- SELF_PROMPT:
  CHAPTER: 46 - Maps and directions
  WORD: direction
  CONTEXTUAL_DEFINITION: The way a person or route is oriented toward a destination.
  PEDAGOGICAL_ART_DIRECTOR: Show a compass rose aligned with a clear route arrow that points from a traveler toward one chosen landmark.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / direction diagram
  SYNONYM_GUARD: Depict orientation/bearing rather than a list of spoken instructions or a compass object alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Traveler marker at (62,135), destination at (239,51); bold route vector runs northeast between them; small compass at (151,96) aligns its needle to the same bearing.
-->
