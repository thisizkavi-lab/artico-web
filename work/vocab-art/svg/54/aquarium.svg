<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:aquarium" data-archetype="scene">
  <defs>
    <!-- Public Aquarium: grand deep-blue ocean exhibit with manta ray, sea turtle, caustic sunbeams, silhouette visitors -->
    <clipPath id="aquarium-glass-clip">
      <rect x="24" y="20" width="256" height="136" rx="12" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="172" rx="122" ry="12" fill="#EAE3D5" />

  <!-- Outer Architectural Framing Wall of the Aquarium Hall -->
  <rect x="22" y="14" width="260" height="144" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />

  <!-- Massive Ocean Viewing Glass Tank -->
  <g clip-path="url(#aquarium-glass-clip)">
    <!-- Deep oceanic gradient bands -->
    <rect x="20" y="20" width="264" height="40" fill="#0284C7" />
    <rect x="20" y="60" width="264" height="50" fill="#0369A1" />
    <rect x="20" y="110" width="264" height="50" fill="#075985" />

    <!-- Soft Underwater Sunbeams / Caustic Rays -->
    <polygon points="50,20 80,20 140,156 90,156" fill="#38BDF8" opacity="0.15" />
    <polygon points="120,20 160,20 220,156 160,156" fill="#38BDF8" opacity="0.15" />
    <polygon points="200,20 230,20 280,156 240,156" fill="#38BDF8" opacity="0.12" />

    <!-- Sea Floor Reef Rock Formations -->
    <path d="M 20 156 Q 60 134 100 146 Q 140 158 180 148 Q 220 138 284 156 Z" fill="#0c4a6e" />
    <circle cx="240" cy="144" r="8" fill="#14532D" opacity="0.6" />
    <circle cx="254" cy="140" r="10" fill="#14532D" opacity="0.6" />

    <!-- Graceful Manta Ray Gliding Through Ocean -->
    <path d="M 152 74 C 130 64 96 66 74 76 C 104 88 126 94 152 90 C 178 94 200 88 230 76 C 208 66 174 64 152 74 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Manta dark dorsal wings -->
    <path d="M 152 74 C 130 66 102 68 84 76 C 108 84 130 86 152 82 C 174 86 196 84 220 76 C 202 68 174 66 152 74 Z" fill="#334155" />
    <!-- Manta cephalic fins (horns) -->
    <path d="M 146 72 Q 144 64 148 64 M 158 72 Q 160 64 156 64" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Long slender whip tail -->
    <path d="M 152 90 Q 154 116 162 138" stroke="#F8FAFC" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Swimming Sea Turtle in Distance -->
    <ellipse cx="78" cy="48" rx="10" ry="7" transform="rotate(-15 78 48)" fill="#059669" stroke="#022c22" stroke-width="1.2" />
    <!-- Flippers -->
    <path d="M 72 44 Q 60 38 66 48 M 82 48 Q 90 42 86 52" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- School of Tiny Tropical Fish -->
    <polygon points="214,50 222,46 222,54" fill="#FACC15" />
    <polygon points="228,54 236,50 236,58" fill="#FACC15" />
    <polygon points="220,62 228,58 228,66" fill="#FACC15" />
    <polygon points="240,60 248,56 248,64" fill="#FACC15" />

    <!-- Soft Rising Micro-Bubbles -->
    <circle cx="106" cy="110" r="2" fill="#BAE6FD" opacity="0.6" />
    <circle cx="108" cy="98" r="1.5" fill="#BAE6FD" opacity="0.6" />
    <circle cx="196" cy="120" r="2.5" fill="#BAE6FD" opacity="0.6" />
    <circle cx="194" cy="106" r="1.8" fill="#BAE6FD" opacity="0.6" />

    <!-- Subtle Glass Refraction Highlights -->
    <line x1="30" y1="26" x2="274" y2="26" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Glass Tank Thick Bevel Rim -->
  <rect x="24" y="20" width="256" height="136" rx="12" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Foreground Dark Silhouettes of Visitors Looking Up in Wonder -->
  <!-- Viewing Floor -->
  <path d="M 12 156 L 292 156 L 292 184 C 292 188 288 192 284 192 L 20 192 C 16 192 12 188 12 184 Z" fill="#090D16" />

  <!-- Child Silhouette pointing at manta ray -->
  <circle cx="86" cy="144" r="7" fill="#090D16" />
  <path d="M 80 156 C 80 148 92 148 92 156 Z" fill="#090D16" />
  <path d="M 88 150 Q 98 140 106 134" stroke="#090D16" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Parent Silhouette standing beside child -->
  <circle cx="64" cy="132" r="8" fill="#090D16" />
  <path d="M 56 156 C 56 140 72 140 72 156 Z" fill="#090D16" />
</svg>