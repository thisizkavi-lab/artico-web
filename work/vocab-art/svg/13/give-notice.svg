  COORDINATE_BLUEPRINT:
    - Backdrop: Rental home doorway and small calendar with several future squares.
    - Context_Layer: Landlord waits at the door.
    - Focal_Layer: Tenant hands a blank formal notice sheet to landlord.
    - Details_Layer: Forward calendar arrow signals advance warning.
    - Lighting_Layer: Blue directional cue leads from notice to future calendar date.
-->
