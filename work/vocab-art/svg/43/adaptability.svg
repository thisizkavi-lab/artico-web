<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: adaptability
  CONTEXTUAL_DEFINITION: The ability to adjust successfully when circumstances change.
  PEDAGOGICAL_ART_DIRECTOR: Make a worker's capacity to choose a new route around a changed condition visible.
  PEDAGOGICAL_ARCHETYPE: 2 - Flexible response
  SYNONYM_GUARD: Show a general capacity for adjustment through a changed route and new options, distinct from the adjective adaptable applied to a person.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Show a worker at x=101..151 moving a blue path marker around a new obstacle at x=160..179. Let a route split toward two workable alternatives and reconnect at a shared goal near x=233, y=62.
-->
