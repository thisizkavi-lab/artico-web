<!-- SELF_PROMPT:
  CHAPTER: 45 - Driving a car
  WORD: windshield
  CONTEXTUAL_DEFINITION: The large front glass screen that protects the driver from wind and weather.
  PEDAGOGICAL_ART_DIRECTOR: Frame the front upper body of a car and make the broad sloped windshield the luminous focal part, with two wiper blades at its base.
  PEDAGOGICAL_ARCHETYPE: 2 - Part-of-whole focus callout
  SYNONYM_GUARD: The front window, not a side window, rear window, or a house window.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Car front faces right. Muted body from x=39..256; windshield is a wide sloped pane x=108..220 y=55..111 with blue glass and a golden callout. Wipers rest along the lower edge at y=112.
-->
