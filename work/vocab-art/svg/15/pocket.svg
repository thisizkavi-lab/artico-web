<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:pocket" data-archetype="part-focus">
  <defs>
    <clipPath id="pocket-shield-clip">
      <path d="M 104 56 L 200 56 L 200 118 L 152 152 L 104 118 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Soft Golden Focus Halo Behind Pocket Zone -->
  <ellipse cx="152" cy="100" rx="76" ry="58" fill="#FEF3C7"/>
  <ellipse cx="152" cy="100" rx="64" ry="46" fill="#FDE68A" opacity="0.6"/>

  <!-- GHOSTED CONTEXT: Denim Garment Body Swatch Behind Pocket -->
  <rect x="52" y="24" width="200" height="144" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Ghosted Fabric Twill Diagonal Lines -->
  <line x1="60" y1="24" x2="80" y2="44" stroke="#94A3B8" stroke-width="1.2" opacity="0.4"/>
  <line x1="220" y1="140" x2="240" y2="160" stroke="#94A3B8" stroke-width="1.2" opacity="0.4"/>
  <line x1="68" y1="24" x2="216" y2="168" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Item Peeking Out from Inside Pocket: Vintage Brass Comb / Fountain Pen -->
  <path d="M 124 34 L 132 34 L 132 64 L 124 64 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.8"/>
  <path d="M 128 34 L 128 56" stroke="#FEF3C7" stroke-width="1.5"/>
  <!-- Fountain Pen Clip -->
  <path d="M 132 38 L 136 40 L 136 58 L 132 58" stroke="#1E2A3B" stroke-width="1.8" fill="none"/>

  <!-- FULL-COLOR TARGET PART: Iconic Pentagonal Patch Pocket -->
  <!-- Pocket Outer Body -->
  <path d="M 104 56 L 200 56 L 200 118 L 152 152 L 104 118 Z"
        fill="#2563EB" stroke="#1E2A3B" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- 3-Tone Shading & Classic Arcuate Stitching inside Pocket -->
  <g clip-path="url(#pocket-shield-clip)">
    <!-- Right side shadow -->
    <path d="M 152 56 L 200 56 L 200 118 L 152 152 Z" fill="#1D4ED8"/>

    <!-- Folded Top Opening Hem Band -->
    <rect x="104" y="56" width="96" height="14" fill="#1E3A8A"/>
    <line x1="104" y1="70" x2="200" y2="70" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 2"/>

    <!-- Decorative Arcuate Double Curved Pocket Stitching -->
    <path d="M 114 88 C 130 114 146 114 152 98 C 158 114 174 114 190 88"
          stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 114 93 C 130 119 146 119 152 103 C 158 119 174 119 190 93"
          stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Lower point corner shadow -->
    <polygon points="152,152 134,139 170,139" fill="#172554" opacity="0.4"/>
  </g>

  <!-- Pocket Outer Perimeter Double Tobacco Topstitching -->
  <path d="M 109 68 L 109 116 L 152 146 L 195 116 L 195 68"
        stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 2" fill="none"/>

  <!-- Top Stress Reinforcement Copper Rivets (Key Jeans Pocket Detail) -->
  <!-- Left Corner Rivet -->
  <circle cx="108" cy="62" r="3.6" fill="#D97706" stroke="#1E2A3B" stroke-width="1.4"/>
  <circle cx="108" cy="62" r="1.4" fill="#FEF3C7"/>

  <!-- Right Corner Rivet -->
  <circle cx="196" cy="62" r="3.6" fill="#D97706" stroke="#1E2A3B" stroke-width="1.4"/>
  <circle cx="196" cy="62" r="1.4" fill="#FEF3C7"/>

  <!-- Pocket Opening Shadow Lip -->
  <line x1="104" y1="56" x2="200" y2="56" stroke="#1E2A3B" stroke-width="3"/>
</svg>