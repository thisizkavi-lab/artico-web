<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: blizzard (Noun)
  CONTEXTUAL_DEFINITION: A dangerous snowstorm with powerful wind driving dense snow across a landscape and near-zero visibility.
  PEDAGOGICAL_ART_DIRECTOR: Convey a whiteout through powerful lateral snow bands, wind-twisted trees, and distant forms fading away.
  PEDAGOGICAL_ARCHETYPE: 3 - Severe weather event
  SYNONYM_GUARD: The defining cue is violent wind driving snow sideways, beyond ordinary snow or a steady snowstorm.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A low dark cloud sweeps across a snowy ridge; horizontal snow ribbons nearly erase distant pines while a foreground pine bends.
-->
