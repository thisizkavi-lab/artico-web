<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: problem-solving
  CONTEXTUAL_DEFINITION: Finding the cause of a difficulty and working out how to fix it.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker diagnosing a blocked workflow and finding a workable route around the obstacle.
  PEDAGOGICAL_ARCHETYPE: 49 - Diagnose and resolve an obstacle
  SYNONYM_GUARD: Emphasize identifying the cause and resolving it, not merely choosing between options or assigning tasks.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a worker beside a process map; show a blue path blocked by a red-orange obstacle, then a curved green reroute reaching a clear check-mark endpoint, with a magnified inspection of the blockage.
-->
