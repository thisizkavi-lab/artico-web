    - Focal_Layer: Long wooden handle from x=104,y=30 to x=171,y=113; flat steel blade crosses at x=184,y=117.
    - Details_Layer: Blade bevel, ferrule, handle grain, loose earth, cut weed, and motion arc.
    - Lighting_Layer: Upper-left steel highlight and a soft sunlit edge on the handle.
-->
