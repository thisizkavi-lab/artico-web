<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: cloudy (Adjective)
  CONTEXTUAL_DEFINITION: A sky with many clouds covering much of the view, with a few breaks.
  PEDAGOGICAL_ART_DIRECTOR: Show multiple cloud masses and only a small sunny opening; do not cover every part of the sky as in overcast weather.
  PEDAGOGICAL_ARCHETYPE: 3 - Sky condition
  SYNONYM_GUARD: Leave visible sky and a little sun; this is cloudy, not fully overcast.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Several overlapping gray-white cloud banks drift across a blue sky, partly hiding the sun above a soft horizon.
-->
