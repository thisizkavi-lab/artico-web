<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: patient (personality trait)
  CONTEXTUAL_DEFINITION: Able to wait and explain without becoming annoyed when someone needs more time.
  PEDAGOGICAL_ART_DIRECTOR: Show a patient coworker giving another person time to learn a process.
  PEDAGOGICAL_ARCHETYPE: 21 - Patient support
  SYNONYM_GUARD: Show kind waiting and an unhurried explanation, not a medical patient or simple calmness without another person.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a patient mentor on the left with an open hand and a learner on the right studying a blank instruction card. Keep a small progress mark midway rather than showing a rushed finish.
-->
