<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: selfish (Adjective)
  CONTEXTUAL_DEFINITION: Putting one's own wants ahead of other people's needs or share.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: One person gathers all the shared snacks into their own place setting while peers receive none; unlike mean, the focus is self-centered hoarding.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Shared snack table.
    - Context_Layer: Two peers with empty plates at either side.
    - Focal_Layer: Central person pulls the whole shared bowl toward themselves.
    - Details_Layer: Overfull personal plate, reaching peers and blocking arm.
    - Lighting_Layer: Neutral focus on the uneven distribution.
-->
