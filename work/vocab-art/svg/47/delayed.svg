<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: delayed
  CONTEXTUAL_DEFINITION: A flight departure is postponed, so the aircraft remains on the ground.
  PEDAGOGICAL_ART_DIRECTOR: Center a stationary airplane at its gate with wheel chocks and a waiting tug.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / travel diagram
  SYNONYM_GUARD: Show the plane's delayed status rather than a passenger who is waiting.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A passenger jet is held beside its gate with wheel blocks at the landing gear and a service tug waiting in front; nobody is boarding.
-->
