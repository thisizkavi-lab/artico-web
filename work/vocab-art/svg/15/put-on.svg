<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:put on (clothes)">
  <defs>
    <clipPath id="puton-sweater-clip">
      <path d="M 112 78 L 84 94 L 72 138 L 92 142 L 102 116 L 100 162 L 204 162 L 202 116 L 212 142 L 232 138 L 220 94 L 192 78 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Presentation Ground Shadow -->
  <ellipse cx="152" cy="172" rx="84" ry="10" fill="#E2E8F0"/>

  <!-- Backdrop warm morning glow -->
  <ellipse cx="152" cy="100" rx="92" ry="58" fill="#FEF3C7" opacity="0.6"/>

  <!-- Character Head & Hair Peeking Through Sweater Neckline Opening -->
  <!-- Neck -->
  <path d="M 144 68 L 144 86 L 160 86 L 160 68 Z" fill="#E8B896" stroke="#1E2A3B" stroke-width="2"/>
  <!-- Head Face Shape -->
  <ellipse cx="152" cy="54" rx="16" ry="18" fill="#FBD8B5" stroke="#1E2A3B" stroke-width="2.2"/>
  <!-- Stylized Hair -->
  <path d="M 136 50 C 136 34 168 34 168 50 C 168 44 160 38 152 38 C 144 38 138 44 136 50 Z"
        fill="#1E2A3B"/>
  <!-- Facial expression: happy, pulling on sweater -->
  <path d="M 144 54 C 146 56 148 56 150 54" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 154 54 C 156 56 158 56 160 54" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 148 62 C 152 66 156 66 160 62" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Character Arms Raised Upward Grasping the Sweater -->
  <!-- Left Forearm -->
  <path d="M 104 104 L 88 58 L 102 54 L 116 94 Z"
        fill="#FBD8B5" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Left Hand holding collar edge -->
  <circle cx="94" cy="54" r="6" fill="#FBD8B5" stroke="#1E2A3B" stroke-width="1.8"/>

  <!-- Right Forearm -->
  <path d="M 200 104 L 216 58 L 202 54 L 188 94 Z"
        fill="#E8B896" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Right Hand holding collar edge -->
  <circle cx="210" cy="54" r="6" fill="#FBD8B5" stroke="#1E2A3B" stroke-width="1.8"/>

  <!-- Chunky Cozy Sweater Being Pulled DOWN Over Head and Shoulders -->
  <!-- Main Sweater Torso & Sleeves -->
  <path d="M 116 76 L 82 92 L 72 142 L 94 146 L 102 118 L 100 162 L 204 162 L 202 118 L 210 146 L 232 142 L 222 92 L 188 76 Z"
        fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Shading & Chunky Knit Texture Lines -->
  <g clip-path="url(#puton-sweater-clip)">
    <!-- Right side shadow -->
    <path d="M 152 76 L 222 92 L 204 162 L 152 162 Z" fill="#D97706" opacity="0.4"/>
    <!-- Knit Cable Ridges -->
    <path d="M 136 90 L 136 156" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 168 90 L 168 156" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wide Stretch Ribbed Collar Pulled Around Neck Opening -->
  <ellipse cx="152" cy="80" rx="36" ry="12" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="2.2"/>
  <ellipse cx="152" cy="80" rx="30" ry="8" fill="#FBD8B5"/>

  <!-- Ribbed Hem Band at Bottom of Sweater -->
  <rect x="100" y="152" width="104" height="10" rx="2" fill="#D97706" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Lower Pants / Jeans Peeking Out Below -->
  <path d="M 112 162 L 192 162 L 196 172 L 108 172 Z" fill="#2563EB" stroke="#1E2A3B" stroke-width="1.8"/>

  <!-- Dynamic Downward Action Motion Arrows (Indicating Pulling ON) -->
  <path d="M 58 84 L 58 116" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="58,124 51,114 65,114" fill="#2563EB" stroke="#1E2A3B" stroke-width="1.4"/>

  <path d="M 246 84 L 246 116" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="246,124 239,114 253,114" fill="#2563EB" stroke="#1E2A3B" stroke-width="1.4"/>
</svg>