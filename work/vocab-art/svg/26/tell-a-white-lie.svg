  CHAPTER: 26 — Communication and beliefs
  WORD: tell a white lie (Verb phrase)
  CONTEXTUAL_DEFINITION: Tell a small untruth to spare another person's feelings.
  PEDAGOGICAL_ARCHETYPE: 3 — Gentle person-to-person reassurance
