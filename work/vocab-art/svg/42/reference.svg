<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: reference / references (employer)
  CONTEXTUAL_DEFINITION: A former employer or colleague who can confirm a candidate's suitability for a job.
  PEDAGOGICAL_ART_DIRECTOR: Show a trusted professional giving a hiring manager a positive work reference for a candidate.
  PEDAGOGICAL_ARCHETYPE: 7 - External endorsement
  SYNONYM_GUARD: The central idea is a person who vouches for the candidate and a verification note, not referring to a topic or running a background check. Keep the endorsement page unobstructed between the former employer and hiring manager; identify the applicant on the page itself.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a former supervisor at x=62..113, y=70..132 and a hiring manager at x=202..253, y=70..132. Center an unobstructed blank recommendation sheet between them at x=132..190, y=48..111, with a tiny applicant portrait and a green check. Their hands gesture toward the endorsement page across the meeting table.
-->
