<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: fire (verb; employment dismissal)
  CONTEXTUAL_DEFINITION: An employer removes someone from their job, often for poor performance or misconduct.
  PEDAGOGICAL_ART_DIRECTOR: Show a manager initiating the dismissal by returning the worker's access badge and directing them away from the workstation.
  PEDAGOGICAL_ARCHETYPE: 3 - Workplace role transition
  SYNONYM_GUARD: Hiring/leaving group overrides the flame and shooting senses; this active verb centers the employer's decision.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put an employee behind a small desk at x=59..164, y=83..143. A supervisor at x=211,y=101 extends a hand with the employee's gold access badge toward the exit at x=262. The worker's chair is emptying as they rise.
-->
