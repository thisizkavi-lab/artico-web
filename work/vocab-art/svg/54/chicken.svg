<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:chicken" data-archetype="hero-object">
  <defs>
    <!-- Farm Chicken / Hen: red comb, red wattle, golden-buff plumage, layered wing, yellow clawed feet pecking grains -->
    <clipPath id="chicken-body-clip">
      <path d="M 118 78 C 114 62 136 50 162 62 C 196 74 214 96 210 134 C 206 154 176 156 142 152 C 114 148 108 126 114 98 Z" />
    </clipPath>
    <clipPath id="chicken-wing-clip">
      <path d="M 132 94 C 150 88 178 94 182 118 C 184 136 160 148 140 142 C 130 134 126 108 132 94 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="100" ry="12" fill="#EAE3D5" />
  <ellipse cx="152" cy="166" rx="48" ry="7" fill="#DDD4C3" />

  <!-- Upward-Arching Tail Feathers -->
  <path d="M 198 106 C 220 90 236 84 242 98 C 244 104 238 114 220 126 Z" fill="#78350F" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 194 114 C 218 104 234 102 238 116 C 238 122 232 130 212 136 Z" fill="#92400E" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 190 124 C 212 120 226 122 226 134 C 222 140 216 142 204 142 Z" fill="#B45309" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Yellow Scaly Legs & Feet -->
  <line x1="144" y1="148" x2="140" y2="166" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <line x1="144" y1="148" x2="140" y2="166" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
  <!-- Left Foot Claws -->
  <path d="M 140 166 L 130 168 M 140 166 L 138 171 M 140 166 L 148 168" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />

  <line x1="166" y1="148" x2="164" y2="166" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <line x1="166" y1="148" x2="164" y2="166" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
  <!-- Right Foot Claws -->
  <path d="M 164 166 L 154 168 M 164 166 L 162 171 M 164 166 L 172 168" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />

  <!-- Plump Hen Body (Warm Brown & Buff) -->
  <g clip-path="url(#chicken-body-clip)">
    <!-- Base golden buff -->
    <rect x="100" y="50" width="120" height="110" fill="#D97706" />
    <!-- Chest / throat lighter buff -->
    <path d="M 100 60 Q 140 70 148 120 L 110 140 Z" fill="#F59E0B" />
    <!-- Back darker feathering -->
    <path d="M 150 60 Q 210 80 210 140 L 150 140 Z" fill="#B45309" />
    <!-- Underside shadow -->
    <ellipse cx="152" cy="150" rx="35" ry="12" fill="#78350F" />
  </g>
  <!-- Body Contour -->
  <path d="M 118 78 C 114 62 136 50 162 62 C 196 74 214 96 210 134 C 206 154 176 156 142 152 C 114 148 108 126 114 98 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Layered Wing -->
  <g clip-path="url(#chicken-wing-clip)">
    <rect x="120" y="85" width="70" height="65" fill="#B45309" />
    <path d="M 130 96 Q 160 98 178 116 M 128 110 Q 158 112 174 130 M 128 122 Q 154 124 166 140" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 134 92 Q 164 94 180 110" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
  <path d="M 132 94 C 150 88 178 94 182 118 C 184 136 160 148 140 142 C 130 134 126 108 132 94 Z" fill="none" stroke="#1E2A3B" stroke-width="2.4" />

  <!-- Red Fleshy Wattles under Beak -->
  <path d="M 102 78 C 98 88 106 94 110 88 Z" fill="#DC2626" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Chicken Head & Neck -->
  <path d="M 112 76 C 108 60 118 48 130 52 C 138 56 140 70 134 82 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Serrated Red Comb on Head -->
  <path d="M 120 52 C 118 40 126 40 128 46 C 130 38 138 38 140 46 C 142 40 148 42 146 52 Z" fill="#DC2626" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

  <!-- Bright Yellow Conical Beak -->
  <polygon points="106,62 90,68 106,72" fill="#FACC15" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <line x1="106" y1="67" x2="94" y2="67" stroke="#1E2A3B" stroke-width="1.4" />

  <!-- Round Curious Eye -->
  <circle cx="118" cy="62" r="4" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.6" />
  <circle cx="118" cy="62" r="2.2" fill="#1E2A3B" />
  <circle cx="117.2" cy="61.2" r="0.8" fill="#FFFFFF" />

  <!-- Yellow Corn Grains on Ground (Hen Pecking Motif) -->
  <ellipse cx="80" cy="164" rx="3.5" ry="2" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.2" />
  <ellipse cx="90" cy="166" rx="3" ry="2.2" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.2" />
  <ellipse cx="98" cy="163" rx="3.5" ry="2" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.2" />
  <ellipse cx="86" cy="169" rx="2.8" ry="1.8" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.2" />
</svg>