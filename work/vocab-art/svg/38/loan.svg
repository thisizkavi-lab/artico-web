<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: loan (noun; general sum of money lent temporarily)
  CONTEXTUAL_DEFINITION: Money given temporarily to a borrower with an agreement to return it.
  PEDAGOGICAL_ARCHETYPE: 3 - Role exchange with time cue
  SYNONYM_GUARD: Use an informal peer-to-peer lending scene, unlike “bank loan,” which specifically shows a financial institution lending.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Two friends across a small table; lender passes an envelope of notes, borrower accepts; a return arrow loops later toward lender beside a small blank calendar with untallied squares.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:loan" data-archetype="role-exchange">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="loan-envelope" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A8D4A2"/><stop offset="1" stop-color="#7FB07A"/></linearGradient>
    <radialGradient id="loan-coin-highlight"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></radialGradient>
    <path id="loan-friend-hand" d="M75 112 C87 101 101 101 113 109 L136 122 L129 137 L106 127 L87 132 Z"/>
    <clipPath id="loan-friend-clip"><use href="#loan-friend-hand"/></clipPath>
    <filter id="loan-peer-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="152" width="304" height="40" fill="#EEE7DA"/><path d="M0 152 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="152" cy="164" rx="113" ry="8" fill="#DDD4C3"/></g>
