<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: slide
  CONTEXTUAL_DEFINITION: One page or frame in a digital presentation, displayed on a screen.
  PEDAGOGICAL_ART_DIRECTOR: Isolate one projected slide page among small neighboring previews so the presentation-screen sense is unmistakable.
  PEDAGOGICAL_ARCHETYPE: 1 - Single presentation page
  SYNONYM_GUARD: This is a visual page in a deck, not a person sliding or moving down a surface.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center one large rectangular projected page at x=68..231, y=35..125, with a title-like color bar and a simple chart composed of shapes only. Add two smaller preview cards in a vertical strip at x=244..273. Keep the screen flat and front-facing; no figure should be sliding.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="40:slide" data-archetype="presentation-slide">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="slide-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF4FA"/></linearGradient>
    <linearGradient id="slide-screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5479AC"/><stop offset="1" stop-color="#3D5F91"/></linearGradient>
    <radialGradient id="slide-halo"><stop stop-color="#FFF1B9" stop-opacity=".68"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <filter id="slide-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
