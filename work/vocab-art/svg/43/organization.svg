<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: organization
  CONTEXTUAL_DEFINITION: Arranging tasks or materials into a clear, workable order.
  PEDAGOGICAL_ART_DIRECTOR: Contrast a scattered set of work items with the same items placed into a deliberate sequence.
  PEDAGOGICAL_ARCHETYPE: 48 - Sorting into a useful order
  SYNONYM_GUARD: Use the workplace action of arranging materials or tasks, not an institution, company, or general administrative service.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place one worker between a small scattered pile of blank task cards at x=42..104 and a tidy three-slot sequence board at x=189..260; show the worker moving one card into the next open slot along an arrow.
-->
