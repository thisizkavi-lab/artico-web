<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:quince" data-archetype="hero-object">
  <defs>
    <!-- Quince: bumpy, knobby, rustic golden-yellow pear-like fruit with textured skin, stout woody twig, sliced wedge -->
    <clipPath id="quince-body-clip">
      <path d="M 112 62 C 124 60 132 74 128 92 C 132 104 154 116 156 138 C 158 158 134 168 112 166 C 88 168 66 156 68 136 C 70 114 92 104 94 92 C 90 74 98 62 112 62 Z" />
    </clipPath>
    <clipPath id="quince-wedge-clip">
      <path d="M 184 146 C 190 106 220 94 246 112 C 250 136 228 156 204 156 C 194 156 188 152 184 146 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="112" cy="162" rx="48" ry="9" fill="#DDD4C3" />
  <ellipse cx="216" cy="164" rx="38" ry="7" fill="#DDD4C3" />

  <!-- Stout Gnarled Woody Twig & Fuzzy Quince Leaves -->
  <g transform="translate(112, 62)">
    <path d="M 0 0 C 2 -12 10 -22 20 -26" stroke="#573010" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 0 0 C 2 -12 10 -22 20 -26" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Rounded fuzzy leaf -->
    <path d="M 8 -12 C 22 -20 38 -14 42 -2 C 32 4 18 0 8 -12 Z" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <!-- Pale woolly underside fluff -->
    <path d="M 12 -10 Q 24 -14 36 -4" stroke="#D9F99D" stroke-width="1.6" fill="none" />
  </g>

  <!-- Whole Bumpy Golden-Yellow Quince on Left -->
  <g clip-path="url(#quince-body-clip)">
    <!-- Base golden-yellow quince skin -->
    <rect x="60" y="55" width="105" height="115" fill="#EAB308" />
    <!-- Knobby bulges / textural surface unevenness -->
    <ellipse cx="94" cy="132" rx="36" ry="28" fill="#FACC15" />
    <ellipse cx="128" cy="128" rx="28" ry="24" fill="#CA8A04" opacity="0.6" />
    <ellipse cx="106" cy="84" rx="22" ry="20" fill="#FACC15" />
    <!-- Underside shadow -->
    <path d="M 68 144 C 82 166 136 166 156 142 L 156 168 L 68 168 Z" fill="#854D0E" />
    <!-- Felted woolly skin flecks (quince fuzz) -->
    <circle cx="84" cy="122" r="1.3" fill="#A16207" />
    <circle cx="102" cy="144" r="1.3" fill="#A16207" />
    <circle cx="122" cy="136" r="1.3" fill="#A16207" />
    <circle cx="134" cy="116" r="1.3" fill="#A16207" />
    <circle cx="118" cy="100" r="1.3" fill="#A16207" />
    <circle cx="104" cy="74" r="1.3" fill="#A16207" />
    <!-- Specular highlight -->
    <ellipse cx="92" cy="94" rx="12" ry="16" transform="rotate(-15 92 94)" fill="#FEF08A" opacity="0.8" />
  </g>
  <!-- Quince Contour (notice characteristic bumpy irregular lobes) -->
  <path d="M 112 62 C 124 60 132 74 128 92 C 132 104 154 116 156 138 C 158 158 134 168 112 166 C 88 168 66 156 68 136 C 70 114 92 104 94 92 C 90 74 98 62 112 62 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Knobby blossom calyx at bottom -->
  <g transform="translate(112, 166)">
    <polygon points="-4,0 0,6 4,0" fill="#78350F" stroke="#1E2A3B" stroke-width="1.6" />
  </g>

  <!-- Cut Quince Wedge in Foreground Right (Showing Dense Pale Flesh & Dark Seeds) -->
  <g clip-path="url(#quince-wedge-clip)">
    <!-- Golden rind rim -->
    <rect x="180" y="90" width="75" height="70" fill="#CA8A04" />
    <!-- Dense grainy pale cream-yellow flesh -->
    <path d="M 188 144 C 194 110 218 102 240 116 C 244 134 224 150 204 150 C 196 150 190 146 188 144 Z" fill="#FEF9C3" />

    <!-- Core boundary & brown seeds -->
    <path d="M 212 140 C 218 130 220 122 216 116" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- 2 Hard brown quince seeds -->
    <ellipse cx="220" cy="128" rx="2.5" ry="3.5" transform="rotate(20 220 128)" fill="#78350F" stroke="#1E2A3B" stroke-width="0.8" />
    <ellipse cx="216" cy="134" rx="2.2" ry="3.2" transform="rotate(-30 216 134)" fill="#78350F" stroke="#1E2A3B" stroke-width="0.8" />
  </g>
  <!-- Wedge Contour -->
  <path d="M 184 146 C 190 106 220 94 246 112 C 250 136 228 156 204 156 C 194 156 188 152 184 146 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
</svg>
