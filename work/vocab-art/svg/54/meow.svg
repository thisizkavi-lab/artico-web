  <path d="M 88 152 C 68 148 54 132 58 116 C 60 106 70 108 68 118 C 66 128 76 138 94 142" stroke="#F97316" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 88 152 C 68 148 54 132 58 116 C 60 106 70 108 68 118 C 66 128 76 138 94 142" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" fill="none" />

