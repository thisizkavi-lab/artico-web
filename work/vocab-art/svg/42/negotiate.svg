<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: negotiate
  CONTEXTUAL_DEFINITION: Discuss terms with another person in order to reach an agreement.
  PEDAGOGICAL_ART_DIRECTOR: Show two workplace parties exchanging proposals and finding a balanced agreement.
  PEDAGOGICAL_ARCHETYPE: 18 - Terms and agreement
  SYNONYM_GUARD: Make the people discuss and adjust terms before agreeing; avoid depicting one-sided instruction or ordinary teamwork alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place two professionals opposite each other across a desk at x=65..113 and x=196..244. Between them show a paired set of proposal cards with one slider marker each, then a centered balanced-scale icon to suggest fair terms reached through discussion.
-->
