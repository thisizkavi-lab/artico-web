<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: answer
  CONTEXTUAL_DEFINITION: A response given to a question during a meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show one colleague responding while another listens, with a clear visual cue that the response resolves an earlier inquiry.
  PEDAGOGICAL_ARCHETYPE: 3 - Response / reply
  SYNONYM_GUARD: Focus on the response, not the raised-hand question or the broader conversation.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a seated questioner at x=50..105 on the left and an answering colleague at x=190..245 on the right across a table. The responder gestures toward a small green resolution card at x=136..168, while the questioner lowers a hand and looks toward the answer; use one empty speech cloud with a check-like icon only.
-->
