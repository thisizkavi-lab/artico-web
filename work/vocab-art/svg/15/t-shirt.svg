<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:t-shirt / t-shirt (alternate capitalization)">
  <defs>
    <clipPath id="tshirt-torso-clip">
      <path d="M 118 46 L 70 64 L 54 106 L 86 114 L 96 92 L 96 156 L 208 156 L 208 92 L 218 114 L 250 106 L 234 64 L 186 46 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop soft fresh aura -->
  <ellipse cx="152" cy="110" rx="90" ry="60" fill="#CCFBF1" opacity="0.6"/>

  <!-- Wooden Hanger Hook -->
  <path d="M 152 24 C 158 24 162 28 160 34 C 158 38 153 40 152 44" fill="none" stroke="#9A6945" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Short Sleeve (Distinct Short Cut) -->
  <path d="M 84 58 L 54 106 L 86 114 L 98 88 L 106 64 Z"
        fill="#2DD4BF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Left Sleeve Hem Stitch -->
  <line x1="58" y1="105" x2="84" y2="111" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="3 1.5"/>

  <!-- Right Short Sleeve -->
  <path d="M 220 58 L 250 106 L 218 114 L 206 88 L 198 64 Z"
        fill="#14B8A6" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Right Sleeve Hem Stitch -->
  <line x1="220" y1="111" x2="246" y2="105" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="3 1.5"/>

  <!-- Main T-Shirt Torso -->
  <path d="M 118 46 L 84 58 L 96 156 L 208 156 L 220 58 L 186 46 Z"
        fill="#2DD4BF" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Shading & Fold Accents inside torso -->
  <g clip-path="url(#tshirt-torso-clip)">
    <!-- Right side shadow -->
    <path d="M 152 46 L 220 58 L 208 156 L 152 156 Z" fill="#14B8A6" opacity="0.35"/>
    <!-- Subtle chest drape ripples -->
    <path d="M 104 84 C 114 96 114 116 102 136" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 198 84 C 188 96 188 116 200 136" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bottom Hem Double Stitch -->
  <line x1="98" y1="150" x2="206" y2="150" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="98" y1="153" x2="206" y2="153" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Inner Back Neckband & Woven Size Tag -->
  <path d="M 128 46 C 136 38 168 38 176 46 L 172 54 C 164 48 140 48 132 54 Z"
        fill="#0F766E" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="148" y="44" width="8" height="6" rx="1" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1"/>

  <!-- Round Crew Rib-Knit Neckline (Unmistakable T-Shirt Feature) -->
  <path d="M 126 46 C 132 64 172 64 178 46 C 168 56 136 56 126 46 Z"
        fill="#5EEAD4" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 127 47 C 133 63 171 63 177 47" fill="none" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="2 1.5"/>
</svg>