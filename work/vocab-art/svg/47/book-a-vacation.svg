<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: book a vacation
  CONTEXTUAL_DEFINITION: Arrange and reserve a complete leisure trip before leaving.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler actively choosing a getaway with transport, lodging, and destination pictured together on a blank screen.
