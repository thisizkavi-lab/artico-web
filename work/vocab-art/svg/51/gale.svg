<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: gale (Noun)
  CONTEXTUAL_DEFINITION: A very strong steady wind bending trees and pulling at clothing, below the destructive scale of a hurricane.
  PEDAGOGICAL_ART_DIRECTOR: Show a person leaning into a forceful sustained gust as a tree bows in the same direction; keep rain and damage absent.
  PEDAGOGICAL_ARCHETYPE: 3 - Strong wind event
  SYNONYM_GUARD: A gale is forceful and steady, much stronger than a breezy or windy day, but without hurricane destruction.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A bundled walker leans forward while a leafy tree bends sharply sideways and long wind ribbons cross a bare hillside.
-->
