<!-- SELF_PROMPT:
  CHAPTER: 45 - Driving a car
  WORD: speed limit
  CONTEXTUAL_DEFINITION: The maximum permitted speed for vehicles on a road.
  PEDAGOGICAL_ART_DIRECTOR: Show a circular regulatory road sign with an icon-only speedometer whose needle reaches a bold red ceiling marker; a car approaches at a controlled pace.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero road rule with functional context
  SYNONYM_GUARD: A maximum speed rule, not a camera that catches speeding or a general road sign.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Round white sign with red border centered (115,81), radius 43, on post to ground y=150. Inside is a simple speedometer arc and needle stopped at a red upper marker; a blue car drives at right with short controlled motion marks.
-->
