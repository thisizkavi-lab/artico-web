<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:jeans">
  <defs>
    <clipPath id="jeans-clip">
      <path d="M 110 32 L 194 32 L 202 70 L 196 166 L 162 166 L 152 78 L 142 166 L 108 166 L 102 70 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop soft denim aura -->
  <ellipse cx="152" cy="108" rx="86" ry="65" fill="#DBEAFE" opacity="0.6"/>

  <!-- Main Denim Jeans Silhouette -->
  <path d="M 110 32 L 194 32 L 202 70 L 196 166 L 162 166 L 152 78 L 142 166 L 108 166 L 102 70 Z"
        fill="#2563EB" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Shading & Twill Texture Shadow on right leg -->
  <g clip-path="url(#jeans-clip)">
    <!-- Right leg shadow -->
    <path d="M 152 32 L 202 70 L 196 166 L 152 78 Z" fill="#1D4ED8"/>
    <!-- Inner leg shadow -->
    <path d="M 148 76 L 156 76 L 164 166 L 140 166 Z" fill="#1E3A8A" opacity="0.5"/>
    <!-- Thigh wash fade highlight -->
    <ellipse cx="128" cy="105" rx="9" ry="24" fill="#60A5FA" opacity="0.6"/>
    <ellipse cx="176" cy="105" rx="9" ry="24" fill="#3B82F6" opacity="0.6"/>
  </g>

  <!-- Waistband -->
  <path d="M 110 32 L 194 32 L 195 44 L 109 44 Z"
        fill="#1D4ED8" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Waistband Tobacco Topstitching -->
  <line x1="110" y1="34" x2="194" y2="34" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="110" y1="42" x2="194" y2="42" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- Belt Loops -->
  <rect x="114" y="30" width="4" height="16" rx="1" fill="#1E3A8A" stroke="#1E2A3B" stroke-width="1.4"/>
  <rect x="142" y="30" width="4" height="16" rx="1" fill="#1E3A8A" stroke="#1E2A3B" stroke-width="1.4"/>
  <rect x="158" y="30" width="4" height="16" rx="1" fill="#1E3A8A" stroke="#1E2A3B" stroke-width="1.4"/>
  <rect x="186" y="30" width="4" height="16" rx="1" fill="#1E3A8A" stroke="#1E2A3B" stroke-width="1.4"/>

  <!-- Center Metal Button Shank -->
  <circle cx="152" cy="38" r="3.2" fill="#D97706" stroke="#1E2A3B" stroke-width="1.6"/>
  <circle cx="152" cy="38" r="1.4" fill="#FEF3C7"/>

  <!-- J-Stitch Fly -->
  <path d="M 152 44 L 152 64 C 152 70 146 72 142 70"
        fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 150 44 L 150 63 C 150 67 146 69 144 68"
        fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="2 1.5"/>

  <!-- Curved Front Scoop Pockets -->
  <!-- Left curved scoop -->
  <path d="M 118 44 C 118 58 132 58 136 44" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <path d="M 119 44 C 119 56 131 56 135 44" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="2 1.5"/>
  <!-- Right curved scoop -->
  <path d="M 168 44 C 172 58 186 58 186 44" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <path d="M 169 44 C 173 56 185 56 185 44" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="2 1.5"/>

  <!-- Coin / Watch Pocket on right -->
  <path d="M 172 44 L 172 52 L 180 52 L 180 44" fill="none" stroke="#F59E0B" stroke-width="1.6"/>

  <!-- Copper Rivets -->
  <circle cx="119" cy="45" r="1.6" fill="#D97706" stroke="#1E2A3B" stroke-width="0.8"/>
  <circle cx="135" cy="45" r="1.6" fill="#D97706" stroke="#1E2A3B" stroke-width="0.8"/>
  <circle cx="169" cy="45" r="1.6" fill="#D97706" stroke="#1E2A3B" stroke-width="0.8"/>
  <circle cx="185" cy="45" r="1.6" fill="#D97706" stroke="#1E2A3B" stroke-width="0.8"/>
  <circle cx="173" cy="51" r="1.4" fill="#D97706" stroke="#1E2A3B" stroke-width="0.8"/>

  <!-- Outer Leg Contrast Double Stitches -->
  <line x1="109" y1="52" x2="114" y2="164" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="4 2"/>
  <line x1="195" y1="52" x2="190" y2="164" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="4 2"/>

  <!-- Folded Ankle Hem Cuffs (showing inner weft) -->
  <path d="M 108 158 L 142 158 L 142 166 L 108 166 Z"
        fill="#93C5FD" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="108" y1="162" x2="142" y2="162" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="2 1.5"/>

  <path d="M 162 158 L 196 158 L 196 166 L 162 166 Z"
        fill="#93C5FD" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="162" y1="162" x2="196" y2="162" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="2 1.5"/>
</svg>