<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: calm (Adjective)
  CONTEXTUAL_DEFINITION: Remaining peaceful and composed while others or events are unsettled.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: A relaxed person stays composed while papers flutter and peers react to a small commotion; this is a person's demeanor, not calm water.
  MODE: STATIC
