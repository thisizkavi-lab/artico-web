<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:anxious" data-archetype="expressive-bust">
  <defs>
    <path id="anxious-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="anxious-head-clip">
      <use href="#anxious-head"/>
    </clipPath>
    <clipPath id="anxious-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Cool Tinted Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#F1F5F9"/>

  <!-- Biting Fingernails in Anxiety (Iconic Habit Cue!) -->
  <path d="M 112 178 L 140 124 L 152 126 L 126 178 Z"
        fill="#5479AC" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hand Brought Up to Mouth, Fingers at Teeth -->
  <circle cx="146" cy="116" r="9.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2"/>
  <g stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round">
    <line x1="144" y1="110" x2="148" y2="106"/>
    <line x1="148" y1="112" x2="152" y2="107"/>
  </g>

  <!-- Torso (Ren) -->
  <g clip-path="url(#anxious-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#5479AC"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#3D5F91"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Anxious Blue Chill -->
  <g clip-path="url(#anxious-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <!-- Blue shadow of worry on forehead -->
    <path d="M 105 32 L 199 32 L 199 66 L 105 66 Z" fill="#93C5FD" opacity="0.4"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#anxious-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Ren) -->
  <path d="M 106 66 C 102 36, 124 20, 152 20 C 180 20, 202 36, 198 66 C 192 48, 176 38, 152 38 C 128 38, 114 48, 106 66 Z"
        fill="#27364B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Anxious Eyebrows Furrowed Deeply in Center -->
  <path d="M 124 68 L 144 64" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 180 68 L 160 64" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Furrow Tick -->
  <line x1="152" y1="62" x2="152" y2="70" stroke="#1E2A3B" stroke-width="1.8"/>

  <!-- Darting Wide Anxious Pupils -->
  <ellipse cx="134" cy="76" rx="7.5" ry="8" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="132" cy="76" r="3.2" fill="#1E2A3B"/>
  <ellipse cx="170" cy="76" rx="7.5" ry="8" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="168" cy="76" r="3.2" fill="#1E2A3B"/>

  <!-- Nervous Sweat Drop on Temple -->
  <path d="M 188 62 C 188 62, 194 70, 194 73 C 194 76, 191.5 78, 188.5 78 C 185.5 78, 183 76, 183 73 C 183 70, 188 62, 188 62 Z"
        fill="#7CC4FA" stroke="#1E2A3B" stroke-width="1.6"/>

  <!-- Ticking Clock in Background (Deadline Anxiety) -->
  <g transform="translate(68, 54)">
    <circle cx="14" cy="14" r="12" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2"/>
    <line x1="14" y1="14" x2="14" y2="6" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="20" y2="12" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
