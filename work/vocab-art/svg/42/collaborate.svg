<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: collaborate
  CONTEXTUAL_DEFINITION: Work together with other people to achieve something.
  PEDAGOGICAL_ART_DIRECTOR: Show coworkers contributing different parts to one shared result.
  PEDAGOGICAL_ARCHETYPE: 16 - Joint contribution
  SYNONYM_GUARD: Emphasize shared hands-on effort and a common output; coordinating arranges the parts, while collaborating means doing the work together.
  MODE: STATIC
