<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: trail (Verb)
  CONTEXTUAL_DEFINITION: To follow someone behind them along an outdoor route, as the glossary specifies.
  PEDAGOGICAL_ART_DIRECTOR: Put one walker clearly ahead and a second following behind on the same path.
  PEDAGOGICAL_ARCHETYPE: 4 - Following action
  SYNONYM_GUARD: Use two separated hikers moving in the same direction, with the nearer person behind; avoid depicting only a path, which would suggest the noun sense.
  MODE: STATIC
