<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: tent pole (Noun)
  CONTEXTUAL_DEFINITION: A long rod or flexible support that holds up a tent canopy.
  PEDAGOGICAL_ART_DIRECTOR: Highlight the long pole arching across a shelter and visibly supporting the fabric.
