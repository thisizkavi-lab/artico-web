<!-- SELF_PROMPT:
  CHAPTER: 58 - Free time activities
  WORD: picnic
  CONTEXTUAL_DEFINITION: An informal meal eaten outdoors, often on a blanket.
  PEDAGOGICAL_ART_DIRECTOR: Center the outdoor meal arrangement so the picnic itself is clear without repeating the people-eating action card.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object + functional context
  SYNONYM_GUARD: A checked blanket, open hamper, packed food, and open-air park distinguish a picnic from an indoor meal.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A checked blanket lies on a grassy park slope with an open wicker basket, sandwiches, apples, grapes, napkins, and a thermos arranged as a ready outdoor meal.
-->
