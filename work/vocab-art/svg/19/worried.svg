<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:worried" data-archetype="expressive-bust">
  <defs>
    <path id="worried-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="worried-head-clip">
      <use href="#worried-head"/>
    </clipPath>
    <clipPath id="worried-torso-clip">
      <path d="M 72 178 C 80 138, 108 124, 152 124 C 196 124, 224 138, 232 178 Z"/>
    </clipPath>
  </defs>

  <!-- Cool Slate Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#F1F5F9"/>

  <!-- Hand Touching Cheek in Worry -->
  <path d="M 194 168 L 186 114 L 176 118 L 184 178 Z"
        fill="#7FA1CF" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="184" cy="110" rx="9" ry="11" transform="rotate(15 184 110)" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Torso (Sam) -->
  <g clip-path="url(#worried-torso-clip)">
    <rect x="68" y="120" width="168" height="64" fill="#7FA1CF"/>
    <path d="M 68 178 C 78 144, 98 130, 118 126 L 118 178 Z" fill="#5479AC"/>
  </g>
  <path d="M 72 178 C 80 138, 108 124, 152 124 C 196 124, 224 138, 232 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="110" width="24" height="20" rx="6" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Shading -->
  <g clip-path="url(#worried-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#D89A6C"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#B6784B" opacity="0.6"/>
  </g>
  <use href="#worried-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Sam) -->
  <path d="M 108 64 C 104 36, 126 20, 152 20 C 178 20, 200 36, 196 64 C 192 50, 180 40, 152 40 C 124 40, 112 50, 108 64 Z"
        fill="#3A2E2B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Deeply Worried Eyebrows Furrowed Upward in Center (/ \) -->
  <path d="M 124 70 Q 134 62 144 70" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 180 70 Q 170 62 160 70" fill="none" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="152" y1="64" x2="152" y2="72" stroke="#B6784B" stroke-width="2"/>

  <!-- Glasses -->
  <circle cx="134" cy="78" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="170" cy="78" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <line x1="144" y1="78" x2="160" y2="78" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Worried Looking Eyes -->
  <circle cx="134" cy="78" r="3.5" fill="#1E2A3B"/>
  <circle cx="170" cy="78" r="3.5" fill="#1E2A3B"/>

  <!-- Wobbly Worried Frown -->
  <path d="M 136 104 Q 152 96 166 104" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Opened Letter / Bill with Exclamation Mark Warning Cue -->
  <g transform="translate(64, 94)">
    <rect x="0" y="0" width="32" height="22" rx="3" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2"/>
    <!-- Fold Flap -->
    <path d="M 0 0 L 16 12 L 32 0" fill="none" stroke="#1E2A3B" stroke-width="1.8"/>
    <!-- Red Alert Mark -->
    <circle cx="16" cy="14" r="5" fill="#EF4444"/>
    <line x1="16" y1="11" x2="16" y2="15" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
