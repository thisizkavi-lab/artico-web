<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: beginner’s luck (Noun phrase)
  CONTEXTUAL_DEFINITION: Unexpected success on an early attempt by someone with little experience.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action with outcome contrast
  SYNONYM_GUARD: Make the inexperienced novice's first-looking attempt visibly awkward but surprisingly successful, distinct from general chance or a sudden lucky find.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Bowling lane with a simple pin deck.
    - Context_Layer: A calm friend watches from the side, ready to coach.
    - Focal_Layer: A novice releases a bowling ball with an unpracticed, off-balance stance.
    - Details_Layer: The ball knocks down the full pin group as the novice looks astonished.
    - Lighting_Layer: Small golden burst marks the surprising success.
-->
