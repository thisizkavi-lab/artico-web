  <path d="M 126 122 L 124 162 L 138 162 L 142 126 Z" fill="#334155" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="124" y="156" width="14" height="6" fill="#0F172A" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="131" y1="156" x2="131" y2="162" stroke="#FAF8F3" stroke-width="1.2" />

  <path d="M 142 124 L 146 160 L 156 160 L 156 128 Z" fill="#1E293B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="146" y="154" width="10" height="6" fill="#0F172A" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Super Fluffy Cloud Scallop Fleece Silhouette -->
  <!-- Base Silhouette Backing -->
  <g clip-path="url(#sheep-body-clip)">
    <rect x="100" y="60" width="150" height="100" fill="#F8FAFC" />
    <ellipse cx="170" cy="80" rx="46" ry="16" fill="#FFFFFF" />
    <rect x="100" y="142" width="150" height="16" fill="#E2E8F0" />
  </g>

  <!-- Puffy Scalloped Cloud Perimeter -->
  <path d="M 112 100 
