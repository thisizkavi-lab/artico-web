  <path d="M 260 172 C 246 152 222 144 190 144 C 178 144 168 150 160 156 C 168 160 184 162 200 162 C 226 162 246 168 260 172 Z" fill="#FDBA74" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Right hand fingers -->
  <ellipse cx="176" cy="148" rx="8" ry="5" fill="#FED7AA" stroke="#1E2A3B" stroke-width="1.8" />
  <ellipse cx="168" cy="152" rx="8" ry="5" fill="#FED7AA" stroke="#1E2A3B" stroke-width="1.8" />

  <!-- Blue Sleeve Cuffs -->
  <polygon points="40,166 60,162 56,182 36,180" fill="#3B82F6" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <polygon points="264,166 244,162 248,182 268,180" fill="#3B82F6" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
</svg>