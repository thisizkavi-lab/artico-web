<!-- SELF_PROMPT:
  CHAPTER: 08 - Common English idioms
  WORD: get cold feet (Phrase)
  CONTEXTUAL_DEFINITION: To lose courage just before doing something difficult or frightening.
  PEDAGOGICAL_ARCHETYPE: 3 (Human reaction at the threshold of an action)
  SYNONYM_GUARD: A rider backs away from a high diving board at the last moment; frost on their toes stands for fear.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Pool and high diving board.
    - Context_Layer: Friends wait safely below.
    - Focal_Layer: Hesitant diver turns back from the board's edge.
    - Details_Layer: Frosted feet, trembling knees, and a hand gripping the rail.
    - Lighting_Layer: Cool blue shadow near the edge.
-->
