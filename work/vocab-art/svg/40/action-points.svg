<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: action points
  CONTEXTUAL_DEFINITION: A short list of tasks or decisions that need to be acted on after a meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show several distinct follow-up tasks on one meeting record, each with its own small owner marker connected to the participant group.
  PEDAGOGICAL_ARCHETYPE: 5 - Follow-up task list
  SYNONYM_GUARD: Use multiple visible rows with separate assignees; this is a set of points, unlike the single assigned action item.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a large meeting record sheet at x=104..202, y=46..126. Add exactly three clear rows, each with a colored task icon, small check box, and a separate colored connector ending in a tiny owner marker near the right edge of the table at y=95..113. Keep the rows evenly spaced and the participants smaller than the list.
-->
