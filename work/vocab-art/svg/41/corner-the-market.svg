<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: corner the market (idiom)
  CONTEXTUAL_DEFINITION: Gain such control over a product market that one seller dominates its supply or sales.
  PEDAGOGICAL_ARCHETYPE: 6 - Dominant seller versus vacant competitors
  SYNONYM_GUARD: One vendor fills the corner stall and holds all the matching goods while neighboring stalls are empty, showing market dominance rather than merely standing at a street corner.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Draw a simple market row with three stalls across y=60..138. Make the corner stall at x=43..160 brightly stocked with identical goods and one seller; mute the neighboring two stalls at x=170..276 and leave them visibly empty.
-->
