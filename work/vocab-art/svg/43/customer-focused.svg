<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: customer-focused
  CONTEXTUAL_DEFINITION: Making the customer's needs the central priority when choosing what to do.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker adapting options and the service process around one customer's preference.
  PEDAGOGICAL_ARCHETYPE: 30 - Customer-centered choice
  SYNONYM_GUARD: Keep the customer at the center of decisions, beyond one helpful transaction or generic customer service.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put one customer centered at x=126..177 and a staff member to the right. Around the customer show three option cards; have the worker move the preferred card to the front and direct the next steps toward the customer.
-->
