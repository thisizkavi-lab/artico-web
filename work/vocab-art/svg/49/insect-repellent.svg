  SYNONYM_GUARD: Use a skin lotion and direct application, not a pressurized aerosol mist like bug spray.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Open-capped repellent lotion in foreground, camper dabs exposed forearm, small mosquitoes veer away from treated skin.
-->
