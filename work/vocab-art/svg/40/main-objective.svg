<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: main objective
  CONTEXTUAL_DEFINITION: The principal result a meeting or team is trying to achieve.
  PEDAGOGICAL_ART_DIRECTOR: Show a group aligning around one important business outcome while smaller side concerns remain secondary.
  PEDAGOGICAL_ARCHETYPE: 6 - Priority / central goal
  SYNONYM_GUARD: Use one prominent shared work outcome, not a weapon target, sports goal, or list of several agenda topics.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center one bright green-and-gold outcome symbol above a boardroom table at x=137..169, y=60..105. Three coworkers at x=62..104, x=127..177, and x=202..244 orient toward it, while two smaller pale side icons sit near the margins. Let a thin triangular set of guide lines converge on the central outcome.
-->
