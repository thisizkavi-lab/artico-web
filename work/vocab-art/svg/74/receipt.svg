<!-- SELF_PROMPT: CHAPTER: 74 — At the supermarket. WORD: receipt. CONTEXTUAL_DEFINITION: a printed record of a completed supermarket purchase. CONTEXT_GUARD: Show a thermal receipt beside checkout payment equipment and purchased groceries. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="74:receipt" data-archetype="hero-object">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="receipt-paper" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E7EEF5"/><stop offset=".25" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5E9F0"/></linearGradient>
    <radialGradient id="receipt-seal"><stop stop-color="#A8D4A2"/><stop offset="1" stop-color="#568552"/></radialGradient>
    <path id="receipt-slip" d="M119 39 H190 V150 L184 145 L177 151 L170 145 L163 151 L156 145 L149 151 L142 145 L135 151 L128 145 L119 150 Z"/>
    <clipPath id="receipt-clip"><use href="#receipt-slip"/></clipPath>
