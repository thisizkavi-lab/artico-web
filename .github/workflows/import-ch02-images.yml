name: Import Artico Chapter 02 generated illustrations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-ch02-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-scenes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging dependency
        run: python -m pip install --quiet pillow
      - name: Save generated Artico artwork as local PNG files
        run: python scripts/ingest_ch02_generated_scenes_once.py
      - name: Commit scene artwork to the website repository
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/assets/course/ch02-scene-*.png
          if git diff --cached --quiet; then
            echo "Scene images already present"
            exit 0
          fi
          git commit -m "Add seven original Chapter 02 scene illustrations as PNG assets"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Artwork published on main"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Could not push generated assets after five attempts"
          exit 1
