    <radialGradient id="sights-goal"><stop stop-color="#FFF1B9" stop-opacity=".9"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <filter id="sights-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".17"/></filter>
    <path id="sights-folder" d="M204 75 H246 Q250 75 250 79 V111 H199 V82 Q199 75 204 75 Z"/>
