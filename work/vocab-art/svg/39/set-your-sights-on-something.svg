<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: set your sights on something (idiom; career goal)
  CONTEXTUAL_DEFINITION: Decide that you want to achieve a particular professional goal.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker deliberately focusing on a clearly higher career target, with a route connecting them to it.
  PEDAGOGICAL_ARCHETYPE: 5 - Goal / progression diagram
  SYNONYM_GUARD: This is an ambition, not a shooting scene or merely noticing something; keep the target a prestigious work role.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place an aspirant worker with compact binoculars at x=72..135,y=83..145, aimed toward a gold-lit executive office/briefcase emblem at x=217,y=50. Connect their gaze to the goal with a clean dashed blue arc that rises through two small career steps.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:set your sights on something" data-archetype="career-goal">
