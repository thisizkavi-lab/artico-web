<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: competitive
  CONTEXTUAL_DEFINITION: Eager to perform well compared with a standard or other people.
  PEDAGOGICAL_ART_DIRECTOR: Show healthy effort to meet and exceed a work benchmark alongside a peer.
  PEDAGOGICAL_ARCHETYPE: 7 - Performance benchmark
  SYNONYM_GUARD: Depict striving against a comparable standard or peer, not a distant personal ambition or hostile rivalry.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Show two workers at adjacent workstations, each completing a similar task. Put one shared benchmark meter across the upper center, with both progress bars close and one worker edging ahead by a small amount.
-->
