<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:donkey" data-archetype="hero-object">
  <defs>
    <!-- Donkey: long fuzzy upright ears, short bristly erect mane, grey coat, white mealy muzzle, tufted tail -->
    <clipPath id="donkey-body-clip">
      <path d="M 104 88 C 104 72 134 70 174 72 C 210 74 232 88 230 132 C 228 150 204 154 166 152 C 122 150 106 122 104 88 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="160" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="162" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Thin Tail with Tufted Switch at Tip -->
  <path d="M 228 114 C 242 124 246 142 242 154" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
  <path d="M 228 114 C 242 124 246 142 242 154" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 242 152 C 246 158 250 166 244 170 C 238 168 240 160 242 152 Z" fill="#1E293B" stroke="#1E2A3B" stroke-width="1.8" />

  <!-- Slender Hind Legs & Hooves -->
  <path d="M 198 126 L 196 162 L 210 162 L 216 128 Z" fill="#64748B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="196" y="156" width="14" height="6" fill="#1E293B" stroke="#1E2A3B" stroke-width="1.6" />

  <path d="M 214 128 L 218 160 L 228 160 L 230 132 Z" fill="#475569" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="218" y="154" width="10" height="6" fill="#1E293B" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Front Legs & Hooves -->
  <path d="M 116 116 L 114 162 L 128 162 L 132 120 Z" fill="#64748B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="114" y="156" width="14" height="6" fill="#1E293B" stroke="#1E2A3B" stroke-width="1.6" />

  <path d="M 130 118 L 134 160 L 146 160 L 146 122 Z" fill="#475569" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="134" y="154" width="12" height="6" fill="#1E293B" stroke="#1E2A3B" stroke-width="1.6" />

  <!-- Donkey Body (Warm Heather Slate Grey) -->
  <g clip-path="url(#donkey-body-clip)">
    <!-- Base Grey -->
    <rect x="95" y="65" width="145" height="95" fill="#64748B" />
    <!-- White / pale grey underbelly -->
    <ellipse cx="160" cy="144" rx="44" ry="18" fill="#F1F5F9" />
    <!-- Cross dorsal stripe shadow across shoulder -->
    <path d="M 124 72 L 132 72 L 136 106 L 128 106 Z" fill="#334155" opacity="0.6" />
    <!-- Lower shadow -->
    <rect x="95" y="146" width="145" height="12" fill="#334155" />
  </g>
  <!-- Body Contour -->
  <path d="M 104 88 C 104 72 134 70 174 72 C 210 74 232 88 230 132 C 228 150 204 154 166 152 C 122 150 106 122 104 88 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Short Upright Bristly Dark Mane -->
  <path d="M 102 76 L 102 46 L 108 48 L 108 78 Z" fill="#1E293B" />
  <path d="M 100 48 L 96 42 L 104 46 L 102 40 L 110 46" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Long Iconic Donkey Ears (Upright, Fuzzy, Pointed) -->
  <!-- Left Ear (Far) -->
  <path d="M 94 48 C 88 22 92 12 102 14 C 108 16 106 32 102 52 Z" fill="#64748B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 96 44 C 92 24 94 18 100 18 C 102 20 102 30 100 46 Z" fill="#FDA4AF" />

  <!-- Donkey Head & Neck -->
  <path d="M 106 72 C 100 56 88 56 78 62 C 68 70 66 86 76 98 C 86 106 104 104 110 90 Z" fill="#64748B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Right Ear (Near) -->
  <path d="M 88 50 C 80 24 84 14 94 16 C 100 18 98 34 94 54 Z" fill="#64748B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M 90 46 C 84 26 86 20 92 20 C 94 22 94 32 92 48 Z" fill="#FDA4AF" />

  <!-- Gentle Kind Eye with White Orbital Ring -->
  <circle cx="86" cy="74" r="7" fill="#F1F5F9" />
  <circle cx="86" cy="74" r="4.5" fill="#1E2A3B" />
  <circle cx="84.5" cy="72.5" r="1.4" fill="#FFFFFF" />

  <!-- White "Mealy" Muzzle (Characteristic Donkey Trait) -->
  <ellipse cx="68" cy="90" rx="14" ry="11" fill="#F8FAFC" stroke="#1E2A3B" stroke-width="2.2" />
  <!-- Nostril -->
  <ellipse cx="64" cy="88" rx="2.5" ry="3.5" fill="#475569" />
  <path d="M 64 96 Q 68 99 72 96" fill="none" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round" />
</svg>