<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: take on someone (phrasal verb; add an employee to a team)
  CONTEXTUAL_DEFINITION: Agree to employ or bring someone into a work team.
  PEDAGOGICAL_ART_DIRECTOR: Show a working team making space for a new colleague, using an open chair and a welcome badge rather than an interview table.
  PEDAGOGICAL_ARCHETYPE: 3 - Team integration
  SYNONYM_GUARD: Hiring and leaving context selects the employ sense, not fight/compete; avoid repeating the one-to-one interview composition used for hire.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Show two coworkers already seated around a curved project table at x=50..170. A team lead at x=207 gestures toward a newly added chair and a newcomer entering from the right with a blue staff badge.
-->
