<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:fruit" data-archetype="hero-object">
  <defs>
    <!-- Fruit: classic ceramic pedestal fruit bowl filled with an abundant bounty of diverse fruits: apple, banana, grapes, orange -->
    <clipPath id="bowl-inside-clip">
      <ellipse cx="152" cy="116" rx="86" ry="32" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="168" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="164" rx="64" ry="9" fill="#DDD4C3" />

  <!-- Pedestal Fruit Bowl Foot & Base -->
  <path d="M 134 140 L 126 164 L 178 164 L 170 140 Z" fill="#F1F5F9" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <rect x="122" y="162" width="60" height="4" rx="2" fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2" />

  <!-- Piled Abundance of Fresh Fruits in Bowl -->
  <!-- 1. Bunch of Bananas Arching in Upper Left -->
  <g transform="translate(104, 76) rotate(-25)">
    <path d="M -30 0 C 0 10 36 12 56 -6" stroke="#FACC15" stroke-width="18" stroke-linecap="round" fill="none" />
    <path d="M -30 0 C 0 10 36 12 56 -6" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <path d="M -24 8 C 4 18 38 18 56 2" stroke="#EAB308" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M -24 8 C 4 18 38 18 56 2" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <polygon points="-30,0 -34,-4 -28,-8" fill="#65A30D" stroke="#1E2A3B" stroke-width="1.5" />
  </g>

  <!-- 2. Crisp Red Apple in Center -->
  <g transform="translate(142, 94)">
    <circle cx="0" cy="0" r="26" fill="#DC2626" stroke="#1E2A3B" stroke-width="2.4" />
    <ellipse cx="-6" cy="-4" rx="16" ry="18" fill="#EF4444" />
    <ellipse cx="-8" cy="-8" rx="6" ry="9" transform="rotate(-20 -8 -8)" fill="#FCA5A5" opacity="0.8" />
    <!-- Apple stem & leaf -->
    <path d="M 0 -26 C 2 -34 8 -38 14 -40" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 6 -32 C 14 -38 24 -36 28 -28 C 20 -26 12 -28 6 -32 Z" fill="#15803D" stroke="#1E2A3B" stroke-width="1.6" stroke-linejoin="round" />
  </g>

  <!-- 3. Vibrant Sunny Orange on Right -->
  <g transform="translate(186, 102)">
    <circle cx="0" cy="0" r="24" fill="#EA580C" stroke="#1E2A3B" stroke-width="2.4" />
    <ellipse cx="-4" cy="-4" rx="16" ry="16" fill="#F97316" />
    <circle cx="-6" cy="-6" r="3" fill="#FDBA74" />
    <circle cx="0" cy="-24" r="2" fill="#65A30D" />
  </g>

  <!-- Ceramic Pedestal Bowl Body (Cupping the Fruit) -->
  <path d="M 62 116 C 62 148 102 152 152 152 C 202 152 242 148 242 116 Z" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Bowl Rim Ellipse -->
  <ellipse cx="152" cy="116" rx="90" ry="24" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- 4. Lush Cluster of Grapes Cascading Over the Front Bowl Rim -->
  <g transform="translate(120, 126)">
    <!-- Hanging grapes overflowing rim -->
    <circle cx="-16" cy="4" r="9" fill="#581C87" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="-4" cy="2" r="9.5" fill="#6B21A8" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="10" cy="6" r="9.5" fill="#7C3AED" stroke="#1E2A3B" stroke-width="2" />

    <circle cx="-10" cy="16" r="9.5" fill="#7C3AED" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="4" cy="16" r="10" fill="#9333EA" stroke="#1E2A3B" stroke-width="2.2" />
    <circle cx="16" cy="18" r="8.5" fill="#6B21A8" stroke="#1E2A3B" stroke-width="2" />

    <circle cx="-2" cy="28" r="9" fill="#6B21A8" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="10" cy="28" r="8.5" fill="#581C87" stroke="#1E2A3B" stroke-width="2" />
    <circle cx="4" cy="38" r="7.5" fill="#581C87" stroke="#1E2A3B" stroke-width="2" />

    <!-- Grape frosted glints -->
    <circle cx="3" cy="14" r="2.2" fill="#DDD6FE" />
    <circle cx="-11" cy="14" r="2" fill="#DDD6FE" />
    <circle cx="-3" cy="26" r="1.8" fill="#DDD6FE" />
  </g>

  <!-- Little Strawberry Nestled on Bowl Rim on Right -->
  <g transform="translate(202, 128) rotate(15)">
    <path d="M 0 -12 C 8 -12 14 -4 10 8 C 8 16 0 20 -2 20 C -4 20 -10 16 -12 8 C -14 -4 -8 -12 0 -12 Z" fill="#EF4444" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <!-- Mini green cap -->
    <polygon points="0,-12 -6,-16 -2,-10 4,-16 0,-10" fill="#15803D" stroke="#1E2A3B" stroke-width="1.2" />
    <!-- Seed dots -->
    <circle cx="-4" cy="0" r="1" fill="#FEF08A" />
    <circle cx="2" cy="2" r="1" fill="#FEF08A" />
    <circle cx="-2" cy="10" r="1" fill="#FEF08A" />
  </g>
</svg>
