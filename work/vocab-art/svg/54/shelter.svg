  <g fill="#FFFFFF" stroke="#1E2A3B" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="36,134 42,126 48,134 48,160 36,160" />
    <polygon points="50,134 56,126 62,134 62,160 50,160" />
    <polygon points="242,134 248,126 254,134 254,160 242,160" />
    <polygon points="256,134 262,126 268,134 268,160 256,160" />
