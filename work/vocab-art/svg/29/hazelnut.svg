<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:hazelnut" data-archetype="hero-object">
  <defs>
    <!-- Hazelnut: round acorn-like woody brown shell with pale circular base scar, plus cracked shell showing spherical edible nut kernel -->
    <clipPath id="hazel-shell-clip">
      <path d="M 112 70 C 138 70 156 88 156 114 C 156 138 136 156 112 156 C 88 156 68 138 68 114 C 68 88 86 70 112 70 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="112" cy="162" rx="46" ry="8" fill="#DDD4C3" />
  <ellipse cx="206" cy="164" rx="40" ry="7" fill="#DDD4C3" />

  <!-- Whole Hazelnut in Hard Shell on Left -->
  <g clip-path="url(#hazel-shell-clip)">
    <!-- Base rich chestnut brown -->
    <rect x="60" y="65" width="105" height="95" fill="#78350F" />
    <!-- Fine vertical woody grain stripes -->
    <path d="M 92 84 Q 86 114 94 146" stroke="#451A03" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 106 74 Q 102 114 108 152" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 120 74 Q 124 114 118 152" stroke="#451A03" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 134 84 Q 140 114 132 146" stroke="#451A03" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Underside shade -->
    <path d="M 68 128 C 82 154 136 154 154 128 L 154 160 L 68 160 Z" fill="#451A03" />
    <!-- Specular highlight -->
    <ellipse cx="94" cy="94" rx="12" ry="16" transform="rotate(-20 94 94)" fill="#B45309" opacity="0.8" />
    <ellipse cx="90" cy="88" rx="4" ry="8" transform="rotate(-20 90 88)" fill="#FDE68A" opacity="0.85" />
  </g>
  <!-- Contour -->
  <path d="M 112 70 C 138 70 156 88 156 114 C 156 138 136 156 112 156 C 88 156 68 138 68 114 C 68 88 86 70 112 70 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Distinctive Pale Tan Circular Base Scar (Hilum) on Whole Hazelnut -->
  <g transform="translate(112, 72)">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#FDE68A" stroke="#1E2A3B" stroke-width="2.2" />
    <!-- Radiating scar texture lines -->
    <path d="M -12 0 L 12 0 M 0 -4 L 0 4 M -8 -3 L 8 3 M -8 3 L 8 -3" stroke="#D97706" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Cracked Open Hazelnut Shell + Spherical Golden Kernel in Foreground Right -->
  <!-- Cracked wooden shell cup underneath -->
  <g transform="translate(206, 126)">
    <path d="M -34 6 C -36 28 -18 36 0 36 C 18 36 36 28 34 6 L 26 12 L 18 4 L 10 10 L 0 2 L -10 10 L -18 4 L -26 12 Z" fill="#78350F" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round" />
    <ellipse cx="0" cy="6" rx="30" ry="14" fill="#451A03" />

    <!-- Spherical Edible Hazelnut Kernel Resting in Shell -->
    <circle cx="0" cy="-6" r="26" fill="#B45309" stroke="#1E2A3B" stroke-width="2.4" />
    <!-- Fine papery skin pellicle stripes on hazelnut kernel -->
    <ellipse cx="0" cy="-6" rx="22" ry="22" fill="#D97706" />
    <path d="M -16 -16 C -6 -6 -6 6 -16 16 M 0 -24 C 6 -10 6 10 0 24 M 16 -16 C 6 -6 6 6 16 16" stroke="#92400E" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />
    <!-- Specular highlight on kernel -->
    <ellipse cx="-8" cy="-14" rx="6" ry="8" transform="rotate(-25 -8 -14)" fill="#FEF08A" opacity="0.8" />
    <circle cx="-9" cy="-16" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Small Cracked Shell Piece Lying on Table in Center -->
  <g transform="translate(156, 146) rotate(35)">
    <path d="M -12 6 C -14 -4 -4 -10 6 -6 C 12 -2 14 8 8 12 Z" fill="#78350F" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M -10 4 C -12 -2 -4 -6 4 -4" stroke="#451A03" stroke-width="1.5" fill="none" />
  </g>
</svg>
