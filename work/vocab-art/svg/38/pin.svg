  <!-- 4. Concealment edge and card-insert cue -->
  <g id="layer-details"><path d="M127 90 Q145 78 159 88 L165 97" fill="none" stroke="#5479AC" stroke-width="5" stroke-linecap="round"/><path d="M109 80 Q130 67 144 83" fill="none" stroke="#4A72B2" stroke-width="2.2" stroke-dasharray="4 4"/><path d="M141 146 H243" stroke="#64748B" stroke-width="2"/><path d="M114 128 L126 128" stroke="#4A72B2" stroke-width="2.4"/><path d="M124 124 L131 128 L124 132 Z" fill="#4A72B2"/></g>
