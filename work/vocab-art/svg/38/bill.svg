<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: bill / bills (noun; amount owed for a purchase or service)
  CONTEXTUAL_DEFINITION: A statement of what a customer owes, typically paid after a meal or service.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero document with unpaid-service context
  SYNONYM_GUARD: Show a restaurant bill awaiting payment, not a bank statement, business invoice, or paper check.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Café table with empty plate, narrow folded bill folder and tall itemized paper slip; a few coins are still separate from the slip to show payment is due.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:bill / bills" data-archetype="hero-object">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
