<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: action item
  CONTEXTUAL_DEFINITION: One specific task assigned during a meeting for someone to complete afterward.
  PEDAGOGICAL_ART_DIRECTOR: Highlight a single task card on a meeting record and visually connect it to the colleague responsible for doing it.
  PEDAGOGICAL_ARCHETYPE: 5 - Assignment / responsibility
  SYNONYM_GUARD: Keep this to one clearly assigned task, distinct from an action-points list containing several follow-up tasks.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put three seated meeting participants behind a table at y=132. Center a large unlettered meeting sheet at x=116..190, y=66..121; only one gold task row has a check box and a small gear icon. Draw a slim curved connector from that row to the right-hand colleague, who receives a small blank task card.
-->
