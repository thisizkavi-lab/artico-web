  CHAPTER: 26 — Communication and beliefs
  WORD: knock on wood / touch wood (UK) (Verb phrase)
  CONTEXTUAL_DEFINITION: Touch or tap wood after hopeful words to avoid tempting fate.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action with ritual cue
  SYNONYM_GUARD: Show a hopeful thought immediately paired with a small ritual tap on a wooden surface, not ordinary carpentry or a door knock.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Warm discussion-room table and pale wall.
    - Context_Layer: A person smiles toward a hopeful sun-and-sprout image in a bubble.
    - Focal_Layer: Their bent knuckles lightly tap the visible wooden tabletop.
    - Details_Layer: Small tap arcs and crossed fingers imply a protective superstition.
    - Lighting_Layer: A soft highlight ties the hope and the wood-touch gesture together.
-->
