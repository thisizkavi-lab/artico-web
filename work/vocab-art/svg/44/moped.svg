<!-- SELF_PROMPT:
  CHAPTER: 44 - Transportation and travel
  WORD: moped
  CONTEXTUAL_DEFINITION: A small light two-wheel vehicle with a modest motor, often retaining bicycle-style pedals.
  PEDAGOGICAL_ART_DIRECTOR: Show the compact step-through body, small motor, and pedals that make the moped distinct from a pedal-only bicycle and a larger motorcycle.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with functional parts
  SYNONYM_GUARD: Include a visible engine and simple pedals in a lightweight frame; avoid the large tank and body bulk of a motorcycle.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place wheels at (78,126) and (221,126), radius 21; form a small step-through frame from y=77 to y=124, a compact motor casing above the crank, pedals at x=149, and a small seat/handlebar; keep the engine separate from the rider saddle.
-->
