  CHAPTER: 24 — Studying
  WORD: give someone feedback on something (Verb phrase)
  CONTEXTUAL_DEFINITION: Offer another person specific helpful comments about their work.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action
  SYNONYM_GUARD: Show one student or instructor pointing to a peer's draft and explaining a constructive suggestion; distinguish this action from the feedback comments themselves.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Collaborative study table.
    - Context_Layer: Two learners face one another with a draft between them.
