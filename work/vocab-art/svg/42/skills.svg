<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: skills
  CONTEXTUAL_DEFINITION: Abilities developed through training or experience that help someone do a job.
  PEDAGOGICAL_ART_DIRECTOR: Show a broad mix of practical and interpersonal abilities around a candidate.
  PEDAGOGICAL_ARCHETYPE: 9 - Capability set
  SYNONYM_GUARD: Use several balanced capability icons to represent skills in general; do not highlight just the small role-critical subset used for key skills.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a candidate at x=125..179, y=79..137. Arrange four equal, blue-outlined skill tiles around them at x=66..105, x=199..238, y=46..83 and x=64..105, x=199..240, y=96..132. Use tool, teamwork, communication, and planning symbols with equal size and no gold priority treatment.
-->
