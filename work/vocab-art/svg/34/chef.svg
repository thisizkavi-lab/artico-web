  <!-- Chef Head, Warm Smile & Curled Mustache -->
  <rect x="115" y="102" width="22" height="14" rx="5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="94" cy="86" r="7.5" fill="#F3B89A" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="158" cy="86" r="7.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>
  <path d="M 96 66 L 156 66 L 155 88 C 155 105, 141 114, 126 114 C 111 114, 97 105, 97 88 Z"
