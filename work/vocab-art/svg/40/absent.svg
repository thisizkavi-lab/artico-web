<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: absent
  CONTEXTUAL_DEFINITION: Not present at a scheduled meeting.
  PEDAGOGICAL_ART_DIRECTOR: Make a vacant seat conspicuous among a few participants who have arrived; use a soft outline to hint at the missing person without drawing a ghost.
  PEDAGOGICAL_ARCHETYPE: 1 - Presence / absence
  SYNONYM_GUARD: The person is missing from the meeting, not forgetful, distracted, or absent-minded.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center an empty blue chair at x=128..178, y=87..151, behind the boardroom table at y=132. Put two small seated attendees at x=45..95 and x=211..260 in the rear. Add a subtle dashed oval above the vacant chair, and let the empty seat remain the brightest focal point.
-->
