<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:fish" data-archetype="hero-object">
  <defs>
    <!-- Domestic pet goldfish swimming inside a glass bowl with water and bubbles -->
    <clipPath id="bowl-water-clip">
      <path d="M 88 78 C 88 56 216 56 216 78 C 234 104 230 156 196 166 C 172 172 132 172 108 166 C 74 156 70 104 88 78 Z" />
    </clipPath>
    <clipPath id="fish-body-clip">
      <ellipse cx="148" cy="116" rx="28" ry="20" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="172" rx="72" ry="10" fill="#EAE3D5" />
  <ellipse cx="152" cy="170" rx="44" ry="6" fill="#DDD4C3" />

  <!-- Glass Fishbowl Base / Pedestal -->
  <ellipse cx="152" cy="168" rx="36" ry="6" fill="#E2E8F0" stroke="#1E2A3B" stroke-width="2.2" />

  <!-- Bowl Water & Interior -->
  <g clip-path="url(#bowl-water-clip)">
    <!-- Water base -->
    <rect x="60" y="66" width="184" height="110" fill="#BAE6FD" />
    <!-- Deeper water gradient/band -->
    <rect x="60" y="120" width="184" height="60" fill="#7DD3FC" />

    <!-- Colored Gravel Pebbles at bottom -->
    <ellipse cx="112" cy="160" rx="8" ry="5" fill="#F472B6" />
    <ellipse cx="126" cy="163" rx="9" ry="5" fill="#38BDF8" />
    <ellipse cx="142" cy="161" rx="10" ry="6" fill="#FBBF24" />
    <ellipse cx="160" cy="162" rx="9" ry="5" fill="#34D399" />
    <ellipse cx="176" cy="164" rx="8" ry="5" fill="#A78BFA" />
    <ellipse cx="190" cy="160" rx="9" ry="5" fill="#FB923C" />

    <!-- Aquatic Plant / Seaweed frond -->
    <path d="M 194 162 Q 206 138 196 118 Q 186 98 194 82" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" />
    <path d="M 194 162 Q 206 138 196 118 Q 186 98 194 82" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 186 162 Q 178 144 184 130" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" />

    <!-- Flowing Fan Tail Fin (Behind fish body) -->
    <path d="M 130 116 C 112 106 90 92 84 104 C 80 114 96 122 82 134 C 92 140 114 126 130 120 Z" fill="#FB923C" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 88 108 Q 108 114 128 116 M 86 128 Q 106 124 128 120" stroke="#EA580C" stroke-width="1.6" fill="none" />

    <!-- Dorsal Fin -->
    <path d="M 140 98 Q 152 86 166 94 Q 152 102 140 98 Z" fill="#FB923C" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />

    <!-- Goldfish Body -->
    <g clip-path="url(#fish-body-clip)">
      <ellipse cx="148" cy="116" rx="28" ry="20" fill="#F97316" />
      <!-- Golden belly highlight -->
      <ellipse cx="152" cy="124" rx="18" ry="10" fill="#FEF08A" />
      <!-- Scale arcs -->
      <path d="M 142 110 A 4 4 0 0 1 146 116 M 150 110 A 4 4 0 0 1 154 116 M 146 118 A 4 4 0 0 1 150 124" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round" />
    </g>
    <ellipse cx="148" cy="116" rx="28" ry="20" fill="none" stroke="#1E2A3B" stroke-width="2.4" />

    <!-- Pectoral Fin -->
    <path d="M 152 120 Q 142 132 134 130 Q 140 122 152 120 Z" fill="#FDBA74" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Fish Eye -->
    <ellipse cx="164" cy="110" rx="5" ry="5.5" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="1.8" />
    <circle cx="165" cy="110" r="3" fill="#1E2A3B" />
    <circle cx="166" cy="108.5" r="1.2" fill="#FFFFFF" />

    <!-- Cute Fish Mouth -->
    <path d="M 174 118 Q 176 121 173 124" fill="none" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />

    <!-- Bubbles Rising in Water -->
    <circle cx="176" cy="100" r="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.4" opacity="0.8" />
    <circle cx="174" cy="98" r="1.2" fill="#FFFFFF" />

    <circle cx="182" cy="84" r="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.4" opacity="0.8" />
    <circle cx="180" cy="82" r="1.5" fill="#FFFFFF" />

    <circle cx="178" cy="72" r="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- Water Surface Ellipse -->
  <ellipse cx="152" cy="74" rx="60" ry="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8" opacity="0.7" />

  <!-- Outer Glass Fishbowl Outline -->
  <path d="M 100 52 L 204 52 M 100 52 C 72 78 68 138 108 166 C 132 172 172 172 196 166 C 236 138 232 78 204 52" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Glass Rim -->
  <ellipse cx="152" cy="52" rx="52" ry="7" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Glass Light Reflection Highlights -->
  <path d="M 88 80 C 80 102 82 134 98 152" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 94 88 C 88 104 90 126 102 142" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>