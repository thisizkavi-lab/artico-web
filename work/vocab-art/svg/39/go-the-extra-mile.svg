<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: go the extra mile
  CONTEXTUAL_DEFINITION: Make a special extra effort to do more than the job requires.
  PEDAGOGICAL_ART_DIRECTOR: Show an employee voluntarily adding a thoughtful finishing touch after the core work is already complete.
  PEDAGOGICAL_ARCHETYPE: 7 - Effort / beyond requirement
  SYNONYM_GUARD: Avoid a road, distance, travel, or literal walking scene; make the additional effort visible as a completed task plus one optional extra improvement.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Set a desk across x=43..262 at y=133. Place a neat stack of finished folders on the left and a nearly complete presentation/model on the right. Center a focused employee at x=124..176, leaning forward to add a small gold detail to the model; include a finished checklist with only icon marks and a warm highlight around the extra addition.
-->
