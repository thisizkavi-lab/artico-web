<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:annoyed" data-archetype="expressive-bust">
  <defs>
    <path id="annoyed-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="annoyed-head-clip">
      <use href="#annoyed-head"/>
    </clipPath>
    <clipPath id="annoyed-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#F1F5F9"/>

  <!-- Torso (Mia: Cream Cardigan) -->
  <g clip-path="url(#annoyed-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#F3ECE1"/>
    <path d="M 140 126 L 152 142 L 164 126 Z" fill="#CE3D4E"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#E2DACD"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Shading -->
  <g clip-path="url(#annoyed-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#annoyed-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Mia) -->
  <path d="M 104 64 C 100 34, 122 18, 152 18 C 182 18, 204 34, 200 64 C 206 90, 206 126, 194 142 C 188 132, 186 96, 184 72 C 176 44, 128 44, 120 72 C 118 96, 116 132, 110 142 C 98 126, 98 90, 104 64 Z"
        fill="#6E473B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Irritated Eyebrows (One twitching down) -->
  <path d="M 124 70 L 144 66" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 160 66 L 180 72" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Annoyed Eye-Roll (Looking Upwards-Right) -->
  <circle cx="134" cy="78" r="8" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="136" cy="74" r="3.5" fill="#1E2A3B"/>

  <circle cx="170" cy="78" r="8" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="172" cy="74" r="3.5" fill="#1E2A3B"/>

  <!-- Wavy Disgruntled Frown -->
  <path d="M 136 102 Q 144 98 152 102 Q 160 106 168 100" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Annoying Mosquito Buzzing in Ear -->
  <g transform="translate(228, 64)">
    <!-- Buzzing loop -->
    <path d="M -24 16 Q -14 2 -6 10 Q 2 18 10 8" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 3"/>
    <!-- Mosquito Body -->
    <ellipse cx="14" cy="8" rx="4" ry="2.5" fill="#1E2A3B"/>
    <ellipse cx="12" cy="4" rx="4" ry="2" fill="#DCECFB" stroke="#1E2A3B" stroke-width="1"/>
  </g>

  <!-- Small Anger Twitch Vein on Forehead -->
  <g stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 122 52 Q 126 56 130 52"/>
    <path d="M 130 52 Q 134 56 130 60"/>
  </g>
</svg>
