<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: shoplifting (Noun)
  CONTEXTUAL_DEFINITION: Taking merchandise from a shop without paying for it.
  PEDAGOGICAL_ARCHETYPE: 4 — Peak-moment action with store merchandise and concealed property
  SYNONYM_GUARD: Show an unpaid shop item hidden in a shopper's open bag while a clerk notices, distinct from a threatening shop robbery.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A small shop aisle with shelves of simple unmarked goods.
    - Context_Layer: An empty display space and a checkout counter identify merchandise.
    - Focal_Layer: A shopper holds an item over an open tote while a clerk gestures toward it.
    - Details_Layer: A ceiling camera and a gold alert cue show the act has been noticed.
    - Lighting_Layer: Even shop lighting keeps the scene clear and non-sensational.
-->
