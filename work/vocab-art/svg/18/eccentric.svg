  CHAPTER: 18 — Personality traits
  WORD: eccentric (Adjective)
  CONTEXTUAL_DEFINITION: Unusually distinctive in personal style or habits.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: A person cheerfully wears deliberately mismatched but coordinated clothes and a quirky hat; the odd self-expression is individual, not foolishness.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Neighborhood gathering room.
    - Context_Layer: Two peers notice the distinctive outfit with curiosity.
    - Focal_Layer: Self-assured person in a bold asymmetrical coat and playful hat.
    - Details_Layer: Mismatched patterns, unusual hat, offbeat accessory and calm smile.
    - Lighting_Layer: Warm halo over the unusual but confident presentation.
-->
