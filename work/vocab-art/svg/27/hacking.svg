<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: hacking (Noun)
  CONTEXTUAL_DEFINITION: Unauthorized access to a computer system or account.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract offense shown through a breached digital lock
  SYNONYM_GUARD: Show an outsider breaking into a protected computer system, distinct from lawful programming or cybersecurity work.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A dim room with two computer stations and cool monitor light.
    - Context_Layer: The owner's screen shows a simple closed lock that has been opened without permission.
    - Focal_Layer: A concealed figure reaches toward the stolen access while the rightful user notices the breach.
    - Details_Layer: A broken lock icon and a dotted intrusion path provide the clue; no code or instructions appear.
    - Lighting_Layer: Blue screen glow with a small plum alert halo keeps the meaning clear and non-technical.
-->
