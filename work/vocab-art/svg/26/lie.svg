<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: lie (Verb)
  CONTEXTUAL_DEFINITION: Deliberately tell someone something known to be untrue.
  PEDAGOGICAL_ARCHETYPE: 3 — Person-to-person mismatch scene
  SYNONYM_GUARD: Show a speaker presenting a false intact-object image while hiding the real broken object, distinct from a harmless white lie.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Neighborhood room after a flowerpot has cracked.
    - Context_Layer: Listener trusts the speaker and sees an apparently intact pot in a bubble.
    - Focal_Layer: Speaker hides the visibly broken pot behind their back while making a confident claim.
    - Details_Layer: A mismatch between the presented image and concealed reality exposes the lie.
    - Lighting_Layer: Mild warm light; avoid a sinister or criminal tone.
-->
