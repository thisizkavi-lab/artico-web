<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: accommodation
  CONTEXTUAL_DEFINITION: A place or places where a traveler can stay overnight.
  PEDAGOGICAL_ART_DIRECTOR: Show a traveler arriving with a suitcase among several distinct lodging buildings to make accommodation the broad category.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / travel diagram
  SYNONYM_GUARD: Show lodging broadly rather than one specific hotel, house, or room type.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Three compact but distinct lodging buildings occupy the midground; one traveler with a rolling case stands in the foreground facing them.
-->
