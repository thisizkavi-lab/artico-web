<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: fraud (Noun)
  CONTEXTUAL_DEFINITION: Deliberate deception for unlawful financial gain.
  PEDAGOGICAL_ARCHETYPE: 6 — Abstract crime shown through a misleading sale
  SYNONYM_GUARD: Show a seller knowingly misrepresenting an empty box to obtain payment, distinct from a simple mistake or a direct theft.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A small indoor sales counter with a warm display shelf.
    - Context_Layer: A blank box sits open beside a few payment coins.
    - Focal_Layer: A seller presents the box as full using a glowing picture cue while the buyer discovers it is empty.
    - Details_Layer: The buyer's coins move toward the seller; the empty interior and mismatched image reveal deception.
    - Lighting_Layer: Warm gold highlights the false promise and a muted plum alert marks dishonesty.
-->
