<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: attend a meeting
  CONTEXTUAL_DEFINITION: Be present at and take part in a meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show one worker entering the boardroom and joining colleagues already gathered at the table, so the action of attendance is clear.
  PEDAGOGICAL_ARCHETYPE: 2 - Arrival / participation
  SYNONYM_GUARD: Depict the act of joining the meeting, not just a portrait of one attendee or an empty chair.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place an open doorway at x=22..78 on the left. A standing worker at x=54..102 steps inward toward a table from x=103..276 at y=132; two colleagues at x=164..205 and x=224..260 are seated and turn toward the arriving person. Keep the open door and table group equally readable.
-->
