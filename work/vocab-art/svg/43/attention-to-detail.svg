<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: attention to detail
  CONTEXTUAL_DEFINITION: Careful focus on small parts so errors are noticed.
  PEDAGOGICAL_ART_DIRECTOR: Show a worker inspecting a small component with care before approving the work.
  PEDAGOGICAL_ARCHETYPE: 44 - Careful close inspection
  SYNONYM_GUARD: Emphasize noticing tiny specifics, not broad accuracy or general organization.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a worker at x=102 studying a small assembly on a table; enlarge the tiny connector in a circular magnifier at x=209..256, and show one overlooked loose piece being caught before a check mark is placed.
-->
