<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:surprised" data-archetype="expressive-bust">
  <defs>
    <path id="surprised-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="surprised-head-clip">
      <use href="#surprised-head"/>
    </clipPath>
    <clipPath id="surprised-torso-clip">
      <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178 Z"/>
    </clipPath>
  </defs>

  <!-- Warm Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#FEF3C7"/>

  <!-- Torso (Mia: Coral top) -->
  <g clip-path="url(#surprised-torso-clip)">
    <rect x="70" y="120" width="164" height="64" fill="#CE3D4E"/>
    <path d="M 70 178 C 82 144, 100 130, 120 126 L 120 178 Z" fill="#9E2636"/>
  </g>
  <path d="M 74 178 C 82 138, 108 124, 152 124 C 196 124, 222 138, 230 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="112" width="24" height="20" rx="6" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#E5A283" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Shading -->
  <g clip-path="url(#surprised-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#F5BFA3"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#E5A283" opacity="0.6"/>
  </g>
  <use href="#surprised-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Mia: Chestnut brown) -->
  <path d="M 104 64 C 100 34, 122 18, 152 18 C 182 18, 204 34, 200 64 C 206 90, 206 126, 194 142 C 188 132, 186 96, 184 72 C 176 44, 128 44, 120 72 C 118 96, 116 132, 110 142 C 98 126, 98 90, 104 64 Z"
        fill="#6E473B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- High Raised Arched Eyebrows -->
  <path d="M 124 64 Q 134 56 144 64" fill="none" stroke="#1E2A3B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 160 64 Q 170 56 180 64" fill="none" stroke="#1E2A3B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Big Wide Circular Eyes (Small Pupils in White Sclera) -->
  <circle cx="134" cy="78" r="9.5" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="134" cy="78" r="4.2" fill="#1E2A3B"/>
  <circle cx="132" cy="76" r="1.5" fill="#FFFFFF"/>

  <circle cx="170" cy="78" r="9.5" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2.2"/>
  <circle cx="170" cy="78" r="4.2" fill="#1E2A3B"/>
  <circle cx="168" cy="76" r="1.5" fill="#FFFFFF"/>

  <!-- Open 'O' Mouth of Surprise -->
  <ellipse cx="152" cy="106" rx="8" ry="12" fill="#7D1D2B" stroke="#1E2A3B" stroke-width="2.4"/>

  <!-- Hands Touching Cheeks in Astonishment -->
  <ellipse cx="106" cy="102" rx="9" ry="14" transform="rotate(-15 106 102)" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2"/>
  <ellipse cx="198" cy="102" rx="9" ry="14" transform="rotate(15 198 102)" fill="#F5BFA3" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Surprise / Shock Pop Marks (Exclamation Mark Cue without text font) -->
  <g fill="#D97706" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round">
    <path d="M 226 40 L 232 40 L 230 56 L 228 56 Z"/>
    <circle cx="229" cy="62" r="2.5"/>
  </g>
  <!-- Motion Burst Rays -->
  <g stroke="#D97706" stroke-width="2" stroke-linecap="round">
    <line x1="84" y1="46" x2="74" y2="40"/>
    <line x1="92" y1="36" x2="88" y2="28"/>
    <line x1="214" y1="36" x2="220" y2="28"/>
  </g>
</svg>
