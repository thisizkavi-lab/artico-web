  <!-- Left biscuit -->
  <path d="M 124 112 C 120 108 114 108 114 112 C 114 116 118 118 116 120 C 114 122 110 122 110 126 C 110 130 116 130 120 126 L 140 126 C 144 130 150 130 150 126 C 150 122 146 122 144 120 C 142 118 146 116 146 112 C 146 108 140 108 136 112 Z" fill="#FDE68A" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />
  <!-- Right biscuit -->
  <path d="M 164 114 C 160 110 154 110 154 114 C 154 118 158 120 156 122 C 154 124 150 124 150 128 C 150 132 156 132 160 128 L 180 128 C 184 132 190 132 190 128 C 190 124 186 124 184 122 C 182 120 186 118 186 114 C 186 110 180 110 176 114 Z" fill="#FEF08A" stroke="#1E2A3B" stroke-width="1.8" stroke-linejoin="round" />

