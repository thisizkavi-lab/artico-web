<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:unimpressed" data-archetype="expressive-bust">
  <defs>
    <path id="unimpressed-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="unimpressed-head-clip">
      <use href="#unimpressed-head"/>
    </clipPath>
    <clipPath id="unimpressed-torso-clip">
      <path d="M 72 178 C 80 138, 108 124, 152 124 C 196 124, 224 138, 232 178 Z"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#F1F5F9"/>

  <!-- Arms Defiantly Crossed Over Chest -->
  <path d="M 82 152 L 152 152 L 222 152" stroke="#1E2A3B" stroke-width="18" stroke-linecap="round"/>
  <path d="M 82 152 L 152 152 L 222 152" stroke="#7FA1CF" stroke-width="13" stroke-linecap="round"/>
  <!-- Crossed Hand Tucked In -->
  <ellipse cx="204" cy="148" rx="10" ry="7" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Torso (Sam) -->
  <g clip-path="url(#unimpressed-torso-clip)">
    <rect x="68" y="120" width="168" height="64" fill="#7FA1CF"/>
    <path d="M 68 178 C 78 144, 98 130, 118 126 L 118 178 Z" fill="#5479AC"/>
  </g>
  <path d="M 72 178 C 80 138, 108 124, 152 124 C 196 124, 224 138, 232 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="140" y="110" width="24" height="20" rx="6" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Head Contour & Shading -->
  <g clip-path="url(#unimpressed-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#D89A6C"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#B6784B" opacity="0.6"/>
  </g>
  <use href="#unimpressed-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Sam) -->
  <path d="M 108 64 C 104 36, 126 20, 152 20 C 178 20, 200 36, 196 64 C 192 50, 180 40, 152 40 C 124 40, 112 50, 108 64 Z"
        fill="#3A2E2B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Flat Skeptical Eyebrows -->
  <line x1="124" y1="68" x2="144" y2="68" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="160" y1="68" x2="180" y2="68" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="134" cy="78" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="170" cy="78" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <line x1="144" y1="78" x2="160" y2="78" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Half-Lidded Dry Side-Glance Eyes (-_- Look) -->
  <line x1="126" y1="78" x2="142" y2="78" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="138" cy="80" r="2.8" fill="#1E2A3B"/>

  <line x1="162" y1="78" x2="178" y2="78" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="174" cy="80" r="2.8" fill="#1E2A3B"/>

  <!-- Deadpan Horizontal Mouth -->
  <line x1="138" y1="102" x2="166" y2="102" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Half-Hearted / Zero-Energy Sigh Wave -->
  <path d="M 188 106 Q 198 102 206 108" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
</svg>
