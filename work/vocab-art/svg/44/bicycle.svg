  CHAPTER: 44 - Transportation and travel
  WORD: bicycle / bike (in the bicycle sense)
  CONTEXTUAL_DEFINITION: A two-wheel road vehicle powered by a rider turning the pedals.
  PEDAGOGICAL_ART_DIRECTOR: Make the pedal-powered cycle unmistakable and distinguish it from the motorized moped and motorcycle.
