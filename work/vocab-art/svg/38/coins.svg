<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: coins (plural noun)
  CONTEXTUAL_DEFINITION: Small round metal pieces used as money, distinct from paper notes.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object / material study
  SYNONYM_GUARD: Make circular ridged metal edges and stacked thickness unmistakable; no paper banknotes in this image.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Three foreground copper/gold coins, one upright at x114 y95 with oval face, ridged edge; two short stacks at x170 and x205; tabletop contact shadow.
-->
