<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: agenda
  CONTEXTUAL_DEFINITION: A plan or list of topics to be discussed at a meeting.
  PEDAGOGICAL_ART_DIRECTOR: Make a forward-looking meeting plan visible as ordered topics prepared before a group begins discussing them.
  PEDAGOGICAL_ARCHETYPE: 5 - Planned sequence
  SYNONYM_GUARD: The list is a plan for what will be discussed, not the later written minutes or a list of tasks assigned afterward.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a tall planning sheet at x=111..193, y=40..128 on a boardroom table. Show four evenly spaced topic rows with distinct small icons and a clear top-to-bottom path arrow along the margin; three waiting attendees sit low behind the table, ready to begin.
-->
