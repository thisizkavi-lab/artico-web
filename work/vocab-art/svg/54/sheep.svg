  <path d="M 136 94 A 8 8 0 0 1 148 102 M 168 88 A 8 8 0 0 1 180 96 M 204 96 A 8 8 0 0 1 216 104 M 150 120 A 8 8 0 0 1 162 128 M 184 122 A 8 8 0 0 1 196 130" fill="none" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" />

  <!-- Horizontal Droopy Dark Ears -->
  <ellipse cx="88" cy="82" rx="12" ry="5" transform="rotate(-15 88 82)" fill="#1E293B" stroke="#1E2A3B" stroke-width="2" />
  <ellipse cx="114" cy="84" rx="12" ry="5" transform="rotate(15 114 84)" fill="#1E293B" stroke="#1E2A3B" stroke-width="2" />

