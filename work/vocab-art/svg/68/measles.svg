<!-- SELF_PROMPT:
 CHAPTER: 68 - Sickness
 WORD: measles
 CONTEXTUAL_DEFINITION: A contagious illness that commonly causes fever and a widespread flat red rash.
 PEDAGOGICAL_ARCHETYPE: a mildly unwell child with a widespread flat rash
 SYNONYM_GUARD: Use flat red spots and blotches spreading across face and arms; avoid raised, fluid-filled chickenpox-like blisters.
 MODE: STATIC
 COORDINATE_BLUEPRINT: Seat a tired child at home with flat red spots across both cheeks, neck and arms; show a few overlapping flush patches and a covered bed behind.
-->
