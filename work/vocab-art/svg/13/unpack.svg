<!-- SELF_PROMPT:
  CHAPTER: 13 — Moving and renting
  WORD: unpack (Verb)
  CONTEXTUAL_DEFINITION: Open a packed box and remove the belongings inside.
  PEDAGOGICAL_ARCHETYPE: 4 — Objects moving outward from carton
  SYNONYM_GUARD: Show the box already open and belongings being lifted out toward a shelf; pack puts objects inside and closes flaps.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: New room with open carton and empty shelf.
    - Context_Layer: Partly filled shelf awaits items.
    - Focal_Layer: Person lifts a wrapped object up and out of open box.
    - Details_Layer: Box flaps are folded outward and other objects are already unpacked.
    - Lighting_Layer: Upward motion arrows leave the box.
-->
