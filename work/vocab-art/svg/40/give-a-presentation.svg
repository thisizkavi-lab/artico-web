<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: give a presentation
  CONTEXTUAL_DEFINITION: Deliver a prepared talk or explanation to an audience.
  PEDAGOGICAL_ART_DIRECTOR: Focus on the presenter's active delivery: one person addresses a seated audience beside a projected visual.
  PEDAGOGICAL_ARCHETYPE: 4 - Public speaking / delivery
  SYNONYM_GUARD: Show a speaker presenting to people, not merely a prepared slide file or a gift being presented.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put a wide screen at x=43..151, y=34..102, displaying three simple icon blocks. Place a presenter at x=171..218, standing beside the screen with one arm extended; three audience heads sit across the lower area behind a table at y=132, all oriented toward the speaker.
-->
