<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: arrogant (Adjective)
  CONTEXTUAL_DEFINITION: Acting as though one is more important or superior to others.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: The focal person looks down from a slightly raised step while peers stand at equal ground; this superiority cue distinguishes arrogance from confidence.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Community-room step and common floor.
    - Context_Layer: Two peers at ground level looking toward the focal person.
    - Focal_Layer: Person at center stands above them with chin lifted and folded arms.
    - Details_Layer: Downward gaze, raised chin and small status step.
    - Lighting_Layer: Subdued halo makes posture, not power, the focus.
-->
