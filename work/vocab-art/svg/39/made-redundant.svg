<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: made redundant (past participle; role no longer needed)
  CONTEXTUAL_DEFINITION: Losing a job because the employer no longer needs that role, rather than because of the employee's performance.
  PEDAGOGICAL_ART_DIRECTOR: Show one role disappearing during workplace consolidation, with a respectful departing worker and a visibly merged workstation.
  PEDAGOGICAL_ARCHETYPE: 3 - Workplace transition with causal context
  SYNONYM_GUARD: This is role redundancy, not a disciplinary firing or a general company-wide layoff.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put one employee with a personal box at x=111..176,y=88..151. In back, two old desks and chairs converge toward one combined workstation under a manager's calm gesture; leave one former station visibly vacant.
-->
