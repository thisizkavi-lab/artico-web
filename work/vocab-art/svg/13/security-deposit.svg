<!-- SELF_PROMPT:
  CHAPTER: 13 — Moving and renting
  WORD: security deposit (Noun phrase)
  CONTEXTUAL_DEFINITION: Money held as protection against damage and returned when the rental ends in good condition.
  PEDAGOGICAL_ARCHETYPE: 6 — Held amount and refund outcome
  SYNONYM_GUARD: Show the money kept aside, an inspection of an undamaged room, and a return arrow; ordinary deposit reserves a home up front.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Neat rental room at move-out inspection.
    - Context_Layer: Clean wall and intact floor signal no damage.
    - Focal_Layer: Separate sealed money envelope is held beside an inspection checklist.
    - Details_Layer: Returning hand moves envelope back to tenant.
    - Lighting_Layer: Circular blue arrow communicates money comes back.
-->
