<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: take minutes
  CONTEXTUAL_DEFINITION: Write a record of the important points during a meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show one participant actively taking notes as coworkers speak around the table.
  PEDAGOGICAL_ARCHETYPE: 4 - Note-taking action
  SYNONYM_GUARD: This is the act of writing meeting notes in progress, distinct from the finished minutes document and later review of that document.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Put an open notebook at x=113..185, y=105..133 on a table. A seated note-taker at x=124..171 holds a pen touching a page with a few fresh icon marks; two coworkers at x=47..91 and x=214..257 face the note-taker and speak with small, text-free gesture arcs.
-->
