<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:sheep" data-archetype="hero-object">
  <defs>
    <!-- Farm Sheep: cloud-scalloped thick woolly fleece, dark face and ears, slender legs, cloven hooves -->
    <clipPath id="sheep-body-clip">
      <path d="M 110 90 C 110 68 142 66 182 66 C 220 66 242 86 240 128 C 236 152 206 156 164 154 C 122 152 110 126 110 90 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="160" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="162" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Slender Dark Hind Legs & Cloven Hooves -->
  <path d="M 196 128 L 194 162 L 208 162 L 214 130 Z" fill="#334155" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="194" y="156" width="14" height="6" fill="#0F172A" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="201" y1="156" x2="201" y2="162" stroke="#FAF8F3" stroke-width="1.2" />

  <path d="M 212 130 L 216 160 L 226 160 L 228 134 Z" fill="#1E293B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round" />
  <rect x="216" y="154" width="10" height="6" fill="#0F172A" stroke="#1E2A3B" stroke-width="1.6" />

