<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: innovative
  CONTEXTUAL_DEFINITION: Introducing a new idea or method that improves how work is done.
  PEDAGOGICAL_ART_DIRECTOR: Show someone applying an original idea to make an existing work process more useful.
  PEDAGOGICAL_ARCHETYPE: 18 - Applied improvement
  SYNONYM_GUARD: Depict a new idea being put into use to improve a process; creative describes generating an idea before application.
