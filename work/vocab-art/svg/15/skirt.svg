<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:skirt">
  <defs>
    <clipPath id="skirt-clip">
      <path d="M 120 48 L 184 48 L 224 162 C 196 168 108 168 80 162 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop glow -->
  <ellipse cx="152" cy="110" rx="88" ry="60" fill="#E0E7FF" opacity="0.6"/>

  <!-- Wooden Skirt Clamp Hanger -->
  <path d="M 152 20 C 158 20 162 24 160 30 C 158 34 153 36 152 40" fill="none" stroke="#9A6945" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="110" y="40" width="84" height="6" rx="2" fill="#C59B75" stroke="#1E2A3B" stroke-width="1.8"/>
  <!-- Silver clamp clips holding waistband -->
  <rect x="122" y="38" width="8" height="14" rx="1.5" fill="#CBD5E1" stroke="#1E2A3B" stroke-width="1.6"/>
  <rect x="174" y="38" width="8" height="14" rx="1.5" fill="#CBD5E1" stroke="#1E2A3B" stroke-width="1.6"/>

  <!-- Main Flared Pleated Skirt Body -->
  <path d="M 120 48 L 184 48 L 224 162 C 196 168 108 168 80 162 Z"
        fill="#1E3A8A" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Structured Knife Pleats & 3-Tone Shading -->
  <g clip-path="url(#skirt-clip)">
    <!-- Right side overall shadow -->
    <path d="M 152 48 L 184 48 L 224 162 L 152 165 Z" fill="#172554"/>

    <!-- Individual Knife Pleat Facets (alternating highlight & shadow) -->
    <!-- Pleat 1 -->
    <polygon points="120,48 128,48 96,164 80,162" fill="#3B82F6"/>
    <!-- Pleat 2 -->
    <polygon points="128,48 136,48 114,165 96,164" fill="#2563EB"/>
    <!-- Pleat 3 -->
    <polygon points="136,48 144,48 132,166 114,165" fill="#3B82F6"/>
    <!-- Pleat 4 -->
    <polygon points="144,48 152,48 150,166 132,166" fill="#2563EB"/>
    <!-- Pleat 5 -->
    <polygon points="152,48 160,48 168,166 150,166" fill="#1D4ED8"/>
    <!-- Pleat 6 -->
    <polygon points="160,48 168,48 186,165 168,166" fill="#1E3A8A"/>
    <!-- Pleat 7 -->
    <polygon points="168,48 176,48 204,164 186,165" fill="#1D4ED8"/>
    <!-- Pleat 8 -->
    <polygon points="176,48 184,48 224,162 204,164" fill="#172554"/>

    <!-- Tartan / Plaid Horizontal Accent Bands across pleats -->
    <path d="M 80 130 C 130 136 174 136 224 130" stroke="#F59E0B" stroke-width="2.5" fill="none"/>
    <path d="M 80 138 C 130 144 174 144 224 138" stroke="#EF4444" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Crisp Fold Edge Lines -->
  <line x1="128" y1="48" x2="96" y2="164" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="136" y1="48" x2="114" y2="165" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="144" y1="48" x2="132" y2="166" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="152" y1="48" x2="150" y2="166" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="160" y1="48" x2="168" y2="166" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="168" y1="48" x2="186" y2="165" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="176" y1="48" x2="204" y2="164" stroke="#1E2A3B" stroke-width="1.8"/>

  <!-- Fitted Waistband at Top -->
  <path d="M 118 46 L 186 46 L 184 54 L 120 54 Z"
        fill="#1E2A3B" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="126" cy="50" r="1.6" fill="#FAF8F3"/>
</svg>