<!-- SELF_PROMPT:
  CHAPTER: 45 - Driving a car
  WORD: turn signal / indicator (UK)
  CONTEXTUAL_DEFINITION: The amber lamp fitted at a vehicle corner that flashes to show an intended turn.
  PEDAGOGICAL_ART_DIRECTOR: Isolate the amber lens on a muted car fender, with a small curved arrow-like glow cue beside it; keep the lens as the object.
  PEDAGOGICAL_ARCHETYPE: 2 - Part-of-whole focus callout
  SYNONYM_GUARD: This is the lamp component, not a driver making a hand signal or the general action of signaling.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Muted front fender and headlamp extend x=45..250. Put a distinct amber side repeater at (174,119) on the fender, between front wheel and mirror; small amber radiating ticks point outward.
-->
