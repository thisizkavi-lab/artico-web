    - Focal_Layer: Plunger with wooden handle and broad rubber cup presses into the sink at x=157,y=94.
    - Details_Layer: Drain ring, water spiral, splashes, pipe joint, handle grain, and cup rim.
    - Lighting_Layer: Cool highlights on the basin and small glints in the draining water.
-->
