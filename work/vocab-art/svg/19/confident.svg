<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:confident" data-archetype="expressive-bust">
  <defs>
    <path id="confident-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="confident-head-clip">
      <use href="#confident-head"/>
    </clipPath>
    <clipPath id="confident-torso-clip">
      <path d="M 72 178 C 80 136, 106 122, 152 122 C 198 122, 224 136, 232 178 Z"/>
    </clipPath>
  </defs>

  <!-- Cool Slate-Blue Background Circle -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#E2E8F0"/>

  <!-- Puffed Chest / Confident Posture (Sam) -->
  <g clip-path="url(#confident-torso-clip)">
    <rect x="68" y="118" width="168" height="66" fill="#7FA1CF"/>
    <path d="M 146 122 L 158 136 L 158 178 L 146 178 Z" fill="#5479AC"/>
    <path d="M 68 178 C 78 144, 98 130, 118 126 L 118 178 Z" fill="#5479AC"/>
  </g>
  <path d="M 72 178 C 80 136, 106 122, 152 122 C 198 122, 224 136, 232 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Strong Raised Right Arm Giving Thumbs Up in Foreground -->
  <path d="M 194 136 L 226 120 L 238 132 L 206 154 Z"
        fill="#7FA1CF" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Thumbs-up Fist -->
  <circle cx="236" cy="122" r="11" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.4"/>
  <!-- Thumb pointing straight up -->
  <path d="M 230 114 L 230 96 C 230 92, 238 92, 238 96 L 238 114 Z"
        fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Confidence Sparkle beside Thumb -->
  <path d="M 248 94 Q 252 94 252 88 Q 252 94 256 94 Q 252 94 252 100 Q 252 94 248 94 Z" fill="#F59E0B"/>

  <!-- Neck -->
  <rect x="140" y="110" width="24" height="20" rx="6" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Shading -->
  <g clip-path="url(#confident-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#D89A6C"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#B6784B" opacity="0.6"/>
  </g>
  <use href="#confident-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Sam) -->
  <path d="M 108 64 C 104 36, 126 20, 152 20 C 178 20, 200 36, 196 64 C 192 50, 180 40, 152 40 C 124 40, 112 50, 108 64 Z"
        fill="#3A2E2B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Firm Confident Eyebrows -->
  <path d="M 124 66 L 144 64" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 160 64 L 180 66" stroke="#1E2A3B" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Glasses (Sam) -->
  <circle cx="134" cy="76" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="170" cy="76" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <line x1="144" y1="76" x2="160" y2="76" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Calm Self-Assured Eyes -->
  <circle cx="134" cy="76" r="3.5" fill="#1E2A3B"/>
  <circle cx="136" cy="74.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="170" cy="76" r="3.5" fill="#1E2A3B"/>
  <circle cx="172" cy="74.5" r="1.2" fill="#FFFFFF"/>

  <!-- Knowing, Self-Assured Smile -->
  <path d="M 136 98 Q 152 108 168 98" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 166 96 Q 170 98 168 102" fill="none" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round"/>
</svg>
