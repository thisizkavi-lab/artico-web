<!-- SELF_PROMPT:
 CHAPTER: 67 - Media and celebrity
 WORD: sensationalize
 CONTEXTUAL_DEFINITION: To present an ordinary event as far more shocking or important than it really is.
 PEDAGOGICAL_ARCHETYPE: small harmless event exaggerated into oversized news coverage
 SYNONYM_GUARD: Show media exaggeration of a minor event, not genuine sensational news or a dangerous incident.
 MODE: STATIC
 COORDINATE_BLUEPRINT: A small spilled cup sits on a table beside a huge newspaper-like media panel magnifying the same tiny spill into a dramatic spotlight image with oversized burst rays.
-->
