<!-- SELF_PROMPT:
  CHAPTER: 48 - Travel and tourism
  WORD: see somebody off / see off somebody
  CONTEXTUAL_DEFINITION: Go with someone to their departure and say goodbye as they leave.
  PEDAGOGICAL_ART_DIRECTOR: Show both the departing traveler and the friend left on the platform waving goodbye.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-Moment Farewell
  SYNONYM_GUARD: Make one person depart while another stays to accompany and wave them off; do not show two travelers merely meeting.
  MODE: STATIC
  COORDINATE_BLUEPRINT: At a station platform, a waiting friend waves up to a traveler waving back through a train window as the train pulls away.
-->
