  <!-- Toe Seam Lines -->
  <line x1="120" y1="168" x2="128" y2="174" stroke="#1E2A3B" stroke-width="1.5"/>
  <line x1="178" y1="168" x2="186" y2="174" stroke="#1E2A3B" stroke-width="1.5"/>
</svg>