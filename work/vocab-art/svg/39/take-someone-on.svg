<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: take someone on (phrasal verb; recruit into employment)
  CONTEXTUAL_DEFINITION: Employ a person or add them to the organization.
  PEDAGOGICAL_ART_DIRECTOR: Show a manager bringing one new worker into the office and giving them a work key, distinct from a standard interview or team-circle scene.
  PEDAGOGICAL_ARCHETYPE: 3 - New employee onboarding
  SYNONYM_GUARD: Although this phrase can also mean challenge or compete with someone, the chapter's hiring group locks it to employment.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Use the open office doorway at x=219..266. The manager stands inside at x=164..207 and gestures toward a ready desk; a newcomer steps over the threshold carrying a small work bag. A blue access key passes from manager to recruit.
-->
