  <circle cx="68" cy="158" r="4.5" fill="#D97706" stroke="#1E2A3B" stroke-width="1.4" />
  <circle cx="76" cy="162" r="4" fill="#92400E" stroke="#1E2A3B" stroke-width="1.4" />
