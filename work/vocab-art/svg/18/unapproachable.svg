<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: unapproachable (Adjective)
  CONTEXTUAL_DEFINITION: Giving the impression that others cannot easily start a conversation with you.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: A closed-off person turns away behind crossed arms while a peer stops before coming closer; unlike unfriendly, no active insult is shown.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Quiet social room with a clear open floor between people.
    - Context_Layer: Hesitant peer at x=72 with a half-raised hand.
    - Focal_Layer: Closed posture at x=213, shoulders angled away.
    - Details_Layer: Crossed arms, downturned brows and an empty approach gap.
    - Lighting_Layer: Cool muted halo around the barrier-like posture.
-->
