<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: presentation
  CONTEXTUAL_DEFINITION: A prepared visual talk or set of materials shown to an audience.
  PEDAGOGICAL_ART_DIRECTOR: Emphasize the prepared presentation materials and assembled audience, not the speaker's act of delivering them.
  PEDAGOGICAL_ARCHETYPE: 5 - Prepared presentation
  SYNONYM_GUARD: In this chapter the noun means a visual talk/material, not the act of giving it and not a gift or award ceremony.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Show a large projection screen at x=59..242, y=29..119 with three polished, text-free visual panels in sequence and a slim stack of preview cards at one edge. A small audience sits at the bottom center, looking up; no presenter occupies the focal plane.
-->
