<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: professional achievements
  CONTEXTUAL_DEFINITION: Important successes or accomplishments gained through work.
  PEDAGOGICAL_ART_DIRECTOR: Show a candidate's concrete completed work wins, represented by a project result and a modest recognition badge.
  PEDAGOGICAL_ARCHETYPE: 7 - Work accomplishment
  SYNONYM_GUARD: Show specific completed successes, distinct from a long-term track record of repeated results or a generic list of skills.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a finished work project model on a table at x=88..183 and a gold achievement medallion at x=197..227. A professional at x=52..101 gestures toward the result, while a small completed-check page sits beside the project; keep the trophy modest and work-linked.
-->
