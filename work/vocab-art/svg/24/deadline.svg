<!-- SELF_PROMPT:
  CHAPTER: 24 — Studying
  WORD: deadline (Noun)
  CONTEXTUAL_DEFINITION: The latest time or date by which work must be submitted.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Depict the due point as a highlighted final slot on a calendar beside a ticking clock and waiting assignment, not a person submitting early or late.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Study desk and wall calendar.
    - Context_Layer: Assignment folder and analog clock.
    - Focal_Layer: Last calendar square highlighted as a firm cutoff.
    - Details_Layer: A short line of remaining work leading to the marked point.
    - Lighting_Layer: Strong warm highlight on the final due point.
-->
