  CHAPTER: 41 - Work and business idioms
  WORD: business as usual (idiom)
  CONTEXTUAL_DEFINITION: Ordinary work continues in its familiar routine despite a minor interruption.
  PEDAGOGICAL_ARCHETYPE: 4 - Calm work action with routine context
  SYNONYM_GUARD: A composed shop clerk keeps handling an ordinary transaction; this is steady routine rather than a general definition of business.
  MODE: STATIC
