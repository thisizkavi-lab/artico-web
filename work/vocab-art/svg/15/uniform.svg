  <polygon points="114,92 115.5,95 119,95 116,97 117,100 114,98 111,100 112,97 109,95 112.5,95" fill="#FEF3C7"/>

  <!-- Polished Brass Front Uniform Buttons -->
  <circle cx="152" cy="116" r="3.2" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.4"/>
  <circle cx="152" cy="116" r="1.4" fill="#FEF3C7"/>
  <circle cx="152" cy="130" r="3.2" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.4"/>
  <circle cx="152" cy="130" r="1.4" fill="#FEF3C7"/>

  <!-- Lower Flap Pockets -->
  <rect x="98" y="122" width="24" height="6" rx="1.5" fill="#172554" stroke="#1E2A3B" stroke-width="1.6"/>
  <rect x="182" y="122" width="24" height="6" rx="1.5" fill="#0F172A" stroke="#1E2A3B" stroke-width="1.6"/>
