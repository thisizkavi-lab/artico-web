<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: resign (verb; formally give up a job or position)
  CONTEXTUAL_DEFINITION: Tell an employer formally that you are leaving a job or position.
  PEDAGOGICAL_ART_DIRECTOR: Show a senior professional submitting a formal blank letter to an employer, then leaving the executive chair.
  PEDAGOGICAL_ARCHETYPE: 3 - Formal workplace departure
  SYNONYM_GUARD: Emphasize formal notice and a job position, not an informal quit or a company-initiated dismissal.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Set a boardroom table at y=128. An executive at x=117..165 places a sealed blank envelope toward a colleague at x=213; behind them an empty high-backed chair marks the role being vacated.
-->
