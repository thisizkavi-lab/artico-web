name: Import Artico relative-time illustrations (one-time)
on:
  push:
    paths: ['.github/workflows/import-artico-time-art.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image support
        run: python -m pip install --quiet Pillow
      - name: Download and permanently store generated illustrations
        env:
          ART_URLS: '[{"name":"now-right-now","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Faa6a933f-2f97-4273-bdc1-c1ba020c5ac5/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEH6Wcc6VhZqQZm-dnr5qGBn-fY1ky54CL3ki7lK6evS&exp=1793296556&osig=AAAAAAAAAAAAAAAAAAAAALHh-A6Lc5VsBU7LvKBofg-sJSIwULQ8lx48nfp6o5vx&signer=media-rpc&token=AAIAAU0AJGFhNmE5MzNmLTJmOTctNDI3My1iZGMxLWMxYmEwMjBjNWFjNQAAAAABoYjN3-CJAkCyOdrhg3S1E2K9LLZ0NclPEkmI0morqw65dvaCbQ&x-canva-quality=thumbnail"},{"name":"earlier-later","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F5256d9e0-b1a9-4cbc-8703-8d5998db73b3/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPOEu_LEjbqQNP4wGJYogW_S59zA2HPRT0wAUc3NsQ6v&exp=1793297824&osig=AAAAAAAAAAAAAAAAAAAAAG16jGetf4Lo9btSfRDPu0zm7uRZY-3G7ckfW0mERYFd&signer=media-rpc&token=AAIAAU0AJDUyNTZkOWUwLWIxYTktNGNiYy04NzAzLThkNTk5OGRiNzNiMwAAAAABoYjhOQDGwwRG57o36dVMtTrRsneQaCnpybclRywkyibdCKRcHA&x-canva-quality=thumbnail"},{"name":"before-after","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F59c29b8c-b0a3-4ef7-b848-bc4779ddb909/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANFD6i8plZCLnoS91-uIAhktt67aNGU3CIrS_kTCnK11&exp=1793296661&osig=AAAAAAAAAAAAAAAAAAAAAG8QNp_w3IAgrxs6TbhgqyYL9wstwW95DMJPtrRhMwQr&signer=media-rpc&token=AAIAAU0AJDU5YzI5YjhjLWIwYTMtNGVmNy1iODQ4LWJjNDc3OWRkYjkwOQAAAAABoYjPegjYnTVkit28x1EKd4_xuh-f-Pt2cHeWm53UUseBqmzYDQ&x-canva-quality=thumbnail"},{"name":"yesterday-today-tomorrow","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fed59d37a-9aa7-4cb6-b256-e6c4f401a59c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFNpb8P-p3go4x_L2zAI4lXlIiqcI6cYrS697Vh1fpNs&exp=1793299255&osig=AAAAAAAAAAAAAAAAAAAAAPVW_k74n6s3Vf70nfSIaVtnSJf2bJtWRnsmr_9DHQb9&signer=media-rpc&token=AAIAAU0AJGVkNTlkMzdhLTlhYTctNGNiNi1iMjU2LWU2YzRmNDAxYTU5YwAAAAABoYj3Dtj9gWvFjrfIWCc7_ocMpM_9o9ZPjAAQEuXaQU2zJRmXag&x-canva-quality=thumbnail"},{"name":"this-morning-this-afternoon-this-evening","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F60e373da-5298-4099-a9ab-b073bcad5c34/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMwPImIzio_Q4FCTULkxPCIt-pb4533J-XSRpgWhhwQA&exp=1793297273&osig=AAAAAAAAAAAAAAAAAAAAAIAz2MrV1Xj5f-YfhKKZy57rVm2jeTO1IucyS2QPIy1_&signer=media-rpc&token=AAIAAU0AJDYwZTM3M2RhLTUyOTgtNDA5OS1hOWFiLWIwNzNiY2FkNWMzNAAAAAABoYjY0KgJ_SAJxVH85dKh_JNcLbtO_IIqf0Y5F9wURplRebNDbQ&x-canva-quality=thumbnail"},{"name":"tonight","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F1ddbd335-8284-4199-abcb-5b6591d78e11/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAAu5NJXZ6wxllSXVBVlD09zWM5w4XcqQ1hAQUYnutuu1&exp=1793298103&osig=AAAAAAAAAAAAAAAAAAAAALpZe1MRizwOzPS-9Y-EB5YTbNPgzWE3Udfe1dMqcE88&signer=media-rpc&token=AAIAAU0AJDFkZGJkMzM1LTgyODQtNDE5OS1hYmNiLTViNjU5MWQ3OGUxMQAAAAABoYjlethSUaz1lo5QWBHTXzI8RjMyyALeevAkFthyz7F4jJca1A&x-canva-quality=thumbnail"},{"name":"last-week-this-week-next-week","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F1b360e55-b76f-4e01-8c5c-2ed697bf42a3/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMp7_KVuD75LZo-qxXcLR5Q3KvzfWtU8dTgx9YT5mZaF&exp=1793295983&osig=AAAAAAAAAAAAAAAAAAAAACePUeT4-p-3zxp9m8n5TI0gmNNb_YW_ma_wx_BPOb_w&signer=media-rpc&token=AAIAAU0AJDFiMzYwZTU1LWI3NmYtNGUwMS04YzVjLTJlZDY5N2JmNDJhMwAAAAABoYjFIZgpMB3Dqrv-Y4HWixs52vNW8s94Kcko1mA093wfGdFOMQ&x-canva-quality=thumbnail"},{"name":"ago","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F242c7ef8-d9e1-472c-a351-0bc166110972/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGWrlz7oABnaeykg2-dMn3ccdp1NKoOHT2nxK4-HKxq_&exp=1793298063&osig=AAAAAAAAAAAAAAAAAAAAAOSzgTVyKkbhjY2_gD0njKRF026d_bwzWkqCLhb0Gl1F&signer=media-rpc&token=AAIAAU0AJDI0MmM3ZWY4LWQ5ZTEtNDcyYy1hMzUxLTBiYzE2NjExMDk3MgAAAAABoYjk3pg7S2n7nC2iuHDW3EyjGdz3I7l8iT1-60l3KeWWOx49OQ&x-canva-quality=thumbnail"},{"name":"soon","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F7ae5c616-a73b-4ba8-8890-d936789a4d2a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEGUYu004tCL3poCJVy7mV4G5YrMX9wULbX0lJjYoIib&exp=1793296190&osig=AAAAAAAAAAAAAAAAAAAAAD-fo-2_0SxeX3CXaHpzpJRlHnuzM5JxIHf1kVHGImKl&signer=media-rpc&token=AAIAAU0AJDdhZTVjNjE2LWE3M2ItNGJhOC04ODkwLWQ5MzY3ODlhNGQyYQAAAAABoYjISjBBu1LtQXXZkzaq2EBoDO0PcRte1t873hHosnJI2chaqQ&x-canva-quality=thumbnail"}]'
        run: |
          python - <<'PY'
          import io, json, os, urllib.request
          from PIL import Image, ImageFilter
          from pathlib import Path
          data=json.loads(os.environ['ART_URLS'])
          output=Path('public/vocabulary-ai/ch03/relative-time'); output.mkdir(parents=True,exist_ok=True)
          for index,entry in enumerate(data):
              req=urllib.request.Request(entry['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=40) as r: raw=r.read()
              image=Image.open(io.BytesIO(raw)).convert('RGB')
              assert image.width>=190 and image.height>=140,(entry['name'],image.size)
              image=image.resize((800,600),Image.Resampling.LANCZOS).filter(ImageFilter.UnsharpMask(radius=1.4,percent=115,threshold=2))
              file=output/(entry['name']+'.webp'); image.save(file,quality=90,method=6)
              print(index,entry['name'],image.size,file.stat().st_size)
          assert len(list(output.glob('*.webp')))==9
          PY
      - name: Commit image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vocabulary-ai/ch03/relative-time/
          git commit -m "Install nine generated relative-time illustrations" || exit 0
          git push origin HEAD:main
