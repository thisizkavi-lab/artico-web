<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: deposit (verb; put money into a bank account)
  CONTEXTUAL_DEFINITION: To place cash into a bank account, increasing its funds.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action plus tool
  SYNONYM_GUARD: Japanese gloss selects banking; show bills moving into a bank deposit slot, opposite to an ATM withdrawal and distinct from a rented-property security deposit.
  MODE: STATIC peak deposit moment
  COORDINATE_BLUEPRINT: Secure bank deposit box at left with one-way slot; thick sleeve and hand slide a blank note inward; adjacent account book shows funds arriving via green arrow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:deposit" data-archetype="action-tool">
