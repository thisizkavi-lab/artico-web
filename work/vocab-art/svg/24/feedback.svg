<!-- SELF_PROMPT:
  CHAPTER: 24 — Studying
  WORD: feedback (Noun)
  CONTEXTUAL_DEFINITION: Helpful comments that show a learner what is working and how to improve.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Show constructive written guidance attached to a student's draft, not electronic signal feedback or a final grade alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Study desk and calm wall.
    - Context_Layer: Student's draft and pencil.
    - Focal_Layer: Returned paper with positive check marks and a clear improvement arrow.
    - Details_Layer: Small comment bubbles and supportive symbols without writing.
    - Lighting_Layer: Warm encouragement glow around the feedback page.
-->
