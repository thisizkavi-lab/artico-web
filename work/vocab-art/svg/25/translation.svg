<!-- SELF_PROMPT:
  CHAPTER: 25 — Speaking a foreign language
  WORD: translation (Noun)
  CONTEXTUAL_DEFINITION: The result of changing meaning from one language into another.
  PEDAGOGICAL_ARCHETYPE: 1 — Object in environment
  SYNONYM_GUARD: Show source and translated pages side by side with the same picture meaning and distinct abstract line patterns; depict the resulting translation, not the action of translating.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Language-study table.
    - Context_Layer: Two open book pages.
    - Focal_Layer: A shared image passes from one page to a second page with transformed nonverbal line patterns.
    - Details_Layer: Bridge arrow and matching illustration on both pages.
    - Lighting_Layer: Clear light on the completed pair of texts.
-->
