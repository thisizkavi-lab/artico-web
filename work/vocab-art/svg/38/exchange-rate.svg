<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: exchange rate (noun)
  CONTEXTUAL_DEFINITION: The relative value at which one currency can be exchanged for another.
  PEDAGOGICAL_ARCHETYPE: 6 - Contrastive proportional diagram
  SYNONYM_GUARD: Compare the relative value of two currencies without showing a cashier transaction; “change money” depicts the exchange action.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Two differently patterned note/coin groups sit on a proportional beam scale; side shows an unnumbered adjustment dial and a conversion arrow, indicating that relative value can vary.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:exchange rate" data-archetype="contrast-proportion">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="rate-scale" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <radialGradient id="rate-coin-a"><stop stop-color="#FCE29C"/><stop offset="1" stop-color="#D49B2A"/></radialGradient>
    <path id="rate-beam" d="M57 75 L242 58 L245 72 L59 89 Z"/>
    <clipPath id="rate-beam-clip"><use href="#rate-beam"/></clipPath>
    <filter id="exchange-rate-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".16"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="153" width="304" height="39" fill="#EEE7DA"/><path d="M0 153 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="152" cy="164" rx="112" ry="8" fill="#DDD4C3"/></g>
  <!-- 2. Relative-value scale context -->
  <g id="layer-context"><path d="M151 77 L128 133 H174 Z" fill="#E5E9F0" stroke="#64748B" stroke-width="2"/><path d="M136 132 H168" stroke="#64748B" stroke-width="2.2"/><path d="M67 83 V109 M235 65 V95" stroke="#64748B" stroke-width="1.8"/><path d="M43 111 Q67 124 91 111 M211 97 Q235 110 259 97" fill="none" stroke="#1E2A3B" stroke-width="1.8"/><path d="M48 111 Q67 120 86 111 L81 120 H53 Z" fill="#DCECFB" stroke="#64748B" stroke-width="1.4"/><path d="M216 97 Q235 106 254 97 L249 106 H221 Z" fill="#E5F0E1" stroke="#568552" stroke-width="1.4"/></g>
  <!-- 3. Primary currencies compared by relative purchasing value -->
  <g id="layer-focal" filter="url(#exchange-rate-shadow)"><use href="#rate-beam" fill="url(#rate-scale)" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/><g clip-path="url(#rate-beam-clip)"><path d="M55 83 L240 65" stroke="#F8FBFE" stroke-width="3" opacity=".75"/></g><rect x="47" y="49" width="42" height="24" rx="3" transform="rotate(-5 47 49)" fill="#8EB0DE" stroke="#1E2A3B" stroke-width="1.8"/><path d="M53 56 H82 M53 62 H75" stroke="#5479AC" stroke-width="1.3"/><rect x="214" y="31" width="41" height="23" rx="3" transform="rotate(-5 214 31)" fill="#A8D4A2" stroke="#1E2A3B" stroke-width="1.8"/><path d="M220 38 H248 M220 44 H241" stroke="#568552" stroke-width="1.3"/><ellipse cx="65" cy="102" rx="10" ry="5" fill="url(#rate-coin-a)" stroke="#1E2A3B" stroke-width="1.4"/><ellipse cx="82" cy="104" rx="8" ry="4.2" fill="#D97A43" stroke="#1E2A3B" stroke-width="1.3"/><ellipse cx="232" cy="91" rx="12" ry="6" fill="#F2C14E" stroke="#1E2A3B" stroke-width="1.4"/><ellipse cx="251" cy="92" rx="9" ry="4.8" fill="#D97A43" stroke="#1E2A3B" stroke-width="1.3"/></g>
  <!-- 4. Variable adjustment dial and direction cue -->
  <g id="layer-details"><circle cx="274" cy="70" r="18" fill="#E5E9F0" stroke="#1E2A3B" stroke-width="1.8"/><circle cx="274" cy="70" r="11" fill="#F8FBFE" stroke="#64748B" stroke-width="1.3"/><path d="M274 70 L282 62" stroke="#CE3D4E" stroke-width="2.4" stroke-linecap="round"/><circle cx="274" cy="70" r="2.5" fill="#CE3D4E"/><path d="M101 54 C131 40 179 38 208 50" fill="none" stroke="#4A72B2" stroke-width="2.2" stroke-dasharray="4 4"/><path d="M201 45 L211 51 L201 55 Z" fill="#4A72B2"/><path d="M65 91 V105 M235 75 V91" stroke="#94A3B8" stroke-width="1.5"/></g>
  <!-- 5. Comparative highlights -->
  <g id="layer-lighting"><path d="M53 53 H69" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/><path d="M220 34 H238" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/><path d="M152 112 L152 120 M148 116 H156" stroke="#F2C14E" stroke-width="2.3" stroke-linecap="round"/></g>
</svg>
