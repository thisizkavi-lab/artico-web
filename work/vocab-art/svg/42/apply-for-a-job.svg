<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: apply for a job
  CONTEXTUAL_DEFINITION: Send a formal request to be considered for employment.
  PEDAGOGICAL_ART_DIRECTOR: Show the candidate submitting a completed application packet to an employer or hiring channel.
  PEDAGOGICAL_ARCHETYPE: 4 - Submission action
  SYNONYM_GUARD: Depict the submission action, not merely the blank form or a generic use/application of an object.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a candidate at x=68..119 on the left, reaching a completed blue folder toward a receiving slot at x=179..216 on the employer desk. Add a small green arrow running from candidate to slot and a recruiter behind the desk at x=222..265; keep the folder mid-transfer.
-->
