  <line x1="214" y1="96" x2="214" y2="132" stroke="#1E2A3B" stroke-width="1.6" />
  <line x1="198" y1="114" x2="230" y2="114" stroke="#1E2A3B" stroke-width="1.6" />
  <!-- Dog silhouette path -->
  <path d="M 204 132 C 204 120 208 116 214 116 C 220 116 224 120 224 132 Z" fill="#1E293B" />
  <path d="M 206 118 C 202 122 202 126 206 128 M 222 118 C 226 122 226 126 222 128" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Window sill with flower box -->
  <rect x="194" y="132" width="40" height="6" rx="2" fill="#B45309" stroke="#1E2A3B" stroke-width="1.6" />
  <circle cx="202" cy="130" r="3" fill="#F43F5E" />
  <circle cx="214" cy="130" r="3" fill="#FACC15" />
  <circle cx="226" cy="130" r="3" fill="#F43F5E" />

