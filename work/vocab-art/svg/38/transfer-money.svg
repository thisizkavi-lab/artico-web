<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: transfer money (verb phrase)
  CONTEXTUAL_DEFINITION: To send money from your bank account to another person or account.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action plus tool
  SYNONYM_GUARD: Show a person actively initiating a transfer on a phone and funds reaching another person's account; not just an abstract arrow diagram.
  MODE: STATIC action moment
  COORDINATE_BLUEPRINT: Sender at left operates a large phone with two account icons; blue dotted transfer path carries coins to receiver's open hand at right; use thick volumetric arms.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:transfer money" data-archetype="action-tool">
