<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: pin (noun; payment-card personal identification number)
  CONTEXTUAL_DEFINITION: A secret numeric code used to authorize a bank-card transaction.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action plus tool
  SYNONYM_GUARD: Depict a cardholder privately entering a hidden code at a payment keypad; not a fastening pin. Show no numerals or letters.
  MODE: STATIC peak keypad interaction
  COORDINATE_BLUEPRINT: POS terminal at x140..242, card slotted at left; cropped thick-sleeve hand shields keypad from above; four blank round keys and privacy arc; screen shows only neutral dots.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="38:pin" data-archetype="action-tool">
  <defs>
    <style>:root{--c-bg-1:#FAF8F3;--c-bg-2:#EEF4FA;--c-surface:#EAE3D5;--c-primary:#5479AC;--c-secondary:#3D5F91;--c-accent:#F2C14E;--c-highlight:#FFFFFF;--c-ink:#1E2A3B}</style>
    <linearGradient id="pin-terminal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E5E9F0"/><stop offset="1" stop-color="#A8B7C9"/></linearGradient>
    <radialGradient id="pin-screen"><stop stop-color="#DCECFB"/><stop offset="1" stop-color="#8EB0DE"/></radialGradient>
    <path id="pin-hand" d="M94 42 C107 35 120 39 126 50 L142 77 C146 85 142 91 136 92 C131 91 127 85 123 80 L117 72 L124 95 C127 104 122 110 115 108 C109 107 108 100 105 92 L99 77 L102 103 C103 111 97 115 91 111 C86 108 88 101 87 94 L83 73 L77 93 C75 100 68 100 65 95 C62 90 65 84 68 75 L77 52 C81 44 87 41 94 42 Z"/>
    <clipPath id="pin-hand-clip"><use href="#pin-hand"/></clipPath>
    <filter id="pin-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E2A3B" flood-opacity=".17"/></filter>
  </defs>
  <!-- 1. Stage canvas & ground shadow -->
  <g id="layer-backdrop"><rect width="304" height="192" fill="#FAF8F3"/><rect y="154" width="304" height="38" fill="#EEE7DA"/><path d="M0 154 H304" stroke="#1E2A3B" stroke-width="2"/><ellipse cx="186" cy="164" rx="83" ry="9" fill="#DDD4C3"/></g>
  <!-- 2. Payment counter context -->
  <g id="layer-context"><path d="M27 143 H279 V155 H27 Z" fill="#C88446" stroke="#1E2A3B" stroke-width="2.1"/><path d="M32 148 H275" stroke="#E3AC77" stroke-width="2"/><path d="M44 112 H107 V141 H44 Z" fill="#5479AC" stroke="#1E2A3B" stroke-width="2"/><path d="M52 119 H99 V136 H52 Z" fill="#3D5F91"/><path d="M60 124 H92" stroke="#8EB0DE" stroke-width="2"/></g>
