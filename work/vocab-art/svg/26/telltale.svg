<!-- SELF_PROMPT:
  CHAPTER: 26 — Communication and beliefs
  WORD: telltale (Noun, British English counterpart of tattletale)
  CONTEXTUAL_DEFINITION: A child who secretly reports another person's misbehavior to someone in authority.
  PEDAGOGICAL_ARCHETYPE: 3 — Person-to-person private report
  SYNONYM_GUARD: Preserve the same reporting meaning as US tattletale while using a distinct quiet whisper-to-teacher classroom scene; do not use the adjective sense “revealing sign.”
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A classroom corridor with a simple notice board and teacher's desk.
    - Context_Layer: One student quietly hides a paint-stained sleeve after a small classroom mishap.
    - Focal_Layer: A uniformed classmate leans close to privately report the incident to the teacher.
    - Details_Layer: Teacher turns toward the reported student; a small cupped-hand whisper marks secrecy.
    - Lighting_Layer: Keep the scene matter-of-fact and school-like, not threatening.
-->
