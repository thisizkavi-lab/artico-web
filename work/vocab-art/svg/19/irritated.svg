<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="19:irritated" data-archetype="expressive-bust">
  <defs>
    <path id="irritated-head" d="M 112 58 C 112 34, 192 34, 192 58 L 190 92 C 190 120, 170 134, 152 134 C 134 134, 114 120, 114 92 Z"/>
    <clipPath id="irritated-head-clip">
      <use href="#irritated-head"/>
    </clipPath>
    <clipPath id="irritated-torso-clip">
      <path d="M 72 178 C 80 136, 106 122, 152 122 C 198 122, 224 136, 232 178 Z"/>
    </clipPath>
  </defs>

  <!-- Stage Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>
  <circle cx="152" cy="96" r="76" fill="#F1F5F9"/>

  <!-- Torso (Sam) -->
  <g clip-path="url(#irritated-torso-clip)">
    <rect x="68" y="118" width="168" height="66" fill="#7FA1CF"/>
    <path d="M 68 178 C 78 144, 98 130, 118 126 L 118 178 Z" fill="#5479AC"/>
  </g>
  <path d="M 72 178 C 80 136, 106 122, 152 122 C 198 122, 224 136, 232 178"
        fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hand Scratching Neck/Collar in Irritation -->
  <path d="M 194 136 L 174 116 L 166 126 L 186 154 Z"
        fill="#7FA1CF" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="168" cy="116" r="9" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.2"/>
  <!-- Scratch Lines -->
  <g stroke="#EF4444" stroke-width="1.8" stroke-linecap="round">
    <line x1="154" y1="110" x2="160" y2="114"/>
    <line x1="156" y1="116" x2="162" y2="120"/>
  </g>

  <!-- Neck -->
  <rect x="140" y="110" width="24" height="20" rx="6" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.2"/>

  <!-- Ears -->
  <circle cx="112" cy="88" r="8.5" fill="#D89A6C" stroke="#1E2A3B" stroke-width="2.3"/>
  <circle cx="192" cy="88" r="8.5" fill="#B6784B" stroke="#1E2A3B" stroke-width="2.3"/>

  <!-- Head Contour & Irritated Shading -->
  <g clip-path="url(#irritated-head-clip)">
    <rect x="105" y="32" width="94" height="106" fill="#D89A6C"/>
    <ellipse cx="128" cy="94" rx="10" ry="6" fill="#EF4444" opacity="0.35"/>
    <path d="M 112 118 C 132 134, 172 134, 192 118 L 192 138 L 112 138 Z" fill="#B6784B" opacity="0.6"/>
  </g>
  <use href="#irritated-head" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Hair (Sam) -->
  <path d="M 108 64 C 104 36, 126 20, 152 20 C 178 20, 200 36, 196 64 C 192 50, 180 40, 152 40 C 124 40, 112 50, 108 64 Z"
        fill="#3A2E2B" stroke="#1E2A3B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Tight Furrowed Eyebrows -->
  <path d="M 124 70 L 144 74" stroke="#1E2A3B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 180 70 L 160 74" stroke="#1E2A3B" stroke-width="3" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="134" cy="78" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="170" cy="78" r="10" fill="none" stroke="#1E2A3B" stroke-width="2"/>
  <line x1="144" y1="78" x2="160" y2="78" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Annoyed Glancing Eyes -->
  <circle cx="132" cy="78" r="3.5" fill="#1E2A3B"/>
  <circle cx="168" cy="78" r="3.5" fill="#1E2A3B"/>

  <!-- Tightly Pursed Grimace -->
  <path d="M 134 104 Q 152 98 170 102" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Impatient Clock Waiting Cue in Corner -->
  <g transform="translate(68, 54)">
    <circle cx="14" cy="14" r="12" fill="#FFFFFF" stroke="#1E2A3B" stroke-width="2"/>
    <line x1="14" y1="14" x2="14" y2="6" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="20" y2="14" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
