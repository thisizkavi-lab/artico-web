<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: tent peg (Noun)
  CONTEXTUAL_DEFINITION: A short stake pushed into the ground to hold a tent corner or cord in place.
  PEDAGOGICAL_ART_DIRECTOR: Focus on a small angled metal stake driven into soil through a tent cord loop.
  PEDAGOGICAL_ARCHETYPE: 2 - Small part of shelter anchoring
  SYNONYM_GUARD: Keep it short and embedded in the ground with a hook holding fabric or cord; unlike a long tent pole that supports the roof.
  MODE: STATIC
