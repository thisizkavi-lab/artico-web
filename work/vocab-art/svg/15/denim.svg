<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:denim">
  <defs>
    <clipPath id="denim-swatch-clip">
      <path d="M 48 34 L 236 34 C 242 34 246 38 246 44 L 246 148 C 246 154 242 158 236 158 L 48 158 C 42 158 38 154 38 148 L 38 44 C 38 38 42 34 48 34 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Presentation Shadow -->
  <rect x="44" y="40" width="212" height="126" rx="8" fill="#E2E8F0"/>

  <!-- Main Indigo Denim Textile Swatch -->
  <rect x="38" y="34" width="208" height="124" rx="6" fill="#1D4ED8" stroke="#1E2A3B" stroke-width="2.6"/>

  <!-- Characteristic Diagonal 3x1 Twill Weave Rib Lines & Indigo Wash Texture -->
  <g clip-path="url(#denim-swatch-clip)">
    <!-- Twill Texture Lines (Dense 45-degree diagonal ribbing) -->
    <line x1="20" y1="30" x2="60" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="30" x2="80" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="30" x2="100" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="80" y1="30" x2="120" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="30" x2="140" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="30" x2="160" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="30" x2="180" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="160" y1="30" x2="200" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="180" y1="30" x2="220" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="30" x2="240" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="220" y1="30" x2="260" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>

    <line x1="20" y1="80" x2="100" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="80" x2="130" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="80" y1="80" x2="160" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="110" y1="80" x2="190" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="80" x2="220" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <line x1="170" y1="80" x2="250" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>

    <!-- Stonewash Fade Highlight & Whiskering in Center -->
    <ellipse cx="130" cy="94" rx="55" ry="32" fill="#60A5FA" opacity="0.35"/>
    <path d="M 54 98 C 88 116 160 114 204 94" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Decorative Curved Denim Arcuate Stitch -->
    <path d="M 68 84 C 92 106 122 106 142 88 C 162 106 192 106 216 84"
          stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- Frayed White Weft Threads along Left Edge -->
    <line x1="36" y1="48" x2="42" y2="48" stroke="#FAF8F3" stroke-width="1.8"/>
    <line x1="36" y1="62" x2="44" y2="62" stroke="#FAF8F3" stroke-width="1.8"/>
    <line x1="36" y1="78" x2="41" y2="78" stroke="#FAF8F3" stroke-width="1.8"/>
    <line x1="36" y1="94" x2="45" y2="94" stroke="#FAF8F3" stroke-width="1.8"/>
    <line x1="36" y1="112" x2="43" y2="112" stroke="#FAF8F3" stroke-width="1.8"/>
    <line x1="36" y1="130" x2="44" y2="130" stroke="#FAF8F3" stroke-width="1.8"/>

    <!-- Heavy Denim Hem Fold (Folded Bottom Cuff showing White Weft Underside) -->
    <path d="M 38 128 L 246 128 L 246 158 L 38 158 Z"
          fill="#DBEAFE" stroke="#1E2A3B" stroke-width="2"/>
    <!-- Weft Horizontal White Grid in Underside -->
    <line x1="38" y1="135" x2="246" y2="135" stroke="#BFDBFE" stroke-width="1.5"/>
    <line x1="38" y1="143" x2="246" y2="143" stroke="#BFDBFE" stroke-width="1.5"/>
    <line x1="38" y1="151" x2="246" y2="151" stroke="#BFDBFE" stroke-width="1.5"/>

    <!-- Gold Tobacco Double Chainstitch along Hem Seam -->
    <line x1="38" y1="124" x2="246" y2="124" stroke="#F59E0B" stroke-width="2.4" stroke-dasharray="4 2"/>
    <line x1="38" y1="120" x2="246" y2="120" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="3 2"/>

    <!-- Red Tab Label (Iconic Denim Signifier) Sewn into Right Seam -->
    <rect x="238" y="68" width="16" height="24" rx="2" fill="#EF4444" stroke="#1E2A3B" stroke-width="1.6"/>
    <line x1="243" y1="72" x2="243" y2="88" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Authentic Heavy Copper Rivet at Top-Right Corner -->
  <circle cx="218" cy="56" r="6.5" fill="#D97706" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="218" cy="56" r="3.5" fill="#B45309"/>
  <circle cx="218" cy="56" r="1.5" fill="#FEF3C7"/>
</svg>