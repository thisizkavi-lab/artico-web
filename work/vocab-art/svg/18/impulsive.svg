  CHAPTER: 18 — Personality traits
  WORD: impulsive (Adjective)
  CONTEXTUAL_DEFINITION: Acting suddenly without stopping to think about the consequences.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: The focal person lunges for a rolling ball before looking, while a peer signals them to pause; unlike bravery, there is no considered protective purpose.
