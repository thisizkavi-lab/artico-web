<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: bribery (Noun)
  CONTEXTUAL_DEFINITION: Offering money or another benefit to improperly influence an official decision.
  PEDAGOGICAL_ARCHETYPE: 4 — Peak-moment action with an offered benefit and a clear refusal
  SYNONYM_GUARD: Show an improper payment offered to an authority figure, distinct from an ordinary legal fee or a friendly gift.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A civic service desk with a pale wall and official counter.
    - Context_Layer: A small gold badge identifies the seated person as an official.
    - Focal_Layer: A visitor slides a closed envelope with visible coins while the official raises a firm stop palm.
    - Details_Layer: A gold dotted motion path reaches the envelope; a plum caution mark signals impropriety.
    - Lighting_Layer: Focus a soft amber halo on the offered payment and keep the exchange restrained.
-->
