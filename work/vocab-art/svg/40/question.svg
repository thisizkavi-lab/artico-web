<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: question
  CONTEXTUAL_DEFINITION: A request for information or clarification, often raised by a participant during a meeting.
  PEDAGOGICAL_ART_DIRECTOR: Show one participant raising a hand and signaling curiosity toward a speaker, with a blank inquiry cloud rather than a written question mark.
  PEDAGOGICAL_ARCHETYPE: 4 - Inquiry / question
  SYNONYM_GUARD: Keep one person's information request distinct from an answer, a broad discussion, or a show-of-hands vote.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a presenter as a small torso at x=216..259 on the right and one seated participant at x=70..127 on the left raising one hand. Put an empty rounded speech cloud between them at x=125..188, y=42..78, containing three small inquiry dots that are not punctuation characters.
-->
