<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: supervise
  CONTEXTUAL_DEFINITION: Watch over a team's work and guide it to make sure it is done properly.
  PEDAGOGICAL_ART_DIRECTOR: Show a supervisor checking progress while a team carries out its tasks.
  PEDAGOGICAL_ARCHETYPE: 22 - Active oversight
  SYNONYM_GUARD: Show observation, guidance, and a quality check while others do the work; distinguish supervision from carrying out the task or merely holding a manager title.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place one supervisor behind and slightly above a shared project board, holding a small check sheet. At the lower left and right, two team members perform separate work tasks. The supervisor points to a progress check while workers remain the active doers.
-->
