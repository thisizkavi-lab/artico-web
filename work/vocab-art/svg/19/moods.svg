<!-- SELF_PROMPT:
  CHAPTER: 19 — Feelings and moods
  WORD: moods (Abstract Noun)
  CONTEXTUAL_DEFINITION: The broader emotional atmosphere that colors how someone feels over time.
  PEDAGOGICAL_ARCHETYPE: 6 — High-contrast geometric metaphor
  SYNONYM_GUARD: One person sits beneath a broad sky changing from clear to overcast and rainy, making mood an overall atmosphere rather than several separate short feelings.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A single continuous outdoor ground and expansive sky.
    - Context_Layer: Wide sunlit, cloudy, and rainy areas sharing one horizon.
    - Focal_Layer: Calmly seated person centered under the shifting sky canopy.
    - Details_Layer: Color transitions, rain, sun rays, and a softly shaded face.
    - Lighting_Layer: Broad arch spanning most of the card to suggest atmosphere.
-->
