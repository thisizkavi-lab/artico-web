<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:blueberry / blueberries" data-archetype="hero-object">
  <defs>
    <!-- Blueberry: iconic star calyx crown on top, powdery silver-blue bloom over navy skin, cut berry showing pale green interior -->
    <clipPath id="bb-whole-clip">
      <circle cx="114" cy="116" r="42" />
    </clipPath>
    <clipPath id="bb-half-clip">
      <circle cx="206" cy="124" r="34" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="114" cy="162" rx="46" ry="8" fill="#DDD4C3" />
  <ellipse cx="206" cy="164" rx="38" ry="7" fill="#DDD4C3" />

  <!-- Slender Sprig & Small Oval Leaves -->
  <g transform="translate(108, 54)">
    <path d="M 6 20 C 6 6 18 -4 28 -8" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 6 20 C 6 6 18 -4 28 -8" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <!-- Leaf 1 -->
    <path d="M 12 12 C 0 4 -4 -10 6 -16 C 18 -12 20 -2 12 12 Z" fill="#65A30D" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
    <!-- Leaf 2 -->
    <path d="M 24 -4 C 36 -12 48 -8 52 4 C 40 8 28 6 24 -4 Z" fill="#4D7C0F" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Whole Plump Blueberry on Left -->
  <g clip-path="url(#bb-whole-clip)">
    <!-- Base deep indigo blue -->
    <circle cx="114" cy="116" r="42" fill="#1E3A8A" />
    <!-- Powdery silver-blue frosted bloom on upper half -->
    <ellipse cx="106" cy="100" rx="34" ry="28" fill="#3B82F6" opacity="0.8" />
    <!-- Soft velvety bloom highlight -->
    <ellipse cx="98" cy="92" rx="18" ry="14" transform="rotate(-20 98 92)" fill="#93C5FD" opacity="0.85" />
    <ellipse cx="94" cy="88" rx="7" ry="5" transform="rotate(-20 94 88)" fill="#EFF6FF" opacity="0.9" />
    <!-- Underside shadow -->
    <path d="M 72 130 C 84 154 136 158 156 134 L 156 158 L 72 158 Z" fill="#0F172A" />
  </g>
  <!-- Blueberry Contour -->
  <circle cx="114" cy="116" r="42" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Iconic 5-Pointed Star Calyx Crown on Top of Whole Blueberry -->
  <g transform="translate(118, 80) rotate(-12)">
    <!-- Indented calyx depression basin -->
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="#0F172A" stroke="#1E2A3B" stroke-width="2" />
    <!-- Inner calyx pit -->
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="#1E1B4B" />
    <!-- 5 pointed star crown teeth radiating outward -->
    <polygon points="0,-7 -2,-11 2,-11" fill="#3B82F6" stroke="#1E2A3B" stroke-width="1.6" />
    <polygon points="12,-3 16,-5 15,-1" fill="#3B82F6" stroke="#1E2A3B" stroke-width="1.6" />
    <polygon points="8,5 12,9 7,8" fill="#3B82F6" stroke="#1E2A3B" stroke-width="1.6" />
    <polygon points="-8,5 -12,9 -7,8" fill="#3B82F6" stroke="#1E2A3B" stroke-width="1.6" />
    <polygon points="-12,-3 -16,-5 -15,-1" fill="#3B82F6" stroke="#1E2A3B" stroke-width="1.6" />
  </g>

  <!-- Cut Blueberry Half in Foreground Right (Showing Pale Green-Gold Flesh) -->
  <circle cx="206" cy="124" r="34" fill="#1E3A8A" stroke="#1E2A3B" stroke-width="2.6" />
  <g clip-path="url(#bb-half-clip)">
    <!-- Thin dark blue skin rim -->
    <circle cx="206" cy="124" r="31" fill="#ECFCCB" />
    <!-- Soft translucent greenish-cream pulp center -->
    <circle cx="206" cy="124" r="22" fill="#D9F99D" opacity="0.9" />

    <!-- Tiny reddish-brown seeds in central ring -->
    <circle cx="200" cy="118" r="1.5" fill="#78350F" />
    <circle cx="212" cy="116" r="1.5" fill="#78350F" />
    <circle cx="216" cy="126" r="1.5" fill="#78350F" />
    <circle cx="208" cy="132" r="1.5" fill="#78350F" />
    <circle cx="198" cy="128" r="1.5" fill="#78350F" />

    <!-- Pulp segment radial lines -->
    <path d="M 206 124 L 206 100 M 206 124 L 226 112 M 206 124 L 222 138 M 206 124 L 190 138 M 206 124 L 186 114" stroke="#BEF264" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
