<!-- SELF_PROMPT:
  CHAPTER: 20 — Family tree
  WORD: stepmom (Noun; informal)
  CONTEXTUAL_DEFINITION: A parent's wife or partner who warmly cares for a child in a blended family.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: A woman kneels beside a child arriving at a new shared home while the child's father welcomes them; ordinary blended-family warmth avoids the cruel-stepmother stereotype.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Welcoming home entry with a simple open door.
    - Context_Layer: Child's small bag and a family portrait of two adults and a child.
    - Focal_Layer: Stepmom meets the child at eye level with an open hand; father stands close by.
    - Details_Layer: Child reaches toward her; all three share a gentle smile.
    - Lighting_Layer: Warm arc around the newly connected family.
-->
