  CHAPTER: 25 — Speaking a foreign language
  WORD: listening (Noun / gerund)
  CONTEXTUAL_DEFINITION: Giving attention to sounds or speech in order to hear what is said.
  PEDAGOGICAL_ARCHETYPE: 2 — People in environment
