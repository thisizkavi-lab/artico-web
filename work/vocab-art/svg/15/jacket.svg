<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:jacket">
  <defs>
    <clipPath id="jacket-body-clip">
      <path d="M 120 44 L 74 60 L 64 138 L 86 142 L 96 112 L 96 148 L 208 148 L 208 112 L 218 142 L 240 138 L 230 60 L 184 44 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop glow -->
  <ellipse cx="152" cy="108" rx="92" ry="58" fill="#ECFDF5" opacity="0.7"/>

  <!-- Wooden Hanger -->
  <path d="M 152 26 C 158 26 162 30 160 36 C 158 40 153 42 152 46" fill="none" stroke="#9A6945" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 112 50 L 152 44 L 192 50" stroke="#B8865D" stroke-width="4" stroke-linecap="round"/>

  <!-- Left Sleeve -->
  <path d="M 86 58 L 62 136 L 82 140 L 98 110 L 106 64 Z"
        fill="#3F624C" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Left Ribbed Cuff -->
  <path d="M 62 136 L 82 140 L 80 148 L 60 144 Z"
        fill="#263E30" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="67" y1="138" x2="65" y2="145" stroke="#4F7A5E" stroke-width="1.5"/>
  <line x1="74" y1="139" x2="72" y2="146" stroke="#4F7A5E" stroke-width="1.5"/>

  <!-- Right Sleeve -->
  <path d="M 218 58 L 242 136 L 222 140 L 206 110 L 198 64 Z"
        fill="#2E4A39" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Right Ribbed Cuff -->
  <path d="M 222 140 L 242 136 L 244 144 L 224 148 Z"
        fill="#263E30" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="229" y1="139" x2="231" y2="146" stroke="#4F7A5E" stroke-width="1.5"/>
  <line x1="236" y1="138" x2="238" y2="145" stroke="#4F7A5E" stroke-width="1.5"/>

  <!-- Main Jacket Torso -->
  <path d="M 120 44 L 84 58 L 94 148 L 210 148 L 220 58 L 184 44 Z"
        fill="#4D775D" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Right Shading inside torso -->
  <g clip-path="url(#jacket-body-clip)">
    <path d="M 152 46 L 220 58 L 210 148 L 152 148 Z" fill="#3F624C" opacity="0.35"/>
    <!-- Shoulder stitch yoke lines -->
    <path d="M 84 58 L 126 64" stroke="#263E30" stroke-width="1.6" stroke-dasharray="3 2"/>
    <path d="M 220 58 L 178 64" stroke="#263E30" stroke-width="1.6" stroke-dasharray="3 2"/>
  </g>

  <!-- Ribbed Bottom Hem Band -->
  <path d="M 94 146 L 210 146 L 208 158 L 96 158 Z"
        fill="#263E30" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="110" y1="147" x2="110" y2="157" stroke="#4F7A5E" stroke-width="1.5"/>
  <line x1="130" y1="147" x2="130" y2="157" stroke="#4F7A5E" stroke-width="1.5"/>
  <line x1="150" y1="147" x2="150" y2="157" stroke="#4F7A5E" stroke-width="1.5"/>
  <line x1="170" y1="147" x2="170" y2="157" stroke="#4F7A5E" stroke-width="1.5"/>
  <line x1="190" y1="147" x2="190" y2="157" stroke="#4F7A5E" stroke-width="1.5"/>

  <!-- Inner Contrast Lining visible at neck V-opening -->
  <path d="M 134 46 L 152 74 L 170 46 Z" fill="#F59E0B" stroke="#1E2A3B" stroke-width="2"/>

  <!-- Stand-up / Folded Collar with snaps -->
  <path d="M 120 44 C 132 38 172 38 184 44 L 178 58 L 152 64 L 126 58 Z"
        fill="#3F624C" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="127" cy="51" r="2" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1"/>
  <circle cx="177" cy="51" r="2" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1"/>

  <!-- Center Metal Zipper Track & Pull Tab -->
  <line x1="152" y1="64" x2="152" y2="146" stroke="#1E2A3B" stroke-width="3"/>
  <line x1="152" y1="64" x2="152" y2="146" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Zipper pull slider & ring -->
  <rect x="149" y="80" width="6" height="8" rx="1.5" fill="#F59E0B" stroke="#1E2A3B" stroke-width="1.4"/>
  <path d="M 152 88 L 152 98" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round"/>

  <!-- Slanted Zippered Side Pockets -->
  <!-- Left pocket -->
  <path d="M 108 116 L 128 126" stroke="#1E2A3B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="126" cy="125" r="1.6" fill="#F59E0B"/>
  <!-- Right pocket -->
  <path d="M 196 116 L 176 126" stroke="#1E2A3B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="178" cy="125" r="1.6" fill="#F59E0B"/>
</svg>