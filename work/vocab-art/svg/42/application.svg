<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: application
  CONTEXTUAL_DEFINITION: A formal request from a person who wants a particular job.
  PEDAGOGICAL_ART_DIRECTOR: Show a completed job application packet ready for review by an employer, rather than the blank form or the act of submitting it.
  PEDAGOGICAL_ARCHETYPE: 5 - Candidate document packet
  SYNONYM_GUARD: Use a completed packet with a candidate profile cue; distinguish it from the empty application form and from the candidate physically applying.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a blue folder at x=96..204, y=56..132, with one completed résumé page peeking out and a small candidate portrait card attached. A recruiter desk sits below at y=137 and a closed receiving tray is behind it; keep the documents as the clear focal subject.
-->
