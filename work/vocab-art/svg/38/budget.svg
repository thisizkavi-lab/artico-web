<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: budget (noun)
  CONTEXTUAL_DEFINITION: A plan for how available money will be divided between income, savings, and expenses.
  PEDAGOGICAL_ARCHETYPE: 1 - Hero object with planning scene
  SYNONYM_GUARD: Show money being deliberately allocated into separate planned categories, not a pile of bills already paid.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Household planner lays three stacks of coins into labelled-by-icon jars (home, food, reserve) beneath a blank ledger; no text, numbers, or currency glyphs.
-->
