<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: sunscreen (Noun)
  CONTEXTUAL_DEFINITION: A cream or lotion put on skin to protect it from sunlight outdoors.
  PEDAGOGICAL_ART_DIRECTOR: Show cream being squeezed and rubbed onto a shoulder beneath bright sunlight.
  PEDAGOGICAL_ARCHETYPE: 4 - Protective product applied to target
  SYNONYM_GUARD: Pair the lotion with skin and strong sunlight, not insects; this distinguishes sunscreen from insect repellent.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Open white sunscreen tube, cream dab and a camper rubbing it onto an exposed shoulder under sun rays.
-->
