<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: board of directors
  CONTEXTUAL_DEFINITION: The group of senior people who govern and make major decisions for a company.
  PEDAGOGICAL_ART_DIRECTOR: Show a formal group of decision-makers around a boardroom table, with a small company-building model and shared planning materials.
  PEDAGOGICAL_ARCHETYPE: 3 - Governing group
  SYNONYM_GUARD: This means a corporate leadership group, not a writing board, classroom board, or a single director presenting.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Arrange four directors along a broad oval table spanning x=34..270 at y=120..142, with one chairperson centered at x=130..174 and three colleagues distributed left and right. Place a small unlettered office-building model at the table center and a quiet window in the background; all figures face inward toward the shared decision.
-->
