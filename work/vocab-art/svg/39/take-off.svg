<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: take off (phrasal verb; career success)
  CONTEXTUAL_DEFINITION: A career or business suddenly begins to succeed.
  PEDAGOGICAL_ART_DIRECTOR: Communicate a sudden upward surge in career fortunes with a worker rising quickly through an office building, not an airplane or clothing removal.
  PEDAGOGICAL_ARCHETYPE: 5 - Spatial / career progression diagram
  SYNONYM_GUARD: The career progression group overrides flight and undressing glosses; show a professional rising rapidly and a steep success curve.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Build a glass office elevator on the right from x=181..250, with its platform high at y=67; place a briefcase-carrying worker inside. Draw three receding lower floor markers at y=136,111,89 and a steep blue-and-gold motion curve climbing to a star at x=260,y=36.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="39:take off" data-archetype="career-rise">
