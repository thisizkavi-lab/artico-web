  CHAPTER: 12 — Tools and gardening
  WORD: hoe (Noun)
  CONTEXTUAL_DEFINITION: A long-handled garden implement with a flat blade for cultivating or cutting weeds.
  PEDAGOGICAL_ARCHETYPE: 1 — Hero object with functional context
  SYNONYM_GUARD: Show a single broad blade set at a right angle to the long shaft; it has no row of rake teeth or fork tines.
