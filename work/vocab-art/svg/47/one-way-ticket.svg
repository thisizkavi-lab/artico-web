<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: one-way ticket
  CONTEXTUAL_DEFINITION: A travel ticket that covers a single outward journey without a return trip.
  PEDAGOGICAL_ART_DIRECTOR: Make a physical ticket the hero and show one arrow from the origin to a plane destination icon.
  PEDAGOGICAL_ARCHETYPE: 2 - Hero Object
  SYNONYM_GUARD: The document is the focal object and contains one outward direction only, not a return arrow.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A large blank perforated ticket has one simple route arrow from a hotel icon toward an airplane icon with no lettering or numbers.
-->
