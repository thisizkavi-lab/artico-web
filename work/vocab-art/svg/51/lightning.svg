<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: lightning (Noun)
  CONTEXTUAL_DEFINITION: A bright jagged electrical flash in the sky during a storm.
  PEDAGOGICAL_ART_DIRECTOR: Make one brilliant angular lightning bolt the focal object between a storm cloud and a lit horizon.
  PEDAGOGICAL_ARCHETYPE: 3 - Weather flash phenomenon
  SYNONYM_GUARD: Show the visible electrical flash, not the thunder sound or the broader storm condition.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A single glowing yellow-white bolt forks from a dark cloud into a stormy sky above a dim distant ridge.
-->
