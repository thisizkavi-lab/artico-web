  CHAPTER: 21 — Family and relationships
  WORD: break up with someone (Phrasal Verb)
  CONTEXTUAL_DEFINITION: To tell a romantic partner that the relationship is ending.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: One partner calmly returns a shared key during a serious conversation while the other listens sadly, showing one person initiating an ending rather than a mutual walk-away.
