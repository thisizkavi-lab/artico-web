<!-- SELF_PROMPT:
  CHAPTER: 18 — Personality traits
  WORD: honest (Adjective)
  CONTEXTUAL_DEFINITION: Truthful and trustworthy, openly returning something that belongs to another person.
  PEDAGOGICAL_ARCHETYPE: 3 — Expressive social scene
  SYNONYM_GUARD: The finder looks the owner in the eye and openly gives back a lost purse, contrasting the hidden purse in dishonest.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: Bright shared-room entry with open space.
    - Context_Layer: Owner reaches out to receive the returned purse.
    - Focal_Layer: Finder extends the purse openly with both hands.
    - Details_Layer: Clear eye contact, open palms, purse clasp and relieved smile.
    - Lighting_Layer: Warm halo around the visible exchange.
-->
