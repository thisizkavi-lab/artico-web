<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: rucksack (Noun)
  CONTEXTUAL_DEFINITION: A large hiking pack with a top flap, padded harness, waist belt, and room for a long walk.
  PEDAGOGICAL_ART_DIRECTOR: Make the taller loaded pack, top lid, external support frame and hip belt distinct from a small backpack.
  PEDAGOGICAL_ARCHETYPE: 1 - Chapter-context equipment
  SYNONYM_GUARD: Emphasize its large trekking load, tall shape, adjustable frame and broad waist strap, not a compact school or day backpack.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Large olive framed trekking rucksack with top lid, rolled sleeping mat, side bottle pocket, shoulder harness and padded waist belt.
-->
