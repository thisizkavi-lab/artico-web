<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: interpersonal skills
  CONTEXTUAL_DEFINITION: The ability to relate and work well with other people.
  PEDAGOGICAL_ART_DIRECTOR: Show a respectful face-to-face exchange where one coworker listens and responds with empathy and cooperation.
  PEDAGOGICAL_ARCHETYPE: 30 - Respectful rapport
  SYNONYM_GUARD: Emphasize supportive social behavior and mutual understanding, not just sending a message or completing a task together.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place two coworkers at x=76 and x=228 on opposite sides of a small shared table; turn their heads toward one another, show one open listening gesture and the other a calm hand gesture, and link them with a soft two-way green arc.
-->
