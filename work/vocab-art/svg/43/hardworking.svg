  CHAPTER: 43 - Workplace skills and abilities
  WORD: hardworking
  CONTEXTUAL_DEFINITION: Willing to put in steady, serious effort to complete work.
  PEDAGOGICAL_ART_DIRECTOR: Show focused persistence through a substantial set of real work tasks.
  PEDAGOGICAL_ARCHETYPE: 15 - Sustained effort
  SYNONYM_GUARD: Emphasize steady work and several completed tasks rather than lively motion, a short efficient route, or persistence after one setback.
