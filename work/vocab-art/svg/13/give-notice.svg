  CHAPTER: 13 — Moving and renting
  WORD: give notice (Verb phrase)
  CONTEXTUAL_DEFINITION: Formally tell a landlord in advance that you plan to leave a rental home.
  PEDAGOGICAL_ARCHETYPE: 4 — Communication action with time cue
  SYNONYM_GUARD: Show the renter handing a written notice early enough to plan; move out is the later physical removal of belongings.
