<!-- SELF_PROMPT:
  CHAPTER: 27 — Crime and the law
  WORD: emergency (Noun)
  CONTEXTUAL_DEFINITION: A sudden serious situation needing immediate help or action.
  PEDAGOGICAL_ARCHETYPE: 6 — Urgent situation with visible hazard and response
  SYNONYM_GUARD: Show a small household fire that requires immediate help, distinct from the act of calling the emergency number.
  MODE: STATIC
  COORDINATE_BLUEPRINT:
    - Backdrop: A home kitchen with a window, counter, and stove.
    - Context_Layer: A pan smokes on the stove and a nearby alarm flashes.
    - Focal_Layer: A resident moves toward an extinguisher while another signals outside for assistance.
    - Details_Layer: Small contained flames and smoke indicate urgency without showing injury.
    - Lighting_Layer: Warm hazard glow against cool room light keeps the emergency legible and calm.
-->
