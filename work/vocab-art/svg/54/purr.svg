<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="54:purr" data-archetype="dynamic-action">
  <defs>
    <!-- Cat Purring: cat curled blissfully in sleeping spiral, rhythmic harmonic throat purr vibration ripples, hearts of contentment -->
    <clipPath id="purr-cat-clip">
      <ellipse cx="152" cy="120" rx="66" ry="42" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="166" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="152" cy="164" rx="64" ry="8" fill="#DDD4C3" />

  <!-- Cozy Circular Pet Rug Mat (Pastel Mint Green) -->
  <ellipse cx="152" cy="136" rx="88" ry="34" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Harmonic Rhythmic Purr Vibration Waves Emanating from Chest/Throat -->
  <!-- Wave 1 -->
  <path d="M 124 74 Q 134 68 144 74 Q 154 80 164 74 Q 174 68 184 74" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
  <!-- Wave 2 -->
  <path d="M 116 60 Q 128 52 142 60 Q 156 68 170 60 Q 184 52 196 60" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" />
  <!-- Wave 3 -->
  <path d="M 108 46 Q 124 36 142 46 Q 160 56 178 46 Q 196 36 210 46" fill="none" stroke="#38BDF8" stroke-width="2.6" stroke-dasharray="5 4" stroke-linecap="round" />

  <!-- Floating Hearts of Pure Bliss & Contentment -->
  <path d="M 136 34 C 132 28 126 28 126 32 C 126 38 136 44 136 44 C 136 44 146 38 146 32 C 146 28 140 28 136 34 Z" fill="#F43F5E" />
  <path d="M 186 38 C 182 32 176 32 176 36 C 176 42 186 48 186 48 C 186 48 196 42 196 36 C 196 32 190 32 186 38 Z" fill="#F43F5E" />

  <!-- Curled Sleeping Ginger Cat Body (Spiral Cinnamon Roll) -->
  <g clip-path="url(#purr-cat-clip)">
    <!-- Base Warm Ginger Fur -->
    <rect x="75" y="70" width="155" height="100" fill="#F97316" />
    <!-- White fluffy chest bib & belly -->
    <ellipse cx="140" cy="126" rx="34" ry="24" fill="#FFF7ED" />
    <!-- Flank tabby stripes -->
    <path d="M 172 104 Q 188 112 182 128 M 186 112 Q 200 120 196 134 M 160 98 Q 172 104 168 116" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Lower body shadow -->
    <rect x="75" y="152" width="155" height="15" fill="#EA580C" />
  </g>
  <ellipse cx="152" cy="120" rx="66" ry="42" fill="none" stroke="#1E2A3B" stroke-width="2.6" />

  <!-- Fluffy Tail Wrapped Snugly Around Body to Nose -->
  <path d="M 214 126 C 224 146 200 162 168 160 C 136 158 110 152 98 140" fill="none" stroke="#F97316" stroke-width="14" stroke-linecap="round" />
  <path d="M 214 126 C 224 146 200 162 168 160 C 136 158 110 152 98 140" fill="none" stroke="#1E2A3B" stroke-width="2.4" stroke-linecap="round" />
  <!-- Tail tip white fur -->
  <circle cx="98" cy="140" r="7" fill="#FFF7ED" stroke="#1E2A3B" stroke-width="2" />

  <!-- Seated Tucked Paws Peeking Under Chin -->
  <ellipse cx="122" cy="144" rx="8" ry="6" fill="#FFF7ED" stroke="#1E2A3B" stroke-width="2" />

  <!-- Blissful Sleeping Cat Head (Resting on paws) -->
  <ellipse cx="118" cy="116" rx="22" ry="18" fill="#F97316" stroke="#1E2A3B" stroke-width="2.4" />
  <!-- White muzzle -->
  <ellipse cx="114" cy="122" rx="11" ry="8" fill="#FFF7ED" />

  <!-- Pointed Ears Folded in Rest -->
  <polygon points="106,102 96,82 114,94" fill="#F97316" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <polygon points="105,100 99,86 111,94" fill="#FDA4AF" />
  <polygon points="132,104 140,84 124,96" fill="#F97316" stroke="#1E2A3B" stroke-width="2" stroke-linejoin="round" />
  <polygon points="131,102 137,88 126,96" fill="#FDA4AF" />

  <!-- Blissful Closed Sleeping Smile Eyes (Happy Inverted Arcs) -->
  <path d="M 106 114 Q 110 118 114 114" fill="none" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 122 114 Q 126 118 130 114" fill="none" stroke="#1E2A3B" stroke-width="2.2" stroke-linecap="round" />

  <!-- Pink Nose & Smiling Sweet Mouth -->
  <polygon points="112,120 116,120 114,123" fill="#F43F5E" stroke="#1E2A3B" stroke-width="1.2" />
  <path d="M 114 123 Q 112 126 110 125 M 114 123 Q 116 126 118 125" fill="none" stroke="#1E2A3B" stroke-width="1.4" stroke-linecap="round" />

  <!-- Sleeping Whiskers -->
  <line x1="106" y1="122" x2="88" y2="120" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />
  <line x1="106" y1="125" x2="86" y2="127" stroke="#1E2A3B" stroke-width="1.2" stroke-linecap="round" />
</svg>