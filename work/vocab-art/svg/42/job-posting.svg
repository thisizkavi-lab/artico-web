<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: job posting
  CONTEXTUAL_DEFINITION: An employer's structured listing of an open position, usually published online.
  PEDAGOGICAL_ART_DIRECTOR: Show a digital listing with role details and an employer source, viewed on a screen.
  PEDAGOGICAL_ARCHETYPE: 5 - Digital vacancy listing
  SYNONYM_GUARD: Use a structured online screen layout; distinguish it from the printed job ad on a noticeboard.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a laptop screen at x=70..233, y=31..122. On the screen, show one employer icon, a briefcase symbol, three detail bars, and a prominent green response button without text. Add a small applicant silhouette looking at the screen from the left edge.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="42:job posting" data-archetype="digital-vacancy-listing">
