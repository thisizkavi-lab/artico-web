<!-- SELF_PROMPT:
  CHAPTER: 38 - Money and finance
  WORD: save (verb; put money aside)
  CONTEXTUAL_DEFINITION: To keep some money for future use rather than spend it now.
  PEDAGOGICAL_ARCHETYPE: 4 - Peak-moment action plus tool
  SYNONYM_GUARD: Japanese gloss lists rescue, but this chapter's finance group locks “save” to setting money aside; show a coin entering a secure savings container for later.
  MODE: STATIC peak saving action
  COORDINATE_BLUEPRINT: Person drops coin through a slot into a clear savings jar; previously saved coin stack and small sprout inside suggest future growth; keep hands volumetric.
-->
