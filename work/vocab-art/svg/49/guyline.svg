<!-- SELF_PROMPT:
  CHAPTER: 49 - Camping and cycling
  WORD: guyline / guy rope (Noun)
  CONTEXTUAL_DEFINITION: A taut cord anchored to the ground that holds a tent steady.
  PEDAGOGICAL_ART_DIRECTOR: Make the diagonal tension line the focal object connecting tent fabric to a ground peg.
  PEDAGOGICAL_ARCHETYPE: 2 - Part-to-structure anchor
  SYNONYM_GUARD: Show a thin cord under tension from the tent to a short ground stake, not a structural tent pole or a loose rope.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Close tent corner at left; conspicuous diagonal cord to a planted stake at lower right, with the tension direction unmistakable.
-->
