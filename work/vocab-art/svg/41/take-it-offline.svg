<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: take it offline (idiom)
  CONTEXTUAL_DEFINITION: Move a side discussion out of a large online meeting into a smaller private conversation.
  PEDAGOGICAL_ARCHETYPE: 6 - Transition from online group to private in-person talk
  SYNONYM_GUARD: A dimmed video-call screen remains behind while two colleagues close the laptop and move aside together; no network failure or internet outage is depicted.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a large faded monitor with four video participants on the back wall at x=35..165, y=24..97. In foreground two coworkers at x=166..267 turn away to speak face-to-face beside a closed laptop at x=99..157, y=120.
-->
