<!-- SELF_PROMPT:
  CHAPTER: 47 - Travel and accommodation
  WORD: reservation
  CONTEXTUAL_DEFINITION: An arrangement that holds a hotel room for a guest in advance.
  PEDAGOGICAL_ART_DIRECTOR: Show a confirmed hotel room booking as a calendar date marked beside its room card.
  PEDAGOGICAL_ARCHETYPE: 2 - Hero Object
  SYNONYM_GUARD: The booking confirmation is already made; distinguish this noun from the act of making a reservation.
  MODE: STATIC
  COORDINATE_BLUEPRINT: A blank calendar page with one amber-selected square sits beside a blue room key card and a small hotel-bed pictogram.
-->
