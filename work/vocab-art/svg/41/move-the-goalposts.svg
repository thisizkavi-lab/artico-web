<!-- SELF_PROMPT:
  CHAPTER: 41 - Work and business idioms
  WORD: move the goalposts (idiom)
  CONTEXTUAL_DEFINITION: Unfairly change the requirements after someone is close to meeting the original target.
  PEDAGOGICAL_ARCHETYPE: 6 - Original target versus shifted target
  SYNONYM_GUARD: The faded original goal remains beside the new farther position as a supervisor moves the posts while a worker reaches the first target, making the unfair rule change clear.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Show the worker at x=67..139 reaching toward a ghosted pair of goalposts at x=148. A supervisor at x=215..272 carries those posts toward x=250, with a blue arrow pointing farther right. Add a blank work checklist near the worker.
-->
