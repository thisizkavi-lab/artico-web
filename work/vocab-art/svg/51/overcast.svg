<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: overcast (Adjective / participle)
  CONTEXTUAL_DEFINITION: Covered everywhere by a continuous layer of gray cloud, with no clear breaks.
  PEDAGOGICAL_ART_DIRECTOR: Cover the whole sky edge to edge with a flat gray cloud deck; keep the sun fully hidden.
  PEDAGOGICAL_ARCHETYPE: 3 - Complete sky cover
  SYNONYM_GUARD: Show no blue opening or sun; this is more complete than cloudy.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Broad unbroken gray cloud canopy fills the full sky above a muted landscape; no sun, bright patch, or gaps.
-->
