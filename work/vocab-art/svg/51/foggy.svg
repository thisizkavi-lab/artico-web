<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: foggy (Adjective)
  CONTEXTUAL_DEFINITION: Covered with dense fog so nearby things are clear but distant things fade from view.
  PEDAGOGICAL_ART_DIRECTOR: Show a whole landscape or street in reduced visibility with foreground crisp and distance gradually obscured.
  PEDAGOGICAL_ARCHETYPE: 3 - Atmospheric condition
  SYNONYM_GUARD: This describes the surrounding conditions, unlike the single mass of fog in the noun card.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Foreground road and person clear, with trees and a small car disappearing into layered white-gray haze.
-->
