<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:fit">
  <defs>
    <clipPath id="fit-jacket-clip">
      <path d="M 124 38 L 78 54 L 66 128 L 88 132 L 98 98 L 94 152 C 114 156 190 156 210 152 L 206 98 L 216 132 L 238 128 L 226 54 L 180 38 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Backdrop soft bespoke tailor aura -->
  <ellipse cx="152" cy="108" rx="94" ry="62" fill="#ECFDF5" opacity="0.7"/>

  <!-- Mannequin Wooden Stand Neck & Finial -->
  <path d="M 148 18 L 148 38 L 156 38 L 156 18 Z" fill="#9A6945" stroke="#1E2A3B" stroke-width="2"/>
  <circle cx="152" cy="18" r="4.5" fill="#C59B75" stroke="#1E2A3B" stroke-width="1.8"/>

  <!-- Left Sleeve of Impeccably Tailored Jacket -->
  <path d="M 88 54 L 66 128 L 88 132 L 98 98 L 108 60 Z"
        fill="#334155" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Right Sleeve -->
  <path d="M 216 54 L 238 128 L 216 132 L 206 98 L 196 60 Z"
        fill="#1E293B" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Main Bespoke Jacket Torso (Sharp, Perfectly Fitted Silhouette) -->
  <path d="M 124 38 L 84 54 L 94 152 C 114 156 190 156 210 152 L 220 54 L 180 38 Z"
        fill="#334155" stroke="#1E2A3B" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Right side shadow inside jacket -->
  <g clip-path="url(#fit-jacket-clip)">
    <path d="M 152 38 L 220 54 L 210 152 L 152 154 Z" fill="#1E293B" opacity="0.45"/>

    <!-- Tailor White Chalk Fitting Marks & Darts (Signature Bespoke Fitting Cues) -->
    <path d="M 104 68 L 118 72" stroke="#FAF8F3" stroke-width="1.8" stroke-dasharray="2 2"/>
    <path d="M 200 68 L 186 72" stroke="#FAF8F3" stroke-width="1.8" stroke-dasharray="2 2"/>
    <line x1="112" y1="94" x2="112" y2="134" stroke="#FAF8F3" stroke-width="1.8" stroke-dasharray="3 2"/>
    <line x1="192" y1="94" x2="192" y2="134" stroke="#FAF8F3" stroke-width="1.8" stroke-dasharray="3 2"/>
  </g>

  <!-- Tailored Notched Lapels -->
  <path d="M 124 38 L 108 66 L 122 70 L 112 96 L 152 108 L 152 48 Z"
        fill="#475569" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 180 38 L 196 66 L 182 70 L 192 96 L 152 108 L 152 48 Z"
        fill="#1E293B" stroke="#1E2A3B" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Inner Crisp White Shirt & Red Tie in Lapel V -->
  <polygon points="138,40 152,78 166,40" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1.6"/>
  <polygon points="150,46 154,46 156,76 152,82 148,76" fill="#DC2626"/>

  <!-- Yellow Tailor's Tape Measure Wrapping Perfectly Around the Waist / Torso -->
  <!-- Tape loop around back -->
  <path d="M 86 108 C 96 102 208 102 218 108"
        stroke="#D97706" stroke-width="7" fill="none"/>
  <!-- Front Tape Wrapping and Meeting at Center to Measure Perfect Fit -->
  <path d="M 88 112 C 104 122 136 126 152 126 C 168 126 200 122 216 112"
        stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Tape Measure Graduation Marks -->
  <path d="M 88 112 C 104 122 136 126 152 126 C 168 126 200 122 216 112"
        stroke="#1E2A3B" stroke-width="1.8" stroke-dasharray="2 3" fill="none"/>
  <!-- Hanging Tape End with Brass Tip -->
  <path d="M 152 126 C 154 138 152 152 158 164"
        stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 152 126 C 154 138 152 152 158 164"
        stroke="#1E2A3B" stroke-width="1.8" stroke-dasharray="2 3" fill="none"/>
  <rect x="154" y="162" width="8" height="5" rx="1" fill="#78350F" stroke="#1E2A3B" stroke-width="1.2"/>

  <!-- Tailor Wooden Mannequin Pedestal Pole below hem -->
  <line x1="152" y1="154" x2="152" y2="182" stroke="#9A6945" stroke-width="4" stroke-linecap="round"/>

  <!-- Emerald Green "Perfect Fit" Quality Checkmark Badge in Upper-Right -->
  <circle cx="236" cy="48" r="18" fill="#10B981" stroke="#1E2A3B" stroke-width="2.4"/>
  <path d="M 228 48 L 234 54 L 246 42" stroke="#FAF8F3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>