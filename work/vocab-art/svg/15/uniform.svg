  <path d="M 114 86 L 122 86 L 122 96 L 114 96 Z" fill="#F59E0B"/>
  <path d="M 106 96 L 114 96 L 114 104 C 114 104 108 102 106 99 Z" fill="#1E3A8A"/>
  <path d="M 114 96 L 122 96 L 122 99 C 120 102 114 104 114 104 Z" fill="#166534"/>
