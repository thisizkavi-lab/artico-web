<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: resume
  CONTEXTUAL_DEFINITION: A résumé or CV listing a job applicant's education, experience, and qualifications.
  PEDAGOGICAL_ART_DIRECTOR: Show the structured document a candidate submits to summarize work and education history.
  PEDAGOGICAL_ARCHETYPE: 8 - Structured application document
  SYNONYM_GUARD: Depict a multi-section CV with work-history and education cues; this is the noun for a job application, not the verb meaning restart.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a portrait-oriented CV page at x=116..208, y=36..130 with a small profile block, grouped work-history rows, an education marker, and a compact skill badge. Place the candidate at x=67..113, y=83..134 reviewing the page on a desk.
-->
