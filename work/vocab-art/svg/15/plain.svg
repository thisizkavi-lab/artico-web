<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="15:plain (adjective)">
  <defs>
    <clipPath id="plain-swatch-clip">
      <path d="M 52 38 L 252 38 L 252 154 L 52 154 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="304" height="192" fill="#FAF8F3"/>

  <!-- Presentation Shadow -->
  <rect x="56" y="44" width="204" height="120" rx="6" fill="#E2E8F0"/>

  <!-- Main Solid Unpatterned Plain Fabric Swatch (Pure Vibrant Cornflower Blue) -->
  <rect x="48" y="38" width="208" height="116" rx="6" fill="#3B82F6" stroke="#1E2A3B" stroke-width="2.6"/>

  <!-- Pure Smooth Monocolor 3-Tone Shading & Drape (Zero Pattern, Zero Print) -->
  <g clip-path="url(#plain-swatch-clip)">
    <!-- Right side deep shade -->
    <path d="M 168 38 L 252 38 L 252 154 L 148 154 Z" fill="#2563EB"/>
    <path d="M 212 38 L 252 38 L 252 154 L 196 154 Z" fill="#1D4ED8"/>

    <!-- Left side subtle light sheen -->
    <path d="M 48 38 L 102 38 L 86 154 L 48 154 Z" fill="#60A5FA"/>

    <!-- Graceful Smooth Fabric Drape Folds (Curved Satin Sheen Waves) -->
    <path d="M 88 38 Q 96 96 104 154" stroke="#93C5FD" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 138 38 Q 146 96 154 154" stroke="#1D4ED8" stroke-width="3.5" fill="none" opacity="0.4"/>
    <path d="M 188 38 Q 196 96 204 154" stroke="#1E3A8A" stroke-width="3.5" fill="none" opacity="0.4"/>

    <!-- Turned Dog-Ear Corner at Bottom-Left showing pure solid underside -->
    <polygon points="48,124 82,154 48,154" fill="#93C5FD" stroke="#1E2A3B" stroke-width="2"/>
    <polygon points="48,124 82,154 82,124" fill="#1D4ED8" opacity="0.4"/>
  </g>

  <!-- Pinking Shears Zig-Zag Cut Top Edge -->
  <path d="M 48 38 L 54 33 L 60 38 L 66 33 L 72 38 L 78 33 L 84 38 L 90 33 L 96 38 L 102 33 L 108 38 L 114 33 L 120 38 L 126 33 L 132 38 L 138 33 L 144 38 L 150 33 L 156 38 L 162 33 L 168 38 L 174 33 L 180 38 L 186 33 L 192 38 L 198 33 L 204 38 L 210 33 L 216 38 L 222 33 L 228 38 L 234 33 L 240 38 L 246 33 L 252 38"
        stroke="#1E2A3B" stroke-width="2" fill="none"/>

  <!-- Minimalist Clean Fabric Header Label Tag -->
  <rect x="180" y="52" width="60" height="26" rx="3" fill="#FAF8F3" stroke="#1E2A3B" stroke-width="1.8"/>
  <line x1="188" y1="60" x2="232" y2="60" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="188" y1="68" x2="218" y2="68" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
</svg>