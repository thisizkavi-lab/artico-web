<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: cover letter
  CONTEXTUAL_DEFINITION: A letter sent with a job application to introduce the candidate and explain their fit.
  PEDAGOGICAL_ART_DIRECTOR: Show a personally addressed letter accompanying an application packet, with a greeting-like opening, a brief body, and a signature mark.
  PEDAGOGICAL_ARCHETYPE: 5 - Correspondence document
  SYNONYM_GUARD: This is a letter addressed to an employer, not a concise career summary, generic résumé, or envelope alone.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Place a white letter page at x=100..196, y=34..130, with a small recipient icon in the upper corner, several paragraph bars, and a handwritten-style signature stroke near the bottom. A blue envelope lies open beneath at x=75..225, and a small gold seal joins page and packet.
-->
