    <rect x="122" y="67" width="26" height="29" fill="#EF4444"/>
    <rect x="122" y="96" width="26" height="29" fill="#991B1B"/>
    <rect x="122" y="125" width="26" height="29" fill="#EF4444"/>

    <!-- Column 5 -->
    <rect x="148" y="38" width="26" height="29" fill="#EF4444"/>
    <rect x="148" y="67" width="26" height="29" fill="#FCA5A5"/>
    <rect x="148" y="96" width="26" height="29" fill="#EF4444"/>
    <rect x="148" y="125" width="26" height="29" fill="#FCA5A5"/>

    <!-- Column 6 -->
    <rect x="174" y="38" width="26" height="29" fill="#991B1B"/>
    <rect x="174" y="67" width="26" height="29" fill="#EF4444"/>
    <rect x="174" y="96" width="26" height="29" fill="#991B1B"/>
    <rect x="174" y="125" width="26" height="29" fill="#EF4444"/>

