  CHAPTER: 41 - Work and business idioms
  WORD: get down to business (idiom)
  CONTEXTUAL_DEFINITION: Stop preliminary conversation and begin focused practical work.
  PEDAGOGICAL_ARCHETYPE: 4 - Transition into a concrete work action
  SYNONYM_GUARD: A coworker clears a casual cup aside and opens the work folder while the team leans in, showing the shift from small talk to serious work.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Use a meeting table at y=128. At x=39..109 a small cup and relaxed chair remain to the side; center a focused worker at x=112..187 opening a blank folder; a second colleague at x=203..264 leans toward the documents. Add a bold start arrow over the folder.
-->
