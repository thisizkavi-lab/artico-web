<!-- SELF_PROMPT:
  CHAPTER: 51 - Weather and climate
  WORD: thunder (Noun)
  CONTEXTUAL_DEFINITION: The low rumbling sound that follows lightning, represented by a person reacting to a vibrating sky and sound ripples.
  PEDAGOGICAL_ART_DIRECTOR: Put sound waves around a low cloud and show a nearby listener bracing against the rumble; do not show a lightning bolt.
  PEDAGOGICAL_ARCHETYPE: 3 - Weather sound and human reaction
  SYNONYM_GUARD: Thunder is the sound, distinct from the visible lightning flash and from a threatening thundery sky.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Deep rolling sound bands radiate beneath a dark cloud as a person covers their ears and crouches slightly.
-->
