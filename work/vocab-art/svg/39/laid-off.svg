<!-- SELF_PROMPT:
  CHAPTER: 39 - Working
  WORD: laid off (past participle; staffing reduction)
  CONTEXTUAL_DEFINITION: Having lost a job because the employer reduced staff or had too little work, rather than because of the worker's performance.
  PEDAGOGICAL_ART_DIRECTOR: Keep one worker as the subject, with empty workstations and a quiet manager in the background establishing a company-wide reduction.
  PEDAGOGICAL_ARCHETYPE: 3 - Professional role transition
  SYNONYM_GUARD: Distinguish from fired by showing the absent workforce and idle operation, not a disciplinary confrontation.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Foreground one worker carrying a small box from a row of four empty desks, x=111..181,y=86..150. In the background, a softly drawn manager offers a supportive hand; several unoccupied chairs and a quiet workload indicator imply a staffing reduction.
-->
