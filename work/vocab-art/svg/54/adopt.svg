  <path d="M 146 95 Q 152 99 158 95" fill="none" stroke="#1E2A3B" stroke-width="1.8" stroke-linecap="round" />
  <!-- Happy little tongue -->
  <path d="M 150 96 C 150 102 154 102 154 96 Z" fill="#F43F5E" stroke="#1E2A3B" stroke-width="1.2" />

  <!-- Tiny Puppy Front Paws resting on human hands -->
  <ellipse cx="138" cy="126" rx="8" ry="6" fill="#FFFBEB" stroke="#1E2A3B" stroke-width="2" />
  <ellipse cx="166" cy="126" rx="8" ry="6" fill="#FFFBEB" stroke="#1E2A3B" stroke-width="2" />

  <!-- Red Adoption Collar with Golden Heart ID Tag -->
  <path d="M 132 108 Q 152 116 172 108" stroke="#EF4444" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 132 108 Q 152 116 172 108" stroke="#1E2A3B" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <!-- Golden heart adoption medal tag -->
  <path d="M 152 120 C 148 114 142 115 142 119 C 142 124 152 130 152 130 C 152 130 162 124 162 119 C 162 115 156 114 152 120 Z" fill="#FACC15" stroke="#1E2A3B" stroke-width="1.6" stroke-linejoin="round" />

  <!-- Caring Human Arms & Hands Cradling the Pet (Left & Right) -->
  <!-- Left arm & cupped hand -->
  <path d="M 44 172 C 58 152 82 144 114 144 C 126 144 136 150 144 156 C 136 160 120 162 104 162 C 78 162 58 168 44 172 Z" fill="#FDBA74" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Left hand fingers gently supporting underside -->
  <ellipse cx="128" cy="148" rx="8" ry="5" fill="#FED7AA" stroke="#1E2A3B" stroke-width="1.8" />
  <ellipse cx="136" cy="152" rx="8" ry="5" fill="#FED7AA" stroke="#1E2A3B" stroke-width="1.8" />

