<!-- SELF_PROMPT:
  CHAPTER: 42 - Applying for a job
  WORD: career summary
  CONTEXTUAL_DEFINITION: A short overview of a candidate's professional background and strongest qualifications.
  PEDAGOGICAL_ART_DIRECTOR: Show a concise top-level profile page that compresses a longer work history into a few highlights.
  PEDAGOGICAL_ARCHETYPE: 5 - Concise profile document
  SYNONYM_GUARD: Keep this shorter and more overview-like than a full résumé, personal statement, or cover letter.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a one-page profile sheet at x=91..210, y=35..139. Place a small candidate portrait at the top, then exactly three short gold/blue highlight bars and a compact work-history timeline beneath; leave broad whitespace so the summary reads concise.
-->
