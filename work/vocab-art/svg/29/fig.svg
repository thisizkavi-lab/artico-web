<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 192" data-vocab-key="29:fig" data-archetype="hero-object">
  <defs>
    <!-- Fig: teardrop violet-purple fruit with green neck, cut half showing succulent jammy ruby-red seed interior -->
    <clipPath id="fig-body-clip">
      <path d="M 112 62 C 122 62 126 78 126 94 C 126 108 152 118 152 138 C 152 158 134 166 112 166 C 90 166 72 158 72 138 C 72 118 98 108 98 94 C 98 78 102 62 112 62 Z" />
    </clipPath>
    <clipPath id="fig-half-clip">
      <path d="M 212 70 C 220 70 224 82 224 96 C 224 108 244 118 244 136 C 244 154 230 162 212 162 C 194 162 180 154 180 136 C 180 118 200 108 200 96 C 200 82 204 70 212 70 Z" />
    </clipPath>
  </defs>

  <!-- Stage Canvas & Ground Shadows -->
  <rect width="304" height="192" fill="#FAF8F3" rx="16" />
  <ellipse cx="152" cy="164" rx="114" ry="14" fill="#EAE3D5" />
  <ellipse cx="112" cy="162" rx="46" ry="8" fill="#DDD4C3" />
  <ellipse cx="212" cy="162" rx="38" ry="7" fill="#DDD4C3" />

  <!-- Short Green/Brown Fig Stem on Left -->
  <g transform="translate(112, 62)">
    <line x1="0" y1="0" x2="-2" y2="-14" stroke="#65A30D" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-2" y2="-14" stroke="#1E2A3B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Whole Teardrop Violet Fig on Left -->
  <g clip-path="url(#fig-body-clip)">
    <!-- Base rich deep purple -->
    <rect x="65" y="55" width="95" height="115" fill="#581C87" />
    <!-- Gradient transition to yellow-green at the neck -->
    <path d="M 98 60 L 126 60 L 126 94 L 98 94 Z" fill="#84CC16" />
    <ellipse cx="112" cy="94" rx="18" ry="14" fill="#7E22CE" opacity="0.6" />
    <!-- Underside shade -->
    <path d="M 72 142 C 86 164 134 164 150 142 L 150 168 L 72 168 Z" fill="#3B0764" />
    <!-- Subtle vertical skin ribs -->
    <path d="M 92 108 C 86 126 86 146 94 158" stroke="#3B0764" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 112 104 C 110 126 110 148 112 162" stroke="#6B21A8" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 132 108 C 138 126 138 146 130 158" stroke="#3B0764" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Specular bloom highlight -->
    <ellipse cx="102" cy="116" rx="12" ry="16" transform="rotate(-15 102 116)" fill="#C084FC" opacity="0.6" />
  </g>
  <!-- Contour -->
  <path d="M 112 62 C 122 62 126 78 126 94 C 126 108 152 118 152 138 C 152 158 134 166 112 166 C 90 166 72 158 72 138 C 72 118 98 108 98 94 C 98 78 102 62 112 62 Z" fill="none" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Small eye ostiole at base of whole fig -->
  <circle cx="112" cy="166" r="3" fill="#3B0764" stroke="#1E2A3B" stroke-width="1.4" />

  <!-- Cut Fig Half in Foreground Right (Succulent Jammy Ruby Core + Seeds) -->
  <path d="M 212 70 C 220 70 224 82 224 96 C 224 108 244 118 244 136 C 244 154 230 162 212 162 C 194 162 180 154 180 136 C 180 118 200 108 200 96 C 200 82 204 70 212 70 Z" fill="#581C87" stroke="#1E2A3B" stroke-width="2.6" stroke-linejoin="round" />
  <g clip-path="url(#fig-half-clip)">
    <!-- Thick spongy white-cream pith lining inside skin -->
    <path d="M 212 74 C 218 74 220 84 220 96 C 220 108 238 118 238 134 C 238 148 226 156 212 156 C 198 156 186 148 186 134 C 186 118 204 108 204 96 C 204 84 206 74 212 74 Z" fill="#FEF9C3" />

    <!-- Lush Succulent Ruby-Red Jammy Seed Interior -->
    <path d="M 212 84 C 216 84 217 92 217 100 C 217 110 232 120 232 134 C 232 144 222 152 212 152 C 202 152 192 144 192 134 C 192 120 207 110 207 100 C 207 92 208 84 212 84 Z" fill="#BE123C" />
    <ellipse cx="212" cy="134" rx="16" ry="14" fill="#9F1239" />

    <!-- Innumerable Tiny Crunchy Gold Fig Seeds / Drupelets -->
    <circle cx="206" cy="124" r="1.5" fill="#FEF08A" />
    <circle cx="216" cy="122" r="1.5" fill="#FEF08A" />
    <circle cx="210" cy="130" r="1.5" fill="#FEF08A" />
    <circle cx="220" cy="132" r="1.5" fill="#FEF08A" />
    <circle cx="204" cy="136" r="1.5" fill="#FEF08A" />
    <circle cx="214" cy="138" r="1.5" fill="#FEF08A" />
    <circle cx="208" cy="144" r="1.5" fill="#FEF08A" />
    <circle cx="216" cy="144" r="1.5" fill="#FEF08A" />
    <circle cx="212" cy="114" r="1.5" fill="#FEF08A" />
    <circle cx="212" cy="102" r="1.5" fill="#FEF08A" />
  </g>
</svg>
