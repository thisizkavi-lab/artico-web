<!-- SELF_PROMPT:
  CHAPTER: 43 - Workplace skills and abilities
  WORD: professional attributes
  CONTEXTUAL_DEFINITION: Personal qualities and habits that make someone effective at work.
  PEDAGOGICAL_ART_DIRECTOR: Show a compact profile of varied useful workplace qualities around a candidate.
  PEDAGOGICAL_ARCHETYPE: 24 - Work-ready qualities set
  SYNONYM_GUARD: Present several complementary traits as a set, not one professional identity, a qualification document, or a single polite manner.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Center a candidate beside a profile board with four equal icon badges for accuracy, dependability, communication, and teamwork. Give each badge similar size and weight so they read as a balanced set of qualities.
-->
