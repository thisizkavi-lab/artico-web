<!-- SELF_PROMPT:
  CHAPTER: 40 - Meeting and presenting
  WORD: unanimous agreement
  CONTEXTUAL_DEFINITION: Complete agreement in which every member of the group supports the same decision.
  PEDAGOGICAL_ART_DIRECTOR: Show every meeting participant holding the same affirmative decision card, with no dissenting or undecided figure.
  PEDAGOGICAL_ARCHETYPE: 6 - Full-group assent
  SYNONYM_GUARD: All participants must signal the same choice; distinguish this from a partial show-of-hands vote, pairwise agreement, or a consensus process still in progress.
  MODE: STATIC
  COORDINATE_BLUEPRINT: Arrange five colleagues evenly across a boardroom table from x=35..269, each with a separate face and identical small green check card held at chest height. Above the table center, add one shared round emblem with a larger check; keep all five people equally prominent and all cards matching.
-->
