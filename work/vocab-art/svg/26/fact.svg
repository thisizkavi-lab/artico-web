    - Context_Layer: Rain is plainly visible outside; a wet umbrella rests inside.
    - Focal_Layer: An observer matches the real scene to a simple verified rain symbol.
    - Details_Layer: Droplets on the sill and a small check cue show it can be confirmed.
    - Lighting_Layer: Neutral daylight keeps the scene objective rather than ominous.
-->
