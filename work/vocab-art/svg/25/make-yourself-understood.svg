  CHAPTER: 25 — Speaking a foreign language
  WORD: make yourself understood (Verb phrase)
  CONTEXTUAL_DEFINITION: Communicate your idea clearly enough that another person grasps it.
  PEDAGOGICAL_ARCHETYPE: 3 — Person in action
  SYNONYM_GUARD: Show a speaker adding a clear gesture and concrete picture cue until the listener recognizes the intended meaning.
